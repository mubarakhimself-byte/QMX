name: QMX CI setup
description: Python 3.14 and pinned uv for tools/ci/qci.py.
# No rclone: the qmx-home tests were baselined without it on GitLab, and with rclone 1.75.1 on PATH
# seven other tests turn red (deep run 43472106038, suite-linux 6).
runs:
  using: composite
  steps:
    - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0
      with:
        python-version-file: .python-version
    - name: Install uv (pinned, as on GitLab)
      shell: bash
      run: python -m pip install --quiet --disable-pip-version-check "uv==${UV_VERSION}"

name: QA Battery
# PR checks use the local CI runner. Coverage and heavier scans stay nightly.
on:
  push:
    branches: [main, integration, 'rebuild/**']
    tags: ['factory-candidate/**']
  pull_request:
    branches: [main, integration, 'rebuild/**']
  schedule:
    # GitHub schedules run on the default branch; PR checks run on rebuild branches.
    - cron: "17 2 * * *"

# Read-only; nothing here writes to the repo. Job artifacts need no token.
permissions:
  contents: read

jobs:
  backend:
    if: github.event_name != 'schedule'
    name: ${{ matrix.runner == 'ubuntu-24.04' && 'backend-linux' || 'backend-windows' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Install rclone for local-remote backup tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-linux-amd64.zip -o "$RUNNER_TEMP/rclone.zip"
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone"
          echo "$RUNNER_TEMP/rclone/rclone-v1.75.1-linux-amd64" >> "$GITHUB_PATH"
      - name: Install rclone for local-remote backup tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://downloads.rclone.org/v1.75.1/rclone-v1.75.1-windows-amd64.zip -OutFile "$env:RUNNER_TEMP/rclone.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/rclone.zip" -DestinationPath "$env:RUNNER_TEMP/rclone"
          "$env:RUNNER_TEMP/rclone/rclone-v1.75.1-windows-amd64" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run local CI command
        run: uv run --frozen python tools/ci.py

  legacy-coverage:
    # Retain the existing coverage floors and the heavier scanners on the nightly lane.
    if: github.event_name == 'schedule'
    name: ${{ matrix.runner == 'ubuntu-24.04' && 'backend-linux' || 'backend-windows' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0; Node 24
        with:
          # The interpreter this project targets - CPython 3.14, pinned in .python-version (AR-04).
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Sync the workspace (default groups)
        id: sync
        run: uv sync --frozen
      - name: Tier-1 fmt-check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe fmt-check
      - name: Tier-1 lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe lint
      - name: Tier-1 types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe types
      - name: Tier-1 test
        env:
          COVERAGE_FILE: .coverage-backend
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe test
      - name: Tier-1 cov-report
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe cov-report
      - name: Tier-1 test-tools
        env:
          COVERAGE_FILE: .coverage-tools
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe test-tools
      - name: Tier-1 money-path-scan
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe money-path-scan
      - name: Tier-1 ambient-scan
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe ambient-scan
      - name: Tier-1 mock-data-scan
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe mock-data-scan
      - name: Tier-1 secret-scan
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --frozen poe secret-scan

  agent-suites:
    # Nested qmx-agents workspace; the agents result job below preserves its check name.
    if: github.event_name == 'schedule'
    name: ${{ matrix.runner == 'ubuntu-24.04' && 'agents-linux' || 'agents-windows' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: qmx-agents
    # The environment is independent of the parent workspace on both platforms.
    # The matrix must complete on both runners before its result gate can succeed.
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version-file: .python-version
      - run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Isolate the nested environment on the runner
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/qmx-agents-venv" >> "$GITHUB_ENV"
      - name: Sync the nested workspace
        id: sync
        run: uv sync --frozen --all-packages
      - name: Nested Tier-1 fmt-check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync poe fmt-check
      - name: Nested Tier-1 lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync poe lint
      - name: Nested Tier-1 types
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync poe types

  vulture:
    # Dead-code ratchet: fail only if the finding count rises above the committed baseline.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0; Node 24
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Vulture count-vs-baseline gate (min-confidence 80)
        # Vulture is pure static AST analysis and imports nothing from the workspace, so no
        # `uv sync` is needed - `--no-project --with vulture==2.14` gives a minimal pinned env.
        # tools/vulture_gate.py enforces vulture's exit-code discipline (0/3 = ran; anything else
        # is a broken scan and fails closed) and fails only if the count exceeds the baseline.
        run: >
          uv run --no-project --with "vulture==2.14" python tools/vulture_gate.py
          --baseline qa/_trace/battery/vulture/gate-baseline-min80.txt
          --min-confidence 80 -- packages extensions qml qmb qmn tools

  agents:
    # Preserve the established check context and refuse failed, cancelled or skipped prerequisites.
    if: ${{ always() && github.event_name == 'schedule' }}
    needs: [agent-suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory suite to succeed
        if: ${{ always() }}
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: agent-suites
        # Runner-provided Python; no checkout or network request can stall this verdict.
        run: &mandatory_verdict |
          python3 - <<'PY'
          import json
          import os
          import sys

          required = os.environ["REQUIRED_JOBS"].split()
          try:
              needs = json.loads(os.environ.get("NEEDS_JSON", ""))
          except ValueError:
              needs = None
          valid = (
              bool(required)
              and len(set(required)) == len(required)
              and isinstance(needs, dict)
              and set(needs) == set(required)
              and all(
                  isinstance(needs.get(job), dict)
                  and needs[job].get("result") == "success"
                  for job in required
              )
          )
          print("All mandatory jobs succeeded" if valid else "::error::Mandatory jobs did not all succeed")
          sys.exit(0 if valid else 1)
          PY

  check:
    # Preserve the established check context and refuse failed, cancelled or skipped prerequisites.
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every mandatory suite to succeed
        if: ${{ always() }}
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: backend
        run: *mandatory_verdict

  mutation-qmn:
    # Nightly mutation testing on the node money-path modules (Story 28.6 / AR-86).
    # Schedule-only — mutmut is not a factory gate. Zero classified mutants fail
    # closed. Classified survivors must be triaged with evidence; this job invents
    # no kill-rate number (FTR-07).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0; Node 24
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Sync the workspace (default groups)
        run: uv sync --frozen
      - name: Stage the node mutmut config into qmn (disposable checkout)
        run: >
          python tools/stage_mutation_config.py qmn/pyproject.toml
          qa/_trace/battery/mutmut/qmn_mutmut_config.toml
      - name: Run mutmut on node money-path modules
        working-directory: qmn
        run: |
          set +e
          uv run --frozen --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut run > mutmut-run.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > mutmut-run.status
          cat mutmut-run.log
      - name: Collect the per-mutant results
        working-directory: qmn
        run: |
          set +e
          uv run --frozen --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut results --all true > mutmut-results.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > mutmut-results.status
          cat mutmut-results.txt
      - name: Complete classified-mutant gate (survivors advisory)
        working-directory: qmn
        run: >
          python "$GITHUB_WORKSPACE/tools/mutation_gate.py"
          --results mutmut-results.txt --run-status mutmut-run.status
          --results-status mutmut-results.status
          --module qmn.order.door --module qmn.order.path
          --module qmn.ledger.binding_ledger --module qmn.reconcile.residuals
          --module qmn.capital.kill_line --module qmn.ledger.virtual
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0; Node 24
        if: always()
        with:
          name: mutmut-qmn-results
          path: |
            qmn/mutmut-run.log
            qmn/mutmut-results.txt
            qmn/mutmut-run.status
            qmn/mutmut-results.status
          if-no-files-found: warn
          retention-days: 30

  mutation:
    # Nightly mutation testing on the two ratified 100%-branch modules. Schedule-only (mutmut is
    # slow) and Linux-only. Kill-rate = killed / (killed + survived); floor 68% (OR-10b, from the
    # 2c8d495 baseline of 249 killed / 117 survived = 68.03%).
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c  # v6.0.0; Node 24
        with:
          python-version-file: .python-version
      - name: Install uv (pinned)
        run: python -m pip install --disable-pip-version-check "uv==0.12.6"
      - name: Sync the workspace (default groups)
        run: uv sync --frozen
      - name: Stage the mutmut config into qmf-core (disposable checkout)
        # Translate the declarative scope into options supported by pinned mutmut 3.3.
        # Sibling sources are copied but not mutated. The checkout is disposable.
        run: >
          python tools/stage_mutation_config.py packages/qmf-core/pyproject.toml
          qa/_trace/battery/mutmut/mutmut_config.toml
      - name: Run mutmut
        working-directory: packages/qmf-core
        # mutmut 3.3 returns normally with survivors. Capture the actual exit status;
        # the gate requires successful commands and a complete --all results listing.
        run: |
          set +e
          uv run --frozen --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut run > mutmut-run.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > mutmut-run.status
          cat mutmut-run.log
      - name: Collect the per-mutant results
        working-directory: packages/qmf-core
        run: |
          set +e
          uv run --frozen --project "$GITHUB_WORKSPACE" --with "mutmut==3.3.0" mutmut results --all true > mutmut-results.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > mutmut-results.status
          cat mutmut-results.txt
      - name: Complete classified-run and kill-rate gate (floor 68%)
        working-directory: packages/qmf-core
        run: >
          python "$GITHUB_WORKSPACE/tools/mutation_gate.py"
          --results mutmut-results.txt --run-status mutmut-run.status
          --results-status mutmut-results.status
          --module qmf.core.exact --module qmf.core.chrono --min-kill-rate 68
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0; Node 24
        if: always()
        with:
          name: mutmut-results
          path: |
            packages/qmf-core/mutmut-run.log
            packages/qmf-core/mutmut-results.txt
            packages/qmf-core/mutmut-run.status
            packages/qmf-core/mutmut-results.status
          if-no-files-found: warn
          retention-days: 30

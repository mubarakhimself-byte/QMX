name: Docker nodes
on:
  pull_request:
    branches: ['rebuild/base']
    paths: ['qmx-apps/**', 'qmx-control/**', 'examples/apps/**', '.github/workflows/docker-nodes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Provision the fresh Ubuntu VM twice
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          sudo install -d -m 700 /opt/qmx-deploy
          git archive --format=tar HEAD | sudo tee /opt/qmx-deploy/source.tar > /dev/null
          sed "s/@REVISION@/$revision/g" qmx-control/src/qmx_control/node-bootstrap.sh > "$RUNNER_TEMP/bootstrap.sh"
          sudo bash "$RUNNER_TEMP/bootstrap.sh"
          sudo bash "$RUNNER_TEMP/bootstrap.sh"
          sudo systemctl is-active docker tailscaled qmx-ship.timer
          sudo systemctl is-enabled qmx-node
          test -s /etc/systemd/system/qmx-node.service
          rclone version
          /usr/local/bin/uv --version
      - name: Verify checklist without live enrollment or subscriptions
        run: |
          sudo /opt/qmx/qmx-control/.venv/bin/qmx node verify > "$RUNNER_TEMP/checklist.txt" && exit 1 || status=$?
          test "$status" = 1
          cat "$RUNNER_TEMP/checklist.txt"
          grep '^PASS docker' "$RUNNER_TEMP/checklist.txt"
          grep '^PASS shipping' "$RUNNER_TEMP/checklist.txt"
          grep '^FAIL cliproxy' "$RUNNER_TEMP/checklist.txt"
      - name: Build, run, isolate, restart and restore the example
        env:
          QMX_TEST_DOCKER: '1'
        run: /usr/local/bin/uv run --project qmx-apps --frozen pytest qmx-apps/tests/test_docker.py -n 0 -q

name: UI quality
# Frontend profiles for the UI lane. Does not replace battery.yml poe check.
on:
  push:
    branches: [ui-integration]
    tags:
      - "factory-candidate/ui/**"
  pull_request:
    branches: [ui-integration]

permissions:
  contents: read

jobs:
  ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22.12.0"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4
        with:
          version: "10.18.3"
      - name: Detect host package
        id: host
        run: |
          python - <<'PY'
          from pathlib import Path
          roots = [
              Path("apps/host"),
              Path("apps/ui"),
              Path("host"),
              Path("tools/ui_factory/fixtures/factory-test-app"),
          ]
          found = next((p for p in roots if (p / "package.json").is_file()), None)
          print(f"host={found or ''}")
          if found is None:
              print("::notice::No UI host package.json; UI job skips (not a pass of product chrome)")
          with open(Path.home() / "host.txt" if False else "/dev/null", "w"):
              pass
          Path("host-path.txt").write_text(str(found) if found else "", encoding="utf-8")
          PY
          HOST=$(cat host-path.txt)
          echo "path=$HOST" >> "$GITHUB_OUTPUT"
          if [ -z "$HOST" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install and check
        if: steps.host.outputs.skip == 'false'
        working-directory: ${{ steps.host.outputs.path }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run check
          pnpm run test
          pnpm run build
      - name: Playwright
        if: steps.host.outputs.skip == 'false'
        working-directory: ${{ steps.host.outputs.path }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
      - name: Skipped host
        if: steps.host.outputs.skip == 'true'
        run: echo "No host package; job succeeded without claiming product UI."

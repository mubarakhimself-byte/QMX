id = "macro-daily-bias"
name = "Macro daily bias"
version = "1.0.0"
risk = "shows"
kind = "both"

[entrypoints]
mcp = "server.py"
jobs = ["daily.py"]
agents = ["agents/analyst.yaml"]
ui = "ui"

[suggested_trigger]
kind = "interval"
seconds = 86400

[capabilities]
network = ["127.0.0.1"]
data_reads = []

[capabilities.secrets]
QMX_DATA_TOKEN = "qmx/control-token"
QMX_MODEL_KEY = "qmx/cliproxy"
# The app code still reads QMX_MODEL_KEY on its live path (macro_bias.py), and the supervisor
# injects only declared secrets, so it stays declared here. The app moves to
# `llm_complete(role)` through the chat's one `qmx` server in the PR that owns macro_bias.py
# (BACKLOG, RTR4). Then this key goes.

[operations.bias]
description = "Read the latest persisted daily bias as an artifact under the bias output."
approval = "read"
returns = "artifact"
input_schema = { type = "object", properties = {}, additionalProperties = false }

[provides.bias]
stale_after = 129600
schema = { type = "object", required = ["bias", "rationale", "as_of", "source"], additionalProperties = false, properties = { bias = { type = "string", enum = ["bullish", "bearish", "neutral"] }, rationale = { type = "string" }, as_of = { type = "string" }, source = { type = "string" } } }

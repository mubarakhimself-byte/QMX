id = "macro-daily-bias"
name = "Macro daily bias"
version = "1.0.0"
risk = "shows"
kind = "both"

[entrypoints]
mcp = "server.py"
jobs = ["daily.py"]
agents = ["agents/analyst.yaml"]
ui = "ui"

[schedule]
interval_seconds = 86400

[capabilities]
network = ["127.0.0.1"]
data_reads = []

[capabilities.secrets]
QMX_DATA_TOKEN = "qmx/control-token"
QMX_MODEL_KEY = "qmx/cliproxy"

[budget]
runs = 40
cpu_seconds = 120
memory_mb = 1024
cpu_percent = 50

[provides.bias]
type = "object"
required = ["bias", "rationale", "as_of", "source"]
additionalProperties = false
properties = { bias = { type = "string", enum = ["bullish", "bearish", "neutral"] }, rationale = { type = "string" }, as_of = { type = "string" }, source = { type = "string" } }

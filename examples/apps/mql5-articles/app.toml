id = "mql5-articles"
name = "MQL5 articles"
version = "1.0.0"
risk = "runs"
kind = "headless"

[entrypoints]
mcp = "server.py"
jobs = ["jobs/daily.py"]

[schedule]
interval_seconds = 86400

[capabilities]
network = ["www.mql5.com", "localhost"]
secrets = { QMX_CONTROL_TOKEN = "qmx/control-token" }

[budget]
runs = 1000
cpu_seconds = 3600
memory_mb = 1024
cpu_percent = 50

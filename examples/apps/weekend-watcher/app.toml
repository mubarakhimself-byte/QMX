id = "weekend-watcher"
name = "Weekend watcher"
version = "1.0.0"
risk = "runs"
kind = "headless"

[entrypoints]
mcp = "server.py"
agents = ["agents/watcher.yaml"]

[capabilities]
network = []
data_reads = []

[operations.summarize]
description = "Summarise a supervisor-verified snapshot reference and land a summary artifact."
approval = "domain_write"
returns = "artifact"
input_schema = { type = "object", required = ["snapshot"], additionalProperties = false, properties = { snapshot = { type = "object" } } }

[feeds.snapshot.schema]
type = "object"
required = ["observations"]
additionalProperties = false

[feeds.snapshot.schema.properties.observations]
type = "array"
items = { type = "object", required = ["exchange", "status", "observed_at"], additionalProperties = false, properties = { exchange = { type = "string" }, status = { type = "string", enum = ["operational", "degraded", "unavailable", "unknown"] }, observed_at = { type = "string" } } }

[provides.summary]
schema = { type = "object", required = ["summary", "source_sha256", "mode"], additionalProperties = false, properties = { summary = { type = "string" }, source_sha256 = { type = "string" }, mode = { const = "recorded_fixture" } } }

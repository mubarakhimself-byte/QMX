[project]
name = "qmf-calendar-crypto247"
version = "0.1.0"
description = "The 24/7 crypto calendar as versioned data, with each venue's funding clock."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Data only. The reader's own tzdata turns each local time into an instant.
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]

[tool.uv.build-backend]
# PEP 420 namespace submodule, as qmf-calendar-forex: no src/qmf/__init__.py in the distribution.
module-name = "qmf.calendar_crypto247"

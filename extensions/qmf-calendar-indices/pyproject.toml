[project]
name = "qmf-calendar-indices"
version = "0.1.0"
description = "Index sessions and their per-index breaks as versioned data: the NYSE cash day and the US, UK, German and Japanese index CFDs, each in its exchange's time."
readme = "README.md"
requires-python = ">=3.14,<3.15"
# Data only. The reader's own tzdata turns each local time into an instant.
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule, as qmf-calendar-forex: no src/qmf/__init__.py in the distribution.
module-name = "qmf.calendar_indices"

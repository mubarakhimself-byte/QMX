[project]
name = "qmf-readings"
version = "0.1.0"
description = "Reading blocks, the reading runner and the stamped reading record: one code for a unit, QMB, the node and the MIS."
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmf-core",
    "qmf-data",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# An app installs qmf-readings as a wheel (`uv sync --no-editable`); rebuild it on any source edit.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]

[tool.uv.build-backend]
# PEP 420 namespace submodule: the code lives at src/qmf/readings/ with no
# src/qmf/__init__.py anywhere in the distribution.
module-name = "qmf.readings"

[tool.uv.sources]
qmf-core = { workspace = true }
qmf-data = { workspace = true }

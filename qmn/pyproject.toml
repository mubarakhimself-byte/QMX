[project]
name = "qmn"
version = "0.1.0"
description = "QMX trading node (code name qmn). Application-layer composition root; never a roster package and never a CLI."
requires-python = ">=3.14,<3.15"
# SemVer is display-only provenance (DEC-0186) — composition_fp is identity.
# Story 24.1 lands the venue boundary (qmf-core + sanctioned qmf-venue at
# qmn.venue). Story 24.4 adds qmb so the live loop drives run_slice unforked.
# Story 26.8 hosts QL-7 seats through the QML runtime protocol.
# Story 27.1 adds cryptography for the two-layer VPS secret store AEAD.
# Story 27.2 adds qmf-data for CT-10/15 governed intake and Dukascopy bootstrap.
# C-08 adds qmf-readings, the reading blocks that used to live in qmn.
# Story 27.5 reuses cryptography==50.0.1 ChaCha20Poly1305 as the CT-14 PayloadCipher.
dependencies = [
    "qmf-core",
    "qmf-data",
    "qmf-readings",
    "qmf-registry",
    "qmf-risk",
    "qmf-venue",
    "qmb",
    "qml",
    "prometheus-client==0.26.0",
    "cryptography==50.0.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
# An app installs qmn as a wheel (`uv sync --no-editable`); rebuild it on any source edit.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]

[tool.uv.build-backend]
# Top-level import qmn — not a qmf.* PEP 420 namespace submodule.
module-name = "qmn"

[tool.uv.sources]
qmf-core = { workspace = true }
qmf-data = { workspace = true }
qmf-readings = { workspace = true }
qmf-registry = { workspace = true }
qmf-risk = { workspace = true }
qmf-venue = { workspace = true }
qmb = { workspace = true }
qml = { workspace = true }

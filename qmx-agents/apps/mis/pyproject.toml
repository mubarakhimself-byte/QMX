[project]
name = "mis-app"
version = "1.0.0"
description = "The MIS as a mini app: QML's reading blocks and qmf-readings' labelers over this machine's market store"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp==4.0.11",
    "qml",
    "qmf-core",
    "qmf-data",
    "qmf-readings",
    "qmf-registry",
    "qmf-risk",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
qml = { path = "../../../qml", editable = true }
qmf-core = { path = "../../../packages/qmf-core", editable = true }
qmf-data = { path = "../../../packages/qmf-data", editable = true }
qmf-readings = { path = "../../../packages/qmf-readings", editable = true }
qmf-registry = { path = "../../../packages/qmf-registry", editable = true }
qmf-risk = { path = "../../../packages/qmf-risk", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.pyright]
include = [".", "tests"]
extraPaths = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "../.."
venv = ".venv"

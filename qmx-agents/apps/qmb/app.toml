id = "qmb"
name = "QMB"
version = "1.0.0"
risk = "runs"
kind = "headless"

[entrypoints]
mcp = "server.py"
jobs = ["jobs/backtest.py", "jobs/behaviour_check.py", "jobs/conformance.py"]

[operations.capabilities]
description = "What this tester replays: its contract, run kinds, fidelities and markets."
approval = "read"
state = "none"

[operations.instruments]
description = "The instrument classes and fidelities this tester can replay."
approval = "read"
state = "none"

[provides.backtest-result]
lander = "qmb-run"

[provides.backtest-result.schema]
type = "object"
required = ["run_id", "status"]

[breaker]
restart = "backoff"

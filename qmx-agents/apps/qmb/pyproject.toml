[project]
name = "qmb-app"
version = "1.0.0"
description = "QMB as a mini app: its run kinds as jobs over QMX's own qmb library"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp==4.0.11",
    "qmb",
    "qml",
    "qmf-calendar-cme",
    "qmf-calendar-crypto247",
    "qmf-calendar-forex",
    "qmf-calendar-indices",
    "qmf-core",
    "qmf-data",
    "qmf-indicators",
    "qmf-registry",
    "qmf-risk",
    "qmf-structure",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
qmb = { path = "../../../qmb", editable = true }
qml = { path = "../../../qml", editable = true }
qmf-calendar-cme = { path = "../../../extensions/qmf-calendar-cme", editable = true }
qmf-calendar-crypto247 = { path = "../../../extensions/qmf-calendar-crypto247", editable = true }
qmf-calendar-forex = { path = "../../../extensions/qmf-calendar-forex", editable = true }
qmf-calendar-indices = { path = "../../../extensions/qmf-calendar-indices", editable = true }
qmf-core = { path = "../../../packages/qmf-core", editable = true }
qmf-data = { path = "../../../packages/qmf-data", editable = true }
qmf-indicators = { path = "../../../packages/qmf-indicators", editable = true }
qmf-registry = { path = "../../../packages/qmf-registry", editable = true }
qmf-risk = { path = "../../../packages/qmf-risk", editable = true }
qmf-structure = { path = "../../../packages/qmf-structure", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.pyright]
include = [".", "tests"]
extraPaths = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "../.."
venv = ".venv"

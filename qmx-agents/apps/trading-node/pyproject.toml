[project]
name = "trading-node-app"
version = "0.1.0"
description = "The trading node as a mini app: its operations over QMX's own qmn library"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp==4.0.11",
    "qmn",
    "qmb",
    "qml",
    "qmf-core",
    "qmf-data",
    "qmf-indicators",
    "qmf-readings",
    "qmf-registry",
    "qmf-risk",
    "qmf-structure",
    "qmf-venue",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
qmn = { path = "../../../qmn", editable = true }
qmb = { path = "../../../qmb", editable = true }
qml = { path = "../../../qml", editable = true }
qmf-core = { path = "../../../packages/qmf-core", editable = true }
qmf-data = { path = "../../../packages/qmf-data", editable = true }
qmf-indicators = { path = "../../../packages/qmf-indicators", editable = true }
qmf-readings = { path = "../../../packages/qmf-readings", editable = true }
qmf-registry = { path = "../../../packages/qmf-registry", editable = true }
qmf-risk = { path = "../../../packages/qmf-risk", editable = true }
qmf-structure = { path = "../../../packages/qmf-structure", editable = true }
qmf-venue = { path = "../../../packages/qmf-venue", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLC0415"]

[tool.pyright]
include = [".", "tests"]
extraPaths = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "../.."
venv = ".venv"

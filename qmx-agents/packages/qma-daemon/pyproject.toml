[project]
name = "qma-daemon"
version = "0.1.0"
description = "QMA sole runtime and sole writer of journal, SQLite, and artifact store via qmf-data sinks."
requires-python = ">=3.14,<3.15"
dependencies = [
    "qma-core",
    "qma-wire",
    "qmf-core",
    "qmf-registry",
    "qmf-data",
    "qmf-risk",
    # IANA zone resolution for wall-clock policies (FR-Q25; AD-6). Same pin as
    # the forex calendar extension so ZoneInfo works on Windows hosts.
    "tzdata==2025.2",
    "langchain==1.4.3",
    "langgraph==1.2.14",
    "deepagents==0.7.22",
    "PyYAML==6.0.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# PEP 420 namespace submodule. Dot notation tells uv_build the module lives at
# src/qma/daemon/ with NO src/qma/__init__.py anywhere in the distribution.
module-name = "qma.daemon"

[tool.uv.sources]
qma-core = { workspace = true }
qma-wire = { workspace = true }
qmf-core = { workspace = "../../.." }
qmf-registry = { workspace = "../../.." }
qmf-data = { workspace = "../../.." }
qmf-risk = { workspace = "../../.." }

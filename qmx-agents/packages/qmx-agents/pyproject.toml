[project]
name = "qmx-agents"
version = "0.1.0"
description = "Agent specs and model routing for the QMX rebuild"
requires-python = ">=3.14,<3.15"
dependencies = [
    "deepagents==0.7.22",
    "langchain[mcp]==1.4.3",
    "langchain-core==1.6.7",
    "langgraph==1.2.14",
    "langchain-anthropic==1.7.5",
    "langchain-openai==1.6.7",
    "keyring==25.7.0",
    "pydantic>=2,<3",
    "PyYAML==6.0.3",
    "httpx==0.28.1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "qmx-tools",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Keep the strangler independent of the legacy workspace and its older pins.
[tool.uv.workspace]
members = []

[tool.uv.sources]
qmx-tools = { path = "../qmx-tools", editable = true }

[dependency-groups]
dev = ["ruff==0.16.5", "pyright==1.1.411", "pytest>=9,<10", "pytest-cov>=7,<8", "pytest-xdist>=3.8,<4", "poethepoet==0.48.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"
markers = ["serial: requires exclusive access to shared resources"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests", "../../../scripts/live/smoke_agent.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests ../../../scripts/live/smoke_agent.py"
lint = "ruff check --config pyproject.toml src tests ../../../scripts/live/smoke_agent.py"
types = "python -m pyright"

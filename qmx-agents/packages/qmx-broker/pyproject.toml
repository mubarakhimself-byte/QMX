[project]
name = "qmx-broker"
version = "0.1.0"
description = "Broker account reads and unsigned Portfolio proposals"
requires-python = ">=3.14,<3.15"
dependencies = ["fastmcp==4.0.11", "pydantic>=2,<3", "keyring==25.7.0", "ccxt==4.5.85", "qmf-venue"]

[project.scripts]
qmx-broker = "qmx_broker.server:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
qmf-venue = { workspace = "../../.." }

[dependency-groups]
dev = ["ruff==0.16.5", "pyright==1.1.411", "pytest>=9,<10", "pytest-xdist>=3.8,<4", "pytest-cov>=7,<8", "poethepoet==0.48.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"
markers = ["serial: requires exclusive access to shared resources"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests", "../../../scripts/live/smoke_broker.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests ../../../scripts/live/smoke_broker.py"
lint = "ruff check --config pyproject.toml src tests ../../../scripts/live/smoke_broker.py"
types = "python -m pyright"

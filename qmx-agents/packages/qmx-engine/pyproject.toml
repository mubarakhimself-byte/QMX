[project]
name = "qmx-engine"
version = "0.1.0"
description = "QMX workflow engine: one engine for script-only, mixed and agentic workflows"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qma-harness",
    "qmx-control",
    "qmx-ledger",
    "qma-core",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "cronsim==2.7",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
qma-harness = { workspace = true }
qmx-control = { workspace = true }
qmx-ledger = { workspace = true }
qma-core = { workspace = true }

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "pytest-cov>=7,<8",
    "poethepoet==0.48.0",
    "types-jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"
markers = ["serial: requires exclusive access to shared resources"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests"]
# A template's scripts are workflow content an operator edits, run as `python -I` subprocesses.
exclude = ["src/qmx_engine/templates/**/scripts"]
# qma-harness ships no py.typed; reading its source gives the engine its real types.
extraPaths = ["src", "../qma-harness/src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests"
lint = "ruff check --config pyproject.toml src tests"
types = "python -m pyright"

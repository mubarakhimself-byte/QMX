[project]
name = "qmx-memory"
version = "0.1.0"
description = "QMX memory: memory rows are Library objects, Hindsight indexes them and FTS5 stands behind it"
requires-python = ">=3.14,<3.15"
dependencies = [
    "qmx-engine",
    "qmx-home",
    "qmx-library",
    "pydantic==2.13.4",
    # Hindsight's embedded engine, pinned to the version P-MEM measured on this PC (PRB-L).
    "hindsight-all==1.0.0",
    "pg0-embedded==0.15.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
qmx-engine = { workspace = true }
qmx-home = { workspace = true }
qmx-library = { workspace = true }

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "poethepoet==0.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../qmx-engine/src", "../qmx-library/src", "../qma-harness/src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests"
lint = "ruff check --config pyproject.toml src tests"
types = "python -m pyright"

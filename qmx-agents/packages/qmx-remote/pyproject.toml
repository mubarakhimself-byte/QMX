[project]
name = "qmx-remote"
version = "0.1.0"
description = "Durable QMX remote runs and content-addressed results"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic>=2,<3", "keyring==25.7.0", "qmx-agents", "qmx-apps"]

[project.optional-dependencies]
amp = ["amp-sdk==0.1.20260918210324"]
modal = ["modal==1.6.1"]
e2b = ["e2b==2.53.1"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = []

[tool.uv.sources]
qmx-agents = { path = "../qmx-agents", editable = true }
qmx-apps = { path = "../../../qmx-apps", editable = true }

[dependency-groups]
dev = ["ruff==0.16.5", "pyright==1.1.411", "pytest>=9,<10", "pytest-xdist>=3.8,<4", "pytest-cov>=7,<8", "poethepoet==0.48.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests", "../../../scripts/live/smoke_remote.py"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests ../../../scripts/live/smoke_remote.py"
lint = "ruff check --config pyproject.toml src tests ../../../scripts/live/smoke_remote.py"
types = "python -m pyright"

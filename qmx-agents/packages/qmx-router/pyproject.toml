[project]
name = "qmx-router"
version = "0.1.0"
description = "QMX router: the relay for key and GPT traffic, the GPT translator and sign-in, provider profiles and plan readings"
requires-python = ">=3.14,<3.15"
dependencies = [
    "claude-agent-sdk==0.2.166",
    "keyring==25.7.0",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "poethepoet==0.48.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"

[tool.ruff]
extend = "../../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests"]
# The moved relay tests build the harness's TestMode and SessionId-typed fixtures; the router's
# own source imports no harness module (tests/test_boundary.py).
extraPaths = ["src", "../qma-harness/src"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests"
lint = "ruff check --config pyproject.toml src tests"
types = "python -m pyright"

[project]
name = "qmx-tools"
version = "0.1.0"
description = "Shared QMX domain tools and MCP servers"
requires-python = ">=3.14,<3.15"
dependencies = ["qmx-home", "fastmcp==4.0.11", "pydantic>=2,<3", "qmf-data", "qmb", "qml", "qmn", "qmx-control"]

[project.scripts]
qmx-mcp-data = "qmx_tools.servers:data"
qmx-mcp-backtest = "qmx_tools.servers:backtest"
qmx-mcp-research = "qmx_tools.servers:research"
qmx-mcp-node = "qmx_tools.servers:node"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
qmx-home = { workspace = true }
qmf-data = { workspace = "../../.." }
qmb = { workspace = "../../.." }
qml = { workspace = "../../.." }
qmn = { workspace = "../../.." }
qmx-control = { workspace = true }

[dependency-groups]
dev = ["ruff==0.16.5", "pyright==1.1.411", "pytest>=9,<10", "pytest-cov>=7,<8", "pytest-xdist>=3.8,<4", "poethepoet==0.48.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"
markers = ["serial: requires exclusive access to shared resources"]

[tool.ruff]
extend = "../../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests"
lint = "ruff check --config pyproject.toml src tests"
types = "python -m pyright"

# Shared agent workspace; qma-ui-contract remains deferred (GAP-0081).

[project]
name = "qmx-workspace"
version = "0.1.0"
description = "Shared QMX agent workspace"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["packages/qmx-tools", "packages/qmx-broker", "packages/qmx-remote", "packages/qmx-apps", "packages/qmx-control", "packages/qmx-ledger", "packages/qma-harness", "packages/qmx-engine", "packages/qmx-host", "packages/qmx-library", "packages/qmx-router", "packages/qmx-memory", "packages/qmx-hub", "packages/qmx-home", "packages/qmx-judge"]

[tool.uv.sources]
qmx-tools = { workspace = true }
qmx-broker = { workspace = true }
qmx-remote = { workspace = true }
qmx-apps = { workspace = true }
qmx-control = { workspace = true }
qmx-ledger = { workspace = true }
qma-harness = { workspace = true }
qmx-engine = { workspace = true }
qmx-host = { workspace = true }
qmx-library = { workspace = true }
qmx-router = { workspace = true }
qmx-memory = { workspace = true }
qmx-hub = { workspace = true }
qmx-home = { workspace = true }
qmx-judge = { workspace = true }
# Parent QMF roster packages — path edges into the enclosing QMX workspace.
qmf-core = { workspace = ".." }
qmf-registry = { workspace = ".." }
qmf-data = { workspace = ".." }
qmf-risk = { workspace = ".." }

# Shared spot fixtures import the node and its parent-workspace dependencies in tests.
qmn = { workspace = ".." }
qmb = { workspace = ".." }
qml = { workspace = ".." }
qmf-indicators = { workspace = ".." }
qmf-structure = { workspace = ".." }
qmf-venue = { workspace = ".." }

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "poethepoet==0.48.0",
    "pytest-xdist>=3.8,<4",
    "qmn",
    "types-pywin32==312.0.0.20261006",
    "types-jsonschema",
    "types-cachetools>=7.0.0.20260713",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal --ignore=packages/qmx-tools --ignore=packages/qmx-broker --ignore=packages/qmx-remote --ignore=packages/qmx-apps --ignore=packages/qmx-control --ignore=packages/qmx-ledger --ignore=packages/qma-harness --ignore=packages/qmx-engine --ignore=packages/qmx-host --ignore=packages/qmx-library --ignore=packages/qmx-router --ignore=packages/qmx-memory --ignore=packages/qmx-hub --ignore=packages/qmx-home --ignore=packages/qmx-judge"
markers = ["serial: requires exclusive access to shared resources"]
testpaths = ["packages"]
pythonpath = [
    "../packages/qmf-core/src",
    "../packages/qmf-data/src",
    "../packages/qmf-registry/src",
    "../packages/qmf-risk/src",
    "../qmn/src",
    "../packages/qmf-venue/src",
    "../qmb/src",
    "../qml/src",
]

[tool.ruff]
line-length = 100
extend-exclude = [".venv", "packages/qmx-tools", "packages/qmx-broker", "packages/qmx-remote", "packages/qmx-apps", "packages/qmx-control", "packages/qmx-ledger", "packages/qma-harness", "packages/qmx-engine", "packages/qmx-host", "packages/qmx-library", "packages/qmx-router", "packages/qmx-memory", "packages/qmx-hub", "packages/qmx-home", "packages/qmx-judge"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF", "PL"]
ignore = [
    "PLW1510",
    "S603",
    "RUF002",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*" = ["S101", "S105", "S106", "S107", "PLC0415"]
"packages/*/examples/*" = ["S101"]
"examples/*" = ["S101"]

[tool.pyright]
include = ["packages", "examples"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "packages/qma-ui-contract", "packages/qmx-tools", "packages/qmx-broker", "packages/qmx-remote", "packages/qmx-apps", "packages/qmx-control", "packages/qmx-ledger", "packages/qma-harness", "packages/qmx-engine", "packages/qmx-host", "packages/qmx-library", "packages/qmx-router", "packages/qmx-memory", "packages/qmx-hub", "packages/qmx-home", "packages/qmx-judge"]
extraPaths = [
    "../packages/qmf-core/src",
    "../packages/qmf-data/src",
    "../packages/qmf-registry/src",
    "../packages/qmf-risk/src",
    "../qmn/src",
    "../packages/qmf-venue/src",
    "../qmb/src",
    "../qml/src",
]
typeCheckingMode = "strict"
pythonVersion = "3.14"
pythonPlatform = "Windows"

[tool.poe.tasks]
fmt = "ruff format packages examples"
fmt-check = "ruff format --check packages examples"
lint = "ruff check packages examples"
# python -m: direct `pyright` console script can be blocked by host App Control.
# `poe.exe` itself is also blocked under this nested .venv (os error 4551); after
# `uv sync` run `python scripts/ensure_poe_shim.py` so `uv run poe` uses poe.cmd.
types = "python -m pyright"

[tool.poe.tasks.check]
sequence = ["fmt-check", "lint", "types"]
default_item_type = "ref"

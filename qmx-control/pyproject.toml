[project]
name = "qmx-control"
version = "0.1.0"
description = "One QMX service layer served through REST and MCP"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.2",
    "fastmcp>=4,<5",
    "keyring==25.7.0",
    "httpx==0.28.1",
    "uvicorn>=0.35,<1",
    "tomli-w>=1.2,<2",
    "psutil>=7,<9",
    "qmx-apps",
    "qmx-broker",
]

[project.scripts]
qmx-control = "qmx_control.__main__:main"
qmx = "qmx_control.node:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.workspace]
members = []

[tool.uv.sources]
qmx-apps = { path = "../qmx-apps", editable = true }
qmx-broker = { path = "../qmx-agents/packages/qmx-broker", editable = true }

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pyright==1.1.411",
    "pytest>=9,<10",
    "pytest-xdist>=3.8,<4",
    "pytest-cov>=7,<8",
    "poethepoet==0.48.0",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n 2 --dist worksteal"
markers = ["serial: requires exclusive access to shared resources"]

[tool.ruff]
extend = "../pyproject.toml"
extend-exclude = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "PLC0415"]
"src/qmx_control/__main__.py" = ["S404"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../examples/apps/mql5-articles"]
typeCheckingMode = "strict"
pythonVersion = "3.14"

[tool.poe.tasks]
fmt-check = "ruff format --config pyproject.toml --check src tests"
lint = "ruff check --config pyproject.toml src tests"
types = "python -m pyright"

# One table per headless role (FACTORY-DESIGN section 11.3). launch.load_roles reads it; a project
# profile's [roles.<name>] table may override model, effort and fallback.
# timeout_s: the run is killed past it and comes back as kind "timeout".
# settings: the Claude Code settings file in this folder passed with --settings.
# fallback: --fallback-model; a Fable role falls back to Opus and says so (FALLBACK in result.json).

[builder]
model = "claude-opus-5-5"
effort = "high"
agent_tool = false
timeout_s = 10800
settings = "builder.json"

[fixer]
model = "claude-opus-5-5"
effort = "high"
agent_tool = false
timeout_s = 10800
settings = "builder.json"

[reader]
model = "claude-opus-5-5"
effort = "high"
agent_tool = false
timeout_s = 7200
settings = "reader.json"

[fault-reader]
model = "fable"
effort = "high"
agent_tool = false
timeout_s = 7200
settings = "reader.json"
fallback = "claude-opus-5-5"

[verdict]
model = "claude-opus-5-5"
effort = "high"
agent_tool = false
timeout_s = 3600
settings = "verdict.json"

[plan-review]
model = "claude-opus-5-5"

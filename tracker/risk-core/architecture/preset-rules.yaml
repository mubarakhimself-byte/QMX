# Which rule moves each core numeric row, on what clock, which way when data is missing, and which row reads it.
# Rules are decided here; values stay open for the numbers lens. build_preset_numbers.py joins this to ledger/v1/ and
# refuses a core numeric row with no line here, or a line for a row that is not core and numeric.
# c class: user (never-self-tune, his), preset (a value in the preset through preset-default@1), derive (a rule computes it),
#          fact (measured, never chosen), venue (from the instrument record), report (written, reads into no size)
# r rule, g rung on day one, k clock, d cautious direction, m authority mode, o owning row, v model value (the sim's, no authority), n note
# d: down or up (the way the value moves when data is missing), hold, blocks (a blank blocks the live click), refuse, label

# 6a. Code field names, not ledger ids (hand-off 22).
code_fields:
  - from: r_after_costs
    to: gross_r
    reason: "it holds gross today and keeps its value under an honest name; it is never net_r. net_r is a new field, (money + cash) / risk; costs_r on the row is display only. trade_r stays gross; brakes, the money ledger, the CUSUM and the gate read net_r; drift attribution keeps both streams. Our call, with his B9 reservation standing (CHECK.md B1)."


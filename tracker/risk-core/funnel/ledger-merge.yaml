  - keep: ev_min_viable_edge_r
    absorb: [expectancy_floor_r]
    note: "one minimum viable edge after costs; expectancy_floor_r (v0) is its old name."
  - keep: verification_trades_needed
    absorb: [min_trades_for_verdict]
    note: "hand-off 34: too_thin derives from the plan, not a fixed 100."
  - keep: brake_precision

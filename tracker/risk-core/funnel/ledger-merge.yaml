    note: "settling_time (X4) stays separate: it is the isolation's settling window in minutes, not the size change's in trades."
  - keep: retrip_backoff_multiplier
    absorb: [isolation_retrip_backoff]
    note: "X3 says its id covers both the unit's restore cool-down and the isolation's TTL; X4's isolation-only form merges into it."
  - keep: tier_dwell

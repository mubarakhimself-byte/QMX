  - keep: x1_fail_mode
    absorb: [agent_evidence_fail_mode, context_need_fail_mode, journal_write_fail_mode]
    note: "one fail-mode field per feed or brake row (DP23, F9), with the three defaults (board open, isolation closed, evidence neutral, journal closed)."
  - keep: exits_never_blocked
    absorb: []
    note: "stays an invariant row; its text gains 'by QMX's controls; a venue refusal raises the incident's urgency' (X4 collision 15)."
  - keep: bench_min_rest
    absorb: []
    note: "kept; referenced by X3-H74 and X4-29, 71."

# 4. Ids that die with dropped hybrids.
dies:
  - id: lot_dither_max_multiple
    with: X2-H46
    reason: "lot dither dropped: rounds single trades up to 1.5x plan."
  - id: x1_oracle_mode
    with: X1-H69
    reason: "the central oracle dropped: single point of failure."
  - id: x1_affects_graph_runtime
    with: X1-H71
    reason: "affects edges at run time dropped; the typed edges live in the ledger and compile-time layer H (x1_layer_h_rules stays)."
  - id: holding_horizon
    with: X0-49
    reason: "NOT dead: the dial is dropped but the id stays as a measured field with status idea; the applier keeps it and adds the note 'measured realised hold against the preset's range; raises yellow only'."
    keep: true
  - id: session_multiplier
    with: X2-H40 (restructure 5)
    reason: "the free session size multiplier is deleted; the id moves to status dropped with seen_values kept."
  - id: premium_window_flag
    with: X2-H40
    reason: "NOT dead: stays as the measured-slice flag (X0-47, X5-H47); its 'lift' semantics are removed from the derivation; status proposal."
    keep: true
  - id: sweep_cap_equity
    with: DP16
    reason: "the 2.5x cliff is replaced by the ratchet; status dropped with seen_values kept; gain_lock_fraction and rising_floor_fraction carry the idea."
  - id: repromotion_positive_demo_trades
    with: X5-H26
    reason: "the ten-wins rule is dropped; status dropped with seen_values kept."
  - id: decay_recent_trades
    with: X5 restructure 1
    reason: "the 20-trade decay check is replaced; status dropped; ev_look_schedule and cusum_limit carry the job."
  - id: decay_record_days
    with: X5 restructure 1
    reason: "as above."

# 5. Renames (no merge).
rename:
  - from: x1_compiler_format
    to: compiler_format
    reason: "the format is the stack's, not X1's; value now 4 (G12), the bump this set needs is 5."

# 6. Orphans reported by the checker (no coupling either way).
orphans:
  - id: x1_adapters_per_slot_min
    action: "couple: affects x1_min_trust_per_slot (down:cap)."
  - id: x1_ledger_snapshot_in_compiled_unit
    action: "couple: inputs [x1_layer_h_rules]; affects decision_freshness_bound (down:cap). Who releases a snapshot is DP2's compile step; note it in open_questions."
  - id: x1_runs_on
    action: "couple: affects x1_number_authority_mode (down:state; the applier runs beside the order path, X1-H31) and risk_fact_staleness_limit (down:cap; a replicated fold is late by its harvest cadence)."

# 6a. Code field names, not ledger ids (hand-off 22). The ledger carries R measures as `expectancy_r`,
#     `round_trip_cost_r` and the trade-row ids; the code fields rename beside them:
code_fields:
  - from: r_after_costs
    to: net_r
    reason: "the misleading name; trade_r stays gross at the stop; net_r = trade_r minus costs in R; brakes, the money ledger and the proof battery read net_r, drift attribution keeps both streams."

# Existence check, 6 Nov 2026: every id named in sections 1 to 7 was found as an id in variables.yaml
# or additions/*.yaml, except the three in 6a (code fields) and X1-H46's staleness check (a field).

# 7. Status changes the picks imply (applied after the merges).
status:
  - ids: [x1_number_authority_mode, x1_retune_share_cap, x1_restore_probe_trades, money_brake_percentile, money_brake_window_trades, money_brake_threshold_r, money_brake_dollar_clamp, survival_horizon_rounds, horizon_survival_risk_usd, planning_edge_point, stressed_unit_correlation, cost_gap_kelly_ceiling, stop_fill_gap_factor, committed_cushion_usd, fast_invalidation_cut_r, fi_cut_mae_percentile, falsifying_condition, exits_never_blocked, control_rank_table, x1_trading_state, risk_state_emit_interval, risk_fact_staleness_limit]
    to: proposal
    note: "the first-increment set (shape C); everything else picked stays at its current status; 'later' hybrids' ids stay idea."
  - ids: [choke_budget_fire_rate, brake_random_control_margin, x1_enforcement_percent]
    to: proposal
    note: "the certificate rule (DP19) is a compile requirement in the first increment."

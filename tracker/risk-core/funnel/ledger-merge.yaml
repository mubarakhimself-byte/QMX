    absorb: []
    note: "last round, as SPINE.md 4.1 has it: values at go-live: [own_record, pooled_class, preset, user, refuse]"
  - keep: state_carry_rule
    absorb: []
    note: "last round (CHECK.md B7), value at go-live: carry_brake_states. A version, a rebind or a restart never clears a bench, a lockout, a drift lock, a stand-down, a paper state, the level, or the ledgers those read. A version restarts the money record as a report only. A world switch keeps its own rule (world_switch_reset_rule) and needs his click."
  - keep: risk_stop_resume_rule
    absorb: []
    note: "last round (CHECK.md item 6), value at go-live: his_click. A lockout (the third bench inside the window) waits for his resume, so a healthy unit's lockout costs what his attention costs; the fold's sim let it expire."
  - keep: x1_guard_unavailable_action
    absorb: []
    note: "last round (CHECK.md B3), value at go-live: entries_refuse_exits_run. Any raise or refusal from a guard call or a status write becomes guard_unavailable on entries; exits mint; the unit stays trading."
  - keep: edge_to_cost_ratio_min
    absorb: []
    note: "last round (CHECK.md B2): shadow at go-live, written on the receipt as would_have. At 2 it refuses the worked healthy unit at every hour on the pooled stressed default, which is M7 again. The gate reads the holdout's net low end and a cell's own fills; the numbers lens may bind a ratio only on measured cells, with F1's table beside it."
  - keep: session_loss_limit_r
    absorb: []
    note: "last round (CHECK.md item 11): shadow at go-live as session-loss@1, written as would_have. Binding it would be a second live reading of the unit's running loss, which SPINE.md AD-8 refuses. He must be told this brake does not bind at go-live (SPINE.md section 13)."
  - keep: gross_edge_r
    absorb: []
    note: "last round (CHECK.md B1): the CUSUM reads net_r against the holdout's net_r at go-live. This row is the drift attribution's gross half, later. Its r_after_costs is the code field that holds gross, renamed gross_r."
  - keep: level_lockout_days
    absorb: []
    note: "promoted to core by the fold (SPINE.md 4.2, appendix C): a CUSUM warning steps the level down and locks its top there for this period, the bench's lockout applied to drift, so the unit's two brakes share one restore rule; 20 days is the rung the fold sim used, the numbers lens owns the value."

# 4. Ids that die with dropped hybrids or dropped mechanisms.
dies:
  - id: lot_dither_max_multiple
    with: X2-H46
    reason: "lot dither dropped."
  - id: x1_oracle_mode
    with: X1-H69
    reason: "the central oracle dropped."
  - id: x1_affects_graph_runtime
    with: X1-H71
    reason: "affects edges at run time dropped; x1_layer_h_rules stays."
  - id: ev_level_evidence_alpha
    with: X5-H13 (the evidence bar under the baseline)
    reason: "the e-meter no longer gates any level under baseline (DP10, M2); ev_evidence_e, ev_bet_grid and ev_score_scale_r stay for its two remaining jobs (raises above baseline, the dial)."
  - id: holding_horizon
    with: X0-49
    reason: "NOT dead: the dial is dropped but the id stays as a measured field with status idea; adds the note 'measured realised hold against the preset's range; raises yellow only'."
    keep: true
  - id: session_multiplier
    with: X2-H40
    reason: "the free session size multiplier is deleted; status dropped with seen_values kept."
  - id: premium_window_flag
    with: X2-H40
    reason: "NOT dead: stays as the measured-slice flag; its 'lift' semantics removed; status proposal, tier later."
    keep: true
  - id: sweep_cap_equity
    with: DP16
    reason: "the 2.5x cliff is replaced by the ratchet (later); status dropped with seen_values kept."
  - id: repromotion_positive_demo_trades
    with: X5-H26
    reason: "the ten-wins rule is dropped."
  - id: decay_recent_trades
    with: X5 restructure 1
    reason: "the 20-trade decay check is replaced."
  - id: decay_record_days
    with: X5 restructure 1
    reason: "as above."
  - id: cap_multiplier
    with: DP16
    reason: "the 2.5x sweep cliff it multiplied is replaced by the ratchet (later); its only edge died with sweep_cap_equity, so it was the ledger's one orphan (fold; NOTES.md item 18)."

# 5. Renames (no merge).
rename:

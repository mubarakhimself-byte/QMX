  - keep: ev_approval_markets
    absorb: [ev_canary_share, x1_canary_share]
    note: "the market list with its canary subset."
  - keep: x1_proposal_direction_allowed
    absorb: [agent_proposal_bounds, loosening_evidence_bar, operation_risk_direction]

  - keep: bms_circuit_breaker
    absorb: []
    note: "at go-live this is the portfolio day stop: book day loss past k x the book's sized day sigma raises a stand-down at `all` with an expiry at the next anchor (DP22, F26). bms_breaker_target_fire_rate is its harness column."
  - keep: house_money_scope
    absorb: []
    note: "value at go-live: portfolio (both halves of the pair, DP14)."
  - keep: choke_budget_fire_rate
    absorb: []
    note: "becomes the TOTAL choke budget across all cuts on a healthy unit, tested in the harness (DP19); the per-brake form is a field. Fold: measure 'ratio', name 'Least share of baseline dollars a healthy unit must risk over every opportunity, refusals counted as zero', value at go-live: 0.75 (FUNNEL 5.2; a healthy unit under it fails CI for any change touching a binding item, SPINE.md AD-16). The metric is dollars risked over the flat baseline of N on every opportunity, because size over baseline on trades taken cannot see a refusal (CHECK.md B8). The baseline already holds the reserve and the cost denominator, 0.7225 of the raw formula in the model. The test runs all 23 things that bind. The old per-brake 5 percent stays in seen_values."

    note: "one event window; the per-driver length is its derivation (state-based with a class maximum, DP21)."
  - keep: cohort_trades
    absorb: [ev_cohort_trades]
  - keep: bad_cohort_r
    absorb: [ev_bad_cohort_r]
  - keep: last_trip_size_level

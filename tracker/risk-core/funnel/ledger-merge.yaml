  - keep: hourly_cost_profile
    absorb: [cost_cell_key]
    note: "the cell key (instrument, hour of week, broker, order type) is the profile's index, not a second variable."
  - keep: stressed_unit_correlation
    absorb: [correlation_stress_rho]
  - keep: worst_step_move_r

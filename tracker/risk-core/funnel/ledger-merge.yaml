  - keep: trades_toward_proof
    absorb: [ev_trades_toward_proof]
    note: "one count of trades toward verification_trades_needed (fold; NOTES.md listed the pair as one idea)."
  - keep: risk_state_emit_interval
    absorb: [x1_risk_state_emit_interval]
    note: "one emit cadence for the RiskState row: on change plus a heartbeat (fold; NOTES.md listed the pair as one idea)."
  - keep: per_driver_exposure_cap
    absorb: [class_risk_cap]
    note: "X4-92 derives the cap from the buffer over a tail gap; X0-41's class cap is the same cap keyed by class."
  - keep: hourly_cost_profile
    absorb: [cost_cell_key]
    note: "the cell key is the profile's index. At go-live a missing cell resolves to the pooled stressed class default (DP11)."

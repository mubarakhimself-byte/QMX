# Ledger merge for v1, written as data by the funnel judge, 6 Nov 2026.
# A later step applies this to variables.yaml plus additions/*.yaml and re-runs ledger/check.py.
# Rules the applier must follow:
#   - `keep` is the surviving id. Every id in `absorb` is deleted; its name, aliases, seen_values,
#     sources, seed_ids, inputs and affects are folded into `keep`; the absorbed id is added to
#     `keep`'s aliases so old references still resolve.
#   - Where two absorbed entries disagree on level or measure, `note` says which wins.
#   - `dies` lists ids that leave the ledger with their dropped hybrid; references to them are removed.
#   - `rename` lists ids that change name with no merge.
#   - `type_edges` is a new field the applier adds to every `affects` entry (down:cap, down:state,
#     up:event); FUNNEL.md DP6 and X1-H35 define it. Default by level: a higher level affecting a
#     lower one is down:cap unless the target is a state (brake_state, x1_trading_state, kill_switch_*),
#     then down:state; a lower level affecting a higher one is up:event.
# Ids below are read from the layers' texts and the checker's output, not from the additions
# files themselves; the applier validates every id against the loaded set and reports any it cannot find.

version: 1
source_check: "ledger/check.py --with-additions --no-write --no-paths, 6 Nov 2026: 903 variables, 1758 couplings, 7 duplicate ids, 5 alias warnings, 3 orphans"

# 1. The seven duplicate ids (checker ERRORS). The same id in two files becomes one entry.
duplicates:
  - keep: co_loss_breadth
    absorb_from: [X4-scenarios.yaml]
    keep_file: X0-trading-lens.yaml
    note: "X0's definition (share of live units losing in one window and the loss given that) is the fuller one; X4's adds the family case (64)."
  - keep: open_breadth_budget_scale
    absorb_from: [X4-scenarios.yaml]
    keep_file: X2-sizing-accelerators.yaml
    note: "X2's carries the derivation (sigma budget scaled by N_eff open); X4-24 and 93 are its scenarios. Also absorbs X0's day_budget_breadth_scale (same idea) below."
  - keep: sleeve_stress_loss_usd
    absorb_from: [X4-scenarios.yaml]
    keep_file: X2-sizing-accelerators.yaml
    note: "measure USD at the class's worst step; X4's use in 87 is the de-gross ranking."
  - keep: world_switch_reset_rule
    absorb_from: [X4-scenarios.yaml]
    keep_file: X2-sizing-accelerators.yaml
    note: "one rule: level 1, house money zero, brake counters reset, costs uncalibrated, new stage tag, paid e-restart (X5-H28)."
  - keep: burn_rate_ticket_threshold
    absorb_from: [X4-scenarios.yaml]
    keep_file: X6-observability.yaml
    note: "X6-15 defines burn in expected trades over two windows; X4-07 is its scenario."
  - keep: burn_rate_page_threshold
    absorb_from: [X4-scenarios.yaml]
    keep_file: X6-observability.yaml
    note: "as above."
  - keep: bad_day_percentile
    absorb_from: [X4-scenarios.yaml]
    keep_file: X6-observability.yaml
    note: "the card's daily distribution percentile for 'yesterday was a one-in-N day'. X5's ev_bad_day_percentile merges into it below."

# 2. The five alias warnings. One idea split in two.
aliases:
  - keep: status_generation
    absorb: [x1_status_generation]
    note: "X6-01's id survives; X1-H01 defined the same stamp."
  - keep: derivation_fallback_order
    absorb: [x1_derivation_fallback_order]
    note: "X4-56's id survives; X1-H08 is the fuller definition, fold its text into the derivation."
  - keep: bet_key_rule
    absorb: [x1_bet_key_rule]
    note: "X4-92's id survives; X1-H38's text (underlying, currency legs, class, direction, driver, window) is the rule."
  - keep: shed_priority_class
    absorb: [x1_shed_priority_class]
    note: "X4-65's id survives; X1-H41's four classes and X2-H30's QoS classes are its values (probation, paper-graduate, proven, core = BestEffort, Burstable, Guaranteed)."
  - keep: agent_evidence_ttl
    absorb: [x1_proposal_expiry]
    note: "both carried the alias evidence_expiry_by_type; X7-H39's per-kind TTL table is the definition; X1-H50's proposal expiry is the same field."

# 3. Same idea under different ids across layers (not flagged by the checker; merged by the picks).
merges:
  - keep: day_budget_breadth_scale
    absorb: [open_breadth_budget_scale]
    note: "after section 1 collapses X2/X4, fold the result into X0's id, which is the one X3-H37 reuses; final survivor: day_budget_breadth_scale."
  - keep: trip_tax_r
    absorb: [ev_trip_tax, trip_tax_record]
    note: "one trip-tax measure (X6-22, X3-H64); X4-76's record is its per-action row."
  - keep: demotion_cause
    absorb: [ev_demotion_cause]
  - keep: upside_alarm_percentile
    absorb: [ev_upside_alarm_percentile, upside_alarm_cone_percentile]
  - keep: twin_gap_r
    absorb: [ev_twin_gap_r]
  - keep: exit_mechanism

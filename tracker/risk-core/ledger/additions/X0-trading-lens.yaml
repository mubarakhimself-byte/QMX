- id: stop_premium_check
  name: Whether the unit's own returns persist at its horizon, so a stop or breakeven rule can help
  level: unit
  kind: evidence
  measure: "other: momentum, mean-reverting or unknown"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Measured on the unit's own trade paths (MAE and MFE excursions) at its holding horizon: a stop-loss rule adds value only under momentum and costs value under mean reversion (Kaminski-Lo). Momentum allows a trailing or breakeven move; mean reversion gets a time exit and no stop move; unknown keeps the disaster stop only."
  inputs: [excursion_mae_mfe_r, holding_horizon]
  affects:
    - {id: stop_policy_per_style, direction: either, how: "The stop policy is chosen per logic from this check, not per style name."}
    - {id: breakeven_trigger, direction: either, how: "A breakeven move is allowed only where the check says momentum."}
  configurable: true
  changed_by: [agent_proposal, automatic]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A5-topup.yaml", note: "A5-079 stopping-premium pre-check; A5-081 trend reversal as the exit"}
    - {gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml", note: "A2-249 Kaminski-Lo; A2-234 breakeven only when the forecast changes; A2-269 his memory of dynamic SL/TP"}
  seed_ids: [A10, A28]
  notes: "Answers M15 (dynamic SL/TP for intraday, fast invalidation for scalpers) with a test instead of a style rule."

- id: tier_dwell
  name: Dwell before a size tier may step up, counted in the unit's own clock
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: stated
  derivation: "Topstep steps a funded account up one tier after 10 active days and down the same day; no tier is skipped. For QMX the dwell is counted in active days for intraday and swing units and in trades for scalpers, because a scalper's day holds many independent trials. No source measures the effect of the dwell itself."

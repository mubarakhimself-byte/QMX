    - {value: "10 active days", gen: research, ref: "research/R9-accelerators-and-brake-pairs.md", note: "Topstep live rules"}
  inputs: [trade_rate]
  affects:
    - {id: size_levels, direction: either, how: "A level may rise only after the dwell; it falls at once."}
    - {id: size_ramp_to_full, direction: either, how: "The ramp is a sequence of dwells."}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A5-topup.yaml", note: "A5-123 tier ladder with dwell; A5-137 settle before the next change"}
  seed_ids: [C19, A21]
  notes: "Heparin's recheck after four half-lives is the same shape in another field (A5-136)."

- id: pyramid_add_rule
  name: "Add-on rule for trend units: smaller adds on the way, one stop for the whole position"
  level: unit
  kind: accelerator
  measure: "other: adds per favourable move"
  applies_to: {classes: [fx, index, metal, energy, futures, stock, crypto], styles: [swing], timeframes: all}
  default: null
  basis: open
  derivation: "open. Turtle form: one unit every half-N (ATR) move in favour, up to four, each add at falling risk, all behind one stop; the unit's open risk never exceeds its cap. Allowed only for trend units whose returns persist at their horizon (A5-079); never for mean reversion or scalpers (A5-119: pressing is worth about nothing on independent trades)."
  inputs: [volatility_target, stop_distance, stop_premium_check]
  affects:
    - {id: open_risk_at_stop, direction: up, how: "Each add raises the position's risk at the common stop."}
    - {id: max_position_size_lots, direction: either, how: "The cap bounds the total after adds."}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: idea
  sources:
    - {gen: research, ref: "linking/components/A5-topup.yaml", note: "A5-120 Turtle pyramiding; A5-119 pressing after wins"}
    - {gen: research, ref: "linking/components/A1-sizing-allocation.yaml", note: "A1-071 pyramiding with a unified stop and falling risk"}
  notes: "Default off everywhere; on only for a unit tagged trend by its own persistence test."

- id: venue_capacity_cap
  name: Ceiling on size growth per venue and instrument from counterparty pushback
  level: account
  kind: limit
  measure: "other: lots or notional per venue and instrument"
  applies_to: {classes: [all], styles: [scalper, intraday], timeframes: all}
  default: null
  basis: open
  derivation: "open. Found by probe-and-drain: briefly size above the current level, keep the gain only if fills, rejects, requotes and markout do not worsen, then drain back. Any accelerator stops at this cap. The real-money betting case (A5-148) shows the cap arrives suddenly, so it is checked, not assumed."
  inputs: [slippage_cost]
  affects:
    - {id: max_position_size_lots, direction: down, how: "The venue cap is a second ceiling under the record's max lot."}
    - {id: max_lot, direction: down, how: "Where pushback is measured, the effective max lot is lower than the venue's published one."}
  configurable: true
  changed_by: [operator, automatic]
  status: idea
  sources:
    - {gen: research, ref: "linking/components/A5-topup.yaml", note: "A5-148 venue capacity ceiling; A5-135 probe and drain"}
    - {gen: research, ref: "linking/components/A3-structure-regimes-scenarios.yaml", note: "A3-015 dealer skew; A3-238 last look"}
  notes: "Marked wild in X0-12. Retail FX and CFD brokers with last look are the closest analogue."

- id: cost_of_conservatism

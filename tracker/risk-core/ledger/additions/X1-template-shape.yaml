- id: x1_derivation_fallback_order
  name: Rungs a number falls back through when its derivation lacks evidence
  level: unit
  kind: other
  measure: "other: ordered list"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: [own_record, pooled_group, class_default, preset_default, refuse_compile]
  basis: reasoned
  derivation: "Own record first because the unit self-configures (A3); a pooled group posterior next because shrinkage borrows strength when the record is thin (chat-17, Carver); class then preset defaults because every number must have a reasoned value (D30); refuse to compile last because a blank key setting must never reach live (Gen 3 blank_effect). Each rung writes a receipt."
  inputs: [calibration_min_trades, calibration_shrink_k]
  affects:
    - {id: paper_to_live_carry_rule, direction: either, how: which rung a promoted unit starts from}
    - {id: x1_derivation_receipt, direction: either, how: every rung writes one}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H08}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:1888}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:6421}
  seed_ids: [D30, A3]
  aliases: [derivation_fallback_order]

- id: x1_expression_names_allowed

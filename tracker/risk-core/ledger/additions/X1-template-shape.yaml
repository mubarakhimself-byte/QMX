# Ledger additions from expansion layer X1, the template's shape (the chassis). Stage B, 3 Nov 2026.
# Ids are prefixed x1_ so they cannot collide with other layers' files; each carries the Stage A
# component's proposed name as an alias so the funnel can merge. Every entry is a proposal or an idea.
# Categorical defaults (a mode, an order, a list) are set only where the research or his words give a
# reason; every number stays null for the numbers lens. Hybrid ids (X1-Hnn) are in expansion/X1-template-shape.md.

# ---------------------------------------------------------------- A. The self-configuring loop

- id: x1_field_owner
  name: Field owner, spec or status, per field of the unit document
  level: unit
  kind: other
  measure: "other: spec or status"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a categorical label per field. The split follows Kubernetes spec and status with separate write rights (people and agent drafts write spec, only the runtime writes status); which existing NumberSpec fields are spec and which calibration rows are status is for the architecture to list."
  inputs: []
  affects:
    - {id: number_motion_mode, direction: either, how: "a motion rule writes status only, never the spec value"}
    - {id: applies_to_open_positions, direction: either, how: a spec field the applier reads}
  configurable: false
  changed_by: [none]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H01}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:175-184}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:703}
  seed_ids: [D32]
  aliases: [field_owner]

- id: x1_status_generation
  name: Status generation, the spec fingerprint a tuned value or brake state was computed against
  level: unit
  kind: evidence
  measure: "other: fingerprint"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a stamp, not a number. The A10 snapshot already stamps by compiled fingerprint; this names the stamp on every status row and RiskState row so a stale brake state is never acted on."
  inputs: []
  affects:
    - {id: state_carry_rule, direction: either, how: a status from another generation is carried only by the declared rule}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H01 and X1-H49}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:737}
  aliases: [status_generation]

- id: x1_recommendation_bounds
  name: Low and high bound published beside each learned target
  level: unit
  kind: size_input
  measure: "other: pair of values in the number's own measure"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the VPA uses the 50th and 95th percentiles of the decayed history as bounds around a 90th-percentile target; the trading form (percentiles of the unit's own closed trades, shrunk toward the pooled group) is the numbers lens's to set. The bounds are clamped by the owner's range."
  inputs: [calibration_min_trades, calibration_shrink_k, x1_recommendation_decay_half_life]
  affects:
    - {id: risk_fraction, direction: either, how: a wide band keeps the applier off; a narrow band lets the target apply}
    - {id: x1_number_authority_mode, direction: either, how: a band wider than the dead band blocks application}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H02}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:102-133}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:10}
  seed_ids: [A13, A24]
  aliases: [recommendation_bounds]

- id: x1_recommendation_decay_half_life
  name: Age at which one trade's weight in the learner halves
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: counted in trades, not hours, so a scalper and a swing unit decay at comparable evidence depth (the VPA uses 24 hours). A per-style value is the numbers lens's."
  inputs: [trade_rate]
  affects:
    - {id: x1_recommendation_bounds, direction: either, how: a short half-life widens the bounds on a thin record}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H02}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:10}
  aliases: [recommendation_decay_half_life]

- id: x1_number_authority_mode
  name: Authority mode per number, who may apply a learned value and when
  level: unit
  kind: other
  measure: "other: off, at_flat, at_new_position, at_period_open, live"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: "off"
  basis: reasoned
  derivation: "Default off (shadow) because the VPA's Off mode computes and shows without changing, and because his rule is to size down 'not quickly' and to let nothing reach live without evidence; a number earns a stronger mode through shadow rows. The shipped authority field is parsed and never read, so this gives it a runtime meaning."
  inputs: [x1_recommendation_bounds]
  affects:
    - {id: applies_to_open_positions, direction: either, how: at_new_position leaves open positions alone unless this flag is set}
    - {id: number_motion_mode, direction: either, how: a motion rule only recommends; this mode decides whether it applies}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H03}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:117-133}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:59}
    - {gen: unit_build, ref: grounding/G8-unit-chassis-and-extensibility.md:227-232, note: authority parsed and ignored}
  seed_ids: [A25, A3]
  aliases: [number_authority_mode]
  open_questions: ["What does at_flat mean for a unit holding several positions at once (A8)?"]

- id: x1_retune_dead_band
  name: Smallest relative change in a recommendation worth applying
  level: unit
  kind: other
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the VPA applies in place only when the recommendation differs by more than 10 %; the trading value is the numbers lens's. Too wide never applies; too narrow churns."
  inputs: [x1_recommendation_bounds]
  affects:
    - {id: calibration_cadence_trades, direction: either, how: a wide band makes the cadence irrelevant}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H03}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:100}
  aliases: [retune_dead_band]

- id: x1_retune_share_cap
  name: Most units of one cluster that may apply a learned move in one window
  level: book
  kind: limit
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the VPA evicts at most 50 % of replicas at once; the herding guard against forty units cutting together (MAPE-K warning). The share and the window are the numbers lens's."
  inputs: [live_unit_count]
  affects:
    - {id: x1_number_authority_mode, direction: down, how: a unit over the cap waits for the next window}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H03 and P16}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:100}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:311}
  aliases: [retune_share_cap]

- id: x1_tuned_value_guard
  name: Condition that must hold for a tuned number to stay in force
  level: unit
  kind: other
  measure: "other: condition"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a guard per tuned number (for example realised loss per trade within the bound the learn assumed). HotSpot names the reason for every failed guess; the trading conditions are the numbers lens's."
  inputs: [x1_recommendation_bounds]
  affects:
    - {id: x1_guard_trip_count, direction: up, how: a failed guard counts one trip}
    - {id: x1_value_reason_code, direction: either, how: a revert writes frozen_after_trips or reverted_by_guard}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H04}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:152-169}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:223}
  aliases: [tuned_value_guard]

- id: x1_guard_trip_count
  name: Failed guesses counted per tuned number
  level: unit
  kind: measure
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a counter the runtime keeps in status; reset rule undecided (HotSpot never resets per method)."
  inputs: [x1_tuned_value_guard]
  affects:
    - {id: x1_guard_freeze_limit, direction: up, how: reaching the limit freezes the number at its default}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H04}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:223}
  aliases: [guard_trip_count]

- id: x1_guard_freeze_limit
  name: Trips after which a tuned number freezes at its default and is flagged to him
  level: unit
  kind: limit
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: HotSpot stays in the interpreter after 400 recompiles of one method; the trading count is the numbers lens's. A freeze can lock a number at a default that is wrong for a new class (known failure)."
  inputs: [x1_guard_trip_count]
  affects:
    - {id: number_motion_mode, direction: down, how: a frozen number stops moving until he unfreezes it}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H04}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:152-169}
  aliases: [guard_freeze_limit]

- id: x1_safe_region_bound
  name: Projected open risk and drawdown past which the fixed sizer takes over from the tuned one
  level: unit
  kind: limit
  measure: R
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the Simplex rule switches to the verified controller when the one-step predicted state would leave the safe region; the region in R per unit, including the gap scenario for indices and futures, is the numbers lens's."
  inputs: [open_risk_at_stop, equity_drawdown_halt, kill_line_distance]
  affects:
    - {id: risk_fraction, direction: down, how: outside the region the baseline fraction replaces the tuned one}
    - {id: x1_fallback_dwell, direction: either, how: leaving the region starts the dwell}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H04}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:471-480}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:269}
  aliases: [safe_region_bound]

- id: x1_fallback_dwell
  name: Trades the fixed sizer keeps control before the tuned one may return
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: Simplex switches back only after a dwell time to avoid oscillation; in trades for scalpers, sessions for intraday. Value open."
  inputs: [x1_safe_region_bound]
  affects:
    - {id: grow_back_rule, direction: either, how: the dwell delays any regrowth}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H04}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:269}
  aliases: [fallback_dwell]

- id: x1_motion_window_down
  name: Span over which a cut is decided, per moving number
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the HPA takes the highest recommendation of the last 300 s before scaling down; QMX points the other way (cut fast, grow slowly), so the down window is short and graded by signal severity. In trades, sessions or weeks by style. Value open."
  inputs: [trade_rate]
  affects:
    - {id: drift_size_down_step, direction: either, how: the window sets how many readings a step-down needs}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H05}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:86-100}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:141}
  seed_ids: [A25]
  aliases: [motion_window_down]

- id: x1_motion_window_up
  name: Span over which evidence must hold, at the current size, before a number may grow
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: growth only on evidence gathered at the current size (Netflix AIMD grows only when the limit is in use; TCP grows on acknowledged bytes). Longer than the down window. Value open."
  inputs: [trade_rate]
  affects:
    - {id: grow_back_rule, direction: either, how: the window gates every step up}
    - {id: size_ramp_to_full, direction: either, how: a warm-up ramp uses the same window}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H05}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:63-73}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:141}
  aliases: [motion_window_up]

- id: x1_motion_rate_cap
  name: Most a number may move per update, per direction
  level: unit
  kind: limit
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: chat-17 suggested at most 5 % of a parameter's normalised value per weekly update; the HPA caps per direction per period. The caps per direction are the numbers lens's."
  inputs: []
  affects:
    - {id: risk_fraction, direction: either, how: bounds each step of the fraction}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H05}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:6457}
  aliases: [motion_rate_cap, parameter_move_cap_per_update]

- id: x1_motion_tolerance
  name: Band around the target inside which nothing moves
  level: unit
  kind: other
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the HPA default tolerance is 0.1 of the ratio; the trading value is the numbers lens's."
  inputs: []
  affects:
    - {id: x1_retune_dead_band, direction: either, how: two bands on one number; the architecture decides whether they merge}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H05}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:141}
  aliases: [motion_tolerance]

- id: x1_cautious_direction
  name: For each number, which way a missing input must push it
  level: unit
  kind: other
  measure: "other: up or down"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a label per number (the HPA assumes 100 % use on a scale-down and 0 % on a scale-up when metrics are missing). For risk numbers the cautious way is almost always smaller size or no move; a mislabelled direction becomes a ratchet the wrong way."
  inputs: []
  affects:
    - {id: x1_fail_mode, direction: either, how: the per-number form of the fail mode}
    - {id: decision_freshness_bound, direction: either, how: a stale input counts as missing}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H05}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:187}
  aliases: [cautious_direction]

- id: x1_never_self_tune_list
  name: Numbers no learner, applier, agent or expression may move, owned by him, per template
  level: portfolio
  kind: other
  measure: "other: list of ledger ids"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: [portfolio_floor, bms_buffer_before_floor, kill_line_floor, kill_switch_level]
  basis: reasoned
  derivation: "The floor and the cushion are user-configured by his ruling (C11); the kill switch goes down only by his hand (C21). OtterTune keeps a per-version black-list of knobs the tuner may never touch and MT5 sinput excludes an input from optimisation. He may add rows; the list is his to edit."
  inputs: []
  affects:
    - {id: portfolio_floor, direction: either, how: "cannot be learnt, applied or proposed; only he edits it"}
    - {id: kill_switch_level, direction: either, how: no proposal may lower it}
    - {id: x1_number_authority_mode, direction: down, how: a listed number has no mode; it is always off}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H06}
    - {gen: research, ref: research/R7-software-patterns-self-configuring.md:135-150}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:672}
    - {gen: operator_words, ref: seeds/SEEDS.md, note: C11 and C21}
  seed_ids: [C11, C21]
  aliases: [never_self_tune_list]

- id: x1_changed_by_class
  name: Measured, self or user, per ledger row
  level: system
  kind: other
  measure: "other: measured, self or user"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a label on every row (MQL5 24237 keeps venue facts, the strategy's responses and the firm's limits apart). The ledger's changed_by field already lists who may change a row; this names which part of the template the row belongs to. The checker refuses a profile that self-derives a user row or types a measured one."
  inputs: []
  affects:
    - {id: x1_never_self_tune_list, direction: either, how: every user row belongs on the list}
  configurable: false
  changed_by: [none]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X1-template-shape.md, note: X1-H06 and X1-H18}
    - {gen: research, ref: linking/components/A4-template-agents-telemetry.yaml:1787}
  seed_ids: [D32]
  aliases: [changed_by_class]


# Ledger additions from Stage B, layer X2 (sizing, allocation, accelerators and costs).
# Written 2026-11-03. Every row is a proposal or idea from expansion/X2-sizing-accelerators.md; the X2-Hnn note names the hybrid.
# Defaults stay null: nothing here is in the current design. Derivations say how each would be computed.
# Reused, not redefined: hourly_cost_profile and edge_to_cost_ratio_min (X0-trading-lens.yaml); x1_aggregate_limit_factor, x1_bet_key_rule, x1_number_authority_mode (X1-template-shape.yaml).
# Check with: uv run --no-project --with pyyaml python ledger/check.py ledger/additions/X2-sizing-accelerators.yaml ledger/additions/X0-trading-lens.yaml ledger/additions/X1-template-shape.yaml --no-write

- id: survival_horizon_rounds
  name: Rounds of trades the floor-odds survival target must hold for (H)
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: reasoned
  derivation: "Trades until the next planned look or re-anchor of the cushion. Proposal: trading days in the review cycle (a month, A4-029) times the unit's trade rate. Longer H means smaller size."
  inputs: [trade_rate]
  affects:
    - {id: horizon_survival_risk_usd, direction: down, how: "Risk falls with the square root of H."}
    - {id: book_day_sigma_budget_usd, direction: down, how: "More days in the horizon shrink the daily swing allowed."}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H01, X2-H02"}
  seed_ids: [A13, D46]

- id: horizon_survival_risk_usd
  name: Per-trade risk from the horizon floor-odds sizer
  level: unit
  kind: size_output
  measure: USD
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "At zero drift r = D_usable / (s x z x sqrt(H) x sqrt(N x (1 + (N - 1) x rho))), z = Phi^-1(1 - eps/2), D_usable = committed cushion minus the contingency reserve. With drift at the planning edge point, the largest r whose first-passage chance of touching the floor within H rounds is at most eps (bisection). Computed at each anchor and cached; a stale cache falls back to the zero-drift form."
  inputs: [committed_cushion_usd, largest_bet_contingency_usd, result_spread_r, floor_touch_tolerance, survival_horizon_rounds, live_unit_count, stressed_unit_correlation, planning_edge_point, edge_range]
  affects:
    - {id: risk_amount_usd, direction: up, how: "The baseline amount before level, modifiers and clamps."}
    - {id: floor_touch_size_bound, direction: either, how: "A derivation candidate for the floor-touch bound, finite horizon and correlated units included."}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H01"}
    - {gen: expansion, ref: "linking/stage-b/X2-sizing-accelerators/sims/out-1000.txt", note: "0 floor touches in 12 cases; 2.8x the 1/N split's median"}
    - {gen: research, ref: "research/R9-accelerators-and-brake-pairs.md", note: "cushion rule, Hsieh lemma"}
  seed_ids: [A2, A24, C13, C29, D46]
  notes: "Each of N units gets 1/sqrt(N(1 + (N - 1) rho)) of the one-unit size. The GitBook ladder's 1/7 of cushion per R equals surviving about 7 to 10 trades at zero edge with 99 % confidence."

- id: planning_edge_point
  name: Which point of the edge range the sizer uses as drift (zero, low or mid)
  level: unit
  kind: other
  measure: "other: choice of zero, low or mid"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: reasoned
  derivation: "Zero for new units (size safe with no edge); low once the low end of the deflated, shrunk band is positive with evidence; mid only on his click. Never moved automatically upward."
  inputs: [edge_range, sequential_evidence_pass]
  affects:
    - {id: horizon_survival_risk_usd, direction: up, how: "A higher point adds drift, which relaxes the survival size."}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H03"}
  seed_ids: [A24, A14]
  notes: "Moving it is a profile version or a calibration row with a card."

- id: stressed_unit_correlation
  name: Correlation used for sizing, the higher of measured and stressed
  level: portfolio
  kind: size_input
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "max(measured correlation of units' residual P&L after shared drivers, stressed floor from the scenario layer). Fast override when a co-movement tell fires."
  inputs: [unit_result_correlation, cross_market_stress_reading]
  affects:
    - {id: horizon_survival_risk_usd, direction: down, how: "Higher correlation shrinks each unit's share."}
    - {id: effective_independent_bets, direction: down, how: "N_eff = N / (1 + (N - 1) rho)."}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H28"}
  seed_ids: [C29, C27]

- id: book_day_sigma_budget_usd
  name: Daily P&L swing the book may carry, from its cushion and horizon
  level: portfolio
  kind: limit
  measure: USD
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "sigma_book = D_usable / (z x sqrt(days in the horizon))."
  inputs: [committed_cushion_usd, floor_touch_tolerance, survival_horizon_rounds]
  affects:
    - {id: unit_day_sigma_budget_usd, direction: up, how: "Split across units by the correlation formula or QoS shares."}
    - {id: portfolio_daily_risk_budget, direction: either, how: "A derivation candidate for the portfolio's day budget."}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H02"}
  seed_ids: [C29, C1]

- id: unit_day_sigma_budget_usd
  name: Daily P&L swing a unit may carry
  level: unit
  kind: size_input
  measure: USD
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "Its share of the book's sigma. Per-trade risk r = sigma_unit / (s x sqrt(n)), n the unit's trades per day, so per-trade risk falls with sqrt(n) and expected daily gain rises with sqrt(n)."
  inputs: [book_day_sigma_budget_usd, stressed_unit_correlation, live_unit_count, unit_risk_request_share, trade_rate, result_spread_r]
  affects:
    - {id: risk_amount_usd, direction: up, how: "Converted to per-trade risk by the square root of the trade rate."}
    - {id: unit_daily_loss_limit, direction: up, how: "The unit's own percentile day brake reads the same sigma."}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H02"}
  seed_ids: [C1, C29, C31]

- id: stop_fill_gap_factor
  name: Average stop fill as a multiple of 1R after gaps and slippage (g)
  level: trade
  kind: size_input
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "Mean realised loss on stopped trades divided by planned 1R, from fills, by instrument and hour; the class default until enough fills."
  inputs: [gap_loss_beyond_stop, slippage_cost]
  affects:
    - {id: cost_gap_kelly_ceiling, direction: down, how: "A larger g lowers the Kelly ceiling."}
    - {id: risk_amount_usd, direction: down, how: "Loss per stop above 1R shrinks the quantity."}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H04"}
  seed_ids: [A11]

- id: cost_gap_kelly_ceiling
  name: Kelly fraction at the stop after costs and gap factor, shrunk by evidence
  level: unit
  kind: limit
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "f* = [p(b - c) - (1 - p)(g + c)] / [(b - c)(g + c)] with c the round-trip cost in R for this hour, times t^2 / (1 + t^2) on the deflated edge; for three-outcome units the general Kelly on the measured distribution. A ceiling only."
  inputs: [win_rate, average_win_r, round_trip_cost_r, stop_fill_gap_factor, edge_t_statistic, kelly_shrink_factor, fast_invalidation_cut_r]
  affects:
    - {id: risk_amount_usd, direction: down, how: "Caps the baseline; never raises it."}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X2-sizing-accelerators.md", note: "X2-H04"}
  seed_ids: [A11, A12]


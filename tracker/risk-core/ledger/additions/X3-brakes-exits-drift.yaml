- id: brake_random_control_margin
  name: A brake's margin over a random brake with the same fire rate and action
  level: unit
  kind: evidence
  measure: R
  applies_to: *id001
  default: null
  basis: formula
  derivation: 'R per 100 trades of (brake arm minus matched random arm) on replay of the unit''s own trades, with a block-permutation p-value; repeated on shadow
    live data. Certified per brake type within a family, then per unit (X3-H13). X3 SIM: 3 in a row +20.5R over 250 days in bad spells; money at own p1 +1.2R at 10
    a day and +25.9R at 40 a day.'
  inputs:
  - brake_precision
  - breaker_expected_fire_rate
  affects:
  - id: brake_state
    direction: either
    how: a brake that cannot beat its random twin stays in shadow (X1 x1_brake_shadow_mode) unless its row says its job is the tail
  - id: brake_precision
    direction: either
    how: reported beside precision on the brake row
  configurable: true

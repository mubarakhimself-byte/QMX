# X3 brakes, restores, exits and drift: ledger additions (Stage B). Generated from the X3 expansion; see expansion/X3-brakes-exits-drift.md.
- id: money_brake_window_trades
  name: Fewest trades in the money brake window
  level: unit
  kind: schedule
  measure: count
  applies_to: &id001
    classes:
    - all
    styles:
    - all
    timeframes: all
  default: 10
  basis: reasoned
  derivation: 'At least 10 trades, so the window P&L takes enough values to reach a 1 percent tail. Window in days = ceil(10 / trades per day): 1 day at 10+ a day,
    3 days at 4 a day, 5 days at 2 a day (X3 SIM). He can change the count or switch to a window in hours.'
  inputs:
  - trade_rate
  affects:
  - id: money_brake_threshold_r
    direction: either
    how: sets the window the threshold is read over
  - id: circuit_breaker_window
    direction: either
    how: replaces a fixed day window for the money breaker
  configurable: true
  changed_by:
  - operator
  - agent_proposal
  - automatic
  status: proposal
  sources:
  - gen: expansion
    ref: expansion/X3-brakes-exits-drift.md
    note: X3-H01
  - gen: expansion
    ref: linking/stage-b/X3-brakes-exits-drift/out-200.txt
    note: orb2 at 2 a day needed a 5-day window to reach a 1 percent tail
  seed_ids:
  - A28
  - C33
  notes: Refines X0 money_brake_percentile (a daily percentile) for slow units.
- id: money_brake_threshold_r
  name: Trip level of the money breaker, in R over its window
  level: unit
  kind: brake_threshold
  measure: R
  applies_to: *id001
  default: null
  basis: formula
  derivation: Lower tail of the unit's running-minimum P&L over its window, at money_brake_percentile, from a block bootstrap of the frozen card or holdout run through
    the same brake; then clamped so it is never looser than money_brake_dollar_clamp converted to R. Recomputed by the learner (X3-H61) inside bounds.
  seen_values:
  - value: -7.0R
    gen: expansion
    ref: linking/stage-b/X3-brakes-exits-drift/out-200.txt
    note: fs10, own p1 (sim)
  - value: -10.4R
    gen: expansion
    ref: linking/stage-b/X3-brakes-exits-drift/out-200.txt
    note: fi40, own p1 (sim)
  inputs:
  - money_brake_window_trades
  - money_brake_dollar_clamp
  - result_spread_r
  - trade_rate
  - win_rate
  affects:
  - id: unit_daily_loss_limit
    direction: either
    how: the unit day limit becomes this window threshold when the window is one day
  - id: breaker_fire_density
    direction: down
    how: a looser threshold fires less often
  - id: brake_state
    direction: either
    how: crossing it benches the unit for the window
  configurable: true
  changed_by:
  - operator
  - agent_proposal
  - automatic
  status: proposal
  sources:
  - gen: expansion
    ref: expansion/X3-brakes-exits-drift.md
    note: X3-H01
  - gen: expansion
    ref: linking/stage-b/X3-brakes-exits-drift/out-200.txt
    note: fires on 1.0-1.2 percent of healthy days at 2-40 trades a day; keeps 99.4-99.8 percent of healthy R
  - gen: research
    ref: linking/components/A5-topup.yaml
    note: A5-144
  seed_ids:
  - A26
  - A28
  - C19
  - C31
  notes: The percentile itself is X0 money_brake_percentile (default 1); this entry is the window threshold it produces.
- id: money_brake_dollar_clamp
  name: Dollar ceiling on how loose a unit money breaker may be
  level: unit
  kind: limit
  measure: USD
  applies_to: *id001
  default: null
  basis: open
  derivation: 'open: a money figure from his budget split (numbers lens). Purpose: a card that flatters the unit cannot set a loose brake; the money breaker trips
    at whichever of its own-percentile level and this ceiling comes first.'
  inputs:
  - unit_capital_share
  - portfolio_daily_risk_budget
  affects:

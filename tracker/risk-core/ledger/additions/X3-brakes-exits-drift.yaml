- id: demotion_two_key_rule
  name: How the two slow-lane keys combine into size steps and demotion
  level: unit
  kind: other
  measure: 'other: rule'
  applies_to: *id001
  default: either key at warning halves at once, reversibly; paper needs both keys, or one key at alarm past the next planned look
  basis: reasoned
  derivation: 'X3 SIM at 40 trades a day: reversible graded steps kept 902R of 950R after a bad week where permanent demotion at the CUSUM alarm kept 614R; both saved
    the same after a real decay. Roundtable: halve at once (pod practice), paper on two keys (trial practice).'

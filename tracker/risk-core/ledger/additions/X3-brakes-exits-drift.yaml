- id: density_alarm_ratio
  name: Fire-rate multiple the breaker sentinel is tuned to detect
  level: unit
  kind: brake_threshold
  measure: ratio
  applies_to: *id001
  default: 3
  basis: formula
  derivation: The Bernoulli CUSUM on daily breaker fires tests p0 against k x p0, with k = min(3, 0.5 / p0), p0 the card's expected healthy fire rate (X3-H08).
  inputs:
  - breaker_expected_fire_rate
  affects:
  - id: density_cusum_threshold
    direction: either
    how: sets the alternative the sentinel tests for
  configurable: true
  changed_by:
  - operator
  - agent_proposal
  - automatic
  status: proposal
  sources:
  - gen: expansion
    ref: expansion/X3-brakes-exits-drift.md
    note: X3-H08
  - gen: expansion
    ref: linking/stage-b/X3-brakes-exits-drift/out-200.txt
    note: slow dens
  seed_ids:
  - A26
- id: density_cusum_threshold
  name: Alarm level of the breaker fire-density sentinel
  level: unit
  kind: brake_threshold
  measure: 'other: log-likelihood units'
  applies_to: *id001
  default: null
  basis: formula
  derivation: 'The 95th percentile (or 1 minus slow_lane_false_alarm_rate) of the sentinel''s maximum over the horizon on healthy bootstrapped paths of the unit''s
    card. X3 SIM: catches a dead edge in 25-58 percent of runs at 2-10 trades a day (99.5 percent at 40), median 36-93 days; alarms after 0-2.5 percent of bad weeks
    at 10 a day.'
  inputs:
  - density_alarm_ratio
  - breaker_expected_fire_rate
  - slow_lane_false_alarm_rate
  affects:
  - id: drift_state
    direction: either
    how: crossing it moves the unit to yellow or red
  - id: drift_size_down_step
    direction: either
    how: a crossing triggers one size step down
  configurable: true

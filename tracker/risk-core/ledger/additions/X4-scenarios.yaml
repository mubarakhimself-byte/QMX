# X4 scenarios: ledger additions. Schema per ledger/README.md. Written 2026-11-03 by the Stage B X4 agent.
# Every id here is new; ids the draft used that already existed in v0 were mapped onto v0 (see expansion/X4-scenarios.md Part 1c).
# Defaults are null unless a shipped number or his ruling states one. Likelihoods and severities in the catalogue are judgments, not ledger values.

# ---------- Shared drivers, same bet, breadth (scenarios 01-03, 64, 91-93) ----------

- id: shared_driver_tags
  name: "Driver tags per instrument (both FX legs, home exchange, region, class, named events)"
  level: system
  kind: other
  measure: "other: list of tags"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: seeded by class defaults (FX pair = both currencies; CFD = home exchange and region; crude and gas = EIA report; CAD = energy), refined by the measured event impact per release and instrument."
  inputs: [instrument_class, measured_event_impact]
  affects:
    - {id: news_impact_level_map, direction: either, how: "a release resolves to every instrument carrying its tag, not to the quote currency"}
    - {id: loss_event_window, direction: either, how: "the window is opened per driver tag"}
    - {id: same_bet_exposure_cap, direction: either, how: "the bet key is built from the tags"}
  configurable: true
  changed_by: [operator, agent_proposal, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 01, 17, 21, 79; idea 95"}
    - {gen: grounding, ref: grounding/G9-runtime-brakes-isolation-evidence.md:105, note: "no base-currency field today"}
  seed_ids: [C27, C28]

- id: same_bet_exposure_cap
  name: "Cap on open risk per bet key across units"
  level: portfolio
  kind: limit
  measure: R
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a bet key is logic family plus driver tags plus direction; the cap per key is the risk one well-sized unit would take on that bet; set from the per-driver cap and the number of keys sharing a driver."
  inputs: [bet_key_rule, per_driver_exposure_cap, open_risk_at_stop]
  affects:
    - {id: lot_size, direction: down, how: "the order that would pass the cap is trimmed or refused"}
    - {id: effective_independent_bets, direction: up, how: "capping same bets raises the realised N_eff toward the unit count"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 01, 03, 23, 64; idea 92"}
    - {gen: grounding, ref: grounding/G9-runtime-brakes-isolation-evidence.md:220, note: "the cross-unit hook passes every order today"}
  seed_ids: [C18, C29, D10]

- id: bet_key_rule
  name: "How a bet key is built from an intent"
  level: portfolio
  kind: other
  measure: "other: rule"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: default key = methodology tag + driver tags + direction; a template may declare a narrower or wider key."
  inputs: [methodology_tag, shared_driver_tags]
  affects:
    - {id: same_bet_exposure_cap, direction: either, how: "defines what counts as the same bet"}
  configurable: true
  changed_by: [operator]
  status: idea
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 64; idea 92"}

- id: per_driver_exposure_cap
  name: "Cap on open risk per shared driver, sized to a tail gap"
  level: portfolio
  kind: limit
  measure: R
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "cap = bms_buffer_before_floor / tail_gap_assumption_pct for that driver, so a tail gap on one driver costs at most the buffer; he may change the tail assumption or the formula."
  inputs: [bms_buffer_before_floor, tail_gap_assumption_pct, shared_driver_tags]
  affects:
    - {id: same_bet_exposure_cap, direction: down, how: "the sum of same-bet caps on one driver may not exceed the driver cap"}
    - {id: currency_exposure_limit, direction: either, how: "the currency limit is the FX form of the driver cap"}
    - {id: cluster_exposure_cap, direction: either, how: "the cluster cap is the class form of the driver cap"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 35, 87; idea 92"}
    - {gen: research, ref: research/R2-trader-practice-windows-drift-isolation-breadth.md:209, note: "the correlation that bites is shared exposure"}
  seed_ids: [C10, C27]

- id: tail_gap_assumption_pct
  name: "Assumed tail gap per driver for sizing the driver cap"
  level: portfolio
  kind: size_input
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: expert-set per driver and labelled as an assumption (a pegged currency near 20 %, an index near 7 %, a crypto cascade near 30 %), revised from the harness's replayed shock list."
  inputs: []
  affects:
    - {id: per_driver_exposure_cap, direction: down, how: "a bigger assumed gap gives a smaller cap"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 35; idea 92"}
    - {gen: research, ref: research/R8-gap-topup.md:372, note: "scenario parameters may be expert-set when data are scarce, labelled"}

- id: methodology_tag
  name: "Logic-family tag on a unit (the methodology level's key)"
  level: methodology
  kind: other
  measure: "other: tag"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: declared on the unit template (mean reversion, ORB, trend); the methodology level pools every unit sharing a tag."
  inputs: []
  affects:
    - {id: methodology_pooled_cusum, direction: either, how: "defines the pooled stream"}
    - {id: bet_key_rule, direction: either, how: "part of the bet key"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 03, 04, 64"}
  seed_ids: [B1]

- id: methodology_pooled_cusum
  name: "CUSUM on the pooled R stream of a logic family"
  level: methodology
  kind: brake_threshold
  measure: R
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the per-unit CUSUM limit scaled for the pooled count, discounted for correlation across the family's units; flags in days what one unit needs about 240 trades to see."
  inputs: [methodology_tag, cusum_limit, unit_result_correlation]
  affects:
    - {id: size_level_now, direction: down, how: "a pooled alarm steps the family's share down one level"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 04, 60, 65"}
    - {gen: research, ref: research/R2-trader-practice-windows-drift-isolation-breadth.md:90, note: "about 240 trades for one unit"}
  seed_ids: [A25]

- id: co_loss_breadth
  name: "Share of units losing together in a window, and the loss given that share"
  level: portfolio
  kind: measure
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: measured from the journal per event window; reported beside N_eff."
  inputs: [loss_event_window]
  affects:
    - {id: effective_independent_bets, direction: either, how: "a high co-loss breadth means a low realised N_eff"}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 64"}

- id: correlation_stress_rho
  name: "Stressed correlation used for sizing the correlated group"
  level: portfolio
  kind: size_input
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the higher of measured and stressed rho; the stressed value from the scenario set's risk-off case (correlations raised)."
  inputs: [unit_result_correlation, scenario_set_version]
  affects:
    - {id: same_bet_exposure_cap, direction: down, how: "sizing on stressed rho shrinks new entries in the group during a spike"}
    - {id: effective_independent_bets, direction: down, how: "stressed rho gives the lower N_eff"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 02, 87"}
    - {gen: research, ref: research/R2-trader-practice-windows-drift-isolation-breadth.md:163, note: "correlation rises in bear moves"}

- id: entry_size_trim_on_comove
  name: "Trim on new entries in a correlated group while a co-move tell is on"
  level: portfolio
  kind: brake_threshold
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: derived from the stressed-rho N_eff against the normal N_eff for the group."
  inputs: [co_move_score, correlation_stress_rho]
  affects:
    - {id: lot_size, direction: down, how: "new entries in the group are sized at the trim while the tell is on"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 02"}

- id: open_breadth_budget_scale
  name: "Scale of the day budget with the breadth that is open now"
  level: portfolio
  kind: size_input
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "scale = N_eff(open now) / N_eff(weekday full breadth), capped at 1; a weekend with two crypto units open spends two units' share, not ten."
  inputs: [effective_independent_bets, live_unit_count]
  affects:
    - {id: bms_daily_loss_limit, direction: down, how: "the spendable budget falls with open breadth"}
    - {id: class_budget_share_cap, direction: either, how: "the open class may not spend more than its weekday share"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 24, 93"}
  seed_ids: [C1, D10]

- id: class_budget_share_cap
  name: "Cap on the share of the day budget one class may spend"
  level: portfolio
  kind: limit
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the class's weekday share of N_eff, so a class alone at the weekend cannot spend the whole budget."
  inputs: [open_breadth_budget_scale]
  affects:
    - {id: bms_daily_loss_limit, direction: down, how: "binds the per-class spend inside the budget"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 24"}

# ---------- House money and accelerators (scenarios 05, 63, 86) ----------

- id: house_money_lockout
  name: "Conditions under which house money and every accelerator are off"
  level: unit
  kind: other
  measure: "other: rule"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: off inside any event window, news window, caution or isolation, in a yellow or red edge zone, during a version's settling period, and whenever any brake is active (any brake blocks every raise)."
  inputs: [loss_event_window, isolation_mode, edge_zone, accelerator_lockout_trades_after_version]
  affects:
    - {id: house_money_winnings_share, direction: down, how: "the share is zero while locked out"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 05, 15, 63, 86"}
    - {gen: research, ref: research/R9-accelerators-and-brake-pairs.md:345, note: "any brake blocks every raise"}
  seed_ids: [A21, C19]

- id: tier_dwell_trades
  name: "Trades or active days a unit must spend in a size tier before the next step up"
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: Topstep uses 10 active days per tier; for a unit the dwell is the trades needed to measure the tier (the settling rule), set from its trade rate."
  inputs: [trade_rate, settling_trades_after_change]
  affects:
    - {id: size_level_now, direction: up, how: "a step up waits for the dwell; a step down is same-day"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 63"}
    - {gen: research, ref: research/R9-accelerators-and-brake-pairs.md:35, note: "Topstep tiers: up after 10 active days, down the same day"}

- id: persistence_block_test_pass
  name: "Whether the unit's own block-persistence test passed, gating any pressing rule"
  level: unit
  kind: evidence
  measure: "other: yes or no"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: positive and significant block-sum autocorrelation at the unit's horizon with tries counted (about 950 trades for a 500-trade regime in R9's script)."
  inputs: []
  affects:
    - {id: house_money_winnings_share, direction: up, how: "a pressing rule is allowed only after the pass"}
  configurable: false
  changed_by: [automatic]
  status: idea
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 63"}
    - {gen: research, ref: research/R9-accelerators-and-brake-pairs.md:34, note: "measure persistence in blocks"}

- id: trip_memory_ceiling
  name: "Remembered size level at the last trip; regrowth slows near it"
  level: unit
  kind: brake_reset
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the TCP ssthresh and CUBIC plateau pattern; regrow fast to a fraction of the trip level, then slowly near it."
  inputs: [size_level_now]
  affects:
    - {id: size_level_now, direction: down, how: "caps the speed of steps up after a trip"}
  configurable: true
  changed_by: [operator]
  status: idea
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 63"}
    - {gen: research, ref: research/R9-accelerators-and-brake-pairs.md:211, note: "remember the trip level"}

- id: settling_trades_after_change
  name: "Trades at the current size before the next size change may happen"
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: the heparin four-half-lives idea: enough trades at the new size to measure it; set from the unit's trade rate and daily spread."
  inputs: [trade_rate]
  affects:
    - {id: size_level_now, direction: either, how: "no step in either direction inside the settling count, except a hard breach"}
    - {id: tier_dwell_trades, direction: up, how: "the dwell is at least the settling count"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 55, 63, 86"}
    - {gen: research, ref: research/R9-accelerators-and-brake-pairs.md:217, note: "settling time"}

- id: best_day_share_max
  name: "Consistency rule: the best day may be at most this share of total profit"
  level: unit
  kind: limit
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: FTMO uses 50 % (30 % on Instant); a breach holds accelerators and the verdict, it never stops the unit."
  inputs: []
  affects:
    - {id: house_money_lockout, direction: either, how: "a breach locks accelerators until the share falls back"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 63, 66"}
    - {gen: research, ref: research/R2-trader-practice-windows-drift-isolation-breadth.md:268, note: "best day at most 50 % of profit"}

- id: accelerator_lockout_trades_after_version
  name: "Trades after any version or world change during which every accelerator is locked"
  level: unit
  kind: schedule
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: at least the settling count; the slow-start period of a new version."
  inputs: [settling_trades_after_change]
  affects:
    - {id: house_money_lockout, direction: either, how: "locked for the count"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 55, 86"}


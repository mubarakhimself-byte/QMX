- id: burn_rate_ticket_threshold
  name: "Burn rate over the slow window that opens a ticket and steps size down"
  level: portfolio
  kind: brake_threshold
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a burn rate of 1 over 3 days in SRE terms; for a cushion, the rate at which the plan's monthly loss allowance would be gone inside the month."
  inputs: [cushion_burn_rate, burn_rate_slow_window]
  affects:
    - {id: size_level_now, direction: down, how: "a slow burn steps size down one level"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 07"}

- id: burn_rate_page_threshold
  name: "Burn rate over the fast window that pages and stops entries"
  level: portfolio
  kind: brake_threshold
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: SRE pages at 2 % of the monthly budget in 1 hour (rate 14.4); for the BMS, the rate that would spend the day budget inside a session."
  inputs: [cushion_burn_rate]
  affects:
    - {id: bms_circuit_breaker, direction: either, how: "a fast burn is one trigger of the BMS breaker"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 07, 14"}
    - {gen: research, ref: research/R3-edge-verification-and-analogues.md:249}

- id: cushion_burn_rate
  name: "Rate at which the cushion above the floor is being spent, over two windows"
  level: portfolio
  kind: measure
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "burn = (cushion lost in window) / (planned loss allowance for the window), computed on a fast and a slow window."
  inputs: [account_equity, portfolio_floor, burn_rate_slow_window]
  affects:
    - {id: burn_rate_ticket_threshold, direction: either, how: "compared against it"}
    - {id: burn_rate_page_threshold, direction: either, how: "compared against it"}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 07"}

# ---------- Isolation (scenarios 08-14, 37, 85, 94) ----------

- id: co_move_score
  name: "Share of a scope's instruments beyond their usual spread or volatility for this minute of the session"
  level: portfolio
  kind: evidence
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "score = instruments in the scope with spread or volatility above their percentile band / instruments in the scope with fresh quotes; stale markets are excluded, never counted as calm."
  inputs: [sqs_score, feed_stale_after]
  affects:
    - {id: cross_market_stress_reading, direction: up, how: "one of the readings the stress reading is built from"}
    - {id: market_isolation_trigger, direction: up, how: "a high score is one tell"}
    - {id: entry_size_trim_on_comove, direction: either, how: "a high score switches the trim on"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenarios 02, 08, 32, 80; idea 94"}
    - {gen: research, ref: research/R2-trader-practice-windows-drift-isolation-breadth.md:172, note: "the useful extra tell is co-movement"}
  seed_ids: [C27]

- id: isolation_two_tell_rule
  name: "Two tells must agree before an isolation fires"
  level: portfolio
  kind: other
  measure: "other: rule"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: spread and volatility, or one tell plus a calendar event tagged to the scope, with a minimum co-move count; scored on history for precision and recall."
  inputs: [co_move_score, baseline_calendar_aware]
  affects:
    - {id: market_isolation_trigger, direction: either, how: "defines the trigger's evidence"}
    - {id: brake_precision, direction: up, how: "two tells raise precision"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: expansion/X4-scenarios.md, note: "scenario 09; idea 94"}
    - {gen: research, ref: research/R3-edge-verification-and-analogues.md:261, note: "alarm fatigue"}

- id: baseline_calendar_aware
  name: "Whether tell baselines know holidays, half days and DST"
  level: node
  kind: other
  measure: "other: yes or no"
  applies_to: {classes: [all], styles: [all], timeframes: all}

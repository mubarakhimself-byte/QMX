- id: burn_rate_slow_window
  name: "Slow window for the cushion burn rate (the ticket class)"
  level: portfolio
  kind: schedule
  measure: "other: hours"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: SRE opens a ticket at 10 % of the monthly budget in 3 days; the slow window is days, the page window hours."
  inputs: []
  affects:
    - {id: cushion_burn_rate, direction: either, how: "defines the slow burn measure"}
  configurable: true

  level: unit
  kind: evidence
  measure: "ratio"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: a similarity score of the claim's logic and context against prior claims in the family ledger; no source gives the measure"
  inputs: []
  affects:
    - {id: effective_tries, direction: either, how: "a near-copy is merged into an existing try instead of adding one"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
  notes: "H01."


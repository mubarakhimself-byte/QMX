- id: ev_worst_regime_sharpe
  name: "Lowest per-trade Sharpe in any regime block of the record"
  level: unit
  kind: evidence
  measure: "ratio"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "cut the record into blocks of at least ev_regime_min_length trades (fixed count), take the lowest block mean over its sd"
  inputs: [ev_regime_min_length]
  affects:
    - {id: ev_statistical_authorisation, direction: down, how: "a deeply negative worst block rejects"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
    - {gen: research, ref: "research/R6-alphaxiv-papers/T-08-live-alpha-decay-detection.md"}
  notes: "H03, H05. By chance 22% of healthy +0.10R units show a negative worst block over 600 trades, so the bar is 'deeply negative', calibrated per unit (H42)."

- id: ev_regime_min_length
  name: "Minimum trades per regime block"
  level: unit
  kind: evidence
  measure: "count"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: 200
  basis: reasoned
  derivation: "three blocks of 200 over a 600-trade record; the block mean's standard error is then 0.07R at sd 1R"
  inputs: []
  affects:
    - {id: ev_worst_regime_sharpe, direction: either, how: "shorter blocks make the worst block noisier"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
  notes: "H05."

- id: ev_edge_band_rule
  name: "Which shrinkage sets the band's low end"
  level: unit
  kind: other
  measure: "other: rule name"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: "lowest-computable"
  basis: reasoned
  derivation: "take the lowest of the computable low ends: deflated holdout minus one SE; James-Stein over the pool; empirical-Bayes family shrink; replication-ratio haircut; 'half the in-sample number' only when none is computable"
  inputs: [edge_range, effective_tries, judge_market_shrink_k, ev_replication_ratio, ev_family_prior_spread]
  affects:
    - {id: edge_range, direction: either, how: "picks the low end the plan and the gate read"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
    - {gen: research, ref: "research/R3-edge-verification-and-analogues.md"}
  seed_ids: [A24, D14]
  notes: "H04, X5-38."

- id: ev_replication_ratio

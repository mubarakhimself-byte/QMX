  level: unit
  kind: evidence
  measure: "ratio"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: from the number of signals and assets and the history length (2501.03938 gives closed forms for linear models); no QMX piece computes it"
  inputs: []
  affects:
    - {id: edge_range, direction: down, how: "a low ratio cuts the low end"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
    - {gen: research, ref: "research/R6-alphaxiv-papers/T-09-validation-against-overfitting.md"}
  notes: "H04."

- id: ev_family_prior_spread
  name: "Spread of true performance across a family, fitted"
  level: methodology
  kind: evidence
  measure: "R"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: fitted on a rolling window of the family's t-statistics; a family whose spread fits near zero pulls every child toward zero"
  inputs: []
  affects:
    - {id: edge_range, direction: either, how: "a narrow family prior pulls the low end toward the family mean"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
  notes: "H04, H27."


  kind: other
  measure: "other: record"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "written by QMB on every result: real-tick share, cost model version, fill convention, same-bar rule, data snapshot, decision lag"
  inputs: []
  affects:

- id: ev_gate_rejection_rates
  name: "Share of candidates each gate rejected, per family"
  level: methodology
  kind: evidence
  measure: "percent"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "per gate: rejected / candidates that reached it, per family, printed on the death certificate"

# Ledger additions from the X5 edge verification layer (Stage B, 2026-11-03).
# Generated from expansion/X5-edge-verification.md; new ids carry the prefix ev_. Existing v0 ids are reused, never redefined.
# Every default has a derivation; null defaults say why they are open. Nothing here is ratified.

- id: ev_claim_registered
  name: "Claim card registered with a hash before any test"
  level: unit
  kind: other
  measure: "other: yes or no"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "true once the claim card (thesis, context, classes, band, falsification tests) is hashed in the family ledger; a unit without it is refused"
  inputs: []
  affects:
    - {id: effective_tries, direction: up, how: "every registered claim is a counted try"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
    - {gen: research, ref: "research/R6-alphaxiv-papers/T-09-validation-against-overfitting.md"}
  seed_ids: [D18]
  notes: "H01. Categorical."

- id: ev_novelty_check

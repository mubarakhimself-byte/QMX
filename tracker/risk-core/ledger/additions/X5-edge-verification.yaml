  measure: "other: id"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "assigned by the ledger on every evaluation, failures included; parent is the candidate it was edited from"
  inputs: []
  affects:
    - {id: effective_tries, direction: up, how: "the ledger is what the try count is read from"}

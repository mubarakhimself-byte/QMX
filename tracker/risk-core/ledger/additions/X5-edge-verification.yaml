- id: ev_prereg_weight
  name: "Weight of a pre-registered claim in the try count"
  level: methodology
  kind: evidence
  measure: "ratio"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: 1
  basis: reasoned
  derivation: "a claim registered before its result counts once; an edit after a result counts twice (the post-hoc weight is 2); rewards the habit of stating the pass rule first"
  inputs: []
  affects:
    - {id: effective_tries, direction: up, how: "post-hoc edits raise the count faster"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
  notes: "H01; from R26 §3.1 C and D in the draft."

- id: ev_unseen_data_source
  name: "Which data could not have shaped the claim"
  level: unit
  kind: other
  measure: "other: sealed-holdout or paper-and-live"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: "paper-and-live"
  basis: reasoned
  derivation: "sealed holdouts are off by default (rulings 136-137), so paper and live trades are the unseen data unless a holdout was sealed; backtest trades never count"
  inputs: []
  affects:
    - {id: ev_counts_toward_proof, direction: either, how: "sets which stage tags count"}
  configurable: true
  changed_by: [operator, automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X5-edge-verification.md"}
  notes: "H02, X5-47."


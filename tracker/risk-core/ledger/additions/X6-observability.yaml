  inputs: []
  affects:
    - {id: burn_rate_page_threshold, direction: either, how: "A shorter short window resets pages faster and fires on more blips."}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A4-template-agents-telemetry.yaml:1134", note: "A4-32"}

- id: burn_window_trades
  name: Long burn window expressed in the unit's expected trades instead of hours

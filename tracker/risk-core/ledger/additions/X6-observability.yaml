- id: exit_mechanism
  name: What closed a trade, kept apart from its outcome
  level: trade
  kind: evidence
  measure: "other: code"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "A closed code emitted by the exit that acted: stop, fast-invalidation cut, breakeven, time, signal, target, trail, forced flat by kill switch, forced flat by risk rule, liquidation, roll. The outcome (R, money) is a separate field. Today the row keeps only QMB fill kinds, so time, signal and FI exits all read close."
  inputs: []
  affects:
    - {id: exit_reason_code, direction: either, how: "Splits the old exit kind into mechanism and outcome."}
    - {id: loss_counting_rule, direction: either, how: "A brake can count FI cuts by size only if the row names them."}
    - {id: event_ledger_rates, direction: either, how: "The event ledger counts mechanisms."}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A4-template-agents-telemetry.yaml:4965", note: "A4-150"}
    - {gen: grounding, ref: "grounding/G11-ledger-exposure-exits-observability.md:190-192", note: "all non-stop exits read close"}
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-04"}
  seed_ids: [A28]


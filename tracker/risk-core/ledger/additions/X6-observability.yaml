# ---------------------------------------------------------------- meanings

- id: risk_light_state
  name: His six words per scope (UP, ON, TRADING, RIGHT, WRONG, TRIPPED) plus UNKNOWN
  level: unit
  kind: evidence
  measure: "other: word"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "Predicates over the RiskState fold, defined in expansion/X6-observability.md section 1: UP from heartbeat and link age; ON from kill level, pause, stand-downs, trading state, calendar and warm-up; TRADING from ON, decision pulse and trade count against the card; RIGHT mechanically (reconcile, stops at venue, costs, replay) and statistically (drift zone, cone); WRONG when a RIGHT half fails; TRIPPED when a brake is latched; UNKNOWN when any input is past its staleness limit or folds disagree. Computed per market, unit, book, account and node."
  inputs: [liveness_heartbeat_cadence, kill_switch_level, brake_state, drift_state, decision_pulse_max_age, risk_fact_staleness_limit, reconciliation_tolerance, cost_assumption_ratio]
  affects: []
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "section 1, X6-11"}
    - {gen: operator_words, ref: "seeds/operator-words-2026-11-03.md:79", note: "M12: wrong, right, working, up, on, trading"}
  seed_ids: [D49, C7]
  aliases: [six lights, up on trading]


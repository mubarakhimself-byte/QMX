  measure: bars
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Proposed rule: a small number of the unit's own bars, read from a sampled 'evaluated, no signal' row. No such row exists; signal rows are written only for blocked decisions (G9 7.1)."

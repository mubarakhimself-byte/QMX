  seed_ids: [D49]

- id: silence_alarm_probability
  name: Chance of seeing zero trades, given the card's trade rate and the open hours, below which a unit is flagged quiet
  level: unit
  kind: other
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Proposed rule: Poisson P(zero trades | card trade rate x open calendar hours in the window); below this level a ticket says 'quiet beyond expectation', split by refusal counts into shut, no signal, refused or deaf. Alert threshold, not a brake."
  inputs: [trade_rate, trade_rate_band, session_windows]
  affects:
    - {id: risk_light_state, direction: either, how: "Turns TRADING into 'on but quiet' with a cause."}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml:3819", note: "A2-166 trade-rate band"}
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-12"}
  seed_ids: [D49, C11]
  notes: "Alert threshold. Weak for swing units with a few trades a week (roundtable)."

# ---------------------------------------------------------------- alerts

- id: loss_budget_burn_rate
  name: How fast a scope is spending its loss budget against the share of trading time elapsed
  level: unit
  kind: measure
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "(share of the period loss budget used) / (share of the period's trading time elapsed). 1 spends the budget exactly by the period's end. Trading time follows each market's calendar: FX weekends do not elapse, crypto hours all do. Computed at unit, book and account."
  inputs: [period_loss_budget, budget_remaining, unit_daily_loss_limit, day_boundary]
  affects:
    - {id: burn_rate_page_threshold, direction: either, how: "Compared with the page tier."}
    - {id: burn_rate_ticket_threshold, direction: either, how: "Compared with the ticket tier."}
    - {id: brake_state, direction: either, how: "Shown on each money brake's meter."}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml:653", note: "A2-28 burn-rate brake"}
    - {gen: research, ref: "linking/components/A4-template-agents-telemetry.yaml:1134", note: "A4-32 SRE burn tiers"}
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-15"}
  seed_ids: [C7, D49]

- id: burn_rate_page_threshold
  name: Burn rate over both windows at which the phone is woken
  level: unit
  kind: other
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Google SRE pages at 14.4 (2 % of a monthly budget in 1 hour) and 6 (5 % in 6 hours). Proposed derivation for trading: the budget from the unit's own daily P&L distribution at its trade count (A5-144) and windows in expected trades, so a healthy unit pages at most once a month in replay. Alert threshold; the brake response is X3's."
  seen_values:
    - {value: 14.4, gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml:653", note: "Google SRE, monthly budget, 1 h window; not trading"}
  inputs: [loss_budget_burn_rate, burn_window_trades]
  affects:
    - {id: alert_tier, direction: up, how: "Above it the alert is a page."}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-15"}
  seed_ids: [D49]

- id: burn_rate_ticket_threshold
  name: Burn rate over both windows at which a ticket opens
  level: unit
  kind: other
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Google SRE opens a ticket at burn 1 over 3 days (10 % of a monthly budget). Proposed: same derivation as the page tier at a slower window, so a healthy unit opens at most one ticket a week in replay."
  seen_values:
    - {value: 1, gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml:653", note: "Google SRE ticket tier; not trading"}
  inputs: [loss_budget_burn_rate, burn_window_trades]
  affects:
    - {id: alert_tier, direction: up, how: "Above it the alert is at least a ticket."}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-15"}

- id: burn_short_window_ratio
  name: Length of the short burn window as a share of the long one; both must exceed the tier
  level: unit
  kind: other
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: stated
  derivation: "SRE practice sets the short window at about 1/12 of the long one so an alert resets fast once burning stops. No trading test; kept as a seen value until the replay sets it."

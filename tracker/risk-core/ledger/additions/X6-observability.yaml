# ---------------------------------------------------------------- the fact spine

- id: risk_state_emit_interval
  name: Heartbeat interval at which the node writes a full RiskState fold even when nothing changed
  level: node
  kind: schedule
  measure: "other: seconds"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Proposed rule: emit on every change plus a heartbeat no longer than half of risk_fact_staleness_limit, so a reader never sees a fold older than its limit without a newer one on the way. A4-152 proposed every pass; the roundtable moved it to on-change plus heartbeat to spare the VPS disk."
  inputs: [risk_fact_staleness_limit]
  affects:
    - {id: brake_state, direction: either, how: "Sets how fresh the brake meters are on every screen."}
    - {id: risk_light_state, direction: either, how: "A late heartbeat turns the six words grey (UNKNOWN)."}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-01"}
    - {gen: research, ref: "linking/components/A4-template-agents-telemetry.yaml:5031", note: "A4-152 RiskState row"}
  seed_ids: [D49]

- id: risk_fact_staleness_limit
  name: Age after which a risk fact on any screen or tool turns UNKNOWN instead of keeping its last colour
  level: node
  kind: limit
  measure: "other: seconds"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open. Proposed rule: per fact, a multiple of its own update cadence (heartbeat for UP, the bar for TRADING, the harvest cadence for facts read on This PC). Gen 3 carried source time, receive time and watermark on every health read; no number was set."
  inputs: [liveness_heartbeat_cadence, journal_harvest_cadence, records_home_cadence]
  affects:
    - {id: risk_light_state, direction: either, how: "Past the limit a word shows UNKNOWN."}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "section 1 and X6-11"}
    - {gen: sept_docs, ref: "C:/Users/Mubarak/Desktop/QMX/docs/lenses/observability/metrics-and-alerts.md:114-116", note: "provenance-stamped health states"}
  seed_ids: [D49]


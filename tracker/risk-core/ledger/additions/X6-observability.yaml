- id: drawdown_by_kind
  name: Drawdown measured as a declared triple of equity series, anchor and window (day, session, trailing, cushion, unit working anchor, account floor)
  level: unit
  kind: measure
  measure: percent
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "For each kind: (anchor value minus current value of the named series) divided by the anchor value, also shown in USD and R. Series: realized, marked or venue. Anchors: day start, session start, high-water mark, fixed floor, unit working anchor (may restart), account floor (never restarts). Computed at unit, book and account."
  inputs: [account_equity, realized_pnl, unrealized_pnl, day_start_equity, high_water_mark_equity, brake_equity_basis]
  affects:
    - {id: brake_state, direction: either, how: "Each money brake reads its declared kind."}
    - {id: time_under_water, direction: either, how: "Depth and duration are shown together."}
  configurable: false
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: research, ref: "linking/components/A2-brakes-drift-exits.yaml:2646", note: "A2-115 declared equity series and base"}
    - {gen: grounding, ref: "grounding/G11-ledger-exposure-exits-observability.md:145-149", note: "four meanings of 5 % drawdown"}
    - {gen: expansion, ref: "expansion/X6-observability.md", note: "X6-02"}
  seed_ids: [B15, C8]


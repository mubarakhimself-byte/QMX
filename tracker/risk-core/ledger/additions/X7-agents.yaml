# Ledger additions from Stage B layer X7 (where agents come in, for risk and sizing).
# Source document: expansion/X7-agents.md. Hybrid ids X7-H01..H49 are named in notes.
# Every default is null: no current design, code or ruling states these values yet.

- id: operation_risk_direction
  name: Declared risk direction of every agent tool and app operation (read, propose, cut, raise, money)
  level: system
  kind: other
  measure: "other: category"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: proposed rule (X7-H02): each catalog row and app operation declares one direction; agent and workflow principals may call read, propose and cut-through-evidence only; raise and money answer only to the operator; an operation with no direction fails CI"
  inputs: []
  affects:
    - {id: kill_switch_level, direction: either, how: "only an operator principal may call operations that change the kill level; agents can only pre-fill an escalation card"}
    - {id: agent_autonomy_level, direction: either, how: "the autonomy level decides which directions an agent profile may use"}
  configurable: false
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: unit_build, ref: "D:/QMX-worktrees/bld-us-c13/qmx-agents/packages/qmx-host/src/qmx_host/host_route.py:91-94", note: "admits: manage operations and money jobs answer only to the operator"}
    - {gen: unit_build, ref: "D:/QMX-worktrees/bld-us-c13/qmx-agents/apps/trading-node/app.toml", note: "kill escalates and never lowers; pause, resume, flatten, deploy are manage"}
    - {gen: research, ref: research/R4-alphaxiv/chat-20-agent-approval-gates-evaluation.md, note: "I-HITL: 9 of 10 models raised their own cap when the gate was reachable"}
    - {gen: expansion, ref: expansion/X7-agents.md, note: "X7-H02"}
  seed_ids: [D42, D43]
  notes: "Configurable is false on purpose: the direction of an operation is a fact about it, not a setting. QMA flag: catalog and host change."
  open_questions:
    - "Is a reduce-only action (close, cancel, tighter stop) its own direction, given agents cannot send orders anyway?"

- id: agent_risk_scale
  name: Size scale an agent evidence record proposes, clamped between the unit's floor and 1
  level: unit
  kind: size_input
  measure: ratio
  applies_to: {classes: [all], styles: [intraday, swing], timeframes: all}
  default: null
  basis: formula
  derivation: "applied scale = max(agent_evidence_max_cut floor, min over valid records of the record's proposed scale, 1); a record that is expired, malformed or of a kind the unit does not accept counts as 1 (X7-H03)"
  inputs: [agent_evidence_max_cut, agent_evidence_ttl, agent_evidence_kinds_accepted, single_item_effect_cap, corroboration_widening_step]
  affects:
    - {id: context_size_modifier, direction: up, how: "a higher scale means a smaller cut; the unit's own rule multiplies size by it"}
    - {id: risk_amount_usd, direction: up, how: "money at risk on the next entry scales with it"}
  configurable: true
  changed_by: [automatic]
  status: proposal
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md, note: "risk_scale_proposal clamped to [0, 1]; loss of the service means no agent-driven change"}
    - {gen: research, ref: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md, note: "SwingGuard and Fake News, Real Crashes"}
    - {gen: expansion, ref: expansion/X7-agents.md, note: "X7-H03"}
  seed_ids: [A25, C27]
  notes: "Styles exclude scalpers by default because LLM latency (about 187 s in one study) exceeds a 1-minute unit's decision time; see agent_evidence_style_scope. Never above 1: agents cannot raise risk."
  open_questions:
    - "Does applying it automatically need ruling 2 restated (question 1 in X7)?"

- id: agent_evidence_kinds_accepted
  name: Agent evidence kinds a unit's (or Book's, or BMS's) own rules may read
  level: unit
  kind: other
  measure: "other: list of kinds"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: declared per template in an accepts_evidence section (news, macro, micro label, structure summary, isolation nomination, journal finding); a kind is allowed only if agent_evidence_style_scope passes"
  inputs: [agent_evidence_style_scope]
  affects:
    - {id: agent_risk_scale, direction: down, how: "each accepted kind is one more source that can cut size"}
  configurable: true
  changed_by: [operator, agent_proposal]
  status: proposal
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-22c-saved-marketsenseai-evolvetrade.md, note: "per-agent evidence contract with expiry and permitted use"}
    - {gen: expansion, ref: expansion/X7-agents.md, note: "X7-H03, X7-H39"}
  seed_ids: [D43, C27]
  notes: "Template section, not a number. Agents may propose adding a kind by card; only he accepts."

- id: agent_evidence_max_cut
  name: Floor on the size scale one evidence kind may cause (the largest cut)
  level: unit
  kind: limit
  measure: ratio
  applies_to: {classes: [all], styles: [intraday, swing], timeframes: all}
  default: null
  basis: open
  derivation: "open: proposed per kind and per class; should be set so a single kind's cut beats a matched random cut (agent_vs_random_lift) and is smaller for uncorroborated kinds"
  inputs: [agent_vs_random_lift, evidence_source_independence]
  affects:
    - {id: agent_risk_scale, direction: up, how: "a higher floor limits how far evidence can cut"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md, note: "cap any single unverified item's effect"}
    - {gen: expansion, ref: linking/stage-b/X7-agents/roundtable.md, note: "round 2: one news record to 0.7, two corroborated perhaps 0.5 (illustration, not a value)"}
  seed_ids: [A25]
  open_questions:
    - "Should the floor differ by class (crypto news authenticity risk) or by style?"

- id: agent_evidence_ttl
  name: How long an agent evidence record stays valid, per kind
  level: system
  kind: schedule
  measure: minutes
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: proposed by kind: news minutes to hours; macro until the next relevant release; micro label one session; structure summary days; isolation nomination days to weeks; journal finding weeks (X7-H39)"
  inputs: [decision_freshness_bound]
  affects:
    - {id: agent_risk_scale, direction: down, how: "a longer life keeps a cut in force longer"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-22c-saved-marketsenseai-evolvetrade.md, note: "evidence expiry by type"}
    - {gen: expansion, ref: expansion/X7-agents.md, note: "X7-H39"}
  seed_ids: [C27, C28]
  aliases: [evidence_expiry_by_type, agent_signal_valid_until]
  notes: "X1's additions carry the same alias on x1_proposal_expiry (checked together on 3 Nov). The funnel decides whether evidence life and proposal life are one variable; this entry is the life of an evidence record by kind, not of a card."

- id: agent_evidence_style_scope
  name: Whether a unit's style and holding time allow agent evidence at all
  level: unit
  kind: other
  measure: "other: yes or no per kind"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "a kind is eligible for a unit when agent_evidence_ttl for that kind exceeds the unit's typical holding time times a margin k and the agent's measured decision latency is below the unit's decision interval; k open"
  inputs: [agent_evidence_ttl, max_hold_time, trade_rate]
  affects:
    - {id: agent_evidence_kinds_accepted, direction: either, how: "removes kinds a fast unit cannot use"}
  configurable: true
  changed_by: [automatic, operator]
  status: proposal
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md, note: "LLM decisions took about 187 s (agents 523 s) in a crypto paper study"}
    - {gen: expansion, ref: linking/stage-b/X7-agents/roundtable.md, note: "round 2"}
  seed_ids: [D6]
  notes: "Scalpers at 1 minute keep only session-level kinds (session caution, class isolation)."

- id: agent_evidence_fail_mode
  name: What a unit does when agent evidence is missing, stale or malformed
  level: unit
  kind: other
  measure: "other: neutral, cut or block"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: reasoned
  derivation: "proposed neutral: missing evidence means no agent-driven change (scale 1), as the de-risk-only designs require; shown beside the MIS board's fail-open and isolation's fail-closed modes on the preflight (X7-H30)"
  inputs: []
  affects:
    - {id: agent_risk_scale, direction: up, how: "neutral returns the scale to 1 when evidence is missing"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md, note: "failure of the service must mean no agent-driven change, not a default increase"}
    - {gen: grounding, ref: grounding/G9-runtime-brakes-isolation-evidence.md, note: "the MIS board fails open by design"}
  seed_ids: [C27]
  open_questions:
    - "Should a unit that depends on one evidence kind (for example an isolation nomination) fail closed instead?"

- id: single_item_effect_cap
  name: Largest cut one uncorroborated item may cause across all units at once
  level: portfolio
  kind: limit
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: proposed so one fabricated headline cannot move many units together; evidence for the need: fabricated news succeeded 62 % against LLM agents, 100 % with two templates"
  inputs: [evidence_source_independence]
  affects:
    - {id: agent_risk_scale, direction: up, how: "limits how far one item can push the scale down"}
  configurable: true
  changed_by: [operator]
  status: proposal
  sources:
    - {gen: research, ref: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md, note: "Fake News, Real Crashes 2610.26438"}
  seed_ids: [C28]

- id: corroboration_widening_step
  name: How much more an evidence record may cut for each independent confirming source
  level: portfolio
  kind: other
  measure: ratio
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: open
  derivation: "open: each independent source (counted by evidence_source_independence) lowers the allowed floor by a step, never below agent_evidence_max_cut"
  inputs: [evidence_source_independence]
  affects:
    - {id: agent_risk_scale, direction: down, how: "corroborated records may cut more"}
  configurable: true
  changed_by: [operator]
  status: idea
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-22c-saved-marketsenseai-evolvetrade.md, note: "independent-source confirmation widens what a record may change"}
  seed_ids: [C28]

- id: evidence_source_independence
  name: Effective number of independent sources behind an evidence record
  level: portfolio
  kind: measure
  measure: count
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "count sources once per feed and once per model family; optionally shrink further by the correlation of the agents' past records"
  inputs: []
  affects:
    - {id: corroboration_widening_step, direction: down, how: "fewer independent sources means less widening"}
    - {id: single_item_effect_cap, direction: either, how: "decides whether an item counts as uncorroborated"}
  configurable: true
  changed_by: [automatic]
  status: idea
  sources:
    - {gen: research, ref: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md, note: "many agents reading one feed are one agent"}
  notes: "Gap in the components: no measure of agent independence exists."


    direction: either
    type: same:level
    how: Every excursion and result is divided by the money at risk at entry.
  - id: mean_loss_r
    direction: either
    type: up:event
    how: Loss sizes are counted in R, so the R definition sets what a full stop means.
  configurable: false
  changed_by:
  - none
  status: running
  sources:
  - gen: sept_docs
    ref: C:/Users/Mubarak/Desktop/QMX/docs/registry/variables.yaml:460-469
  - gen: unit_build
    ref: D:/QMX-worktrees/bld-us-c13/qmb/src/qmb/results/journal.py:397-418
    note: trade rows carry R
  seed_ids:
  - B9
  aliases:
  - R
  - original_risk_unit
  - r_multiple
  - risk unit
  notes: 'The unit build marks R undefined when a unit declares no price stop (r_missing). He has not accepted R fixed at entry: ''We shall see about that'' (B9).'
  open_questions:
  - Is R frozen at entry, or may it be re-based (he has not accepted the frozen version)?
  - What is R for a unit with no price stop (fast invalidation only, time exit, grid)?

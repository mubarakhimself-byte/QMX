- id: net_r
  name: A trade's result in R after its costs
  tier: core
  level: trade
  kind: measure
  measure: R
  applies_to:
    classes:
    - all
    styles:
    - all
    timeframes: all
  default: null
  basis: formula
  derivation: 'net_r = (money + cash) / risk. risk is one R: the planned loss at the disaster stop at entry. money is the close at fill prices, which already hold spread and slippage. cash is commission and swap. This is the form QMB''s report already computes (qmx-agents/apps/qmb/jobs/backtest.py). r = money / risk is the judge''s trade_r, gross of cash. costs_r{spread, commission, slippage, swap} on the row is a display split and is never subtracted again: subtracting it counts spread and slippage twice, and at 0.16R a trade that sends 93 to 100 percent of healthy model units to paper (architecture/check/out-check-main.txt arm G). Until R24 proves deal money the node takes cash from the cost cell''s commission and swap, labelled cost:uncalibrated, so its stream and the card stay on one basis. Brakes, the money ledger, the CUSUM and the admission gate read net_r, and the CUSUM''s reference is the holdout''s net_r. The judge and the logic record read r. The code field r_after_costs (unit_handler.py:724,
    ClosedTrade, motion/engine.py) holds gross despite its name: it keeps its value, is renamed gross_r in the risk session''s slice 1, and is never net_r. Our call; his B9 reservation stands (FUNNEL DP11, hand-off 22; CHECK.md B1).'
  inputs:
  - round_trip_cost_r
  - spread_cost
  - commission_cost
  - slippage_cost
  - exit_mechanism
  affects:
  - id: loss_counting_rule
    direction: either
    type: up:event
    how: The unit bench and the day stop count losses in net_r, so a cut counts its size and a breakeven its cost.
  - id: money_brake_threshold_r
    direction: either
    type: up:event
    how: The own-p1 threshold is measured on the net_r stream, so costs cannot hide a loss from the bench.
  - id: drift_state
    direction: either
    type: up:event
    how: The CUSUM reads net_r against the card's net mean; gross and cost streams stay apart for attribution.
  configurable: false
  changed_by:
  - automatic
  status: proposal
  sources:
  - gen: grounding
    ref: grounding/G12-audit-and-repair-for-risk.md:75
    note: 'hand-off 22: r_after_costs holds gross today'
  - gen: expansion
    ref: funnel/FUNNEL.md:113
    note: 'DP11: R is gross, net_r beside it'
  - gen: expansion
    ref: architecture/CHECK.md:13-17
    note: 'B1: the double count and the true form'

- id: horizon_survival_risk_usd
  name: Per-trade risk from the horizon floor-odds sizer
  tier: core
  level: unit
  kind: size_output
  measure: USD
  applies_to:
    classes:
    - all
    styles:
    - all
    timeframes: all
  default: null
  basis: formula
  derivation: At zero drift r = D_usable / (s x z x sqrt(H) x sqrt(N x (1 + (N - 1) x rho))), z = Phi^-1(1 - eps/2), D_usable = committed cushion minus the contingency reserve. With drift at the planning edge point, the largest r whose first-passage chance of touching the floor within H rounds is at most eps (bisection). Computed at each anchor and cached; a stale cache falls back to the zero-drift form.
  inputs:
  - committed_cushion_usd
  - largest_bet_contingency_usd
  - result_spread_r
  - floor_touch_tolerance
  - survival_horizon_rounds
  - live_unit_count
  - stressed_unit_correlation
  - planning_edge_point
  - edge_range
  affects:
  - id: risk_amount_usd
    direction: up
    type: down:cap
    how: The baseline amount before level, modifiers and clamps.
  - id: floor_touch_size_bound
    direction: either
    type: same:level
    how: A derivation candidate for the floor-touch bound, finite horizon and correlated units included.
  configurable: true
  changed_by:
  - automatic
  status: proposal
  sources:
  - gen: expansion
    ref: expansion/X2-sizing-accelerators.md
    note: X2-H01
  - gen: expansion
    ref: linking/stage-b/X2-sizing-accelerators/sims/out-1000.txt
    note: 0 floor touches in 12 cases; 2.8x the 1/N split's median
  - gen: research
    ref: research/R9-accelerators-and-brake-pairs.md
    note: cushion rule, Hsieh lemma
  seed_ids:
  - A2
  - A24
  - C13
  - C29
  - D46

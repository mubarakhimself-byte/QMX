- id: floor_touch_size_bound
  name: Largest risk per trade that keeps the chance of touching the floor under a target
  level: unit
  kind: size_output
  measure: USD
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "15 Oct maths: the chance of touching the kill line is about exp(-2 x EV x D / (s^2 x r)), D the cushion above the floor, r dollars risked. Requiring it below eps gives r <= 2 x EV x D / (s^2 x ln(1/eps)). Size comes from the cushion, not equity; EV <= 0 means size 0."
  inputs: [expectancy_r, result_spread_r, loss_runway, floor_touch_tolerance]
  affects:
    - {id: cushion_share_per_trade, direction: up, how: "The bound sets what share of the cushion one trade may risk."}
  configurable: false
  changed_by: [automatic]
  status: idea
  sources:
    - {gen: october, ref: "grounding/G1-operator-sessions.md:210-215"}
  seed_ids: [C10, C14]
  notes: "Assumes independent trades and a known edge; at half the edge the touch odds rise sharply (1 Nov and 3 Nov sims)."


  aliases: [quantity, volume, position size]
  notes: "The sent quantity must equal the sizer receipt after rounding (placeholder row 30, kept). On $300 the minimum lot often decides the size (G3 section 6)."
  open_questions:
    - "On small accounts: skip below the minimum lot, round to nearest, or allow a bounded oversize?"


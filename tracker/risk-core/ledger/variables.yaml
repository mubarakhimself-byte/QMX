    - {id: margin_used, direction: up, how: "More lots use more margin."}
  configurable: false
  changed_by: [automatic]
  status: running
  sources:
    - {gen: unit_build, ref: "D:/QMX-worktrees/bld-us-c13/qml/src/qml/blocks/stdlib/fixed-fraction-at-stop/1/block.py:37-59"}

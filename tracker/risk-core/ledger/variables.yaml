- id: original_risk_r
  name: R, one unit of the money a trade loses if its stop is hit
  level: trade
  kind: measure
  measure: R
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: 1
  basis: reasoned
  derivation: "By definition one R is the full planned loss at the stop, fixed when the trade is admitted (DEC-0076, AD-40). Every result is then stated as a multiple of it: -1 is a full loss, 0 is breakeven."
  inputs: [stop_distance, risk_amount_usd]
  affects:
    - {id: excursion_mae_mfe_r, direction: either, how: "Every excursion and result is divided by the money at risk at entry."}
    - {id: mean_loss_r, direction: either, how: "Loss sizes are counted in R, so the R definition sets what a full stop means."}
  configurable: false
  changed_by: [none]
  status: running
  sources:
    - {gen: sept_docs, ref: "C:/Users/Mubarak/Desktop/QMX/docs/registry/variables.yaml:460-469"}
    - {gen: unit_build, ref: "D:/QMX-worktrees/bld-us-c13/qmb/src/qmb/results/journal.py:397-418", note: "trade rows carry R"}
  seed_ids: [B9]
  aliases: [R, original_risk_unit, r_multiple, risk unit]
  notes: "The unit build marks R undefined when a unit declares no price stop (r_missing). He has not accepted R fixed at entry: 'We shall see about that' (B9)."
  open_questions:
    - "Is R frozen at entry, or may it be re-based (he has not accepted the frozen version)?"
    - "What is R for a unit with no price stop (fast invalidation only, time exit, grid)?"


  level: trade
  kind: size_output
  measure: "other: lots"
  applies_to: {classes: [all], styles: [all], timeframes: all}
  default: null
  basis: formula
  derivation: "lots = risk_amount_usd / (stop_distance x value_per_point), rounded down to lot_step; below min_lot the trade is skipped with a reason. April clamped up to the minimum lot instead (a silent oversize). The Book door refuses an inexact size rather than round."

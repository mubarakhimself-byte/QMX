- id: A1-sizing-allocation-093
  name: Hierarchical risk parity and cluster-constrained variants
  source: "research/R4-alphaxiv/chat-23-A-portfolio-level-sizing.md:69-77 (Lopez de Prado 2016); research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md (section 2: Raffinot HERC 2018, Pfitzinger-Katzke 2019); research/R6-alphaxiv-papers/T-01-portfolio-optimisation-and-sizing.md:54-72 (Cotton critique)"
  kind: allocator
  what_it_does: "Cluster sleeves by P&L dependence, order them in a tree and split allocation recursively between branches using their risk, without inverting the covariance or using expected returns. HERC compares downside or drawdown risk per cluster; constrained HRP adds cluster and position caps. Stops many similar scalpers looking like diversification."

  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Statistical method from research 05/08; arithmetic in R2."
  known_failures: ["slow for thin edges: +0.10R median about 604 trades to pass 20 (G2)"]
  performance_note: "Avoids permanent shrink of healthy units."
  survival_note: "No re-risking on a lucky run."

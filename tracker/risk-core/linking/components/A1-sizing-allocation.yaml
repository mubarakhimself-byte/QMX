- id: A1-sizing-allocation-027
  name: Post-selection James-Stein shrink of the winner's Sharpe
  source: "research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:29-50 (Pav 2606.01650); research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:160-187"
  kind: gate/test
  what_it_does: "After picking the best of k candidates, pull its Sharpe toward the pool mean: s = (1 - ((k - 2) / n) / ||z - zbar||^2)+. GMLEB when only a few candidates are truly good. Under candidate correlation above 0.75 the raw estimate ranks better."

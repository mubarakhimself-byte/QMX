- id: A1-sizing-allocation-146
  name: One cost ledger for backtest, paper and live, with a cost-stress grid
  source: "research/R6-alphaxiv-papers/T-11-costs-and-self-configuring-parameters.md:9-45 (AutoQuant 2512.22476; 2609.34510); grounding/G7-unit-inputs-qmb-mis-instruments.md:47-52 (QMB 1.5x and 2x stress); research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:328-339 (2608.18676)"
  kind: cost model
  what_it_does: "One execution convention and one net-return ledger (raw - fees - slippage - funding) for backtest, replay and monitoring, reconciled to zero differences. A nine-scenario cost grid (fees and funding varied, 0.5-2x) screens candidates; on BTC perpetuals CAGR fell 5.2 to 4.3 to 2.7 from zero to full costs. QMX gates use expectancy at 1.5x costs (shipped) or 2x (old preset). Size on post-cost returns, never gross then subtract."
  inputs: [cost terms per class, stress multiples]
  outputs: [net returns per scenario, pass or fail]
  assumptions: ["linear costs, no impact"]
  levels: [unit]

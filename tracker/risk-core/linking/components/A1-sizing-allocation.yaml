  source: "expansion/drafts-stopped/X1-template-shape.md:222-244 (X1-23, X1-25); research/R7-software-patterns-self-configuring.md:598 (OtterTune: empty record borrows a prior, deny-list); research/R3-edge-verification-and-analogues.md:313 (pysystemtrade order)"

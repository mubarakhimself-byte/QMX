    - "A1-sizing-allocation-146: chat-01 combo F robust Kelly on post-cost returns (2608.18676)"

- id: A1-sizing-allocation-024
  name: Risk-constrained Kelly with a wealth-floor probability
  source: "research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:92-111 (Busseti-Ryu-Boyd 1603.06183); research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:43,303-313"
  kind: sizing rule
  what_it_does: "Maximise expected log growth subject to E[(r'b)^(-lambda)] <= 1 with lambda = log(beta) / log(alpha), which guarantees P(lowest wealth ever < alpha x start) < beta. Convex, one knob; it beat fractional Kelly at equal risk in the authors' simulations."
  inputs: [return scenarios and probabilities, floor alpha, allowed probability beta]
  outputs: [bet fractions including cash]
  assumptions: ["return distribution known", "i.i.d. returns", "floor from start, not from peak"]
  levels: [unit, portfolio, account]
  instrument_classes: [theory]
  class_notes: "Fat-tailed classes (crypto, small caps) need tail scenarios in the set."
  styles_timeframes: "book level"
  evidence: simulation
  evidence_note: "Proofs plus simulations; bound close to Monte Carlo drawdown risk (R6 read)."
  known_failures: ["not a peak-to-trough guarantee", "assumes the model"]
  performance_note: "Spends the full survival allowance, no more, instead of an arbitrary fraction."
  survival_note: "Expresses his 'almost never touch the floor' as (alpha, beta); re-anchor alpha at each sweep for a peak version (T-05)."
  ledger_ids: [floor_touch_tolerance, portfolio_floor, kill_line_floor, kelly_multiplier]
  new_variables: [{name: floor_probability_beta, what: "allowed chance of ever falling below the floor"}]
  qmx_layer: [X2, X3]
  link_hints:
    - "A1-sizing-allocation-027: T-05 combo shrink the edge then size the book to a floor probability"
    - "A1-sizing-allocation-038: T-06 combo hard pathwise cap plus probabilistic floor"
    - "A1-sizing-allocation-036: the October floor-touch bound is the same target in closed form"

- id: A1-sizing-allocation-025
  name: Conformal Kelly warning, and a slow volatility estimate inside any sizing rule
  source: "research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:52-71 (Ryan 2608.01494); research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:23"
  kind: sizing rule
  what_it_does: "Capped fractional Kelly with sigma read from the half-width of a conformal prediction interval. Coverage held (0.745 vs 0.750) but it ranked last of 11 on Sharpe and Calmar in a sealed 2022-2024 test; development growth 28.5 % became 8.5 %. Inside the study, slow unweighted per-asset quantiles beat adaptive estimates by 2.1 points a year."

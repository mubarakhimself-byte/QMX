  what_it_does: "Size grows back only when an e-value on trades after the cut passes 1/alpha (for example 20) plus a minimum time. A ratchet that only tightens on a noisy estimate drifts every unit to minimum size; the principled one-way ratchet belongs on the account floor. Ten wins in a row prove little for a high-win-rate unit."

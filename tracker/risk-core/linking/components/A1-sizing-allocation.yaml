- id: A1-sizing-allocation-028
  name: Hierarchical shrinkage of the edge toward a family prior (Bayes-Stein)
  source: "research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:123-137,276; research/R4-alphaxiv/chat-23-A-portfolio-level-sizing.md:19 (Jorion 1986); grounding/G2-unit-plan-risk-state.md:170"

  what_it_does: "Each number may bind a derivation block that computes it from facts and writes a receipt. If the unit's own record is too thin, fall back to the class default, then the preset default; refuse to compile if the ladder can end empty. An empty record borrows a prior from the most similar past units; numbers that may never self-tune sit on a deny-list he owns."

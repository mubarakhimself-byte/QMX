- id: A1-sizing-allocation-087
  name: Three answers for N units - Kelly-independent, volatility budget, plain split
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:212-224; STATE.md item 10"
  kind: allocator
  what_it_does: "For independent small bets Kelly gives each unit its solo size (total risk 3.2x with 10 units); a fixed total volatility budget gives each 1 / sqrt(N(1 + (N - 1) rho)) of the budget (0.32 each at 10 independent, 0.16 at rho 0.3); a plain split gives 1/N. Fix the book's risk, then N and correlation set each share. Lead's check: ten full-size units reach the floor 11 % at half the edge vs 5.8 % for one; ten $1 units stay at 0 %."
  inputs: [unit count, average correlation, book risk budget]
  outputs: [per-unit share]
  assumptions: ["Gaussian, equal units"]
  levels: [portfolio]
  instrument_classes: [all]
  class_notes: "Correlation hides in shared drivers (USD pairs on one release)."
  styles_timeframes: "any"
  evidence: simulation
  evidence_note: "R2 arithmetic; lead's scratch sims in grounding/sims."
  known_failures: ["'same floor odds' holds only if the edge is as believed and units independent"]
  performance_note: "Independent units can each carry about 3x the 1/N share for the same daily swing."
  survival_note: "Splitting is insurance against being wrong about the edge."
  ledger_ids: [unit_capital_share, effective_independent_bets, unit_result_correlation, portfolio_daily_risk_budget]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-088: his day-capital split is the volatility-budget row"
    - "A1-sizing-allocation-105: N_eff"


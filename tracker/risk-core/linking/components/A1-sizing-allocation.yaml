  kind: gate/test
  what_it_does: "Drawdown cuts from fewer and smaller trades are mechanical: meta-labelled RSI cut drawdown 93 % with a classifier 48 % accurate, below chance. Any sizing claim must beat a random filter or random size cut that fires as often (23482 design) or fixed-count placebos (23665)."

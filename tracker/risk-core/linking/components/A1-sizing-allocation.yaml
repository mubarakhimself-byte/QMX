# ------------------------------------------------------------------ L. workflows and tests for sizing

- id: A1-sizing-allocation-170
  name: Re-size a recorded trade list without a new backtest
  source: "research/R1-platforms-risk-sizing-extensibility.md:135-142 (QuantAnalyzer money-management simulator, equity control, What-If); expansion/drafts-stopped/X1-template-shape.md:407-409 (X1-45); grounding/G8-unit-chassis-and-extensibility.md:320,397"
  kind: workflow
  what_it_does: "Take a finished trade list and re-size it under several sizing rules (fixed lots, fixed amount, % with a lot cap), taking a missing stop from the maximum or average loss; equity-control and What-If filters run as snippets on the same list. QMX has no such run: the judge works in R and is size-blind, what-ifs filter but never resize."
  inputs: [trade list with R and stops, sizing rule]
  outputs: [money curve, drawdown, budget use, brake fires]
  assumptions: ["entries unchanged by size"]
  levels: [unit, portfolio]
  instrument_classes: [all]
  class_notes: "Needs per-trade money per point and costs."
  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Vendor tool; QMX gap."
  known_failures: ["size can change fills and costs, which a replay ignores"]
  performance_note: "Trying a sizing rule costs seconds."
  survival_note: "Drawdown under each rule visible before trading."
  ledger_ids: []
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-173: random-control comparison on the same list"

- id: A1-sizing-allocation-171
  name: Survival-first parameter choice, then median wealth
  source: "research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:146-163 (Uhrin et al. 2107.08827)"
  kind: workflow
  what_it_does: "Pick sizing hyperparameters on training data by maximising median wealth subject to at most 5 % of runs dropping below 90 %. Plain Kelly and max-Sharpe ruined every run with no real edge over the bookmaker; fractional Kelly was strong; a drawdown constraint performed about the same; a per-bet cap helped in one sport and hurt in another."
  inputs: [candidate settings, reshuffled runs, survival constraint]
  outputs: [chosen setting]
  assumptions: ["simultaneous bets modelled"]
  levels: [unit, portfolio]
  instrument_classes: [none]
  class_notes: "Betting markets; bookmaker margin plays the spread's role."
  styles_timeframes: "any"
  evidence: author backtest
  evidence_note: "Three sports, real data, 1,000 reshuffles each."
  known_failures: ["no transaction costs beyond the margin"]
  performance_note: "Most growth that meets the survival target."
  survival_note: "Survival is the constraint, as RANKING asks."
  ledger_ids: [kelly_multiplier, floor_touch_tolerance]
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-018: the fraction to choose"

- id: A1-sizing-allocation-172
  name: Hidden risk-of-ruin audit on a trade history
  source: "MQL5 23673 (md/23673.md:40-86); grounding/G1-operator-sessions.md:238"
  kind: gate/test
  what_it_does: "Screen closed positions for four fingerprints: volume escalation after a loss (next size at least 1.3x), stacking at worse prices, payoff asymmetry (high win rate, low payoff, large tail ratio), and classical ruin R = ((1 - A) / (1 + A))^U with A = (W x Rp - L) / (W x Rp + L) and U = 1 / fraction risked. Combine into an A-F grade."
  inputs: [closed positions, intended risk fraction]
  outputs: [ruin grade, escalation flags]
  assumptions: ["i.i.d. outcomes for the ruin term"]
  levels: [unit]
  instrument_classes: [fx]
  class_notes: "Instrument-neutral."
  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Article tool; no test reported in the lines read."
  known_failures: ["ruin formula assumes a fixed fraction"]
  performance_note: "None."
  survival_note: "Catches martingale-like sizing before it ruins."
  ledger_ids: [payoff_ratio, win_rate, risk_fraction]
  new_variables: []
  qmx_layer: [X5, X6]
  link_hints:
    - "A1-sizing-allocation-008: what it detects"


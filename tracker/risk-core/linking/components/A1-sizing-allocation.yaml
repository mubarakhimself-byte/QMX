- id: A1-sizing-allocation-008
  name: Martingale, grid and averaging-down sizing (failure family)
  source: "research/R5-mql5-corpus-ideas.md:30 (MQL5 5269, 15067, 8826, 20018, 20449), :651 (24331 'a martingale with better manners'); grounding/G8-unit-chassis-and-extensibility.md:191 (dictionary martingale-sizing, anti-martingale-sizing); grounding/G1-operator-sessions.md:238 (MQL5 23673)"
  kind: sizing rule
  what_it_does: "Size grows after a loss (martingale) or adds same-direction positions at worse prices (grid, averaging). Wins are frequent and small; one losing run takes the account. The anti-martingale mirror grows size after wins."
  inputs: [last result, lot multiplier, grid step]
  outputs: [next lot]
  assumptions: ["the loss run ends before the account does"]
  levels: [trade, position, unit]
  instrument_classes: [fx, metal]
  class_notes: "Gold martingale tested two months only (20449). Trending and gapping classes (crypto, gold, indices) end it fastest."
  styles_timeframes: "grid and recovery EAs"
  evidence: author backtest
  evidence_note: "Short in-sample backtests; 8826 stopped working before 2016 for unknown reasons; 5269 names a high chance of losing the deposit."
  known_failures: ["trend runs and gaps (R5 Part VI trap 10)", "high win rate hides tail (23673)", "averaging without caps is martingale"]
  performance_note: "Smooth curve until the tail; no real growth after the tail is priced."
  survival_note: "Endangers the floor directly. R5 suggests QMX forbid size growth after losses."
  ledger_ids: []
  new_variables: [{name: size_escalation_after_loss_forbidden, what: "yes or no; refuses any sizer that raises size after a loss"}]
  qmx_layer: [X2, X4]
  link_hints:
    - "A1-sizing-allocation-172: the ruin audit that detects it"
    - "A1-sizing-allocation-071: pyramiding is safe only with falling risk and a unified stop"

- id: A1-sizing-allocation-009
  name: Volatility-scaled stop at fixed risk (ATR sizing)
  source: "research/R1-platforms-risk-sizing-extensibility.md:118,124-131 (SQ ATR volatility sizing); MQL5 23583 (CVolatilityScaledModel); MQL5 22338 (Donchian range-scaled lots, md/22338.md:38-40); grounding/G2-unit-plan-risk-state.md:172"
  kind: sizing rule
  what_it_does: "The stop is set as a multiple of ATR or range; risk stays a fixed percent, so lots fall when the market is wide and rise when it is quiet. 22338 adds an RBF 'gatekeeper' network."
  inputs: [ATR or range, ATR multiple, risk fraction, value per point]
  outputs: [stop distance, lots]
  assumptions: ["recent range predicts the next stop-out distance"]
  levels: [trade]
  instrument_classes: [fx, metal]
  class_notes: "One ATR multiple fails differently per pair (MQL5 23597); calibrate per instrument. Crypto gaps through ATR stops (21372)."
  styles_timeframes: "intraday and swing; scalpers often use fixed invalidation instead"
  evidence: author backtest
  evidence_note: "22338 in-sample backtest; SQ and 23583 code only."
  known_failures: ["the extra network adds overfit surface (22338)", "lags jumps"]
  performance_note: "G2 notes an ATR stop at fixed R already gives most of what volatility targeting gives in FX."
  survival_note: "Keeps money at risk constant across volatility regimes, if stops fill."
  ledger_ids: [stop_distance, risk_fraction, volatility_target, stop_buffer]
  new_variables: [{name: atr_stop_multiple, what: "stop distance as a multiple of ATR, per instrument"}]
  qmx_layer: [X2, X3]
  link_hints:
    - "A1-sizing-allocation-011: money-volatility target across instruments"
    - "A1-sizing-allocation-160: money at stop from broker tick value"

- id: A1-sizing-allocation-010
  name: Volatility-managed exposure by inverse variance (Moreira-Muir), with the real-time challenge
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:239-243; research/R4-alphaxiv/chat-29-G-multi-asset-normalisation.md (turn 2 sections 1-2); research/R4-alphaxiv/chat-26-D-macrostructure.md:110-121; research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md (section 1)"
  kind: sizing rule
  what_it_does: "Scale next period's exposure by 1 / recent realised variance, normalised so long-run volatility matches the unscaled strategy. Moreira and Muir report Sharpe up 50-100 % on equity factors and FX carry. Cederburg et al. find the gain does not hold reliably in real time across 103 strategies."
  inputs: [recent realised variance of the strategy's money P&L, normalising constant, exposure cap]
  outputs: [exposure multiplier for the next period]
  assumptions: ["volatility persists more than returns do", "monthly rebalancing"]
  levels: [unit, cluster, portfolio]
  instrument_classes: [stock, fx]
  class_notes: "Helped Sharpe only for risk assets across 60+ assets but cut extreme returns everywhere (R2 4.5). Untested on intraday FX, crypto weekends, futures rolls."
  styles_timeframes: "factor and portfolio level, monthly; not a per-trade scalper rule"
  evidence: author backtest
  evidence_note: "Published historical backtests; challenged by Cederburg et al. 2020 (no robust real-time gain). Not checked by R6."
  known_failures: ["levers up after quiet spells just before a jump", "lags gaps", "whipsaw and turnover cost", "needs a hard cap"]
  performance_note: "The one case where de-risking can raise Sharpe (chat-26 growth vs survival)."
  survival_note: "Cuts tails in volatile spells; useless against a jump that arrives before the estimate moves."
  ledger_ids: [volatility_target, context_size_modifier]
  new_variables: [{name: vol_scaler_cap, what: "ceiling on the volatility multiplier so quiet spells cannot lever up"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-011: capped inverse-volatility is the gentler default chat-29 prefers"
    - "A1-sizing-allocation-018: chat-29 combo 1 volatility overlay plus fractional Kelly plus deflated Sharpe"
    - "A1-sizing-allocation-093: chat-29 combo 2 volatility scaler plus HRP plus cluster caps"

- id: A1-sizing-allocation-011
  name: Constant volatility target in account money per instrument
  source: "research/R3-edge-verification-and-analogues.md:302-309 (pysystemtrade block value, instrument value vol, percentage_vol_target 16); research/R4-alphaxiv/chat-29-G-multi-asset-normalisation.md (turn 1 risk stack; turn 3 capped inverse vol w ~ 1/sigma)"
  kind: sizing rule
  what_it_does: "Size each position so its expected daily P&L swing in account currency equals a set share of capital. The money value of a 1 % move and the instrument's daily volatility convert the target into contracts. chat-29 prefers a capped 1/sigma scaler over 1/sigma^2."
  inputs: [annual volatility target, account capital, instrument value of 1 % move, instrument daily volatility, contract size]
  outputs: [target position in contracts or lots]
  assumptions: ["volatility is a fair risk unit for that instrument", "positions held long enough for daily volatility to matter"]
  levels: [position, unit, portfolio]
  instrument_classes: [futures, fx, index]
  class_notes: "R3 worked number on $500: a 16 % target allows about 0.013 Micro E-mini (rounds to zero) but about 0.01 lot EUR/USD. Lot granularity decides whether the rule can trade a class at all."
  styles_timeframes: "trend and carry, daily; scalpers are better served by stop-based R"
  evidence: idea
  evidence_note: "Practitioner framework docs; no result quoted in the sources."
  known_failures: ["rounds to zero on large contracts at small equity", "R and volatility units agree only when stops are a fixed multiple of volatility"]
  performance_note: "Puts every class on one scale so breadth across classes is usable."
  survival_note: "Equalises routine risk, not tail risk; needs stress caps beside it."
  ledger_ids: [volatility_target, instrument_class, value_per_point, lot_step]
  new_variables: [{name: instrument_money_vol, what: "daily volatility of one lot in account currency"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-157: minimum-size feasibility per class"
    - "A1-sizing-allocation-161: per-class risk unit table"
    - "A1-sizing-allocation-097: factor aggregation on top"

- id: A1-sizing-allocation-012
  name: Time-of-day volatility and cost bucket sizing
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:12-26,67-85 (Andersen-Bollerslev 1997; Multiplicative Component GARCH 2111.02376); research/R4-alphaxiv/R4-alphaxiv-synthesis.md:107-133"
  kind: sizing rule
  what_it_does: "Quantity = fixed dollar risk / (stop loss per unit + cost reserve per unit), then cut when the forecast volatility for the planned hold is high or spreads widen. The forecast = seasonal bucket shape x daily level x short-term clustering. Volatility and cost are estimated separately per instrument and time bucket, since busy can mean deep, wide or fast."
  inputs: [dollar risk budget, stop per unit, cost reserve per unit, seasonal volatility by bucket, daily level, recent clustering, spread by bucket]
  outputs: [quantity, size cut factor]
  assumptions: ["intraday volatility shape repeats across comparable sessions"]
  levels: [trade, unit]
  instrument_classes: [fx, index, metal, energy, crypto, stock]
  class_notes: "FX needs pair-specific zones and DST; crypto has its own cycles (2109.12142, Bitcoin time-of-day); session curves do not transfer between classes."
  styles_timeframes: "intraday 5m to 1h, ORB and session units"
  evidence: idea
  evidence_note: "The volatility models are published and fitted; the sizing rule built on them is the assistant's proposal, untested."
  known_failures: ["24/7 crypto has no session close", "overlapping FX sessions", "retail CFD quotes are broker-specific"]
  performance_note: "Avoids paying wide costs at bad hours; sizes up in calm deep hours."
  survival_note: "Smaller size into scheduled volatility bursts."
  ledger_ids: [session_windows, spread_cost, round_trip_cost_r, session_multiplier]
  new_variables: [{name: vol_bucket_forecast, what: "forecast volatility for the planned hold from the time-of-day model"}, {name: cost_reserve_per_unit, what: "money per lot held back for costs and fast-market slippage"}]
  qmx_layer: [X1, X2]
  link_hints:
    - "A1-sizing-allocation-147: hourly spread and cost windows"
    - "A1-sizing-allocation-024: chat-25 combo 1 time-of-day vol plus volume forecast plus risk-constrained Kelly"
    - "A1-sizing-allocation-069: April session multipliers were this, by hand"


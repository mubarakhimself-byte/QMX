- id: A1-sizing-allocation-105
  name: Fundamental law and effective breadth (IR = TC x IC x sqrt(BR); N_eff)
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:189-210; research/R4-alphaxiv/chat-02-breadth-effective-bets.md:39-49; research/R3-edge-verification-and-analogues.md:55-64"
  kind: measure/telemetry
  what_it_does: "Information ratio grows with skill times the square root of independent bets, cut by a transfer coefficient (realised 0.3-0.8 of the law). With average correlation rho, N_eff = N / (1 + (N - 1) rho) and Sharpe tends to s / sqrt(rho): at 0.05R per trade and rho 0.05 the ceiling is 0.22. Ten units at daily rho 0.3 act like 2.7."
  inputs: [per-bet skill, bet count, average correlation]
  outputs: [effective bets, Sharpe ceiling]
  assumptions: ["equal bets, equal correlation"]
  levels: [portfolio, methodology]
  instrument_classes: [all]
  class_notes: "Correlation that bites is shared exposure: USD pairs on one release, many classes on one risk-off day, or one logic fading everywhere."
  styles_timeframes: "most relevant for scalpers and many-market units"
  evidence: idea
  evidence_note: "Grinold 1989, Clarke et al. 2002; R2 arithmetic."
  known_failures: ["breadth multiplies net edge whatever its sign; negative net edge loses faster", "correlation in the edge itself cannot be diversified"]
  performance_note: "The lever for his 'risk less, do it many times'."
  survival_note: "Shows when ten units are really two or three bets."
  ledger_ids: [effective_independent_bets, unit_result_correlation, live_unit_count, trade_rate]
  new_variables: []
  qmx_layer: [X2, X6]
  link_hints:
    - "A1-sizing-allocation-087: per-unit shares from N and rho"
    - "A1-sizing-allocation-106: better breadth measures"

- id: A1-sizing-allocation-106

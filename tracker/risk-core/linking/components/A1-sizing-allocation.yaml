- id: A1-sizing-allocation-052
  name: Dose-escalation size levels (BOIN, 3+3)
  source: "research/R3-edge-verification-and-analogues.md:172-178 (FDA review of BOIN); expansion/drafts-stopped/X5-edge-verification.md:209-215 (X5-16)"
  kind: sizing rule
  what_it_does: "Size is a level L0 (paper) to Ln, never a free number. Move one level at a time on cohorts of trades: up when the bad-cohort rate at this level is at or below a low bar, down when at or above a high bar, lock out a level that proves dangerous, never skip. For a 30 % target BOIN bars are 0.236 and 0.359; X5 drafts cohorts of 25 trades with a bad cohort at -5R or worse."
  inputs: [current level, cohort results, bad-outcome definition, up and down bars]
  outputs: [next level, locked levels]
  assumptions: ["cohorts are independent enough", "a bad outcome is defined before trading"]
  levels: [unit]
  instrument_classes: [theory]
  class_notes: "Cohort size must scale with trade rate: ORB cohorts of 10, scalper 25 (X5-46)."
  styles_timeframes: "any; slow units step rarely"
  evidence: simulation
  evidence_note: "BOIN operating characteristics are simulated and the FDA found it fit for purpose in real trials; no trading test. X5 arithmetic: a 55 % unit has a bad 25-trade cohort 9.7 % of the time, a no-edge unit 21.4 %."
  known_failures: ["level-to-dollars map is open (X5 collision C4)", "slow for rare traders"]
  performance_note: "Steps up only on live or paper evidence (Numerai rule), so size reaches full for units that earn it."
  survival_note: "One notch down at a time; dangerous levels locked."
  ledger_ids: [size_levels, size_ramp_to_full, grow_back_rule, drift_size_down_step]
  new_variables: [{name: cohort_trades, what: "trades per cohort judged for a level move"}, {name: bad_cohort_r, what: "cohort net R at or below which a cohort counts as bad"}, {name: level_up_bar, what: "bad-cohort rate at or below which the unit steps up"}, {name: level_down_bar, what: "bad-cohort rate at or above which the unit steps down"}]
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-031: X5-30 size = level fraction x risk share"
    - "A1-sizing-allocation-019: X5-31 multiply by t^2/(1+t^2)"
    - "A1-sizing-allocation-057: AIMD growth only on closed evidence"


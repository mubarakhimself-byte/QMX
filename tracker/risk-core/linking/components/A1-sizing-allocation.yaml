  styles_timeframes: "any"
  evidence: author backtest
  evidence_note: "Audited case, PBO 0.586 after selection; three-stage benchmark found no AI method beat the market live (2609.34510)."
  known_failures: ["robust selection lowered drawdown, not return"]
  performance_note: "Honest growth numbers."
  survival_note: "Fragility filter."
  ledger_ids: [cost_stress_multiple, funding_cost, swap_financing_cost, slippage_cost, commission_cost]
  new_variables: []
  qmx_layer: [X1, X2, X5, X6]
  link_hints:
    - "A1-sizing-allocation-023: robust Kelly on post-cost returns"
    - "A1-sizing-allocation-138: gate input"

- id: A1-sizing-allocation-147
  name: Hourly spread and cost windows
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:24,53-63; research/R5-mql5-corpus-ideas.md:150 (MQL5 9804); grounding/G7-unit-inputs-qmb-mis-instruments.md:201-212 (QMB synthetic spread keyed by instrument, hour and session; measured costs by hour planned)"
  kind: cost model
  what_it_does: "Costs move by hour: EUR/USD spreads narrow in London, widen after 16:00-17:00 GMT and peak at 21:00-22:00; HFT spreads widen over 30 % in the minute before news; the fix reversal pays only at half spreads. QMX plans a measured cost profile per instrument by hour from the market journal; QMB has a synthetic spread keyed by instrument, hour and session that refuses when uncalibrated."
  inputs: [recorded bid and ask, fills, hour and session]
  outputs: [cost per instrument per hour]
  assumptions: ["calibrated per world; a demo pass never stands in for live"]
  levels: [trade, unit]
  instrument_classes: [fx, metal, index, crypto]
  class_notes: "FX: rollover 17:00 New York spike; gold: wide spreads at rollover; indices: cash open; crypto: weekends and funding times."
  styles_timeframes: "scalper and session units"
  evidence: idea
  evidence_note: "Published FX spread studies; QMX producer not built."
  known_failures: ["no commission key on the instrument record", "no cost input reaches the sizer (G7)"]
  performance_note: "Trade the cheap hours harder."
  survival_note: "Avoid costly hours."
  ledger_ids: [spread_cost, unit_cost_target, session_windows]
  new_variables: [{name: hourly_cost_profile, what: "measured spread, slippage and fill latency per instrument by hour of week"}]
  qmx_layer: [X1, X2]
  link_hints:
    - "A1-sizing-allocation-070: windows are cost slices"
    - "A1-sizing-allocation-012: time-of-day sizing"

- id: A1-sizing-allocation-148
  name: Carry, swap and funding in the hold and size decision
  source: "research/R5-mql5-corpus-ideas.md:127 (MQL5 22175 md/22175.md:38,664; 23327 md/23327.md:329); research/R3-edge-verification-and-analogues.md:288-296 (Binance funding every 8 h)"
  kind: cost model
  what_it_does: "Put the daily swap in account currency into multi-day hold and size decisions, including the triple-swap day; 'for scalpers swap rates don't really matter'. Perpetual funding every 8 hours at 00:00, 08:00 and 16:00 UTC, amount = notional x rate, paid between traders."

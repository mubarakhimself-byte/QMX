  known_failures: ["co-loss factor rises in stress, exactly when it matters"]
  performance_note: "Children keep full size in normal times."
  survival_note: "Aggregate limit set on joint losses."
  ledger_ids: [portfolio_daily_risk_budget, bms_daily_loss_limit, unit_result_correlation]

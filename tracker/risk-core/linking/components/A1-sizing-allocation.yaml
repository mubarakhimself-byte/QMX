    - "A1-sizing-allocation-010: chat-29 combo vol scaler plus HRP plus cluster caps"

- id: A1-sizing-allocation-094
  name: One correlation-shrinkage knob with a condition-number check (CRISP gamma, Cotton gamma)
  source: "research/R6-alphaxiv-papers/T-01-portfolio-optimisation-and-sizing.md:28-72 (Wuebben 2604.23833; Cotton 2411.05807)"
  kind: allocator
  what_it_does: "Solve Markowitz on P = (1 - gamma) diag(Sigma) + gamma Sigma: gamma 0 is a diagonal rule, 1 full Markowitz. Out-of-sample Sharpe is flat across a wide plateau, so gamma = 0.5 is a robust default; CRISP reached 80-94 % of oracle Sharpe. The condition number kappa = largest / smallest eigenvalue sorts the problem into easy to pathological; fall back to diagonal weights when hard."
  inputs: [covariance, signal vector (all ones for minimum variance), gamma]
  outputs: [weights, kappa diagnostic]
  assumptions: ["synthetic covariance regimes resemble real P&L"]
  levels: [cluster, portfolio]
  instrument_classes: [theory]
  class_notes: "kappa is large where sleeves share a driver (FX pairs on USD, index futures on beta)."
  styles_timeframes: "book level"
  evidence: simulation
  evidence_note: "Monte Carlo only; CRSP backtest listed as open work. R6 read the paper."
  known_failures: ["wrong-sign signal not caught by the diagnostic"]
  performance_note: "Most of the optimiser's gain without its instability."
  survival_note: "Diagonal fallback in pathological cases."
  ledger_ids: [unit_capital_share, unit_result_correlation]
  new_variables: [{name: correlation_shrink_gamma, what: "weight on off-diagonal correlation in the allocator, 0 diagonal to 1 full"}, {name: correlation_condition_number, what: "kappa of the strategy correlation matrix, shown each rebalance"}]
  qmx_layer: [X2, X6]
  link_hints:
    - "A1-sizing-allocation-095: T-01 combo inverse-vol default plus gamma plus kappa"
    - "A1-sizing-allocation-127: R6 combo with co-movement score"

- id: A1-sizing-allocation-095
  name: Simple rules as Bayes-optimal - inverse volatility as the default allocator
  source: "research/R6-alphaxiv-papers/T-01-portfolio-optimisation-and-sizing.md:74-96 (Noguer i Alonso 2606.12612)"
  kind: allocator
  what_it_does: "Proves when each simple rule is exactly max-Sharpe (inverse vol when each Sharpe is proportional to its correlation row sum; risk parity when return contributions are equal). Equal weight is Bayes-optimal when assets cannot be told apart, inverse vol when only vols are known; small assumption errors cost second-order Sharpe. With N/T = q, sample minimum variance is inflated by 1/(1 - q)."
  inputs: [vols, optionally correlations]
  outputs: [weights, Sharpe-loss angle, inflation warning]
  assumptions: ["elliptical returns for some results"]
  levels: [portfolio]
  instrument_classes: [theory]
  class_notes: "Inverse vol needs exchangeable standardised returns; crypto scalpers and bond swing are not exchangeable in the tails."
  styles_timeframes: "book level"
  evidence: idea
  evidence_note: "Proofs only."
  known_failures: ["not universally optimal (HRP caveat)"]
  performance_note: "Default until edge is verified, then tilt."
  survival_note: "Show 1/(1 - q) when live units approach the observation count."
  ledger_ids: [unit_capital_share, live_unit_count]
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-096: tilt only after verification"
    - "A1-sizing-allocation-027: chat-01 combo shrink plus robust Kelly plus HPO"


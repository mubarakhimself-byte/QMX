- id: A1-sizing-allocation-153
  name: Round down to the lot step and skip below the minimum, with a reason
  source: "grounding/G7-unit-inputs-qmb-mis-instruments.md:217-218; research/R4-alphaxiv/chat-29-G-multi-asset-normalisation.md (turn 2 procedure step 6); research/R5-mql5-corpus-ideas.md:21 (MQL5 22684 'floor, then skip'); research/R1-platforms-risk-sizing-extensibility.md:332"
  kind: sizing rule
  what_it_does: "q = sign(q*) x l x floor(|q*| / l); if |q*| < l, place no trade. Never round up to meet a target; recompute portfolio risk, factor exposure, stress loss and margin after rounding and accept unused risk. QMX's branch lots() rounds down and refuses below minimum or above maximum."
  inputs: [continuous quantity, lot step, minimum and maximum lot]
  outputs: [lots or skip reason]
  assumptions: ["below-minimum skips are counted, not hidden"]
  levels: [trade]
  instrument_classes: [all]
  class_notes: "Coarse steps at $500 make many sizes impossible: Micro E-mini rounds to zero where EUR/USD 0.01 lot fits."
  styles_timeframes: "any"
  evidence: old QMX rule
  evidence_note: "Built on a unit-build branch, never live."
  known_failures: ["skips can be most trades on large-contract classes"]
  performance_note: "Small under-use of budget per trade."
  survival_note: "Never more than intended risk."
  ledger_ids: [lot_size, lot_step, min_lot, max_lot, rounding_residue_r]
  new_variables: []
  qmx_layer: [X2]
  link_hints:

- id: A1-sizing-allocation-029
  name: Kelly probation discount on first live trading
  source: "grounding/G3-old-system.md:195-197; grounding/G10-brakes-decay-slots-all-generations.md:304; research/R2-trader-practice-windows-drift-isolation-breadth.md:114"
  kind: sizing rule
  what_it_does: "On first live promotion Kelly is multiplied by about 0.85 until the bot leaves probation; the planned auto-flip to full was 'e.g. N winning sessions, no breaker fires', never set."

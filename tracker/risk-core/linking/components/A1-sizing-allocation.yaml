  evidence_note: "Monte Carlo, n 126-2,016 days, k 10-2,500; author calls it preliminary."
  known_failures: ["not a size or confidence bound", "near-identical variants: count them as one idea instead"]
  performance_note: "Stops the winner's curse from inflating size."
  survival_note: "Lower, more honest edge into sizing."
  ledger_ids: [effective_tries, edge_range, deflated_sharpe_min]

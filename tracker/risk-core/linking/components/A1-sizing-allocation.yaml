- id: A1-sizing-allocation-057
  name: Grow only on closed evidence, cut by severity, restart small after idle (TCP congestion window)
  source: "research/R7-software-patterns-self-configuring.md:48-61 (RFC 5681)"
  kind: control loop
  what_it_does: "A window grows by acknowledged data, halves on a mild loss signal, drops to one segment on a timeout, and restarts small after an idle spell longer than the timeout. Growth is counted in bytes acknowledged, not acknowledgements, so a receiver cannot inflate it by splitting them."
  inputs: [closed evidence, signal severity, idle time]
  outputs: [size window]
  assumptions: ["loss signals are honest feedback"]
  levels: [unit]
  instrument_classes: [none]
  class_notes: "Software analogue; for QMX count evidence in R or money, not trade count, so many tiny trades cannot inflate size (R7 judgment)."
  styles_timeframes: "high-frequency units fit best"
  evidence: live
  evidence_note: "Runs on the internet's transport layer; no trading test."
  known_failures: ["fast multiplicative cut can over-react to one bad trade if the severity map is wrong"]
  performance_note: "Probes upward continuously instead of a fixed size."
  survival_note: "Severe signals reset size at once."
  ledger_ids: [grow_back_rule, drift_size_down_step, size_levels]
  new_variables: [{name: idle_restart_after, what: "idle time after which a unit's size restarts small"}]
  qmx_layer: [X2]

- id: A1-sizing-allocation-038
  name: Pathwise drawdown invariance (exposure = cushion x direction, worst move per class)
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:8-12,27-48 (Hsieh 2609.23272)"
  kind: sizing rule
  what_it_does: "With account value V, peak V_max and limit d_max, an action is safe if worst one-step loss plus costs is no larger than the cushion C = V - (1 - d_max) V_max. Every safe policy is cushion times a normalised direction; the best one beat the best constant-gain policy on SPY and TLT at every drawdown limit."
  inputs: [equity, true high-water mark, drawdown limit, worst one-step move per instrument, cost rates]
  outputs: [allowed exposure each step]
  assumptions: ["return support known (X_min)", "independence for optimality"]
  levels: [unit, portfolio, account]
  instrument_classes: [stock]
  class_notes: "X_min must be set per class and holding time: FX majors small, crypto and single stocks large, index CFDs over weekends large; take it from stress scenarios, not recent volatility."
  styles_timeframes: "any; daily illustration"
  evidence: idea
  evidence_note: "Proofs plus an illustration on SPY and TLT 2015-2026 with 0.5 bp costs."
  known_failures: ["a gap beyond X_min breaks the guarantee", "restart must never reset the true high-water mark"]
  performance_note: "At least as good as any fixed fraction meeting the same limit."
  survival_note: "Hard pathwise drawdown cap if the support holds."
  ledger_ids: [high_water_mark_equity, gap_loss_beyond_stop, equity_drawdown_halt, loss_runway]
  new_variables: [{name: worst_one_step_move, what: "per class and holding time, the largest adverse one-step move the cushion must absorb"}]
  qmx_layer: [X2, X3, X4]
  link_hints:
    - "A1-sizing-allocation-024: T-06 combo hard cap plus probabilistic floor"
    - "A1-sizing-allocation-168: X_min from joint stress scenarios"


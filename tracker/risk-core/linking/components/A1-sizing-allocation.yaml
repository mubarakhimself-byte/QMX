  what_it_does: "Spectral effective rank (participation ratio (sum lambda)^2 / sum lambda^2, entropy rank) describes the return universe; risk-contribution concentration 1 / sum RC_i^2 describes the allocation; diversification ratio sum |w| sigma / sqrt(w' Sigma w); minimum-torsion bets keep the original labels. Publish spectral rank, RC concentration and out-of-sample incremental net performance together; a new strategy that raises the first but not the third broadened the menu, not the edge."
  inputs: [shrunk correlation of net strategy returns, weights]
  outputs: [effective rank, allocation count, DR, incremental performance]
  assumptions: ["returns on the decision horizon, net of cost"]
  levels: [cluster, portfolio]
  instrument_classes: [all]

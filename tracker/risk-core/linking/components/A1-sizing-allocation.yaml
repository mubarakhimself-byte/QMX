  source: "research/R4-alphaxiv/R4-alphaxiv-synthesis.md:202-204 (chat-28); research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:108-110"
  kind: agent role
  what_it_does: "Each agent emits a typed, expiring proposal with risk_scale_proposal clamped to [0, 1]; a deterministic service checks schema, timestamps, sources and instrument mapping, aggregates and applies hard limits, and outputs an approved risk multiplier, never an order. Failure, expiry or loss of the service means no agent-driven change; cap any single unverified item's effect."
  inputs: [agent proposals with valid_until, sources, confidence]
  outputs: [approved risk multiplier]
  assumptions: ["agents never raise risk"]
  levels: [unit, cluster, portfolio]
  instrument_classes: [fx, index, metal, energy, crypto, futures, stock]
  class_notes: "Class-specific envelope fields (pair surprise, contract month, venue, filing number)."
  styles_timeframes: "any; never inside a scalping decision loop"
  evidence: idea
  evidence_note: "Assistant design; fake-news attack paper shows why (62 % success of fabricated information)."
  known_failures: ["many agents reading one feed are one agent"]
  performance_note: "Agent context can only cut size, so gains come from avoided losses."
  survival_note: "Agents cannot add risk."
  ledger_ids: [context_size_modifier, decision_freshness_bound]
  new_variables: [{name: agent_risk_scale, what: "approved multiplier in [0, 1] from validated agent proposals"}]
  qmx_layer: [X2, X7]
  link_hints:
    - "A1-sizing-allocation-122: one more cap with a reason"


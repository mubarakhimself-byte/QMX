- id: A1-sizing-allocation-062
  name: Calibrated-number motion from the unit's own trades (QMX motion engine)
  source: "grounding/G8-unit-chassis-and-extensibility.md:37,53,225-230; grounding/G7-unit-inputs-qmb-mis-instruments.md:244"
  kind: control loop
  what_it_does: "A motion block moves one number from the unit's closed trades, shrunk toward its default, one step at a time, only when flat, after a minimum count, writing a calibration row each time (example: every 20 trades, minimum 20, shrink 100). Only two motion modes compile; a number bound only to the sizer cannot move, so a self-tuning risk_fraction refuses to compile today."
  inputs: [own closed trades, current value, default, range, cadence]
  outputs: [new value, calibration row]
  assumptions: ["the number is stamped by a logic binding"]
  levels: [unit]
  instrument_classes: [fx, metal]
  class_notes: "Per market with a thin market shrunk toward the unit's pooled value (60 trades, k 100, every 20 trades)."
  styles_timeframes: "any"
  evidence: old QMX rule
  evidence_note: "Built on the unit stack; risk numbers cannot use it yet; never run live."
  known_failures: ["scaled, state_table and learned modes refused", "sizer-bound numbers cannot move", "per-market sizer instances lose unit-level memory"]
  performance_note: "The existing self-configuring hook; sizing needs a compiler change to use it."
  survival_note: "One step inside a range per cadence."

# ------------------------------------------------------------------ A. base per-trade sizers

- id: A1-sizing-allocation-001
  name: Fixed fraction of equity at the stop
  source: "grounding/G7-unit-inputs-qmb-mis-instruments.md:218; grounding/G8-unit-chassis-and-extensibility.md:126; research/R1-platforms-risk-sizing-extensibility.md:17,379; MQL5 23583 (fixed fractional model)"
  kind: sizing rule
  what_it_does: "Risk a set share of equity on each trade. Lots = equity x fraction / (|entry - stop| x value per point), rounded down to the lot step; below the minimum lot the trade is skipped with a reason. Size grows and shrinks with equity, so it compounds."
  inputs: [equity (which series is a choice), risk fraction, entry price, stop price, instrument record (value per point, lot step, min and max lot)]
  outputs: [lots, or skip with reason, money at risk]
  assumptions: ["a price stop exists, so 1R is defined", "the stop fills near its price", "the risk fraction has a reason (today it is a placeholder 0.5 %)"]
  levels: [trade, unit]
  instrument_classes: [fx, metal]
  class_notes: "Works in money for every class once value per point is right. FX and gold fixtures only so far. Indices and futures: tick value large, so small equity rounds to zero. Crypto: gaps blow through the stop, so money at risk can exceed the fraction. Stocks: per-share sizing and fractional-share rules decide feasibility."
  styles_timeframes: "any style; the classic retail default for scalper 1m to intraday 15m"
  evidence: old QMX rule
  evidence_note: "Built on a unit-build branch as placeholder fixed-fraction-at-stop@1, never run on a venue. The April system was effectively this at 0.5 %/0.8 % because its caps always bound (G3 section 3)."
  known_failures: ["treats a weak and a strong signal the same (MQL5 21824)", "ignores what else is open, so units stack (21824 concurrency)", "the sizer gets equity only: no open risk, costs, own record or limits (G8 1.4)", "a constant fraction keeps compounding losses during a streak (23583)"]
  performance_note: "Growth comes from compounding on current equity; the fraction is the whole growth dial."
  survival_note: "Bounded per trade if stops hold; unbounded across units that share one account, because each sizes from the whole equity (G9 0.9)."
  ledger_ids: [risk_fraction, sizing_equity_basis, risk_amount_usd, lot_size, stop_distance, value_per_point, lot_step, min_lot, max_lot]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-153: the rounding rule it depends on"
    - "A1-sizing-allocation-130: a budget share would replace whole-account equity"
    - "A1-sizing-allocation-005: keep the policy (how much) apart from lot conversion"
    - "A1-sizing-allocation-142: add costs and stop slippage to the divisor"

- id: A1-sizing-allocation-002
  name: Fixed money risk per trade
  source: "MQL5 23583 (fixed monetary model); MQL5 21372 (md/21372.md:172-188, $1 cap per trade on crypto CFDs); grounding/G8-unit-chassis-and-extensibility.md:161 (dictionary entry fixed-cash-risk-sizing)"
  kind: sizing rule
  what_it_does: "Risk the same dollar amount on every trade, whatever the equity. 21372 uses a $1 cap per trade with the stop rolled in, so a crypto candle that blows through an ATR stop still costs a known sum."
  inputs: [dollar risk per trade, stop distance, value per point]
  outputs: [lots]
  assumptions: ["the dollar figure is set from the account size and goal", "the stop is honoured"]
  levels: [trade, unit]
  instrument_classes: [crypto, fx]
  class_notes: "Suits classes with gap risk (crypto, gold, index CFDs over weekends), because money at risk is capped directly. On futures the fixed sum must cover at least one contract's stop, or the trade is skipped."
  styles_timeframes: "small accounts, scalpers and prop-style accounts"
  evidence: idea
  evidence_note: "21372 part I has no test result; 23583 is a code build without P&L. Dictionary entry has no code."
  known_failures: ["does not compound unless someone re-sets the sum", "a fixed sum is a growing share of equity after losses (anti-compounding in a drawdown is reversed)"]
  performance_note: "Gives up compounding; can be paired with a step-up rule to grow."
  survival_note: "Simple hard cap per trade; good against gaps only if the sum already includes gap loss."
  ledger_ids: [risk_amount_usd, per_trade_cap_by_family]
  new_variables: [{name: fixed_cash_risk_usd, what: "dollar amount a unit risks per trade under a fixed-cash sizer"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-052: dose levels can be fixed cash steps"
    - "A1-sizing-allocation-001: the compounding alternative"

- id: A1-sizing-allocation-003
  name: Portfolio-percent target sizing with cash buffer and minimum-order skip
  source: "research/R1-platforms-risk-sizing-extensibility.md:63-73 (LEAN PortfolioTarget.Percent), :337-343 (Backtrader PercentSizer), :353 (freqtrade stake)"
  kind: sizing rule
  what_it_does: "Size by the share of portfolio value to hold, not by the loss at the stop. LEAN turns a target percent into a quantity, shrinks it by a free-cash buffer, divides by leverage, and silently skips orders below a minimum margin share."
  inputs: [target percent per idea, total portfolio value, free cash buffer, security leverage, minimum order margin share]
  outputs: [quantity in whole lots]
  assumptions: ["risk is roughly proportional to notional", "positions are held long enough that notional matters more than the stop"]
  levels: [position, portfolio]
  instrument_classes: [stock, futures]
  class_notes: "Natural for stocks and ETFs. For FX and CFD scalpers the stop distance, not notional, sets the loss, so this rule mis-sizes them. Equal notional across classes is not equal risk (chat-29)."
  styles_timeframes: "swing and portfolio rebalancing; poor fit for scalpers"
  evidence: idea
  evidence_note: "Shipped platform code (LEAN, Backtrader); no performance claim."
  known_failures: ["the stop never enters the sizing (R1:73)", "silent skip of small orders hides refusals"]
  performance_note: "None by itself; it is a translation layer."
  survival_note: "The cash buffer (0.25 % default in set_holdings) keeps room for gaps."
  ledger_ids: [sizing_equity_basis, leverage, margin_used]
  new_variables: [{name: free_cash_buffer_fraction, what: "share of portfolio value kept out of sizing as a gap reserve"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-001: the stop-based alternative QMX scalpers need"
    - "A1-sizing-allocation-158: margin as its own limit"

- id: A1-sizing-allocation-004
  name: Fixed-risk sizer with commission, currency conversion, hard cap and split entries
  source: "research/R1-platforms-risk-sizing-extensibility.md:328-335 (NautilusTrader calculate_fixed_risk_position_size, crates/risk/src/sizing.rs:39-107)"
  kind: sizing rule
  what_it_does: "Risk money = equity x risk minus one round-trip commission on it. Size = risk money / exchange rate / stop distance in ticks / tick size / multiplier, capped by a hard limit, divided across N planned entries, rounded down to a batch size and capped by the instrument maximum. A zero stop or zero rate returns size 0."
  inputs: [equity, risk fraction, entry, stop, commission rate, exchange rate, hard limit, unit batch size, number of entries]
  outputs: [quantity]
  assumptions: ["commission is known per trade", "exchange rate is current"]
  levels: [trade]
  instrument_classes: [all]
  class_notes: "The exchange-rate and multiplier terms make it class-neutral; slippage and swap are not in it."
  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Open-source engine code read on GitHub; no performance claim."
  known_failures: ["slippage and carry not modelled", "split across entries assumes all entries fire"]
  performance_note: "Costs taken out before sizing stop a scalper from over-sizing on gross edge."
  survival_note: "Hard limit and round-down never exceed intended risk."
  ledger_ids: [risk_amount_usd, commission_cost, value_per_point, lot_step, max_lot, round_trip_cost_r]
  new_variables: [{name: planned_entry_count, what: "number of entries a position's risk is split across"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-142: same idea with slippage added"
    - "A1-sizing-allocation-160: conversion read live"

- id: A1-sizing-allocation-005
  name: Risk policy kept apart from lot conversion
  source: "MQL5 23583 (md/23583.md:40-51, :124, :189-272); research/R1-platforms-risk-sizing-extensibility.md:379"
  kind: config/override pattern
  what_it_does: "Two questions, two parts. A risk model answers 'how much do I lose if the stop is hit' (fixed fraction, fixed money, volatility-scaled, equity-curve scaled). One shared lot converter turns money plus stop distance into a broker-accepted lot, measuring money per point by a profit probe at the minimum lot. The result reports target risk and actual risk after rounding."
  inputs: [risk model choice, model parameters, stop distance, broker probe of money per point]
  outputs: [lots, risk_amount, actual_risk_amount, reason string]
  assumptions: ["broker profit calculation is the truth for money per point"]
  levels: [trade]
  instrument_classes: [fx, metal, index]
  class_notes: "The probe makes it work on any symbol the broker prices, including crosses and CFDs; futures need the exchange multiplier instead."
  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Article code build, no P&L test."
  known_failures: ["NormalizeLots rounds to the nearest step (MathRound), which can round risk up (md/23583.md:197)"]
  performance_note: "Lets new sizing policies be added without touching instrument maths."
  survival_note: "Reporting actual vs target risk makes rounding oversize visible."
  ledger_ids: [risk_amount_usd, rounding_residue_r, value_per_point]
  new_variables: []
  qmx_layer: [X1, X2]
  link_hints:
    - "A1-sizing-allocation-156: the receipt that records the residue"
    - "A1-sizing-allocation-007: menu of policies that plug into it"

- id: A1-sizing-allocation-006
  name: Size cut by count of recent losses (MT5 DecreaseFactor)
  source: "research/R1-platforms-risk-sizing-extensibility.md:168-169 (MQL5 13426, md/13426.md:398-462)"
  kind: sizing rule
  what_it_does: "Start from free margin x MaximumRisk / margin per lot. Count consecutive losing deals for this symbol; if more than one, lot = lot - lot x losses / DecreaseFactor (default 3). Two losses cut size by two thirds; three cut it to zero."
  inputs: [free margin, MaximumRisk, margin per lot, consecutive losses, DecreaseFactor]
  outputs: [lots]
  assumptions: ["loss streaks carry information about the next trade"]
  levels: [trade, unit]
  instrument_classes: [fx]
  class_notes: "Margin-based start is wrong for risk on any class with wide stops; count-based cut must scale with trade rate."
  styles_timeframes: "low-frequency EAs; fires constantly on scalpers"
  evidence: idea
  evidence_note: "MetaQuotes sample code; no test."
  known_failures: ["count rule fires by chance as trade count rises (R2 3.2)", "sizes from margin, not from the stop", "random-walk returns: streak cuts lower expected return (G2 Kaminski-Lo note)"]
  performance_note: "Only helps if losses cluster; test serial correlation first."
  survival_note: "Steep cut limits streak damage."
  ledger_ids: [loss_streak, reverse_house_money_steps]
  new_variables: [{name: decrease_factor, what: "divisor that sets how fast size falls per consecutive loss"}]
  qmx_layer: [X2, X3]
  link_hints:
    - "A1-sizing-allocation-049: April reverse house money is the same idea in tiers"
    - "A1-sizing-allocation-050: loss points count FI cuts by size instead of by count"


  outputs: [weights]
  assumptions: ["clusters are stable enough"]
  levels: [cluster, portfolio]
  instrument_classes: [all]
  class_notes: "HRP's split ignores cross-group covariance (Cotton), which bites for gold vs USD pairs or crypto vs Nasdaq on risk-off days."

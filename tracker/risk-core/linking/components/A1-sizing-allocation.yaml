  known_failures: ["signal-blind, so it can fund a losing sleeve", "clusters shift with the window", "alphas are 'ephemeral' and do not form stable clusters (Kakushadze)"]
  performance_note: "Diversification safeguard rather than return source."
  survival_note: "Caps hidden concentration."
  ledger_ids: [cluster_exposure_cap, unit_capital_share]

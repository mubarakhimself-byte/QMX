# ------------------------------------------------------------------ C. survival-target and cushion sizing

- id: A1-sizing-allocation-036
  name: Floor-touch size bound from the cushion
  source: "grounding/G1-operator-sessions.md:206-219 (15 Oct maths); ledger/variables.yaml (floor_touch_size_bound, cushion_share_per_trade); seeds/SEEDS.md C14"
  kind: sizing rule
  what_it_does: "Chance of touching the floor is about exp(-2 x EV x D / (s^2 x r)), with D the cushion above the floor and r dollars risked. Requiring it to be at most eps gives r <= 2 x EV x D / (s^2 x ln(1/eps)). Size comes from the cushion, EV <= 0 gives size 0, and house money and reverse house money fall out of the maths."
  inputs: [expectancy per trade, result spread, cushion, allowed touch probability eps]
  outputs: [largest dollar risk per trade]
  assumptions: ["independent trades with a stable edge", "Brownian approximation"]
  levels: [unit, cluster, portfolio]
  instrument_classes: [all]
  class_notes: "Gaps and fat tails (crypto, indices over weekends) make the touch chance higher than the formula says."
  styles_timeframes: "any; higher trade rates allow more total growth at the same eps"
  evidence: idea
  evidence_note: "Derived by Claude on 15 Oct; he never gave eps until his 3 Nov 'almost never' (C10)."
  known_failures: ["leans on the edge estimate (A24)", "breaks under correlation across units"]
  performance_note: "Uses the whole cushion the survival target allows; risk rises with the cushion (an accelerator by construction)."
  survival_note: "Ties size directly to how often the floor may be touched."
  ledger_ids: [floor_touch_size_bound, cushion_share_per_trade, floor_touch_tolerance, loss_runway, expectancy_r, result_spread_r]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-024: probabilistic floor in optimisation form"
    - "A1-sizing-allocation-032: floor_odds as the edge point"
    - "A1-sizing-allocation-136: his user-set floor and buffer"

- id: A1-sizing-allocation-037
  name: Cushion-proportional sizing under a floor that rises with the high-water mark
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:249; grounding/G2-unit-plan-risk-state.md:172; research/R4-alphaxiv/chat-23-A-portfolio-level-sizing.md:140 (Grossman-Zhou)"
  kind: sizing rule
  what_it_does: "The optimal policy under a drawdown limit risks in proportion to the cushion above a floor that rises with the high-water mark. It is the principled one-way ratchet: the floor tightens, the size can grow back."

- id: A1-sizing-allocation-086
  name: Parent limit below the sum of its children (RiskMetrics hierarchy)
  source: "research/R1-platforms-risk-sizing-extensibility.md:290-299 (RiskMetrics 1996 section 3.1); expansion/drafts-stopped/X1-template-shape.md:205-211 (X1-21)"
  kind: budget
  what_it_does: "Limits in one risk unit (VaR) at every level; because children rarely lose together, a parent's limit is lower than the sum of its children's ($20MM over groups of $10MM, $12MM and $8MM). X1 draft: aggregate limit = factor x sum of book limits, factor from measured joint losses; children are scaled only when the sum binds."
  inputs: [children's limits, co-loss measure]
  outputs: [parent limit]
  assumptions: ["joint loss behaviour can be measured"]
  levels: [cluster, portfolio]
  instrument_classes: [all]
  class_notes: "One money unit for every class is the point."

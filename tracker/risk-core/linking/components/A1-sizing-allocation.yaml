  outputs: [weights]
  assumptions: ["good calibration means good economics (shown false)"]
  levels: [unit, portfolio]
  instrument_classes: [stock]
  class_notes: "Eight equity and bond ETFs only. Coverage was 0.592 in 2022 and 0.842 later, so per-regime coverage matters in every class."
  styles_timeframes: "daily allocation"
  evidence: author backtest
  evidence_note: "Pre-registered sealed holdout after an LLM agent searched about 200 configurations; R6 read the paper."
  known_failures: ["fast, noisy volatility inputs to a nonlinear sizing map cost growth", "leverage cap bound on 97.7 % of days", "agent search inflated development results"]
  performance_note: "Lesson for growth: feed sizing a slow scale estimate."
  survival_note: "Drawdown control failed its registered criterion."
  ledger_ids: [volatility_target, kelly_multiplier, kelly_cap]
  new_variables: [{name: vol_estimate_half_life, what: "how slowly the scale estimate feeding a sizer adapts"}]
  qmx_layer: [X2, X5]

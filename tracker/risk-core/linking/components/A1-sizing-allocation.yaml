# ------------------------------------------------------------------ I. costs and cost windows

- id: A1-sizing-allocation-138
  name: Edge-to-cost admission gate and a cost-aware no-trade filter
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:129-140; research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:7-77 (Mesfin 2605.04004; Bysik-Slepaczuk 2606.00060)"
  kind: gate/test
  what_it_does: "Admit a scalper only if the lower confidence bound of gross edge is at least 2x stressed round-trip cost (3x for negative skew or thin live evidence), gross edge measured mid-to-mid on all signals, cost from fills against contemporaneous mids plus fees and funding, recomputed in rolling session-aware windows. Live: change position only if |forecast| > 2 x cost x |position change|; on hourly BTC this cut trades from 10,619 to 251 and turned -64 % a year into +65 %. On MNQ 11 of 14 retail 5-minute families had gross edge 0.07-1.5 points under a 2-point friction floor."
  inputs: [gross edge per signal, stressed round-trip cost per instrument, venue, order type, session]
  outputs: [admit or refuse, trade or skip]
  assumptions: ["cost measured in the instrument's own units"]
  levels: [trade, unit]
  instrument_classes: [futures, crypto, index]
  class_notes: "Crypto fees bind on tight books; FX and CFDs the spread binds; micro futures the fixed commission (MNQ 2 points = $4, MGC 0.5 points). FX majors' small hourly moves mean the same filter blocks almost everything."
  styles_timeframes: "scalper 1m-5m, intraday"
  evidence: author backtest
  evidence_note: "MNQ walk-forward falsification and BTC walk-forward with bootstrap and Holm correction (R6 read both); the 2x/3x ratio is the assistant's proposal."
  known_failures: ["best cost-aware BTC strategy did not beat buy-and-hold after Holm", "an earlier MNQ draft charged gold the index point cost ($20 instead of $5): units matter"]
  performance_note: "The edge that survives trades rarely and holds longer."
  survival_note: "Stops a negative net edge being multiplied by breadth."
  ledger_ids: [viability_cost_fraction_max, round_trip_cost_r, unit_cost_target, cost_stress_multiple, expectancy_floor_r]
  new_variables: [{name: edge_to_cost_ratio_min, what: "smallest gross edge / stressed round-trip cost a unit must show to trade"}]
  qmx_layer: [X1, X2, X5]
  link_hints:
    - "A1-sizing-allocation-141: cost cushion as a demotion number"
    - "A1-sizing-allocation-144: measured cost source"
    - "A1-sizing-allocation-140: April and July versions"

- id: A1-sizing-allocation-139
  name: Break-even win rate after costs
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:33-41; grounding/G1-operator-sessions.md:207-212"
  kind: cost model
  what_it_does: "p_BE = (S + C) / (T + S) for stop S, target T and round-trip cost C, a floor that ignores gaps and partial fills. October form: EV = p W - (1 - p) L - c, p* = (L + c) / (W + L); at W = 0.5R, L = 1R, c = 0.08R, p* = 72 %, so a 78 % scalper has EV about 0.09R and at 73 % the edge is gone."
  inputs: [stop, target, round-trip cost, win rate]
  outputs: [break-even win rate, EV]
  assumptions: ["fixed stop and target"]
  levels: [trade, unit]
  instrument_classes: [all]
  class_notes: "Costs in R grow as the stop shrinks, so short timeframes pay more per R."
  styles_timeframes: "scalpers most sensitive"
  evidence: idea
  evidence_note: "Arithmetic."
  known_failures: ["FI cuts change W and L; the formula needs real exit sizes"]
  performance_note: "Shows how little margin a high-win scalper has."
  survival_note: "EV <= 0 means size 0."
  ledger_ids: [breakeven_win_rate, round_trip_cost_r, win_rate, average_win_r, mean_loss_r]
  new_variables: []
  qmx_layer: [X0, X2]
  link_hints:
    - "A1-sizing-allocation-036: EV feeds the floor bound"

- id: A1-sizing-allocation-140
  name: Fee gate on net payoff and a viability cost share (April 1.1, July 0.10)
  source: "grounding/G3-old-system.md:58-62; grounding/G4-current-book-bms.md:102,126-127; grounding/G1-operator-sessions.md:139"
  kind: gate/test
  what_it_does: "April: net R:R = average win after fees / average loss after fees; block below 1.1 (old code used a weaker 'fees >= average win'). July FORM-0007: round-trip cost / expected edge <= 0.10. Both dropped in the September docs."
  inputs: [average win and loss after fees, round-trip cost, expected edge]
  outputs: [trade or block]
  assumptions: ["costs measured"]
  levels: [unit]
  instrument_classes: [fx]
  class_notes: "None."
  styles_timeframes: "scalpers"
  evidence: old QMX rule
  evidence_note: "Never ran; July run 01 with the viability door on never traded."
  known_failures: ["the 1.1 R:R gate blocks typical scalpers (70 % win at RR 0.6 never trades)", "0.10 is strict enough to block everything in run 01"]
  performance_note: "Wrong thresholds kill the book."
  survival_note: "Keeps fee-dominated units out."
  ledger_ids: [min_net_rr_gate, viability_cost_fraction_max, payoff_ratio]
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-138: ratio on gross edge instead"

- id: A1-sizing-allocation-141
  name: Cost cushion and retention
  source: "research/R5-mql5-corpus-ideas.md:152 (MQL5 23299, md/23299.md:74-82,594-606), :542 (combo 7)"
  kind: measure/telemetry
  what_it_does: "Break-even cost per deal = average edge; cushion = net profit / total assumed cost; retention = 1 - 1 / cushion. Example: PF 1.56, cushion 2.49, 40 % of profit lost to realistic costs; below 3.0 is flagged. Combined with p95 slippage and spread percentiles, measured costs feed each unit's cushion, and a cushion under a set multiple demotes it."
  inputs: [net profit, total costs]
  outputs: [cushion, retention]
  assumptions: ["slippage is not constant"]
  levels: [unit]
  instrument_classes: [fx]
  class_notes: "Same maths for any class once costs are in money."
  styles_timeframes: "scalpers"
  evidence: simulation
  evidence_note: "Sample deals."
  known_failures: ["assumed costs, not measured"]
  performance_note: "Shows how much growth costs eat."
  survival_note: "Early demotion signal."
  ledger_ids: [cost_drift_multiple, round_trip_cost_r, unit_cost_target]
  new_variables: [{name: cost_cushion_min, what: "net profit over total cost below which a unit is flagged"}]
  qmx_layer: [X3, X5, X6]
  link_hints:
    - "A1-sizing-allocation-144: measured inputs"

- id: A1-sizing-allocation-142
  name: Size bound that includes costs and stop slippage
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:24-31; research/R4-alphaxiv/chat-27-E-microstructure.md:30-38; research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:16-24; grounding/G11-ledger-exposure-exits-observability.md (cost / stop distance carries timeframe)"
  kind: sizing rule
  what_it_does: "Q <= R / (D x V + C + S): risk budget over stop distance times value per unit plus round-trip cost plus stop slippage, using the larger of expected and stressed costs. Set the stop from the thesis, then shrink or reject if spread and slippage are large against it; never round up to a minimum lot."
  inputs: [risk budget, stop distance, value per unit, round-trip cost, stressed stop slippage]
  outputs: [quantity]
  assumptions: ["costs per unit known"]
  levels: [trade]
  instrument_classes: [all]
  class_notes: "A shorter timeframe means a smaller stop, so the same cost weighs more; the timeframe enters sizing through cost / stop."
  styles_timeframes: "scalper and intraday"
  evidence: idea
  evidence_note: "Assistant formula."
  known_failures: ["cost estimate needs long ledgers (Eisler-Muhle-Karbe)"]
  performance_note: "No over-sizing on gross edge."
  survival_note: "Money at risk includes cost and slippage."
  ledger_ids: [risk_amount_usd, stop_distance, value_per_point, round_trip_cost_r, slippage_cost, spread_cost, commission_cost]
  new_variables: [{name: stressed_stop_slippage, what: "money per lot assumed lost beyond the stop under stressed fills"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-001: adds costs to its divisor"
    - "A1-sizing-allocation-012: cost reserve by time bucket"

- id: A1-sizing-allocation-143
  name: Execution cost decomposition from fills, and latency discretion
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:94-127 (Cartea et al. 2021; Eisler-Muhle-Karbe 2405.18936; Ma-Saggese-Smith 2504.00846)"
  kind: cost model
  what_it_does: "Split execution cost into a linear spread-crossing part and a size-related impact part from fills and the mid path; even 1,000 orders leave the naive linear estimate weak. For marketable limit orders, choose how far the order may walk the book (discretion) by trading extra cost against the penalty of a missed order, from measured in-flight book changes."
  inputs: [fill prices, mid path, order timing, decision and arrival timestamps]
  outputs: [cost decomposition, price tolerance]
  assumptions: ["exchange-style mid exists"]
  levels: [trade, account]
  instrument_classes: [futures, crypto, fx]
  class_notes: "Retail CFDs have no central book; last-look and requotes must be in measured outcomes; crypto books are per venue."
  styles_timeframes: "scalpers"
  evidence: idea
  evidence_note: "Published models; no retail-account test."
  known_failures: ["models fitted in calm misprice news and rollover"]
  performance_note: "Real costs, not assumed, feed the gate."
  survival_note: "Shows when fills are toxic."
  ledger_ids: [slippage_cost, spread_cost]
  new_variables: []
  qmx_layer: [X1, X6]
  link_hints:
    - "A1-sizing-allocation-144: per-broker cost record"

- id: A1-sizing-allocation-144
  name: Per-broker execution quality with p95 and slippage asymmetry; spread against its own histogram
  source: "research/R5-mql5-corpus-ideas.md:149,151 (MQL5 22998 md/22998.md:44-91; 23355 md/23355.md:40-54,1103-1115)"
  kind: cost model
  what_it_does: "Measure slippage, observed spread, requotes and the asymmetry between entry and exit slippage, keeping every sample for median and p95; it measures the whole path (PC, VPS, network, broker). Judge the live spread against the instrument's own rolling histogram with two percentile thresholds; two window lengths separate a spike from drift. A 5-pip edge keeps 4 at 1 pip of spread and nothing at 5."
  inputs: [probe and passive fills, spread samples]
  outputs: [median and p95 costs per symbol and broker, spread percentile]
  assumptions: ["probe trades available on demo or live"]
  levels: [trade, account, node]
  instrument_classes: [fx, metal]
  class_notes: "Execution mode differs by broker; recalibrate on broker change."
  styles_timeframes: "scalpers"
  evidence: idea
  evidence_note: "22998 demo probes; 23355 mechanism check."
  known_failures: ["cannot tell a lasting shift from a spike with one window"]
  performance_note: "Sizing on real p95 costs instead of means."
  survival_note: "Catches broker degradation in tens of trades."
  ledger_ids: [slippage_cost, spread_cost, spread_cost_guard, sqs_score, cost_drift_multiple]
  new_variables: [{name: slippage_asymmetry, what: "exit slippage minus entry slippage per symbol and broker"}]
  qmx_layer: [X3, X6]
  link_hints:
    - "A1-sizing-allocation-141: R5 combo 7 live cost monitor"


# ------------------------------------------------------------------ B. Kelly and the uncertain edge

- id: A1-sizing-allocation-017
  name: Kelly from the unit's own record, zero below break-even
  source: "research/R1-platforms-risk-sizing-extensibility.md:200 (MQL5 24147, md/24147.md:93-110,214-241); grounding/G3-old-system.md:64-69 (April raw Kelly)"
  kind: sizing rule
  what_it_does: "Measure win rate and payoff from the unit's own closed trades and compute Kelly = ((payoff + 1) x win rate - 1) / payoff; return 0 when the edge is below break-even. In 24147's simulation full Kelly halves the account in 11 % of runs, half Kelly in about 2 % while keeping about 85 % of growth."
  inputs: [win rate after fees, payoff ratio after fees, closed-trade count]
  outputs: [raw Kelly fraction]
  assumptions: ["the record is long enough to estimate the edge", "trades are independent", "results measured after fees"]
  levels: [unit]
  instrument_classes: [fx]
  class_notes: "Record must be per market or pooled with shrinkage; FX record pooled across pairs shares USD exposure."
  styles_timeframes: "any; scalpers reach a sample fastest"
  evidence: simulation
  evidence_note: "24147 Monte Carlo with an assumed edge. April vault formula (old QMX rule, code lost, cap always bound)."
  known_failures: ["'your edge is an estimate' (24147)", "half-Kelly on a 7-14 day paper sample is 15-30x the old caps (G3 section 3)", "winners cut short overstate payoff (G3 4.9)"]
  performance_note: "Growth-optimal if the edge is right."
  survival_note: "Full Kelly at a 40 % kill line touches it about 60 % of the time (G2 section 5)."
  ledger_ids: [kelly_fraction_raw, win_rate, payoff_ratio, expectancy_r, average_win_r, mean_loss_r]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-018: fraction it"
    - "A1-sizing-allocation-027: shrink the input first"

- id: A1-sizing-allocation-018
  name: Fractional Kelly
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:230; grounding/G2-unit-plan-risk-state.md:153-166; research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:84-93 (MacLean-Thorp-Ziemba); research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:146-163 (Uhrin 2107.08827)"
  kind: sizing rule
  what_it_does: "Bet c x Kelly with c below 1. Half Kelly keeps about 75 % of growth. Chance of ever falling to a share a of bankroll is a^(2/c - 1): at a 40 % kill line, full 60 %, half 22 %, quarter 2.8 %. In the sports-betting review fractional Kelly was the strong simple choice; plain Kelly ruined every run with no real edge."
  inputs: [raw Kelly, fraction c]
  outputs: [risk fraction]
  assumptions: ["edge known (the formula assumes it)"]
  levels: [unit]
  instrument_classes: [all]
  class_notes: "The papers give no per-class fraction (chat-01 turn 3)."
  styles_timeframes: "any"
  evidence: author backtest
  evidence_note: "Uhrin et al. tested on 2,700 races, 16,000 NBA and 32,000 football games with 1,000 reshuffles; ruin maths is closed form."
  known_failures: ["does not fix selection bias or tell if the edge is positive (chat-01)", "Metel: half Kelly was below plug-in Kelly on growth in all 4 settings when the model is roughly right (T-05)", "at half the true edge full Kelly grows nothing (G2)"]
  performance_note: "Most growth for a modest fraction; G2 sim: 2.5 % (quarter Kelly) 2.99x median in 500 trades vs 12.2x at full."
  survival_note: "The fraction is 'the final brake, not the uncertainty estimator' (chat-01)."
  ledger_ids: [kelly_multiplier, kelly_fraction_raw, floor_touch_tolerance]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-024: replace the arbitrary fraction with a floor-probability constraint"
    - "A1-sizing-allocation-171: pick c by survival-first, then median wealth"

- id: A1-sizing-allocation-019
  name: Shrunk Kelly by the edge's t-statistic
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:231; grounding/G2-unit-plan-risk-state.md:153; expansion/drafts-stopped/X5-edge-verification.md:334-338"
  kind: sizing rule
  what_it_does: "Multiply Kelly (or a size level) by t^2 / (1 + t^2), t being the edge's t-statistic so far. 0.05R over 300 trades (t = 0.87) gives 0.43; over 3,000 trades 0.88. Size grows only as proof accumulates and never reaches full without trades."
  inputs: [edge estimate, standard error or t-statistic]
  outputs: [shrink factor]
  assumptions: ["trades independent", "t computed on net R"]
  levels: [unit]
  instrument_classes: [all]
  class_notes: "Thin-sample classes (daily stock units) stay small for a long time."
  styles_timeframes: "high-frequency units gain size fastest"
  evidence: idea
  evidence_note: "Derived in research 05; arithmetic only."
  known_failures: ["ignores selection across many tries", "serial correlation overstates t"]
  performance_note: "Size follows evidence, a dial between 'lean on edge' and 'ignore edge'."
  survival_note: "Small until proven."
  ledger_ids: [kelly_shrink_factor, edge_t_statistic]
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-052: multiplies a dose level in X5-31"
    - "A1-sizing-allocation-027: deflate for tries first"

- id: A1-sizing-allocation-020
  name: Bayesian Kelly (posterior-mean edge, sceptical prior)
  source: "research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:55-82 (Browne-Whitt 1996); research/R2-trader-practice-windows-drift-isolation-breadth.md:232; research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md (section 1 distinction)"
  kind: sizing rule
  what_it_does: "Bet Kelly on the posterior mean of the edge, updating as trades arrive. For a binary bet posterior uncertainty alone adds no haircut, because log wealth is linear in p; only a sceptical prior shrinks the size."
  inputs: [prior on edge, closed trades]
  outputs: [Kelly on posterior mean]
  assumptions: ["the prior is chosen, not neutral"]
  levels: [unit]
  instrument_classes: [theory]
  class_notes: "Prior can be per class or family (crypto heavier shrink per chat-01)."
  styles_timeframes: "any"
  evidence: idea
  evidence_note: "Theory; no market test in the sources."
  known_failures: ["no conservatism without a sceptical prior", "learning cost real but computed only in theory"]
  performance_note: "Size grows as evidence builds."
  survival_note: "Only as safe as the prior."
  ledger_ids: [kelly_fraction_raw, edge_range]
  new_variables: [{name: edge_prior_mean, what: "prior mean edge in R for a unit family before its own trades"}]
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-028: the prior can be the family estimate"

- id: A1-sizing-allocation-021
  name: Lower-confidence-bound Kelly
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:233,237; research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:95-121"
  kind: sizing rule
  what_it_does: "Size on mu_L = mu_hat - z x SE, f = max(mu_L, 0) / sigma_U^2. At 0.05R per trade it gives zero size until about 1,100 trades and 0.40 of point Kelly at 3,000."
  inputs: [edge estimate, standard error, confidence z, conservative variance]
  outputs: [risk fraction, often zero]
  assumptions: ["fixed-time inference; repeated looks need anytime-valid bounds"]
  levels: [unit]
  instrument_classes: [theory]
  class_notes: "Sparse classes stay at zero longest."
  styles_timeframes: "only high-frequency units ever leave zero"
  evidence: idea
  evidence_note: "Illustrative formula; no fund source found (R2)."
  known_failures: ["strictest form of leaning on the edge; a thin-edge scalper gets no size for months (R2 4.4)", "a bound on mean edge is not a bound on the next trade (chat-01)"]
  performance_note: "Low; better used as a gate than as the amount (R2, X5-03)."
  survival_note: "Very safe; risks the 'sitting duck' failure."
  ledger_ids: [edge_range, edge_t_statistic, kelly_cap]
  new_variables: []
  qmx_layer: [X2, X5]
  link_hints:
    - "A1-sizing-allocation-031: use the low end as the gate, risk share as the amount"

- id: A1-sizing-allocation-022
  name: Uncertainty-integrated Kelly with a mild chance constraint, and an estimated haircut
  source: "research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:73-90 (Metel 1701.02814); research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:42-44 (Baker-McHale 2013)"
  kind: sizing rule
  what_it_does: "Average Kelly over parameter uncertainty (Monte Carlo over the fitted model) or add a chance constraint on expected log wealth. Metel: true probabilities 27.46, plug-in 18.13, half Kelly 13.27, averaged 18.47, chance-constrained alpha 0.4 best at 18.48; strong constraints over-damp. Baker-McHale estimate the haircut from the uncertainty instead of assuming half."
  inputs: [model parameters and covariance, payoffs, constraint level]
  outputs: [stakes]
  assumptions: ["the probability model is right in shape"]
  levels: [unit]
  instrument_classes: [theory]
  class_notes: "Discrete fixed-odds outcomes; a scalper's continuous P&L needs another model."
  styles_timeframes: "any"
  evidence: simulation
  evidence_note: "2,500 simulated races in 4 settings (R6 read the paper)."
  known_failures: ["estimation error alone costs about a third of growth", "no selection correction"]
  performance_note: "Never worse than plug-in in Metel's runs; keeps growth half Kelly gives away."
  survival_note: "Weak conservatism; QMX's 'edge likely overestimated' case favours a fraction for survival."
  ledger_ids: [kelly_shrink_factor, kelly_fraction_raw]
  new_variables: []
  qmx_layer: [X2]
  link_hints:
    - "A1-sizing-allocation-025: T-05 combo Metel averaging plus slow volatility"

- id: A1-sizing-allocation-023
  name: Distributionally robust Kelly
  source: "research/R4-alphaxiv/chat-01-sizing-uncertain-edge.md:208-227 (Sun-Boyd 1812.10371); research/R6-alphaxiv-papers/T-05-sizing-uncertain-edge-and-breadth.md:113-125"
  kind: allocator
  what_it_does: "Choose bets that maximise the worst expected log growth over a set of plausible distributions (box, ellipsoid, divergence, Wasserstein, moment sets). Returns a full allocation including cash; holds cash when the edge is weak against the set."

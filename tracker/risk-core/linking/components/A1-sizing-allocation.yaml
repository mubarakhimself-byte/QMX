  instrument_classes: [theory]
  class_notes: "One set per class: wider for crypto, narrower for FX majors (T-05)."
  styles_timeframes: "book level"
  evidence: idea
  evidence_note: "Theory and a 20-horse example; in Uhrin's review robust Kelly was safest but grew least."
  known_failures: ["set too narrow gives false comfort, too wide kills risk taking", "no selection correction"]
  performance_note: "Lowest growth of the Kelly family in practice."
  survival_note: "Best worst case if the set is right."
  ledger_ids: [kelly_fraction_raw, unit_capital_share]

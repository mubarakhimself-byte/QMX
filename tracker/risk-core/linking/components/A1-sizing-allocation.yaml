- id: A1-sizing-allocation-014
  name: Stress-percentile size cut from spread, activity and session regime
  source: "research/R5-mql5-corpus-ideas.md:146 (MQL5 22938 action table, md/22938.md:484-494), :81 (24742 quote durations), :125 (22940 regime labels), :549-561 (combo 12)"
  kind: sizing rule
  what_it_does: "Cut size when the spread is above its 75th percentile and 'materially' above the 90th; feed an activity gauge (waits between quotes) and a session regime label ('Stressed' checked first, 1.8x normal volatility) into the same multiplier. Thresholds are refit per instrument."
  inputs: [spread percentile, quote duration model, session regime label]
  outputs: [size multiplier]

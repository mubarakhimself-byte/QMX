# ---------------------------------------------------------------- PART 6: exits and stops, and how they change sizing and brake counting

- id: A2-brakes-drift-exits-230
  name: "Fixed versus volatility-scaled (ATR) stop, with a cap"
  source: "research/R4-alphaxiv/chat-13-stops-and-exits.md:27; research/R5-mql5-corpus-ideas.md:193 (23597)"
  kind: exit/stop
  what_it_does: "A fixed price or percent stop is auditable but its risk varies with volatility: too tight in a wild session, too wide in a quiet one. An ATR stop follows recent range but lags a sudden jump. Use a causal volatility estimate, cap the distance so a large ATR cannot silently become a large loss, and compare fixed vs ATR out of sample by instrument and regime after costs."
  inputs: ["ATR or volatility estimate", "cap"]
  outputs: ["stop distance"]
  assumptions: ["volatility persistent over the hold"]
  levels: [trade]
  instrument_classes: ["generic (assistant); FX in 23597"]
  class_notes: "One ATR multiple fails in different ways on gold and GBPUSD; express FX and index stops in ATR or spread multiples, never pips across classes."
  styles_timeframes: "all"
  evidence: "idea (assistant advice); author backtest in MQL5 articles"
  known_failures: ["backward-looking ATR lags jumps"]
  performance_note: "Size adapts through risk budget / stop distance."
  survival_note: "Cap prevents oversized losses in volatile spells."
  ledger_ids: [stop_distance, stop_buffer, risk_fraction]
  new_variables:
    - {name: stop_atr_multiple, note: "stop distance in ATR units, with a cap"}
  qmx_layer: [X1, X3]
  link_hints:
    - "A2-brakes-drift-exits-243: per-instrument signature"
    - "A2-brakes-drift-exits-250: size from realized loss, not nominal stop"

- id: A2-brakes-drift-exits-231
  name: "Trailing stop as an optimal-stopping problem; suboptimal under positive drift"
  source: "research/R6-alphaxiv-papers/T-10-stops-exits-fast-invalidation.md:47-59 (1701.03960); research/R4-alphaxiv/chat-13-stops-and-exits.md:19,29,88-98"
  kind: exit/stop
  what_it_does: "Model the trailing stop as a floor f(running max); solve when to sell voluntarily and when an extra upper target pays. As volatility rises the optimal sell level rises and the buy level falls; the trailing stop changes the best entry, so tune entry and exit together. Under positive-drift GBM a trailing stop is not optimal (also Glynn-Iglehart 1995). Trailing protects gains for 'stay in while it persists' edges but gives back open profit and cuts mean reversion short."
  inputs: ["price dynamics model", "trailing floor function"]
  outputs: ["optimal liquidation level", "entry region"]
  assumptions: ["continuous diffusion, no gaps"]
  levels: [trade]
  instrument_classes: ["theory (exponential OU example)"]
  class_notes: "Most relevant to mean-reverting instruments (spreads, some FX crosses); trailing triggers do not guarantee fills on jumps."
  styles_timeframes: "trend and breakout; harmful for mean reversion"
  evidence: "simulation (theory and numerical example)"
  known_failures: ["jumps and changing drift", "fitted to one regime, holds through reversals"]
  performance_note: "Can raise capture on trends; can give back gains."
  survival_note: "Locks part of open profit."
  ledger_ids: [trailing_stop_setting, giveback_fraction]
  new_variables: []
  qmx_layer: [X1, X3]
  link_hints:
    - "A2-brakes-drift-exits-244: trail type chosen by why the trade was opened"
    - "A2-brakes-drift-exits-265: trend state picks the exit"

- id: A2-brakes-drift-exits-232
  name: "Optimal mean-reversion entry and exit with stop-loss and costs (OU)"
  source: "research/R4-alphaxiv/chat-13-stops-and-exits.md:18,76-86,157 (1411.5062)"
  kind: exit/stop
  what_it_does: "Treat a spread as Ornstein-Uhlenbeck; solve the best liquidation level with costs, add a lower stop that forces liquidation before the target, and solve entry given the exit policy. Raising the stop level lowers the optimal take-profit: a tighter stop makes waiting for a distant target less attractive. Follow-ons: signature-based timing (2309.16008), stop-loss and leverage in energy (1706.07021)."
  inputs: ["long-run mean", "reversion speed", "volatility", "stop level", "costs"]
  outputs: ["take-profit boundary", "entry interval"]
  assumptions: ["OU dynamics hold"]
  levels: [trade]
  instrument_classes: ["ETF spreads (illustration)"]
  class_notes: "Pairs and spreads; FX crosses; gold OU half-life about 8 hours is too slow for 5-minute scalps (2605.04004)."
  styles_timeframes: "mean reversion"
  evidence: "simulation (analytical; no out-of-sample P&L)"
  known_failures: ["spread stops reverting; equilibrium moves; stop fills past level", "unstable reversion speed on small samples"]
  performance_note: "Coherent entry, target and stop."
  survival_note: "Stop where the thesis is no longer credible."
  ledger_ids: [target_r, stop_distance]
  new_variables: []
  qmx_layer: [X1, X3]
  link_hints:
    - "A2-brakes-drift-exits-233: half-life time exit"
    - "A2-brakes-drift-exits-242: OU fitted on trade P&L"


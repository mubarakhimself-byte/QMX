  levels: [unit]
  instrument_classes: ["FX (MT5)"]
  class_notes: "Generic."
  styles_timeframes: "all"
  evidence: "author backtest (out-of-sample, with nulls)"
  known_failures: ["arms that trade less see more signals"]
  performance_note: "Honest brake reports."
  survival_note: "Avoids trusting a brake that never bites."
  ledger_ids: [exit_reason_code, brake_precision]

  kind: gate/test
  what_it_does: "Raise the bar by the luck of the best of N tries (the best of 10 pure-luck tries sits about 1.57 standard errors up, of 100 about 2.53). In 24150 the best of 56 XAUUSD backtests scored 98.5% alone and 90.6% once all variants were counted. B13 records effective tries by clustering result streams. Missing the bar is not proof of no edge."
  inputs: ["candidate Sharpe", "effective tries", "spread of Sharpes across tries", "skew and kurtosis"]

- id: A2-brakes-drift-exits-152
  name: "Multi-stream e-detectors with e-BH / e-Bonferroni and error over patience"
  source: "research/R6-alphaxiv-papers/T-08-live-alpha-decay-detection.md:8-13,25-47 (2501.04130); research/R4-alphaxiv/chat-10-alpha-decay-live.md:245-259"
  kind: detector
  what_it_does: "One e-detector per live strategy; combine with e-BH (flag the k largest if M_[k] >= K/(k alpha)) for a review list and e-Bonferroni (M >= K/beta) for demotion. Any monitor with finite average run length is 100% wrong at its first alarm under 'nothing changed', so control error over patience: FDR(stop) <= alpha x E[stop]; to target FDR q over horizon H, set alpha = q/H. Each stream's evidence must stay valid given all streams' information."
  inputs: ["per-stream e-detectors", "monitoring time"]
  outputs: ["changed streams", "patience logged next to each alarm"]
  assumptions: ["global-filtration validity"]
  levels: [unit, portfolio]
  instrument_classes: ["simulated streams"]
  class_notes: "Units sharing a driver (USD, BTC) share information; asynchronous sessions complicate it."
  styles_timeframes: "all"
  evidence: "simulation (plus proofs)"
  known_failures: ["naive per-stream thresholds push FDR and FWER near 1 in long runs", "no power or delay guarantees"]
  performance_note: "Alarms grow with monitoring time; size the review workload to it."
  survival_note: "System-level false-alarm accounting."
  ledger_ids: [sequential_evidence_pass, drift_state]
  new_variables:
    - {name: decay_alpha_per_patience, note: "alpha divided by monitoring horizon for error-over-patience control"}
  qmx_layer: [X3, X5, X6]
  link_hints:

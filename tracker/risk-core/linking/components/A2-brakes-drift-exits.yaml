  what_it_does: "Units running one logic pool paper and level-1 trades to prove 'this logic has an edge in this context'; each cell estimate is shrunk toward the family: w x cell + (1 - w) x family, w = n/(n + k). Ten units at 4 trades a day reach 610 trades in about 15 days instead of 153, but correlated units count as N/(1 + (N-1) rho): ten at rho 0.3 prove like 2.7 units (about 57 days). A new unit correlating above a cap adds tries, not breadth."

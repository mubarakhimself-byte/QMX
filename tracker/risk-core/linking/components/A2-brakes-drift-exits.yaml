- id: A2-brakes-drift-exits-188
  name: "Pooled proof of a shared claim across a logic family, discounted for correlation"
  source: "research/R3-edge-verification-and-analogues.md:62-64; research/R2-trader-practice-windows-drift-isolation-breadth.md:197-210; expansion/drafts-stopped/X5-edge-verification.md:167-185,381-387"

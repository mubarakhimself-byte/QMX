- id: A2-brakes-drift-exits-016
  name: "Four-state brake with hysteresis, minimum hold and staged recovery (dual timescale)"
  source: "research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:76-95 (SwingGuard, https://www.alphaxiv.org/abs/2610.12988)"
  kind: brake
  what_it_does: "A fast deterministic risk loop (5-minute) runs apart from slow daily agents: a rule screen, then a 6-hour accumulation check, then an LLM diagnosis only if triggered. It keeps a persistent state NORMAL / ALERT / SURVIVAL / RECOVERY with hysteresis, minimum holds and staged re-entry: ALERT compresses exposure, SURVIVAL forces zero, RECOVERY restores in steps. The current risk state is fed into the agents' proposals."
  inputs: ["5-minute bars", "rule triggers", "accumulated stress", "state history"]
  outputs: ["risk state", "exposure cap"]
  assumptions: ["the fast loop has the authority, agents only propose"]
  levels: [unit, portfolio]
  instrument_classes: [crypto]
  class_notes: "BTC and ETH only; the dual-timescale idea is generic; each class needs its own accumulation window."
  styles_timeframes: "swing (daily decisions with 5-minute risk loop)"
  evidence: "author backtest"
  known_failures: ["six months, two coins, one GPT-4o setup, long only, no trial count"]
  performance_note: "Joint portfolio Sharpe 2.98, drawdown 6.44% vs buy-and-hold 1.19 / 28.47%; removing the 5-minute controller dropped Sharpe to 1.87 and drawdown to -14.19%."
  survival_note: "No instant re-entry after one quiet bar."
  ledger_ids: [drift_state, grow_back_rule, brake_state]
  new_variables:

- id: A2-brakes-drift-exits-155
  name: "Bounded betting e-process against a minimum viable edge"
  source: "research/R4-alphaxiv/chat-10-alpha-decay-live.md:49-70,94-116,158-181 (2010.09686)"
  kind: detector
  what_it_does: "Define 'gone' before looking: economic failure is E[X | past] < m_i, the minimum net edge worth keeping, on a pre-outcome risk scale with all costs in. For a score in [a, b], multiply L = 1 + lambda (m_i - X) with 0 <= lambda <= 1/(b - m_i), bets chosen from past data only and mixed across small and moderate sizes; demote at E >= 1/alpha_i. Clipping changes the target to clipped P&L; keep an unclipped dollar-loss override."

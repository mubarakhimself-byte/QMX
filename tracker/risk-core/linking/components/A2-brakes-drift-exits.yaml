  evidence: "author backtest (two models, budgets to 100, five repeats)"
  known_failures: ["rejects some strategies profitable out of sample"]
  performance_note: "Fewer false live strategies."
  survival_note: "Search luck does not reach money."
  ledger_ids: [effective_tries, deflated_sharpe_min]
  new_variables:
    - {name: prereg_bar_discount, note: "lower evidence bar for hypotheses written before the backtest"}
  qmx_layer: [X5, X7]
  link_hints:

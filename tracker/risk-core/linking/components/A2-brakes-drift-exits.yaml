- id: A2-brakes-drift-exits-020
  name: "One central controller reconciles simultaneous triggers; dependence-aware safeguards"
  source: "research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:57-59; research/R4-alphaxiv/chat-06-kill-switches-breakers.md:152 (2611.00386)"
  kind: brake
  what_it_does: "Safeguards share data, broker, model and failure modes, so assess them as a dependent system. One controller reconciles an incident and picks the action instead of staggering thresholds; alerts from one root cause are deduped and get one owner, but suppressing duplicate alerts never suppresses an independent safety enforcement. A bad gold unit should not disconnect unrelated units; a broker outage should affect everything routed through that broker."

# ---------------------------------------------------------------- PART 4: brake test design, drift and alpha-decay detectors

- id: A2-brakes-drift-exits-135
  name: "Random-control brake test at matched frequency"
  source: "research/R5-mql5-corpus-ideas.md:33,123,539,563-568 (MQL5 article 23482, lines 586-699)"
  kind: gate/test
  what_it_does: "Run the same strategy three ways on the same history: no brake, the brake, and a random brake that fires with the same average frequency (per-bar probability 1/lambda) and the same action. Only a brake that beats the random control carries timing information; any brake on a losing strategy looks good because it trades less. In 23482, BOCPD de-risking cut max equity drawdown 856 to 756 skipping 4 of 97 trades, while the random brake deepened it to 1,007."
  inputs: ["strategy", "brake rule", "brake fire rate", "history"]
  outputs: ["three result sets", "verdict: timing informative or not"]
  assumptions: ["entries held fixed across arms"]
  levels: [unit]
  instrument_classes: ["FX (EURUSD M30)"]
  class_notes: "Run per instrument; fire rates differ by class."
  styles_timeframes: "all"
  evidence: "controlled test (author backtest with a matched random control; few trades)"
  known_failures: ["thin samples; random arm varies run to run", "all three arms lost money: a brake does not make an edge"]
  performance_note: "Separates a brake that saves money by timing from one that only trades less."
  survival_note: "Stops adopting brakes that only look good."
  ledger_ids: [brake_precision, breaker_expected_fire_rate]
  new_variables:
    - {name: brake_random_control_result, note: "brake result minus random-control result at matched fire rate, per brake and instrument"}
  qmx_layer: [X3, X5]
  link_hints:
    - "A2-brakes-drift-exits-136: fixed-count placebo for filters (R5 combination 3)"
    - "A2-brakes-drift-exits-137: path-independent split and denominator rule (R5 combination 3)"
    - "RANKING.md evidence 2 requires exactly this control"


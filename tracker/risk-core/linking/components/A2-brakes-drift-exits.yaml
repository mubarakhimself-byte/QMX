- id: A2-brakes-drift-exits-138
  name: "Validate a gate against random admission at the same adoption rate"
  source: "research/R6-alphaxiv-papers/T-09-validation-against-overfitting.md:41-59 (2610.07701)"
  kind: gate/test
  what_it_does: "Plant known edges and compare an admission gate (sub-period stability, leave-best-days-out, sample size, deflated Sharpe over 40 trials) with a random rule that adopts at the same rate. For weak signals (training t below 2.5) pure search adopts false winners 24-59% of the time and gates cut that to about 0 while adopting only 1-7%; above t 2.5 gates add nothing. Print per-criterion rejection rates."
  inputs: ["candidate set with injected truth", "gate"]
  outputs: ["false-adoption rate vs random", "per-criterion rejections"]
  assumptions: ["injected edges resemble real ones"]
  levels: [unit, methodology]
  instrument_classes: ["A-share ETF panels (synthetic and real-calibrated)"]
  class_notes: "Gates computed on absolute returns silently rejected every candidate, even a true t = 4 signal; use excess (class-benchmark-removed) returns."
  styles_timeframes: "daily"
  evidence: "controlled test (injected truth, random admission control)"
  known_failures: ["one market; constant injected edges", "a 30-day-hold leg needed about 37 years of data"]
  performance_note: "Gates matter only for weak edges, QMX's normal case."
  survival_note: "Shows a gate truly filters false winners."
  ledger_ids: [deflated_sharpe_min, min_trades_for_verdict]
  new_variables: []
  qmx_layer: [X5]
  link_hints:
    - "A2-brakes-drift-exits-203: excess-return gates"
    - "A2-brakes-drift-exits-205: then shrink the winner (R6 combination)"


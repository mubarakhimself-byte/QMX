  known_failures: ["family green read as unit green (X5 C7)", "rho needs weeks of paper"]
  performance_note: "'Ten times faster' made safe."
  survival_note: "Correlation discount stops a one-move 'proof'."
  ledger_ids: [effective_independent_bets, unit_result_correlation, judge_market_shrink_k]
  new_variables:

  source: "research/R5-mql5-corpus-ideas.md:260,569 (MQL5 article 23983)"
  kind: gate/test
  what_it_does: "Count every refusal by reason against the signals that actually reached the gate (a quoted 3.5% veto rate was wrong because 109 of 143 signals never reached it). Gate A/B arms see different signal sets, so totals contradict; measure brake value on a path-independent forward split. An anomaly score has no direction."
  inputs: ["signals reaching the gate", "refusals by reason"]
  outputs: ["refusal rates with correct denominators"]

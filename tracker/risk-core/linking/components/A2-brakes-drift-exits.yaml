  instrument_classes: ["generic (stylised P&L)"]
  class_notes: "Style matters more than class: scalpers and mean-reversion are short-vol-like (depth worst cases 1.30-1.34x Gaussian); trend and breakout grind (time measures 1.08-1.11x)."
  styles_timeframes: "all; worst for low-Sharpe slow units (5% depth about 1.50/S, length about 2.14/S^2 years)"
  evidence: "simulation (validated against closed forms)"
  known_failures: ["cannot separate bad luck from an overstated Sharpe (CFM authors)", "Sharpe uncertainty raises worst cases by 21-48%"]
  performance_note: "Stops healthy units being cut inside their normal drawdown."
  survival_note: "Gives a principled depth at which to cut instead of a guessed one."
  ledger_ids: [drift_state, drift_size_down_step, result_spread_r, expectancy_r]
  new_variables:

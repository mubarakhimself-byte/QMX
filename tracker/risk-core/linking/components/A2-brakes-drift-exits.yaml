  source: "research/R3-edge-verification-and-analogues.md:41-66"
  kind: gate/test
  what_it_does: "Trades needed ~ ((z_conf + z_power) / per-trade Sharpe)^2; for a +/-1R trade winning p, Sharpe = (2p - 1)/sqrt(1 - (2p - 1)^2). A 55% unit needs about 612 trades for 80% power at 95%; at half the edge (52.5%) about 2,467; at 51% about 15,450. MinTRL at 50% power: 274. Calendar = trades / (rate x effective units); correlated units count N/(1 + (N-1) rho)."
  inputs: ["claimed edge", "trade rate", "unit count", "correlation"]
  outputs: ["trades and days to proof"]
  assumptions: ["independent +/-1R trades"]
  levels: [unit, methodology]
  instrument_classes: ["generic (arithmetic)"]
  class_notes: "Generic."
  styles_timeframes: "all; one-trade-a-day units wait years"
  evidence: "simulation (arithmetic)"
  known_failures: ["fat tails, streaks and regimes make proof slower"]
  performance_note: "Shows what frequency buys."
  survival_note: "No thin edge is proved in days."

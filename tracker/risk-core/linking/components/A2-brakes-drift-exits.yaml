  kind: gate/test
  what_it_does: "Start at the lowest dose; observed harm rate at or below lambda_e: up one level; at or above lambda_d: down one; dose-elimination removes a dose and all higher when very likely too toxic (for a 30% target, lambda_e 0.236, lambda_d 0.359). Mapped: size is a level moved one step at a time on cohorts of trades (25), bad cohort = net R <= -5R; a 55% unit has a bad cohort 9.7% of the time, a no-edge unit 21.4%; with the target from the card (15%: up below 11.8%, down above 17.9%) the healthy unit climbs and the dead unit descends. Steps rest on paper and live trades only."
  inputs: ["cohort results at the current level", "target bad rate from the card"]
  outputs: ["level up, hold, down, lock out"]
  assumptions: ["levels map to dollars (sizing layer)"]
  levels: [unit]
  instrument_classes: ["clinical trials (analogue)"]
  class_notes: "Level 1 may be below the minimum lot on some classes at $500."
  styles_timeframes: "all; cohorts of 10 for ORB, 25 for scalpers"
  evidence: "live in its own field, not trading (FDA fit-for-purpose design, analogue); simulation (X5 arithmetic); analogue, no trading result"
  known_failures: ["a fixed 30% target lets a dead unit climb"]
  performance_note: "Healthy units reach full size on evidence."
  survival_note: "Dangerous levels locked out; never skips levels."
  ledger_ids: [size_levels, size_ramp_to_full, grow_back_rule]
  new_variables:
    - {name: bad_cohort_target, note: "bad-cohort rate the level rule aims at, derived from the card"}
  qmx_layer: [X2, X5]
  link_hints:

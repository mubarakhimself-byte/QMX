- id: A2-brakes-drift-exits-001
  name: "Kill path outside model inference"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:73-91 (FARSIGHT, https://www.alphaxiv.org/abs/2609.19705); research/R4-alphaxiv/chat-06-kill-switches-breakers.md:12,71-79"
  kind: brake
  what_it_does: "A supervisory path that can stop order generation and cancel working orders without waiting for any agent or model to reason. Hard loss limits are enforced outside the agent and read broker prices, not agent text. One false-halt threshold per layer is tuned from logged false halts."
  inputs: ["broker equity and prices", "open risk and margin", "position and order reconciliation", "data freshness", "rejects, slippage, order rate"]
  outputs: ["halt state per scope (alert, block entries, cancel working, disabled, account stop)", "logged false halts"]
  assumptions: ["the kill process is independent of the strategy and agent processes", "broker state is readable when the agent is not"]
  levels: [unit, account, system]
  instrument_classes: ["stocks (simulated single-stock market)"]
  class_notes: "Crowding risk is largest in thin markets where many bots trade one signal (small-cap crypto, single stocks). For FX and index CFDs the same path holds; only the broker read differs."
  styles_timeframes: "all; matters most for fast scalpers where inference latency makes model-side stops late"
  evidence: "simulation (plus a review of 15 LLM trading designs and 7 code releases)"
  known_failures: ["'a few false halts per calm hour' at the paper's threshold", "detector is late if it waits for realized losses or delayed broker state", "many strategies halting or restarting together can synchronise"]
  performance_note: "Removes agent-caused crashes in the simulation; the cost is a few false halts, set by one threshold."
  survival_note: "Core survival piece: a halt that cannot be argued away by the agent it stops."
  ledger_ids: [kill_switch_level, kill_switch_scope, kill_switch_detector_posture, account_equity, reconciliation_tolerance]
  new_variables:
    - {name: false_halt_rate_per_layer, note: "logged false halts per calm hour per layer, used to tune the trip threshold"}
  qmx_layer: [X3, X7]
  link_hints:
    - "A2-brakes-drift-exits-016: SwingGuard states driven by this LLM-free fast path; recovery needs time and reconciled positions (T-06 combination)"
    - "A2-brakes-drift-exits-012: account governor bounded by the drawdown cushion plus this kill path (chat-06 combination)"
    - "A2-brakes-drift-exits-097: the shipped kill switch is his hand only; this adds an automatic trigger"

- id: A2-brakes-drift-exits-002
  name: "Halt means stop new orders and cancel working ones; flatten is a separate, tested policy"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:22-23,83-90; research/R4-alphaxiv/chat-06-kill-switches-breakers.md:35,109"
  kind: brake
  what_it_does: "A breached limit stops new entries and cancels resting orders but does not market-sell everything. Liquidation runs only under a pre-agreed, tested policy. 'Stop new orders', 'cancel working orders' and 'liquidate' are three distinct actions."
  inputs: ["breach event", "open positions", "liquidation policy"]
  outputs: ["no-new-entry state", "cancel list", "optional staged liquidation"]
  assumptions: ["existing stops at the broker stay in place", "the market can absorb the open positions later"]
  levels: [unit, cluster, account]
  instrument_classes: ["stocks (simulated)"]
  class_notes: "Energy and futures limit moves and stock halts can make exits impossible; 'halt' there means risk is uncontained, not paused."
  styles_timeframes: "all"
  evidence: "simulation"
  known_failures: ["holding through a breach can lose more if the move continues", "a halt that silently means flatten turns many breakers into one synchronised market exit"]
  performance_note: "In FARSIGHT, agents selling after true bad news overshot the new value by 9.6-11.1%; with halts the price ended within 0.1%."
  survival_note: "Avoids adding to a disorderly move; protective stops still bound the open loss."
  ledger_ids: [kill_switch_effect_matrix, window_forced_flat, soft_kill_exit_schedule]
  new_variables:
    - {name: breach_action, note: "per brake: no_new_entries, cancel_working, reduce, flatten_by_policy"}
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-101: exits are never blocked, so a halt never blocks a close"
    - "A2-brakes-drift-exits-120: isolation modes no-new-entries / reduce / flatten follow the same split"

- id: A2-brakes-drift-exits-003
  name: "Order-boundary worst-case loss veto"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:56,79,136 (Unbounded Losses, Unchecked Inputs, https://arxiv.org/abs/2610.24289)"
  kind: gate/test
  what_it_does: "Before routing, compute the maximum loss from the actual order structure (size, stop, gap allowance, fees, margin) and reject an order that breaches its limit, instead of trusting a size cap or the agent's stated intent."
  inputs: ["order structure", "instrument record (multiplier, tick value)", "gap allowance", "fees", "margin"]
  outputs: ["accept or reject with reason"]
  assumptions: ["a worst-case move per instrument can be stated"]
  levels: [trade, position]
  instrument_classes: ["options (paper's case); generalised by the assistant"]
  class_notes: "Futures and short options carry large or unbounded loss on a small count; crypto perpetuals need liquidation price inside the check."
  styles_timeframes: "all"
  evidence: "idea (assistant claim; paper not read by R6)"
  known_failures: ["a gap beyond the assumed worst move breaks the bound"]
  performance_note: "No growth effect; it removes malformed orders."
  survival_note: "Stops a single bad order from becoming the floor event."
  ledger_ids: [risk_amount_usd, gap_loss_beyond_stop, liquidation_stop_check, margin_used, max_position_size_lots]
  new_variables:
    - {name: worst_move_per_class, note: "assumed worst one-step move per instrument class and holding time, used at the order boundary"}
  qmx_layer: [X3, X7]
  link_hints:
    - "A2-brakes-drift-exits-012: the same worst-move support feeds the drawdown cushion clip"
    - "A2-brakes-drift-exits-250: size from the realized loss distribution, then veto at the boundary"

- id: A2-brakes-drift-exits-004
  name: "Three-level brake hierarchy, tightest limit wins, local breach stays local"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:14-22,111; research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:109-117"
  kind: brake
  what_it_does: "Limits run per strategy, per asset class (or risk cluster) and account-wide; the tightest applicable limit binds. A strategy breach stops that strategy only; the class breaker catches shared exposure; the account governor enforces the aggregate loss budget and overrides any strategy's cooldown. Strategy budgets must sum below the account budget."
  inputs: ["per-strategy P&L and drawdown from its own high-water mark", "class exposure", "account marked equity after fees"]
  outputs: ["block at the scope that breached"]
  assumptions: ["exposure can be aggregated by shared driver, not label"]
  levels: [unit, cluster, account]
  instrument_classes: ["generic"]
  class_notes: "FX: aggregate by currency (several FX bots may all be short USD). Indices: one equity-beta bucket. Crypto: tokens collapse into one risk-on cluster in stress."
  styles_timeframes: "all"
  evidence: "idea (assistant design advice)"
  known_failures: ["a strategy that reports wrong P&L must not be able to defeat the account limit", "label-based classes miss shared drivers"]
  performance_note: "Keeps unrelated units trading when one breaks, which preserves breadth."
  survival_note: "The account layer holds even if a strategy crashes or duplicates orders."
  ledger_ids: [unit_daily_loss_limit, account_daily_loss_limit, bms_daily_loss_limit, cluster_exposure_cap, control_rank_table]
  new_variables: []
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-021: grid selectivity gives the timing between these levels"
    - "A2-brakes-drift-exits-027: parent limit set below the sum of children"
    - "A2-brakes-drift-exits-131: his 'several brakes, each saying what is breaking'"

- id: A2-brakes-drift-exits-005
  name: "Four trigger families for breakers"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:24-33; research/R4-alphaxiv/R4-alphaxiv-synthesis.md:299"
  kind: detector
  what_it_does: "Use several independent trigger families so a single loss threshold does not miss operational faults: financial (session loss, rolling loss, drawdown from peak, margin, projected gap loss), execution (slippage vs estimate, fills outside collars, partial or duplicate fills, position mismatch, rejects), system health (stale data, clock or sequence gaps, ack latency, disconnects, order bursts) and behaviour (trading a disabled instrument, size or frequency jumps, many strategies taking the same side). Position mismatch, out-of-bounds order or a stale price used for an order are hard stops."
  inputs: ["equity, drawdown, margin", "fill records", "feed and clock health", "order flow per strategy"]
  outputs: ["trigger events with family tag", "hard or soft classification"]
  assumptions: ["latency and slippage thresholds are set per strategy horizon"]
  levels: [unit, cluster, account, node]
  instrument_classes: ["generic"]
  class_notes: "A two-second quote delay means something different to a scalper than to a slow intraday unit; thresholds per horizon and class."
  styles_timeframes: "all"
  evidence: "idea (assistant design advice)"
  known_failures: ["noisy metrics without persistence checks cause needless shutdowns"]
  performance_note: "Catches broken units by execution signals before P&L shows it."
  survival_note: "Covers failure modes a money brake cannot see."
  ledger_ids: [feed_stale_after, clock_drift_no_new_entry, reconciliation_tolerance, slippage_cost, brake_state]
  new_variables:
    - {name: behaviour_same_side_trip, note: "share of units taking the same side at once that trips a behaviour alarm"}
  qmx_layer: [X3, X6]
  link_hints:
    - "A2-brakes-drift-exits-102: the node's health stand-downs already cover the system-health family"
    - "A2-brakes-drift-exits-061: execution-anomaly brake covers the execution family"

- id: A2-brakes-drift-exits-006
  name: "Staged brake response ladder"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:35; research/R4-alphaxiv/R4-alphaxiv-synthesis.md:300"
  kind: brake
  what_it_does: "Where time permits, respond in stages: alert and reduce size, then block new entries, then cancel working orders and revoke the strategy's order permission, then an account-wide emergency stop. What happens to open positions is defined separately."
  inputs: ["trigger severity", "scope"]
  outputs: ["one stage per scope"]
  assumptions: ["stages are ordered and each has its own threshold"]
  levels: [unit, cluster, account]
  instrument_classes: ["generic"]
  class_notes: "Hard conditions (stale price in an order, mismatch) skip straight to the top stage in every class."
  styles_timeframes: "all"
  evidence: "idea"
  known_failures: ["a slow ladder is late on gaps; hard triggers must bypass it"]
  performance_note: "Size reduction before blocking keeps some trades running through noise."
  survival_note: "Graded response; the top stage still exists."
  ledger_ids: [kill_switch_effect_matrix, daily_loss_warning_fraction, drift_size_down_step]
  new_variables: []
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-023: staged load shedding is the grid version"
    - "A2-brakes-drift-exits-112: trading states ACTIVE / REDUCING / HALTED / RESTORE give the ladder a state machine"

- id: A2-brakes-drift-exits-007
  name: "State-based re-enable gate (not a timer)"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:101-111; research/R4-alphaxiv/R4-alphaxiv-synthesis.md:302"
  kind: brake
  what_it_does: "A trip stays latched. Re-enable needs a minimum cool-down for the unit's horizon AND the trigger cleared AND health checks passed (fresh quotes, normal acks, reconciled positions, normal spreads and slippage, no further class or account deterioration). Clear only after the metric sits inside a lower recovery threshold for several observations. Re-enter one unit or a small cohort at reduced risk, staggered with jitter. Hard and account stops need human re-authorisation."
  inputs: ["trip record", "health checks", "recovery metric history", "loss budget left"]
  outputs: ["re-enable decision", "re-entry size", "stagger schedule"]
  assumptions: ["health checks are independent of the unit's own report"]
  levels: [unit, cluster, account]
  instrument_classes: ["generic"]
  class_notes: "Crypto has no daily close to reset; stocks need a post-reopen stability check; energy limit moves are no normal cool-down."
  styles_timeframes: "persistence window set by the unit's decision cadence: short for scalpers, longer for intraday"
  evidence: "idea"
  known_failures: ["'wait five minutes and resume' restarts into the same regime", "simultaneous re-enables create a restart storm"]
  performance_note: "Reduced-size re-entry lets a healthy unit earn back sooner than a full lockout."
  survival_note: "Prevents restarting straight into the bad regime and synchronised re-entry."
  ledger_ids: [circuit_breaker_reset, risk_stop_resume_rule, grow_back_rule, isolation_end_rule]
  new_variables:
    - {name: reenable_persistence_obs, note: "consecutive in-band observations needed before a trip clears"}
    - {name: reenable_jitter_s, note: "random stagger applied to non-emergency re-enables"}
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-032: half-open probes are the software form of reduced-size re-entry"
    - "A2-brakes-drift-exits-022: recloser lockout after repeated failed restores"
    - "A2-brakes-drift-exits-119: staged resume after isolation"

- id: A2-brakes-drift-exits-008
  name: "Separate trip and clear thresholds (hysteresis)"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:99 (Learning AI Agents, Market Makers, and Stress in Automated Markets, https://arxiv.org/abs/2611.01799)"
  kind: brake
  what_it_does: "Trip at a more severe level and clear only at a milder one, so a brake does not chatter on and off. The paper's model shows liquidity disappearing at one threshold and returning only after conditions improve further, and the same return distribution with very different stress persistence."
  inputs: ["monitored metric", "trip level", "clear level"]
  outputs: ["latched brake state"]
  assumptions: ["the metric's noise band is known"]
  levels: [unit, cluster, portfolio]
  instrument_classes: ["simulated AMM market"]
  class_notes: "Clear levels per class and session baseline."
  styles_timeframes: "all"
  evidence: "simulation (assistant claim)"
  known_failures: ["too wide a band keeps a healthy unit out long after the stress ends"]
  performance_note: "Fewer false re-trips mean fewer missed trades."
  survival_note: "Stops a brake flapping in and out of a stress spell."
  ledger_ids: [sqs_hysteresis_band, isolation_end_rule]
  new_variables:
    - {name: brake_clear_threshold, note: "level at which a tripped brake may clear, milder than its trip level"}
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-111: SQS already has a hysteresis band"
    - "A2-brakes-drift-exits-016: SwingGuard states use hysteresis and minimum hold"

- id: A2-brakes-drift-exits-009
  name: "Liquidity-normalised re-entry after a venue pause"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:47,89,93-99,144 (1211.6667 mini flash crashes; 2603.22835 Breaking news; 2609.31260 Agentic LOB)"
  kind: brake
  what_it_does: "'Exchange resumed' is not a re-enable signal. Require spreads and depth to normalise, quotes to be fresh and fills to stay inside price collars, then reopen with reduced size in a small staggered cohort. Exchange trading breaks around macro news were associated with overshooting rather than restored fair pricing."
  inputs: ["spread and depth vs norm", "quote freshness", "fill vs collar"]
  outputs: ["re-entry allowed, reduced size, cohort"]
  assumptions: ["normal spread and depth are known per session"]
  levels: [unit, cluster]
  instrument_classes: ["US equities (mini flash crashes)", "E-mini futures (Breaking news)", "simulated LOB"]
  class_notes: "Stocks: post-halt reopen auctions; index futures: venue pauses; crypto: venue outages; FX: no exchange pause, use broker spread."
  styles_timeframes: "scalpers and intraday"
  evidence: "author backtest (event studies) plus simulation; assistant claims"
  known_failures: ["agentic LOB phase model is homogeneous, a stress scenario not a live threshold"]
  performance_note: "Skips the worst re-entry fills."
  survival_note: "Avoids re-entering a frozen or collapsing book."
  ledger_ids: [sqs_score, spread_cost_guard, isolation_end_rule]
  new_variables:
    - {name: price_collar_bps, note: "allowed distance of a fill from the reference price before it counts as abnormal"}
  qmx_layer: [X3, X4]
  link_hints:
    - "A2-brakes-drift-exits-119: staged resume after isolation"
    - "A2-brakes-drift-exits-072: exchange breakers as the external pause"

- id: A2-brakes-drift-exits-010
  name: "Starting daily-loss ladder for a small account: alert, stop entries, human review"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:22; research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:53"
  kind: brake
  what_it_does: "Test values the assistant floated for $500: alert at 1% daily loss ($5), stop new entries at 2% ($10), human review at 5% peak-to-trough ($25), all including open P&L and fees, on rolling windows as well as session totals. For scalping it floated 0.1-0.25% planned loss per trade and 0.5-1% daily loss including open trades."
  inputs: ["marked equity", "day start equity", "peak equity"]
  outputs: ["alert", "entry block", "review request"]
  assumptions: ["per-trade risk is far below the daily limit"]
  levels: [account]
  instrument_classes: ["generic"]
  class_notes: "At $500 one trade on an index future or gold contract can exceed $10; the ladder only fits micro lots."
  styles_timeframes: "scalpers and intraday"
  evidence: "idea (assistant's starting values, not research results)"
  known_failures: ["fixed percent ladders are the 10/5/3 problem he rejected: they may sit below one trade's risk"]
  performance_note: "Low limits cap growth when the edge is real."
  survival_note: "Tight; floor far away."
  ledger_ids: [account_daily_loss_limit, daily_loss_warning_fraction, equity_drawdown_halt, risk_fraction]
  new_variables: []
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-094: the old 10/5/3 bands"
    - "A2-brakes-drift-exits-134: his 3-5-7 recollection"
    - "A2-brakes-drift-exits-052: a taper instead of steps"

- id: A2-brakes-drift-exits-011
  name: "Loss counters that survive restarts, closes and date changes"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:105,158; grounding/G6-book-bms-levels-and-paper.md:132; research/R5-mql5-corpus-ideas.md:242,272 (24397, 21803)"
  kind: config/override pattern
  what_it_does: "High-water marks, loss counters and drained budgets persist across every restart, market close and calendar change; a pause, a restart or a new day never replenishes a loss budget by itself unless the rule says so. A confirmed day baseline is stored and restored, not reconstructed from a moving balance."
  inputs: ["journaled counters", "stored day baseline"]
  outputs: ["restored brake state"]
  assumptions: ["journals are durable and readable at start"]
  levels: [unit, cluster, account, node]
  instrument_classes: ["generic"]
  class_notes: "Crypto 24/7 has no natural close; the day must be declared."
  styles_timeframes: "all"
  evidence: "idea; July ops rule (docs only); MQL5 demo scenario tests"
  known_failures: ["a daily limit measured from a balance re-read after restart is a classic bug (24397)"]
  performance_note: "None direct."
  survival_note: "Closes the 'restart to reset' hole."
  ledger_ids: [day_start_equity, day_boundary, state_carry_rule, high_water_mark_equity]
  new_variables: []
  qmx_layer: [X3, X6]
  link_hints:

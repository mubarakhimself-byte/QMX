    - "A2-brakes-drift-exits-116: rolling windows close the boundary exploit"

- id: A2-brakes-drift-exits-012
  name: "Drawdown-cushion exposure clip (robust invariance)"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:8-13,27-49 (Hsieh 2026, https://www.alphaxiv.org/abs/2609.23272)"
  kind: brake
  what_it_does: "An action is drawdown-safe if its worst one-step loss plus costs is at most the cushion C = V - (1 - d_max) x V_max. Every safe policy is cushion times a normalised direction; the best safe policy beats every constant-gain policy that meets the same limit. Used as a clip on proposed exposure at account or sleeve level."
  inputs: ["equity V", "true high-water mark V_max", "drawdown limit d_max", "worst and best one-step return per instrument", "cost rates"]
  outputs: ["maximum allowed exposure each step"]
  assumptions: ["one-step returns stay inside the stated support", "independence for the optimality part"]
  levels: [account, portfolio, cluster]
  instrument_classes: ["SPY and TLT daily (illustration)"]
  class_notes: "X_min per class and holding period: FX majors small; crypto and single stocks large; index CFDs over weekends large. Take X_min from stress scenarios, not recent volatility."
  styles_timeframes: "any; daily illustration"
  evidence: "author backtest (plus proofs)"
  known_failures: ["a gap beyond X_min (weekend, news, crypto wick, outage) breaks the guarantee", "a restart must not reset the high-water mark"]
  performance_note: "Beat the best constant-gain policy at every positive drawdown limit on 21, 63 and 252-day horizons; it is a growth-optimal brake, not only a stop."
  survival_note: "Pathwise drawdown cap inside the assumed support."
  ledger_ids: [high_water_mark_equity, rising_floor_fraction, portfolio_floor, open_risk_ceiling, gap_loss_beyond_stop]
  new_variables:
    - {name: drawdown_limit_dmax, note: "drawdown from the true peak the cushion is built against"}
    - {name: worst_move_per_class, note: "X_min per class and holding time (shared with the order-boundary veto)"}
  qmx_layer: [X2, X3, X4]
  link_hints:
    - "A2-brakes-drift-exits-014: worry lines review each strategy inside the cushion (T-06 combination)"
    - "A2-brakes-drift-exits-001: FARSIGHT kill path plus cushion plus cluster governor (chat-06 combination)"
    - "Risk-Constrained Kelly (A1 cluster): hard pathwise cap at the account plus a probabilistic floor per sleeve"

- id: A2-brakes-drift-exits-013
  name: "Drawdown control with restart and a forgetting factor"
  source: "research/R4-alphaxiv/chat-06-kill-switches-breakers.md:57,81-87; research/R4-alphaxiv/chat-13-stops-and-exits.md:161 (2303.02613)"
  kind: brake
  what_it_does: "Exposure scales down with the remaining cushion as drawdown nears a preset bound. Near the bound a restart re-initialises the control state and recomputes the gain with a forgetting factor so post-restart trades are smaller. The restart must never reset the account's true high-water mark or refill a loss budget."
  inputs: ["account value", "running maximum", "max drawdown", "exposure rule"]
  outputs: ["shrinking allowed exposure", "reduced-gain restart"]
  assumptions: ["bounded returns for the drawdown guarantee"]
  levels: [account, portfolio]
  instrument_classes: ["ETF", "crypto (BTC)"]
  class_notes: "The paper's BTC case slightly overshot its 20% bound (20.18%); jumps break the bound in every class."
  styles_timeframes: "portfolio governor, any style"
  evidence: "author backtest (assistant-reported numbers; R6 did not read)"
  known_failures: ["can shrink exposure so far that the strategy stops before the formal bound", "can restart into the same regime", "not an operational kill switch"]
  performance_note: "Reported ETF case: 20.97% cumulative with restart vs -8.42% without; BTC 101.82% vs 17.41% (historical case studies)."
  survival_note: "Keeps drawdown near its bound on bounded returns; human or conservative restart after a breaker."
  ledger_ids: [high_water_mark_equity, grow_back_rule, size_ramp_to_full]
  new_variables:
    - {name: restart_forgetting_factor, note: "gain multiplier applied after a drawdown restart"}
  qmx_layer: [X2, X3]
  link_hints:
    - "A2-brakes-drift-exits-012: the 2026 robust version of the same author"
    - "regime HMM (2605.27848): regime probabilities may lengthen the pause, never override a hard stop (chat-06 combination)"

- id: A2-brakes-drift-exits-014
  name: "Style-aware drawdown worry lines (depth and duration)"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:51-71 (Landolfi 2608.00127, after Rej-Seager-Bouchaud 1707.01457); research/R2-trader-practice-windows-drift-isolation-breadth.md:75-82"
  kind: detector
  what_it_does: "From a strategy's Sharpe, horizon and style archetype (or a block bootstrap of its own returns), compute normal-versus-worry lines for max drawdown, max loss below start, time under water and longest time between highs. Past the line: cut size or revise the Sharpe estimate down. Use depth lines for mean-reversion scalpers and duration lines for breakout and trend."

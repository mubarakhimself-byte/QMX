  known_failures: ["a leaky oracle with Sharpe 35 passed DSR and PBO: statistics cannot catch leakage"]
  performance_note: "55% unit at 1:1 needs 1,026 trades at N = 10 vs 612 alone."
  survival_note: "Stops best-of-many luck going live."

- id: A2-brakes-drift-exits-021
  name: "Grid selectivity: nearest brake trips first, outer levels wait a graded delay"
  source: "research/R3-edge-verification-and-analogues.md:205-213 (TSEWG TP-7); research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:50-53"
  kind: brake
  what_it_does: "The protection closest to the fault acts promptly; backups farther away may start to operate but do not trip while the primary works. Inverse-time relays are spaced 0.3-0.4 s apart so the nearest device clears the fault before upstream devices respond. Margins shrink only if field tests show it still works. Mapped: the unit brake acts first, the book next, the account last, each with a graded delay."
  inputs: ["fault location (scope)", "per-level delay"]
  outputs: ["which level trips"]
  assumptions: ["the nearest level can contain the fault"]
  levels: [unit, cluster, portfolio, account]
  instrument_classes: ["power grids (analogue)"]
  class_notes: "Translate as severity and escalation rules, never as a delay that lets a financial hard limit be breached."
  styles_timeframes: "all"
  evidence: "live in its own field, not trading (engineering standard practice; analogue); analogue, no trading result"
  known_failures: ["a delay on a money limit can let a gap pass through"]
  performance_note: "Only one level trips, so healthy units keep trading."
  survival_note: "Backups still act if the nearest fails."
  ledger_ids: [control_rank_table, unit_daily_loss_limit, bms_daily_loss_limit]
  new_variables:
    - {name: escalation_delay_per_level, note: "time or evidence a higher level waits before acting on a fault a lower level owns"}
  qmx_layer: [X3]
  link_hints:
    - "A2-brakes-drift-exits-004: the level hierarchy this times"
    - "A2-brakes-drift-exits-022: recloser at the same grid"


- id: A2-brakes-drift-exits-140
  name: "Counterfactual exit replayer over a unit's own trade paths, with trial counting"
  source: "research/R6-alphaxiv-papers/T-10-stops-exits-fast-invalidation.md:26-44 (2604.27150); research/R4-alphaxiv/chat-13-stops-and-exits.md:100-110,168"
  kind: gate/test
  what_it_does: "Replay each closed trade's price path under alternative exit rules (stop, trailing activation and distance, partial level and fraction, stale close, ATR stop and target, consecutive-loss breaker) and rank configurations. Preserve chronology and realistic fills; count every configuration tried and deflate; keep the winner as a candidate default, not a fact."
  inputs: ["closed trades with price paths", "exit grid"]
  outputs: ["ranked exit configurations", "trial count"]
  assumptions: ["entries unchanged by the exit"]
  levels: [unit]
  instrument_classes: [crypto]
  class_notes: "Percent stops only make sense for crypto; FX and index scalpers need ATR or spread multiples."

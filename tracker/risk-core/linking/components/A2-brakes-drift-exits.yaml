- id: A2-brakes-drift-exits-153
  name: "Restarted, weighted change detectors with summable restart weights"
  source: "research/R6-alphaxiv-papers/T-08-live-alpha-decay-detection.md:49-63 (2609.27179); research/R4-alphaxiv/chat-10-alpha-decay-live.md:118-136"
  kind: detector
  what_it_does: "Standard conformal change detectors react slowly after a long healthy period (delay growing with time already monitored). Build delayed processes from candidate start times s with weights pi_s summing to at most 1: E = sum over s<=t of pi_s E_s:t + sum over s>t of pi_s, thresholded at 1/alpha. Late starts need more evidence (about 1/(alpha pi_s)); every restart is paid for. Re-promotion is a new episode with its own budget."
  inputs: ["trade stream", "restart weights"]
  outputs: ["aggregate evidence", "alarm"]
  assumptions: ["independent observations within regimes"]
  levels: [unit]
  instrument_classes: ["simulated"]
  class_notes: "Independence is weakest for trend and carry P&L."
  styles_timeframes: "all"
  evidence: "simulation (plus proofs)"
  known_failures: ["volatility clustering breaks within-regime independence"]
  performance_note: "Detects decay after long good runs."
  survival_note: "Restarting never resets the error budget for free."
  ledger_ids: [sequential_evidence_pass]
  new_variables:

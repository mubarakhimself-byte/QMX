- id: A2-brakes-drift-exits-201
  name: "Anytime-valid funded promotion ledger (Promote)"
  source: "research/R6-alphaxiv-papers/T-09-validation-against-overfitting.md:11-39 (2611.03384)"
  kind: gate/test
  what_it_does: "Each candidate is frozen and hashed (code, universe, parameters, sizing, rebalance, cost model) and gets testing wealth pi at birth from a lifetime budget summing to at most 1. From the next return it bets on Y = clip(net return / scale, -1, 1): E = product of (1 + lambda Y), averaged over the bet grid {0.025, 0.05, 0.10, 0.20, 0.35}; promote when E >= 1/(alpha pi); trading starts next period. Abandoning refunds nothing; any change is a new candidate."
  inputs: ["frozen candidate", "cost convention", "score scale", "budget policy"]
  outputs: ["promote or not", "audit trail"]
  assumptions: ["no pre-birth evidence counts"]
  levels: [unit, methodology]
  instrument_classes: ["ETF and industry panels"]
  class_notes: "Scale and clipping per class (crypto clips more often)."
  styles_timeframes: "daily calendar rules"
  evidence: "simulation (3,000 null paths) plus author backtest"
  known_failures: ["controls false promotion under 'never had an edge', not that the edge is alive at deployment", "5 bp edges never cross"]
  performance_note: "Power 70.1% at a 15 bp/session edge, median crossing at session 2,327."
  survival_note: "Repeated unadjusted tests promote a false rule in 94.5% of null paths; Promote 0.0%; adaptive births 1.77% vs 18.4% unfunded."
  ledger_ids: [sequential_evidence_pass, effective_tries]
  new_variables:
    - {name: testing_wealth_budget, note: "lifetime alpha wealth split across candidates at birth"}
  qmx_layer: [X5, X6, X7]
  link_hints:
    - "A2-brakes-drift-exits-202: honest-evaluation trial counting (T-09 combination)"
    - "A2-brakes-drift-exits-152: same evidence currency for demotion"
    - "A2-brakes-drift-exits-017: Steward core trades what he promotes"

- id: A2-brakes-drift-exits-202

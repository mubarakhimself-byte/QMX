  kind: gate/test
  what_it_does: "Agents call only registry-validated, point-in-time tools; every evaluation is logged and all reported performance is deflated by the trial count. Passive benchmarks were certified; every LLM-discovered strategy was rejected. The best in-sample Sharpe climbs with each trial but the deflation threshold climbs faster. A Sharpe-35 leaky oracle passed DSR and PBO, so leakage is blocked by tools. Pre-registered hypotheses get a lower bar. Human approval authorises only the exact frozen artifact."
  inputs: ["agent proposals", "trial log", "registry"]
  outputs: ["certified or not with reason"]
  assumptions: ["all trials logged"]

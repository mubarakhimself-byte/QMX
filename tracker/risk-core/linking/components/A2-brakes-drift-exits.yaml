  name: "Fixed-count placebo test for filters and gates"
  source: "research/R5-mql5-corpus-ideas.md:332 (MQL5 article 23665)"
  kind: gate/test
  what_it_does: "Block permutation: compare the accepted trades' edge against many placebo selections of the same count from the same signal set, separating the operational effect (fewer trades) from selection skill. In 23665 the filter improved risk metrics but its accepted-trade edge was not unusual under placebo."
  inputs: ["all signals", "accepted subset"]
  outputs: ["placebo distribution", "p-value of selection skill"]
  assumptions: ["blocks preserve dependence"]
  levels: [unit]
  instrument_classes: ["FX (MT5)"]
  class_notes: "Generic."
  styles_timeframes: "all"
  evidence: "controlled test (placebo selections, author backtest)"
  known_failures: ["needs enough signals for placebos"]
  performance_note: "Keeps only filters that add edge."
  survival_note: "Exposure-only gains are labelled as such."
  ledger_ids: [brake_precision]

- id: "A3-structure-regimes-scenarios-178"
  name: "Selective protection: the smallest affected domain trips first, backups wait"
  source: "research/R3-edge-verification-and-analogues.md:205-213 (power-grid relays, reclosers, staged load shedding); research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:52-59"
  kind: "brake"
  what_it_does: "The protection nearest the fault acts first; backups farther away do not trip while it works (relays spaced 0.3-0.4 s); 80-90 % of line faults are transient, so breakers reclose automatically, single-shot then lockout needing a human; load shedding comes in at least three set points. Borrowed for isolation: instrument, then class, then BMS; a bad gold unit does not disconnect unrelated units, but a broker outage hits everything routed through that broker. One central controller reconciles simultaneous triggers; suppressing duplicate alerts must not suppress independent hard limits."
  inputs: ["fault location (instrument, class, broker)", "trip state per level"]
  outputs: ["which level trips", "retry or lockout"]
  assumptions: ["levels and their domains defined"]
  levels: ["unit", "cluster", "portfolio", "node"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Same hierarchy; the broker is a domain across classes."
  styles_timeframes: "All."
  evidence: "live"
  known_failures: ["graded delays must never let a hard money limit be breached"]
  performance_note: "Most faults stay local; the rest of the book trades."
  survival_note: "Escalation when local action fails."
  ledger_ids: ["isolation_scope", "bms_circuit_breaker", "kill_switch_scope"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-093: bucket-local isolation is the nearest device."
    - "A3-structure-regimes-scenarios-107: reclosers are the retry-then-lockout lifecycle."


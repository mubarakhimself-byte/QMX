- id: "A3-structure-regimes-scenarios-232"
  name: "Scenario library to limits: five steps and a refresh cadence"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md (turn 2 'Turning scenarios into limits'; turn 3 'Sizing and limits that leave room for growth')"
  kind: "workflow"
  what_it_does: "(1) One library: historical replays, hypothetical shocks, reverse-stress cases, generated joint tails, each with execution overlays (spread widening, less depth, gaps, partials, halts, stressed margin) and explicit session calendars. (2) Replay the whole system together; units competing for the same liquidity get one combined exit, not summed standalone costs. (3) Survival gates at portfolio and cluster level (loss, drawdown, margin, liquidation time). (4) Strategy limits by incremental stress contribution, no equal shares or unit-count cap. (5) Growth inside the gates by robust out-of-sample net performance and diversification; rerun the combined tests after material changes. Cadence: monitoring daily, scenario weights monthly, full scenario and generator validation quarterly, sooner after a break; keep a fixed crisis library so calm data cannot erase required scenarios."
  inputs: ["scenario library", "all units' code and state", "his tolerances"]
  outputs: ["gates", "limits per unit and cluster", "refresh schedule"]
  assumptions: ["replay harness exists"]
  levels: ["unit", "cluster", "portfolio", "system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Per-class scenario rows in A3-structure-regimes-scenarios-233."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["a generator trained on calm data must never relax a gate"]
  performance_note: "Budget follows contribution to stress, so diversifying units earn more."
  survival_note: "Combined exits priced as one."
  ledger_ids: ["portfolio_floor", "unit_capital_share", "cluster_exposure_cap"]
  new_variables:
    - name: "scenario_refresh_cadence"
      what: "Daily monitoring, monthly weights, quarterly full validation, plus event-triggered reruns."
  qmx_layer: ["X4", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-159: survival gates and growth controls."
    - "A3-structure-regimes-scenarios-147: the fixed crisis library."

- id: "A3-structure-regimes-scenarios-233"
  name: "Per-class stress scenarios as paths with trigger, propagation and exit"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md (turn 3 table; Negative Oil and Nickel Squeeze https://www.alphaxiv.org/abs/2610.00951)"
  kind: "scenario"
  what_it_does: "FX: surprise central-bank decision or intervention, peg or band break through poor weekend liquidity, carry unwind, funding and cross-currency basis. Indices: overnight gap opens, futures-led sell-offs, pauses and limit rules, volatility-control deleveraging. Metals: squeezes and short covering, real-rate and dollar shocks, margin increases. Energy: front-month collapse near expiry, limit moves, storage and delivery constraints, negative prices (WTI -$37.63 on 20 April 2020), forced-closure feedback in falls and squeezes. Crypto: perpetual liquidation cascades, stablecoin or collateral de-peg, funding spikes, venue outage with flow concentrating on venues still open, cross-venue basis breaks. Futures: roll squeezes, calendar-spread dislocation, margin shocks, each roll leg simulated separately. Stocks: earnings gaps, halts and reopening auctions, borrow squeezes."

- id: "A3-structure-regimes-scenarios-033"
  name: "Sniping window as a measured slice, proven out of sample"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:65-69,276; seeds/SEEDS.md:668-675 (D8, operator M7, M8, M10)"
  kind: "detector"
  what_it_does: "'Sniping window' has no professional meaning (retail 'sniper entry', ICT 'kill zones'; to professionals it means latency arbitrage). The honest version is a time slice where one unit's net edge in R on one instrument is higher out of sample. Agents propose candidates from activity and cost maps (sessions, fixes, releases); QMB proves them on later data; each try is counted. ICT hours are candidates, not evidence."
  inputs: ["unit's trades by time slice and instrument", "cost and activity maps", "try count"]

- id: "A3-structure-regimes-scenarios-145"
  name: "Three bounded agents (macro, microstructure, news) feeding one deterministic risk service"
  source: "research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:43-60,123-150,222"
  kind: "workflow"
  what_it_does: "Asynchronous agents with separate evidence contracts each submit a record with as_of, valid_until, evidence_ids, confidence and risk_scale_proposal. The deterministic service validates schema, timestamps, allow-list and instrument mapping; aggregates; clamps proposals to de-risking only ([0, 1]); applies hard portfolio, drawdown, liquidity, event and session limits; outputs an approved multiplier to the strategy layer, never an order. Stale, malformed or contradictory records are ignored and the configured conservative default applies. Order of authority: his approved configuration, deterministic service and kill switches, strategy execution, agents' advice."
  inputs: ["agent records", "hard limits", "conservative defaults"]
  outputs: ["approved risk multiplier per scope", "rejection log"]
  assumptions: ["agents cannot loosen limits, revive expired signals or change their own status"]
  levels: ["portfolio", "system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Common envelope plus class-specific fields."
  styles_timeframes: "All; the fast path never waits on an agent."
  evidence: "idea"
  known_failures: ["failure of the service must mean no agent-driven change, not a default increase"]
  performance_note: "Agent value is tested by paired runs (no agent, deterministic features, agent, agent plus service)."
  survival_note: "Agents can only reduce risk."
  ledger_ids: ["decision_freshness_bound", "context_size_modifier"]
  new_variables:
    - name: "risk_scale_proposal"
      what: "Agent-proposed multiplier, clamped to [0, 1], with expiry."
  qmx_layer: ["X7", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-027: SwingGuard feeds risk state into proposals."
    - "A3-structure-regimes-scenarios-138: provenance gate before news counts."

# ---------- 6. Stress scenarios and correlated-loss modelling ----------

- id: "A3-structure-regimes-scenarios-146"
  name: "Hours clause: all losses from one move inside a window count as one event"
  source: "research/R3-edge-verification-and-analogues.md:227,232 (Verisk on the hours clause); ledger variable loss_event_window"
  kind: "budget"
  what_it_does: "Reinsurance counts all losses accumulated in a defined number of hours as one event (tornado 24 hours, windstorm 72, flood 168 in the US or 504 in Europe). Borrowed: all units' losses from one market move inside a set window count once for the book's brakes, so five correlated stops read as one big hit, not five strikes, and no unit is benched for a streak it did not have."
  inputs: ["loss timestamps across units", "shared driver tags", "window length"]
  outputs: ["event-grouped losses", "one event charge to the book budget"]
  assumptions: ["the window is set per driver or style"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Window length could follow the instrument's shock persistence: minutes for a data release, hours for a risk-off session, a weekend for crypto."
  styles_timeframes: "Book-level; matters most for many concurrent scalpers."
  evidence: "live"
  known_failures: ["clustered storms make the window contentious (same in markets: aftershocks)", "a too-long window hides independent losses"]
  performance_note: "Count brakes stop firing on healthy units for one shared move."
  survival_note: "The book charges the joint hit in full against one event allowance."
  ledger_ids: ["loss_event_window", "bms_circuit_breaker", "loss_counting_rule", "circuit_breaker_strikes"]
  new_variables:
    - name: "event_window_by_driver"
      what: "Length of the one-event window per shared driver or event type."
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-191: the losing-together scenario this fixes."
    - "A3-structure-regimes-scenarios-195: house money must also wait for the window to close."

- id: "A3-structure-regimes-scenarios-147"
  name: "Mandatory scenario set every book reports against, plus its own"
  source: "research/R3-edge-verification-and-analogues.md:226 (Lloyd's Realistic Disaster Scenarios), :334 (judgment 7)"
  kind: "workflow"
  what_it_does: "Lloyd's keeps mandatory Realistic Disaster Scenarios to stress individual syndicates and the market as a whole, and monitors the total of all syndicate losses. Three sets: compulsory (all report), two of each syndicate's own for losses not captured elsewhere, and specialist ones reported only above a loss threshold. Borrowed: a fixed scenario list every book and unit is run against, plus a few each book adds, with the portfolio total watched."
  inputs: ["compulsory scenario list", "book-specific scenarios", "exposure per book"]
  outputs: ["loss per book per scenario", "portfolio total"]
  assumptions: ["scenarios defined on shared drivers, not tickers"]
  levels: ["cluster", "portfolio", "system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Compulsory set could include a USD shock, an equity crash day, a crypto weekend liquidation, an oil supply shock, a broker outage."
  styles_timeframes: "All."
  evidence: "live"
  known_failures: ["the full RDS specification was unreadable (font encoding); details from the public page only"]
  performance_note: "Books that add little joint loss can earn budget."
  survival_note: "Joint hit measured in advance."
  ledger_ids: ["portfolio_floor", "bms_buffer_before_floor"]
  new_variables:
    - name: "compulsory_scenario_set"
      what: "Fixed list of shared-driver scenarios every book reports against."
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-159: scenario losses become survival gates."
    - "A3-structure-regimes-scenarios-176: his scenario families seed the list."


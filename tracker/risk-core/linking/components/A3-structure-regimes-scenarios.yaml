- id: "A3-structure-regimes-scenarios-057"
  name: "Point-in-time discipline for macro and context inputs"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:42,86-90; chat-28-F-agents-macro-micro-news.md:62-66,107 (OpenPM ts_available <= decision_time)"
  kind: "gate/test"
  what_it_does: "Every macro and context input carries event time and availability time separately; a record is visible only if available at decision time. Gate macro series by vintage (ALFRED), filings by acceptance time, bars until they close, news after a publication lag. Regime features are lagged to when a unit could see them."
  inputs: ["event_time", "available_time", "data vintage"]
  outputs: ["visible or hidden at decision time", "gate log"]
  assumptions: ["vintage archives exist for the inputs used"]
  levels: ["system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Futures continuous series must not leak roll information; crypto news has first-public and ingestion times that differ."
  styles_timeframes: "All, mostly in research and replay."
  evidence: "idea"
  known_failures: ["vendor timestamps can be wrong", "revised series silently replace first releases"]
  performance_note: "Backtests of regime overlays become believable."
  survival_note: "Stops look-ahead from inflating a regime brake's apparent value."
  ledger_ids: ["decision_freshness_bound"]
  new_variables:
    - name: "available_time"
      what: "When an input became knowable to QMX, kept beside its event time."
  qmx_layer: ["X5", "X7"]
  link_hints:
    - "A3-structure-regimes-scenarios-139: the news form of the same rule."

- id: "A3-structure-regimes-scenarios-058"
  name: "Weekend crypto volatility factor and a Monday-open rule"
  source: "research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:49-64,84-89; paper https://www.alphaxiv.org/abs/2610.35702 (Ebadollahyvahed, Umeorah 2026)"
  kind: "detector"
  what_it_does: "A common weekend crypto volatility factor (BTC, ETH, XRP) added to HAR models predicts Monday variance of the S&P 500, gold and a Treasury ETF: one standard deviation gives 27-54 % higher fitted Monday variance and out-of-sample loss falls 11-22 %, only after a structural break in October 2023. Rule: if weekend crypto realised variance is high, raise the expected Monday gap and slippage for index, metals and bond units and cut their opening size."
  inputs: ["weekend crypto range-based variance", "Monday open schedule per class"]
  outputs: ["Monday gap and slippage uplift", "opening-size cut"]
  assumptions: ["the link persists; re-test quarterly"]
  levels: ["portfolio", "cluster", "unit"]
  instrument_classes: ["crypto", "indices", "metals", "futures"]
  class_notes: "Crypto leads; equities, gold and bonds receive. Friday crypto volatility does not do it; coin-specific parts add nothing."
  styles_timeframes: "Monday-open intraday, ORB and swing held over the weekend."
  evidence: "author backtest"
  known_failures: ["daily data, mechanism unresolved, short recent sample", "weak before 2024"]
  performance_note: "Keeps full size on calm-weekend Mondays."
  survival_note: "Shrinks Monday-open exposure after volatile crypto weekends."
  ledger_ids: ["gap_loss_beyond_stop", "cross_market_stress_reading"]
  new_variables:
    - name: "weekend_crypto_vol_factor"
      what: "Common weekend realised volatility of major coins, as a Monday risk input."
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-028: raises Monday X_min for index and metals sleeves (R6 combination)."
    - "A3-structure-regimes-scenarios-059: the link appeared in 2023, so re-test it."

- id: "A3-structure-regimes-scenarios-059"
  name: "Re-test cross-class links on a schedule; they appear and vanish"
  source: "research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:12-15,63; research/R4-alphaxiv/chat-26-D-macrostructure.md:44"
  kind: "workflow"
  what_it_does: "Spillover links between classes change over time (weekend crypto to Monday equities was weak before 2024; crypto's equity beta and USD's haven role are unstable). Isolation and stress rules that rely on a cross-class link are re-tested each quarter and carry the date of their last test."
  inputs: ["link definitions used by isolation and scenarios", "recent data"]
  outputs: ["link valid or retired", "last-tested date"]
  assumptions: ["enough recent episodes to test"]
  levels: ["system", "portfolio"]
  instrument_classes: ["crypto", "indices", "metals", "FX"]
  class_notes: "Crypto-equity and haven links are the least stable."
  styles_timeframes: "Book-level, quarterly."
  evidence: "idea"
  known_failures: ["few episodes per quarter"]
  performance_note: "Drops stale links that would cut good trades."
  survival_note: "Adds new links (like 2023's) before they bite."
  ledger_ids: ["cross_market_stress_reading"]
  new_variables:
    - name: "link_last_tested"
      what: "Date a cross-class link used by a rule was last re-tested."
  qmx_layer: ["X4", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-121: candidate graph detectors would need the same re-test."

- id: "A3-structure-regimes-scenarios-060"
  name: "Old physics multiplier and chaos gate"
  source: "grounding/G3-old-system.md:56,81 (step 0 chaos gate; step 1c row 5, R2:126); grounding/G7-unit-inputs-qmb-mis-instruments.md:156; research/R5-mql5-corpus-ideas.md:487 (MQL5 15332, 15445 chaos 'not the Holy Grail')"
  kind: "sizing rule"
  what_it_does: "A chaos regime was a step-0 block. The physics multiplier blocked a trade if the Ising measure was 1.0 or more or the Lyapunov exponent was above a threshold, else multiplied size by 1 - score with a floor of 0.1. No Ising or Lyapunov code exists in the current stack; MQL5 chaos articles found results vary by instrument."
  inputs: ["Ising-type and Lyapunov measures"]
  outputs: ["block or size multiplier 0.1-1"]
  assumptions: ["the measures carry information about risk"]
  levels: ["trade", "unit"]
  instrument_classes: ["FX"]
  class_notes: "FX-only system; never tested elsewhere."
  styles_timeframes: "Old scalpers and ORB."
  evidence: "old QMX rule (specified; the code is lost; never ran live)"
  known_failures: ["'Ising-type measures have no trading evidence found' (unit-plan research 23)", "threshold never given"]
  performance_note: "None shown."
  survival_note: "Could zero trades in chaotic states, untested."
  ledger_ids: ["physics_multiplier", "context_size_modifier"]
  new_variables: []
  qmx_layer: ["X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-189: persistence readings (Hurst, variance ratio) are the built successors."
    - "A3-structure-regimes-scenarios-185: context_size_modifier is its modern slot."

- id: "A3-structure-regimes-scenarios-061"
  name: "Regime age: taper new adds as a regime ages (hidden semi-Markov durations)"
  source: "research/R5-mql5-corpus-ideas.md:124,553 (MQL5 24460, Part V combination 17)"
  kind: "sizing rule"
  what_it_does: "A plain HMM assumes the chance a regime ends is the same whatever its age; a hidden semi-Markov model gives each regime a duration distribution, so remaining duration is information. Taper new adds as the regime ages. On 8 months of XAUUSD M5, trades closed by the duration gate made money (59.3 % wins) while the system lost."
  inputs: ["regime label and age", "duration distribution per regime"]
  outputs: ["remaining-duration estimate", "size taper for new adds"]
  assumptions: ["durations stable enough to fit"]
  levels: ["unit"]
  instrument_classes: ["metals"]
  class_notes: "Shown on gold M5 only."
  styles_timeframes: "Intraday trend and mean-reversion units."
  evidence: "author backtest"
  known_failures: ["in-sample; system as a whole lost"]
  performance_note: "Adds early in a regime, less late."
  survival_note: "Fewer adds just before a regime ends."
  ledger_ids: ["context_size_modifier"]
  new_variables:
    - name: "regime_age_taper"
      what: "Size taper on new adds as the current regime ages."
  qmx_layer: ["X2", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-062: duration-aware BOCPD estimates the same run length."

- id: "A3-structure-regimes-scenarios-062"
  name: "Duration-aware online changepoint detection with an anti-flap rule"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:55-74; paper https://www.alphaxiv.org/abs/2609.07989 (Jebali 2026); Adams, MacKay 2007"
  kind: "detector"
  what_it_does: "BOCPD keeps a probability over time since the last change. A constant hazard (memoryless regime lengths) forecasts worse on order flow than log-normal durations; Pareto made too many short regimes. One filter per stream beat a joint two-asset model (MSE 0.7705 vs 0.8707). Flag a change only if the most likely run length actually falls, not when it is below a threshold, to stop flapping."
  inputs: ["signed volume in volume-clock buckets or returns", "duration prior"]
  outputs: ["run-length posterior", "change flag"]
  assumptions: ["one stream per filter"]
  levels: ["unit", "cluster"]
  instrument_classes: ["stocks", "futures"]
  class_notes: "Apple, Microsoft, NASDAQ; long memory in order signs is common in equities and futures; crypto and FX untested."
  styles_timeframes: "Intraday regime alarms."
  evidence: "author backtest"
  known_failures: ["two stocks, four months, an internship report", "true change points unknown in real data"]
  performance_note: "Fewer false regime flips keep units trading."
  survival_note: "Faster, steadier change warnings."
  ledger_ids: ["drift_state"]
  new_variables:
    - name: "bocpd_hazard_family"
      what: "Duration distribution used by the changepoint detector (constant, log-normal)."
  qmx_layer: ["X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-044: sticky regime for class brakes, BOCPD for faster per-strategy warnings (T-03 combination)."
    - "A3-structure-regimes-scenarios-065: the BOCPD cooldown brake."

- id: "A3-structure-regimes-scenarios-063"
  name: "Three break detectors with three jobs: confirm, update, early warning"
  source: "research/R5-mql5-corpus-ideas.md:128 (MQL5 20946, stat-arb Part 10)"
  kind: "detector"
  what_it_does: "A Chow test confirms a relationship is dead, a rolling eigenvector comparison says it needs updating, and a recursive CUSUM catches the break early. Each has its own action: warn early, update the model, confirm and retire."
  inputs: ["relationship residuals or returns"]
  outputs: ["early warning", "update flag", "confirmed break"]
  assumptions: ["a stable relationship to monitor (pairs, baskets)"]
  levels: ["unit", "cluster"]
  instrument_classes: ["FX", "indices", "metals"]
  class_notes: "Shown on stat-arb pairs; any correlated group used for isolation could use the same three."
  styles_timeframes: "Stat-arb and basket units; correlation inputs to the book."
  evidence: "author backtest"
  known_failures: ["in-sample"]
  performance_note: "Updating instead of retiring keeps a relationship alive."
  survival_note: "Early warning before a hedge silently dies."
  ledger_ids: ["drift_state", "unit_result_correlation"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-046: a dead hedge in the correlation monitor is what these confirm."

- id: "A3-structure-regimes-scenarios-064"
  name: "Price-side CUSUM volatility alarm, calibrated per instrument"
  source: "research/R5-mql5-corpus-ideas.md:328,454-462 (MQL5 23043, 23103)"
  kind: "detector"
  what_it_does: "An industrial control chart on standardised returns. Across 36 runs on six instruments and three timeframes, the empirical run between alarms averaged 65.7 bars against 338.1 in theory (about five times more alarms), mostly variance shifts, with single-digit-bar latency at macro events. Use as a fast volatility-regime alarm with thresholds fitted per instrument from history, not as an edge-decay test."
  inputs: ["standardised returns per instrument"]
  outputs: ["volatility-shift alarm"]
  assumptions: ["thresholds fitted per instrument against a null"]
  levels: ["unit", "cluster"]
  instrument_classes: ["FX", "metals", "indices"]
  class_notes: "Tested on FX, gold, DE40 and USTEC; false-alarm rate similar across them but far from theory."
  styles_timeframes: "Intraday and scalpers."
  evidence: "author backtest"
  known_failures: ["theory thresholds misfire", "assumes iid normal returns"]
  performance_note: "Cuts size only when volatility actually shifts."
  survival_note: "Fast at macro events."
  ledger_ids: ["cusum_limit", "cusum_allowance_r"]
  new_variables:
    - name: "price_cusum_threshold_by_instrument"
      what: "Per-instrument CUSUM threshold on returns, fitted on history."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-095: fires on many instruments of a class at once feed the class co-move score."

- id: "A3-structure-regimes-scenarios-065"
  name: "Changepoint de-risk cooldown tested against a random brake of equal rate"
  source: "research/R5-mql5-corpus-ideas.md:123 (MQL5 23482)"
  kind: "brake"
  what_it_does: "Each bar gets a probability that the regime just broke; above a level the unit de-risks for a cooldown. Three arms: none, BOCPD, and a random brake with the same trigger rate. BOCPD cut max equity drawdown from 856 to 756 while skipping 4 of 97 trades; the random brake made it worse (1,007). It 'measures change, not direction'."
  inputs: ["changepoint probability per bar"]
  outputs: ["cooldown on, size cut"]
  assumptions: ["the control arm fires at the same rate"]
  levels: ["unit"]
  instrument_classes: ["FX"]
  class_notes: "Single instrument in the article."
  styles_timeframes: "Intraday."
  evidence: "controlled test"
  known_failures: ["all three arms lose money", "few trades"]
  performance_note: "Skips few trades for the drawdown saved."
  survival_note: "A brake that beats chance, not just one that trades less."
  ledger_ids: ["drift_state", "brake_precision"]
  new_variables: []
  qmx_layer: ["X3", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-109: every isolation rule needs the same random control."

# ---------- 3. Microstructure: spread, depth, order flow, liquidity by hour ----------

- id: "A3-structure-regimes-scenarios-066"
  name: "Impact proportional to order-flow imbalance over depth: slippage budget k / depth"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:78-93; paper https://www.alphaxiv.org/abs/1011.6402 (Cont, Kukanov, Stoikov 2014)"
  kind: "cost model"
  what_it_does: "Over short windows the mid change is about linear in OFI at the best quotes, with slope proportional to 1 / depth: a thin book means more impact. Average R^2 65 % on 50 S&P stocks; trade imbalance alone 32 % and adds nothing once OFI is in. Impact at the open is up to twice the day average, because depth is low, not because flow is higher. Use slippage budget = k / depth and top-of-book depth against its own time-of-day norm as a cheap live liquidity gauge."
  inputs: ["level-1 quotes and trades", "depth at the touch"]
  outputs: ["impact slope", "depth-scaled slippage budget"]
  assumptions: ["a central limit order book"]
  levels: ["trade", "node"]
  instrument_classes: ["stocks", "futures", "crypto"]
  class_notes: "Holds in central books; not directly in retail FX or CFDs, where the broker quote is not a public queue."
  styles_timeframes: "Scalpers; session-open entries."
  evidence: "author backtest"
  known_failures: ["one month, US stocks, before many venue changes", "explains price change, does not forecast it"]
  performance_note: "Size up where depth is deep."
  survival_note: "Expect worst slippage at opens and around news."
  ledger_ids: ["slippage_cost", "microstructure_multiplier"]
  new_variables:
    - name: "depth_vs_tod_norm"
      what: "Top-of-book depth against its own time-of-day norm."
  qmx_layer: ["X2", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-069: one input of the execution-risk score."

- id: "A3-structure-regimes-scenarios-067"
  name: "Liquidity withdraws before scheduled news: a news-window execution brake"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:95-109; paper https://www.alphaxiv.org/abs/2508.06788 (Takahashi 2025)"
  kind: "brake"
  what_it_does: "On S&P E-mini futures 2008-2013 (37,029 windows), price impact rises just before a release, fewer orders are submitted, return volatility spikes at release then decays; negative surprises amplify impact; shocks dissipate within one second. Widen expected slippage and block new market orders from a few minutes before to a few minutes after a scheduled release, per affected class; do not scalp the first second."
  inputs: ["release calendar", "affected classes"]
  outputs: ["no-market-order window", "slippage widening"]
  assumptions: ["release times known"]
  levels: ["unit", "node"]
  instrument_classes: ["futures", "indices", "FX"]
  class_notes: "Same pattern across FX, rates and index futures in the papers it cites."
  styles_timeframes: "Scalpers and intraday."
  evidence: "author backtest"
  known_failures: ["one contract, older sample, eight second-tier releases (not CPI or NFP)"]
  performance_note: "Avoids the most expensive minutes for no lost edge."
  survival_note: "Keeps entries out of the liquidity hole."
  ledger_ids: ["news_blackout_before", "news_blackout_after", "slippage_cost"]
  new_variables: []
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-127: the protection window that applies this."
    - "A3-structure-regimes-scenarios-139: one news clock for agent inputs and execution brakes (T-04 combination)."

- id: "A3-structure-regimes-scenarios-068"
  name: "Three-state liquidity label per instrument (calm, mixed, stressed), state first"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:111-128; paper https://www.alphaxiv.org/abs/2607.09230 (Jeon 2026)"
  kind: "detector"
  what_it_does: "Label each minute of a book calm, mixed or stressed by how many of spread, depth and imbalance sit in their worst third (thresholds fitted on training months only). Around 9,773 scheduled macro events on Binance BTC and ETH perps (47,513 windows, 40 monthly folds) the pre-event state was the main predictor of the post-event state; a shallow boosted tree on book shape added a robust gain; order flow added a little for ETH (rising with stress) and nothing robust for BTC. Each layer is credited only if it beats the layer below out of sample and a shuffle test."
  inputs: ["spread, depth, imbalance per minute", "event calendar"]
  outputs: ["liquidity state", "post-event state forecast"]
  assumptions: ["thresholds fitted out of sample"]
  levels: ["unit", "cluster", "node"]
  instrument_classes: ["crypto"]
  class_notes: "Order-flow value differs even inside one class (ETH yes, BTC no)."
  styles_timeframes: "Scalpers and news-adjacent intraday."
  evidence: "author backtest"
  known_failures: ["two assets, one venue, one-minute snapshots", "predicts liquidity, not price"]
  performance_note: "Trades through events when the pre-event state is calm."
  survival_note: "A stressed label is a brake input."
  ledger_ids: ["sqs_score", "brake_state"]
  new_variables:
    - name: "liquidity_state_label"
      what: "Calm, mixed or stressed per instrument per minute."
  qmx_layer: ["X3", "X5", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-079: the 'credit a layer only if it beats the one below' protocol for any new gate."
    - "A3-structure-regimes-scenarios-095: stressed labels across a class feed the co-move score."

- id: "A3-structure-regimes-scenarios-069"
  name: "One execution-risk score per instrument"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:162-165; R6-synthesis.md:141-142 (combination of 1011.6402, 2508.06788, 2607.09230)"
  kind: "measure/telemetry"
  what_it_does: "Combine depth against its time-of-day norm, a news-window flag and the calm, mixed or stressed label into one live execution-risk score per instrument that feeds both the cost model and the brakes."
  inputs: ["depth vs norm", "news window flag", "liquidity state"]
  outputs: ["execution-risk score"]
  assumptions: ["components calibrated per instrument"]
  levels: ["unit", "node"]
  instrument_classes: ["futures", "crypto", "stocks", "FX"]
  class_notes: "FX and CFDs lack true depth; use spread and tick-rate stand-ins."
  styles_timeframes: "Scalpers and intraday."
  evidence: "idea"
  known_failures: ["combination untested as a package"]
  performance_note: "One number lets size fall smoothly in thin conditions."
  survival_note: "Brakes read execution risk directly."
  ledger_ids: ["microstructure_multiplier", "sqs_score", "spread_cost_guard"]
  new_variables:
    - name: "execution_risk_score"
      what: "Composite of depth, news window and liquidity state per instrument."
  qmx_layer: ["X2", "X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-066: depth term."
    - "A3-structure-regimes-scenarios-068: state term."

- id: "A3-structure-regimes-scenarios-070"
  name: "Percentile spread gate against the instrument's own histogram, two windows"
  source: "research/R5-mql5-corpus-ideas.md:149 (MQL5 23355)"
  kind: "gate/test"
  what_it_does: "Judge the live spread against the instrument's own rolling histogram with two percentile thresholds, no per-instrument tuning. A 5-pip edge keeps 4 pips at 1 pip of spread and nothing at 5. Two window lengths separate a spike from a lasting drift, which one window cannot."
  inputs: ["live spread", "rolling spread histogram (short and long window)"]
  outputs: ["allow, warn, block", "spike or drift tag"]
  assumptions: ["histogram from real quotes"]
  levels: ["trade", "node"]
  instrument_classes: ["FX", "metals", "indices", "crypto"]
  class_notes: "Any quoted instrument; baselines must be session-aware for index cash opens and FX rollover."
  styles_timeframes: "Scalpers."
  evidence: "author backtest"
  known_failures: ["one window cannot tell a lasting shift from a spike"]
  performance_note: "Keeps entries in cheap spread states."
  survival_note: "Refuses entries in blowouts."
  ledger_ids: ["sqs_score", "sqs_hard_block_threshold", "sqs_baseline_conditioning", "spread_cost_guard"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-075: SQS is the built version of this gate."

- id: "A3-structure-regimes-scenarios-071"
  name: "Spread-percentile size cut (p75 reduce, p90 reduce materially), refit per instrument"
  source: "research/R5-mql5-corpus-ideas.md:146 (MQL5 22938, Market Microstructure Part 5; thresholds at md/22938.md:484-494)"
  kind: "sizing rule"
  what_it_does: "From 602 NQ M1 sessions: quoted spread proxy above the 75th percentile means widen stops and reduce size; above the 90th, reduce size materially and validate the data feed; noise ratio above p75 means volatility estimates are less reliable. Thresholds are specific to NQ M1 and must be re-derived per instrument, timeframe and window."
  inputs: ["spread proxy", "noise ratio", "per-instrument percentiles"]
  outputs: ["size cut steps", "feed-validation flag"]
  assumptions: ["percentiles from the instrument's own history"]
  levels: ["unit", "trade"]
  instrument_classes: ["indices", "futures"]
  class_notes: "NQ M1 only; Roll spread near zero at one-minute aggregation."
  styles_timeframes: "Scalpers and intraday on M1."
  evidence: "author backtest"
  known_failures: ["in-sample percentiles", "widening stops changes the unit's payoff"]
  performance_note: "Graded rather than binary, so trades continue at smaller size."
  survival_note: "Size falls as execution cost rises."
  ledger_ids: ["microstructure_multiplier", "context_size_modifier"]
  new_variables: []
  qmx_layer: ["X2", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-076: the old microstructure multiplier did the same job without derived thresholds."

- id: "A3-structure-regimes-scenarios-072"
  name: "Session regime labels with 'Stressed overrides everything'"
  source: "research/R5-mql5-corpus-ideas.md:125 (MQL5 22940; rules at md/22940.md:50-95)"
  kind: "detector"
  what_it_does: "Six labels from priority-ordered rules: Stressed first (jump-contaminated session, realised volatility above p90, or volatility and noise both above p75), then Informed, Trending, Noisy, Mean-Reverting, Normal (the residual, 50 % of sessions). Stressed sessions (21 %) have 1.8x normal volatility; Stressed and Noisy get zero directional score. The order is a design choice, not an optimum."
  inputs: ["noise ratio, clustering, flow confidence, VPIN, ARFIMA d, multifractal width, realised volatility"]
  outputs: ["session regime label and confidence"]
  assumptions: ["thresholds from the instrument's own quantiles"]
  levels: ["unit", "cluster"]
  instrument_classes: ["indices", "futures"]
  class_notes: "602 NQ M1 sessions; percentiles must be refit per class."
  styles_timeframes: "Intraday and scalpers."
  evidence: "author backtest"
  known_failures: ["in-sample", "many inputs, much overfit surface"]
  performance_note: "Trending and Informed labels are unit seeds (see unit idea bank)."
  survival_note: "A clear priority rule: stress beats every other signal."
  ledger_ids: ["brake_state", "context_size_modifier"]
  new_variables:
    - name: "session_regime_label"
      what: "Priority-ordered session regime word per instrument."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-095: Stressed labels across a class are isolation evidence."

- id: "A3-structure-regimes-scenarios-073"
  name: "Five execution-noise gates: can the market fill an order now?"
  source: "research/R5-mql5-corpus-ideas.md:80 (MQL5 22772)"
  kind: "gate/test"
  what_it_does: "Five gates must pass before any signal fires: spread expansion, tick velocity, quote gaps, micro-volatility and slippage stability (defaults 2x median spread, 40 ticks per second, 150-point gaps). 'The EA does not predict direction. It predicts whether the market can currently fill an order.'"
  inputs: ["spread vs median", "tick rate", "quote gaps", "micro-volatility", "recent slippage"]
  outputs: ["fillable yes or no with the failing gate"]
  assumptions: ["the same gates run in test and live"]
  levels: ["trade", "node"]
  instrument_classes: ["FX", "metals"]
  class_notes: "Multi-pair FX in the article; tick velocity means quote changes on retail feeds."
  styles_timeframes: "Scalpers."
  evidence: "author backtest"
  known_failures: ["two-month test", "the tester uses looser gates than live, so the backtest checks a different gate"]
  performance_note: "Blocks only unfillable moments."

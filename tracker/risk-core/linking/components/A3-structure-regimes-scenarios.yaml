# ---------- 5. News and event handling ----------

- id: "A3-structure-regimes-scenarios-124"
  name: "His news sectoring: by instrument, region and correlated pairs, then isolate"
  source: "operator M10 (seeds/operator-words-2026-11-03.md:13); seeds/SEEDS.md:560-572 (C27, C28)"
  kind: "config/override pattern"
  what_it_does: "'News differs, man. And it's very broad. You need to sector it... at an instrument level, at a regional level... news in Europe can be scattered. News in New York obviously it's the US. Then news in Tokyo and Asia is different. But remember now we have bots that could trade correlating FX pairs.' On news days, first see which instruments are affected, then the isolation protocol can kick in. He recalls the kill switch handled news in both systems."
  inputs: ["event and its region", "instrument exposure map", "correlated pair groups"]
  outputs: ["affected instruments", "isolation request"]
  assumptions: ["an event-to-instrument map exists"]
  levels: ["portfolio", "node"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "He names FX pairs; the same need covers index CFDs (home exchange), gold (USD and fixes), crypto (its own event classes)."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["on the unit path the kill switch does not handle news today (G9 §2)", "every generation scoped news by currency only"]
  performance_note: "Only affected instruments stop; the rest keep trading."
  survival_note: "Covers correlated pairs a symbol-only map misses."
  ledger_ids: ["news_impact_level_map", "news_region_shift", "isolation_scope"]
  new_variables: []
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-131: driver tags implement the sectoring."
    - "A3-structure-regimes-scenarios-102: news is one input to his isolation protocol."

- id: "A3-structure-regimes-scenarios-125"
  name: "Old news-to-kill-level table with currency scope and fail-safe up"
  source: "grounding/G10-brakes-decay-slots-all-generations.md:211-219,226-230 (KSA:83-92, MIS:308-322, PROT:1126, PRD:709)"
  kind: "brake"
  what_it_does: "LOW: nothing. MEDIUM: YELLOW at T-5 min, GREEN at T+10. HIGH: ORANGE at T-15, GREEN at T+20. EXTREME: RED at T-30, YELLOW for 60 minutes, then GREEN. The event's currency maps to every pair holding it ('a JPY-impact event at HIGH impact will trigger ORANGE for all JPY-denominated pairs'); if scope resolution fails, block all symbols; low classification confidence escalates. Calendar from Forex Factory and MyFXBook, correlated and confidence-marked, plus a live news provider for unscheduled events."
  inputs: ["event impact and time", "currency", "scope table", "classification confidence"]
  outputs: ["kill level per pair over time"]
  assumptions: ["impact labels meaningful"]
  levels: ["node", "portfolio"]
  instrument_classes: ["FX"]
  class_notes: "Currency-only; indices, gold, oil and crypto unmapped."
  styles_timeframes: "All FX styles."
  evidence: "old QMX rule (specified in April; never ran)"
  known_failures: ["news levels cleared by timer while 'automated triggers cannot de-escalate'", "provider colours are editorial labels"]
  performance_note: "Short windows for low impact keep trading time."
  survival_note: "Fail-safe up blocks all when scope is unknown."
  ledger_ids: ["kill_switch_level", "news_blackout_before", "news_blackout_after", "news_impact_level_map", "kill_switch_detector_posture"]
  new_variables: []

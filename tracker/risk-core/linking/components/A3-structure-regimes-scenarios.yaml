- id: "A3-structure-regimes-scenarios-027"
  name: "Swing dual-timescale risk loop (daily agents, 5-minute deterministic controller)"
  source: "research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:76-95; paper https://www.alphaxiv.org/abs/2610.12988 (SwingGuard 2026)"
  kind: "control loop"
  what_it_does: "Daily agents form a long-only target; a separate 5-minute risk controller runs a rule screen, then a 6-hour accumulation check, then an LLM diagnosis only if triggered. It keeps a persistent state NORMAL, ALERT, SURVIVAL, RECOVERY with hysteresis, minimum holds and staged re-entry. Feeding the risk state into the proposal step raised Sharpe 2.79 to 2.98; removing the fast controller did the most damage (Sharpe 1.87, drawdown -14.19 %)."
  inputs: ["5-minute bars", "agent daily targets", "news, on-chain and macro inputs"]
  outputs: ["risk state", "capped position"]
  assumptions: ["the fast loop never waits on the LLM"]
  levels: ["unit", "portfolio"]
  instrument_classes: ["crypto"]
  class_notes: "BTC and ETH only; the dual-timescale idea is generic. Class-specific fast tells would replace the crypto rule screen."
  styles_timeframes: "Swing (daily decisions) with a 5-minute guard."
  evidence: "author backtest"
  known_failures: ["six months, two coins, one GPT-4o setup, long-only", "no trial count reported; many design choices"]
  performance_note: "In the backtest the capped book beat equal-weight buy-and-hold on Sharpe (2.98 vs 1.19) and drawdown (6.44 % vs 28.47 %); survived 50 bp costs at Sharpe 2.15."
  survival_note: "A fast deterministic loop can force exposure to zero without waiting for the slow agents."
  ledger_ids: ["brake_state", "drift_state"]
  new_variables: []
  qmx_layer: ["X0", "X3", "X7"]
  link_hints:
    - "A3-structure-regimes-scenarios-041: the same two-speed split appears for macro state."
    - "A3-structure-regimes-scenarios-107: staged recovery matches the isolation lifecycle."

- id: "A3-structure-regimes-scenarios-028"
  name: "Worst one-step move table per class and holding time"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:29-45 (Hsieh 2026, https://www.alphaxiv.org/abs/2609.23272); research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:18-20"
  kind: "scenario"
  what_it_does: "Cushion-based drawdown control guarantees its cap only given a bound on the worst one-step move per instrument (X_min). Keep that bound as a stress-scenario table per class and per holding time (FX majors small; crypto and single stocks large; index CFDs over weekends large), set from stress scenarios, not from recent volatility."
  inputs: ["historical and hypothetical worst moves per class", "holding time", "weekend and event flags"]
  outputs: ["X_min per instrument and holding horizon"]
  assumptions: ["the table is wider than recent volatility suggests"]
  levels: ["position", "unit", "account"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Crypto wicks 24/7; FX weekend and SNB-type gaps; stocks earnings gaps; energy limit moves; metals fix and roll."
  styles_timeframes: "All; widens with holding time."
  evidence: "simulation"
  known_failures: ["a gap beyond X_min (weekend, news, broker outage) voids the guarantee"]
  performance_note: "A tight but honest bound for liquid classes leaves more cushion to use."
  survival_note: "The pathwise drawdown guarantee rests on it."
  ledger_ids: ["gap_loss_beyond_stop", "high_water_mark_equity", "kill_line_floor"]
  new_variables:

# ---------- 2. Macrostructure: regimes, cross-asset links, macro drivers ----------

- id: "A3-structure-regimes-scenarios-041"
  name: "Macro state as a slow budget governor beside a fast market layer"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:12,31-46,156-158,167 (assistant)"
  kind: "control loop"
  what_it_does: "Macro state changes how much risk the book may carry, never which trades a unit takes. A slow layer (a few interpretable states such as calm expansion, inflation or rates stress, growth risk-off, liquidity or volatility shock, recomputed daily and at scheduled releases) sets a budget multiplier; a fast layer (realised volatility, conditional covariance, liquidity and book exposure, every 5-15 minutes and before each order) decides how much of that budget is usable now. Limits fall fast and rise slowly with hysteresis; an uncertain or conflicting state means an intermediate reduced budget; stale inputs fall back to a pre-approved conservative state."
  inputs: ["point-in-time macro releases and surprises", "yields, curve slope, USD, credit, commodities", "realised volatility at several horizons", "spread and slippage measures", "book exposures"]
  outputs: ["macro-state probabilities", "slow budget multiplier", "fast usable-budget multiplier"]
  assumptions: ["releases enter only when published", "states use probabilities, not brittle labels"]
  levels: ["portfolio", "account"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Crypto has too little macro history for its own macro model: use macro as a shared overlay and let crypto's own realised risk drive its limits. Energy needs contract fundamentals (inventories, weather) beside macro. FX needs pair-relative macro (both legs)."
  styles_timeframes: "Book-level for all styles; the macro layer is daily, never an intraday predictor."
  evidence: "idea"
  known_failures: ["macro data are revised and lagged", "a model fitted to one rate era misclassifies the next", "daily macro cannot predict intraday moves"]
  performance_note: "Volatility management can raise Sharpe when risk rises faster than return; macro state can also release budget in calm states."
  survival_note: "Shrinks the whole book before a broad shock spends many unit budgets at once."
  ledger_ids: ["portfolio_daily_risk_budget", "cross_market_stress_reading", "volatility_target", "board_stale_after"]
  new_variables:
    - name: "macro_state_probabilities"
      what: "Filtered probabilities over a small set of named macro states."
    - name: "macro_budget_multiplier"
      what: "Slow multiplier on the book's risk budget from macro state."
    - name: "state_unknown_fallback"
      what: "Pre-approved conservative multiplier used when inputs are stale or disagree."
  qmx_layer: ["X0", "X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-042: the class-limit formula applies this multiplier per class."
    - "A3-structure-regimes-scenarios-043: Hamilton filtered probabilities produce the state."
    - "A3-structure-regimes-scenarios-152: macro state selects which stress scenarios apply."

- id: "A3-structure-regimes-scenarios-042"
  name: "Class limit = approved cap x macro-state multiplier x volatility and liquidity multiplier"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:123-154 (assistant's starting policy, not a paper result)"
  kind: "budget"
  what_it_does: "Each class's cap in risk units (stressed loss, not lots) is its approved normal cap times a macro-state multiplier times a book-wide volatility and liquidity multiplier, with a total stressed-loss cap that overrides the sum of class caps. Starting table: calm 1.00 for equities, FX, rates, metals, 0.75 energy, 0.50 crypto; growth risk-off 0.50/0.65/0.80/0.65/0.40/0.25; inflation or rate shock 0.65/0.70/0.40/0.70/0.60/0.35; volatility, liquidity or correlation shock 0.25 everywhere."
  inputs: ["approved normal cap per class", "macro state", "volatility and liquidity state"]
  outputs: ["class risk limit", "total stressed-loss check"]
  assumptions: ["caps in risk units", "multipliers backtested before use"]
  levels: ["portfolio"]
  instrument_classes: ["indices", "stocks", "FX", "metals", "energy", "crypto", "futures"]
  class_notes: "Futures map to the factor class of their underlying. An index future and an ETF on the same index draw from one factor budget."
  styles_timeframes: "Book-level, all styles."
  evidence: "idea"
  known_failures: ["multipliers are guesses until backtested", "six compliant class caps do not prove the combined book safe"]
  performance_note: "Class budgets in calm states can run at full approved size."
  survival_note: "A shock state cuts every class to a quarter at once."
  ledger_ids: ["cluster_exposure_cap", "portfolio_exposure", "instrument_class"]
  new_variables:
    - name: "class_state_multiplier_table"
      what: "Macro-state by class multiplier table on approved class caps."
  qmx_layer: ["X2", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-048: factor caps sit beside class caps."
    - "A3-structure-regimes-scenarios-049: the stressed correlation floor is the companion stress check."

- id: "A3-structure-regimes-scenarios-043"
  name: "Filtered regime probabilities (Hamilton Markov switching), never smoothed labels"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:76-90; chat-08-risk-off-regimes.md:33,41; Hamilton 1989 https://doi.org/10.2307/1912559; Filardo 1994; Hamilton 2011 'Calling Recessions in Real Time'"
  kind: "detector"
  what_it_does: "A latent-state model with a Markov transition matrix updates state probabilities as each observation arrives. Hand the risk service the filtered probability vector P(state at t given data through t). Smoothed probabilities use later data and leak the future into backtests."
  inputs: ["macro or market series (growth, inflation surprises, yields, stress indicators)", "transition model"]
  outputs: ["filtered state probabilities"]
  assumptions: ["data vintages and publication timestamps used", "states persistent"]
  levels: ["portfolio"]
  instrument_classes: ["indices", "FX", "metals", "energy", "futures"]
  class_notes: "Original application quarterly GNP; market inputs can run daily. Crypto history too short for its own fit."
  styles_timeframes: "Book-level, daily."
  evidence: "author backtest"
  known_failures: ["detection lags a transition", "states hard to interpret", "misclassifies a new rate era"]
  performance_note: "Gives a gradual budget dial instead of a binary switch."
  survival_note: "Persistent stress states keep the budget reduced."
  ledger_ids: ["cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-044: a jump penalty makes the regime sticky and robust to delay."
    - "A3-structure-regimes-scenarios-152: filtered state selects stress scenarios (chat-26 combination 8)."

- id: "A3-structure-regimes-scenarios-044"
  name: "Sticky statistical jump model as a per-class regime brake"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:34-53; paper https://www.alphaxiv.org/abs/2402.05272 (Shu, Yu, Mulvey 2024)"
  kind: "brake"
  what_it_does: "Cluster days into bull and bear like k-means over time, plus a fixed penalty each time the label changes, so regimes persist; the penalty is chosen by time-series cross-validation. Hold the index in bull, the safe asset in bear. On US, German and Japanese indices 1990-2023 with costs and a one-day delay it lowered volatility and max drawdown, raised annual return about 1-4 %, beat an HMM switch, and stayed robust to delays up to two weeks."
  inputs: ["daily index returns", "risk and return features", "jump penalty"]
  outputs: ["regime label per day", "class gross cut"]
  assumptions: ["penalty fitted out of sample", "average regime length reported"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["indices"]
  class_notes: "Tested on equity indices only; crypto and FX regime lengths differ, so the penalty needs its own fit per class."
  styles_timeframes: "Daily; acts on books of any style through gross exposure."
  evidence: "author backtest"
  known_failures: ["a 0/1 switch is coarse", "penalty chosen on strategy performance can overfit"]
  performance_note: "Added return and Sharpe in the backtest, not only lower drawdown."
  survival_note: "Cuts a class's gross in bear regimes and tolerates detection delay."
  ledger_ids: ["isolation_scope", "market_isolation_trigger"]
  new_variables:
    - name: "regime_jump_penalty"
      what: "Penalty per label change in the jump model, fitted per class."
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-045: use the regime to cut gross, never to re-weight."
    - "A3-structure-regimes-scenarios-095: slow sticky regime plus fast co-move spike on one class (T-07 combination)."

- id: "A3-structure-regimes-scenarios-045"
  name: "Regimes cut gross; they never re-weight strategies"
  source: "research/R6-alphaxiv-papers/T-01-portfolio-optimisation-and-sizing.md:135-147; paper https://www.alphaxiv.org/abs/2610.27751 (Regime NCO 2026)"
  kind: "config/override pattern"
  what_it_does: "Nested clustered optimisation with a rolling Gaussian HMM regime filter on five assets churned (24.58 % monthly turnover, net 1.60 %, drawdown 9.99 %) against plain NCO (29.97 % cumulative, drawdown 2.18 %, turnover 5.41 %). Regime signals may cut gross exposure; they may change allocation weights only if the regime is sticky and switching costs are charged."
  inputs: ["regime signal", "allocator weights"]
  outputs: ["gross multiplier only"]
  assumptions: ["small universes give tiny regime sub-samples"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["stocks", "metals", "FX", "crypto"]
  class_notes: "Mixing crypto with bonds in one tree made regime sub-samples tiny."
  styles_timeframes: "Monthly allocator in the paper; the rule applies to any allocator cadence."
  evidence: "author backtest"
  known_failures: ["N = 5, one country, flat 10 bp costs"]
  performance_note: "Avoids turnover that eats the allocator's gains."
  survival_note: "Keeps a noisy regime label from reshuffling risk."
  ledger_ids: ["slot_rebalance_rule"]
  new_variables: []
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-044: the sticky regime brake that respects this rule."

- id: "A3-structure-regimes-scenarios-046"
  name: "Conditional correlation monitor (DCC or exponentially weighted), with asymmetric dynamics"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:92-106 (Engle 2002; Cappiello, Engle, Sheppard 2006; Aielli 2013); research/R5-mql5-corpus-ideas.md:57 (MQL5 23322, lambda 0.94)"
  kind: "measure/telemetry"
  what_it_does: "Standardise each series by its own conditional volatility, update a correlation matrix from recent co-movement plus persistence, and combine with volatilities into a conditional covariance. The MQL5 version uses exponential weights (lambda 0.94, effective window about 16.7) so a hedge that fell from 0.85 to 0.30 correlation stops counting as a hedge, and stays inert until configured. Correlations rise asymmetrically in sell-offs."
  inputs: ["synchronised returns of instruments or units"]
  outputs: ["conditional correlation and covariance", "risk contributions"]
  assumptions: ["a common clock; closed markets not filled with zeros"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Daily fits cannot see minute-scale breaks; minute data across FX, futures, equities and 24/7 crypto bring asynchronous trading and stale prices."
  styles_timeframes: "Book-level."
  evidence: "author backtest"
  known_failures: ["reactive, not leading", "slow or unstable across a structural break", "misses tail dependence; cold start"]
  performance_note: "Spots fading diversification so budgets can be rebalanced."
  survival_note: "Feeds the same-bet check with current correlations instead of stale ones."
  ledger_ids: ["unit_result_correlation", "portfolio_correlation_ceiling", "correlation_multiplier"]
  new_variables:
    - name: "correlation_decay_lambda"
      what: "Weight decay of the exponentially weighted correlation estimator; inert until set."
  qmx_layer: ["X2", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-049: supplement with a stressed correlation floor."
    - "A3-structure-regimes-scenarios-088: turbulence needs the same covariance, cleaned."

- id: "A3-structure-regimes-scenarios-047"
  name: "Volatility-managed scaling with a cap (inverse variance or inverse volatility)"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:108-121; chat-29-G-multi-asset-normalisation.md:52-70,130-138 (Moreira, Muir 2017; Cederburg et al. 2020); research/R2-trader-practice-windows-drift-isolation-breadth.md:239-243"
  kind: "sizing rule"
  what_it_does: "Scale exposure inversely to recently realised variance (Moreira-Muir) or volatility (a stable risk contribution), normalised and capped. Moreira-Muir report Sharpe increases of about 50-100 % on equity factors and FX carry; Cederburg et al. found the benefit does not survive real-time evaluation across 103 strategies. Treat it as tail control at book level, not as edge."
  inputs: ["realised variance from recent returns", "cap on the multiplier"]
  outputs: ["exposure multiplier per sleeve"]
  assumptions: ["volatility persistent", "multiplier capped"]
  levels: ["unit", "cluster", "portfolio"]
  instrument_classes: ["indices", "FX", "stocks", "futures"]
  class_notes: "Helped Sharpe only for risk assets across 60+ assets, though it cut extreme returns everywhere. Crypto weekends and contract rolls break simple estimators."
  styles_timeframes: "Monthly in the paper; use a shorter validated estimator for short horizons."
  evidence: "author backtest"
  known_failures: ["levers up after quiet spells just before jumps", "lags gaps", "whipsaw and turnover", "volatility is not liquidity"]
  performance_note: "Can raise Sharpe where risk rises faster than return."
  survival_note: "Cuts exposure in volatile spells; useless against the first gap."
  ledger_ids: ["volatility_target", "context_size_modifier"]
  new_variables: []
  qmx_layer: ["X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-041: the fast layer of the macro governor."
    - "A3-structure-regimes-scenarios-053: implied volatility adds a forward-looking input."

- id: "A3-structure-regimes-scenarios-048"
  name: "Two layers of caps: factor exposure (USD, equity beta, duration, energy, crypto) and instrument"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:146-152,183; chat-29-G-multi-asset-normalisation.md:29,74-83 (Sigma = B Sigma_F B' + D)"
  kind: "budget"
  what_it_does: "Map every position to common factors (USD, equity beta by region, rates and duration, commodities, crypto beta, plus basis and residual) and cap factor exposure across all units, so several agents cannot each spend a separate limit on one underlying bet. Below that, a tighter instrument or contract cap reflects leverage, margin, liquidity and gaps."
  inputs: ["positions in account-currency P&L", "factor loadings B", "factor covariance", "residual risk"]
  outputs: ["factor exposures", "factor cap checks", "component risk contributions"]
  assumptions: ["factor definitions right", "a factor model exists per class"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "FX loads on USD and carry; indices on regional equity beta, rates, USD, vol; gold on USD, real rates, haven demand; industrial metals on growth; energy on oil and gas benchmarks; crypto on BTC/ETH beta and USD liquidity; stocks on market, sector, style."
  styles_timeframes: "Book-level."
  evidence: "idea"
  known_failures: ["covariance understates crisis co-movement", "roll handling can create fake P&L"]
  performance_note: "Lets genuinely different factor bets keep their own budgets."
  survival_note: "Stops ten 'different' units from being one USD bet."
  ledger_ids: ["currency_exposure_limit", "per_instrument_exposure_cap", "cluster_exposure_cap", "portfolio_exposure"]
  new_variables:
    - name: "factor_exposure_cap"
      what: "Cap on aggregate exposure to one common factor across all units."
  qmx_layer: ["X2", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-050: currency legs are the exact FX version."
    - "A3-structure-regimes-scenarios-148: CRESTA-style zones are the insurance analogue of factor buckets."

- id: "A3-structure-regimes-scenarios-049"
  name: "Stressed correlation floor and stock-bond sign-change tightening"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:44,150,207 (assistant); 'The Determinants of Stock and Bond Return Comovements' 2010"
  kind: "scenario"
  what_it_does: "Size and cap against the higher of measured and stressed correlation; tighten limits on strategies that rely on bonds hedging equities when the stock-bond correlation changes sign or rises sharply; keep a scenario where correlations move toward one during a liquidity shock."
  inputs: ["measured correlation", "stress correlation assumption", "stock-bond correlation"]
  outputs: ["correlation used for sizing", "tightened caps on hedge-dependent strategies"]
  assumptions: ["stress correlation set per driver"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["indices", "futures", "FX", "metals", "crypto"]
  class_notes: "Bonds diversify equities in growth scares but not in inflation shocks; USD strength can be haven, rates or funding; crypto's equity link is unstable."
  styles_timeframes: "Book-level."
  evidence: "idea"
  known_failures: ["'set every correlation to one' is not a sufficient stress test on its own (conv-01)"]
  performance_note: "Measured correlation is used in calm times, so diversification still pays."
  survival_note: "New entries in a spike are sized as if correlation were high."
  ledger_ids: ["portfolio_correlation_ceiling", "correlation_multiplier", "unit_result_correlation"]
  new_variables:
    - name: "correlation_stress_rho"
      what: "Stressed correlation per shared driver used as a floor in sizing."
  qmx_layer: ["X2", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-192: the correlation spike scenario."

- id: "A3-structure-regimes-scenarios-050"
  name: "Currency-leg exposure for FX; covariance for other classes"
  source: "research/R5-mql5-corpus-ideas.md:31,195-196,237 (MQL5 24392); research/R4-alphaxiv/chat-26-D-macrostructure.md:175 (Lustig, Roussanov, Verdelhan 2011)"
  kind: "measure/telemetry"
  what_it_does: "FX positions split exactly into currency legs: long EURUSD, long GBPUSD and short USDJPY are one bet against the dollar. Measure net and gross exposure per currency in account-currency notional, asking for base and quote from the broker, never parsing symbol names. Metals, indices and crypto do not split into legs, so they need covariance. FX pairs share dollar and carry factors."
  inputs: ["positions", "base and quote currency from the broker", "conversion rates"]
  outputs: ["net and gross exposure per currency", "per-currency limit checks"]
  assumptions: ["broker metadata gives base and quote"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["FX", "metals"]
  class_notes: "Exact for FX only; gold quoted in USD loads on USD but is not a leg. Instrument records today hold the quote currency only; no base-currency field."
  styles_timeframes: "All FX styles."
  evidence: "author backtest"
  known_failures: ["two EAs passing one limit on the same tick race without a lock", "state lost on restart"]
  performance_note: "Offsetting legs net out, so units on different pairs need not be cut."
  survival_note: "Catches hidden one-currency concentration."
  ledger_ids: ["currency_exposure_limit", "portfolio_exposure", "netting_mode"]
  new_variables:
    - name: "base_currency"
      what: "Base currency of an FX instrument, from broker metadata."
  qmx_layer: ["X2", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-131: driver tags need both FX legs for news scope too."
    - "A3-structure-regimes-scenarios-116: rk2 turns positions into currency legs in R."

- id: "A3-structure-regimes-scenarios-051"
  name: "Oil shock type as a scenario selector (supply vs demand)"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:22,59 (Kilian 2009, https://doi.org/10.1257/aer.99.3.1053)"
  kind: "scenario"
  what_it_does: "The same oil move can be a supply shock (raises inflation risk while growth assets weaken) or demand-driven. On a supply shock tighten energy and inflation-sensitive exposure and reassess correlated FX and index positions rather than treating the commodity trade as isolated."
  inputs: ["oil move", "accompanying growth and inflation signals"]
  outputs: ["shock type", "linked tightening list"]
  assumptions: ["shock type identifiable in time"]
  levels: ["portfolio"]
  instrument_classes: ["energy", "FX", "indices", "metals"]
  class_notes: "Commodity currencies (CAD, NOK) and inflation-linked rates move with a supply shock."
  styles_timeframes: "Book-level."
  evidence: "idea"
  known_failures: ["identification is slow and model-based"]
  performance_note: "Avoids cutting units unaffected by a demand-driven move."
  survival_note: "Catches the cross-class spillover of a supply shock."
  ledger_ids: ["cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-152: a coherent driver hypothetical built on this split."

- id: "A3-structure-regimes-scenarios-052"
  name: "Volatility level vs volatility term structure as separate states"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:46,60"
  kind: "detector"
  what_it_does: "A high but easing volatility level differs from volatility rising sharply with the front of the curve above deferred maturities. On rising front-end volatility or deteriorating liquidity, scale gross down, reduce simultaneous positions and disable strategies whose edge depends on normal spreads or continuous fills. An equity volatility index is not a universal gauge for FX, commodities or crypto."
  inputs: ["realised volatility per market", "implied term structure where liquid"]
  outputs: ["volatility level state", "term-structure state"]
  assumptions: ["implied data exist (indices, gold, some FX)"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["indices", "metals", "FX"]
  class_notes: "Term structure is available for equity indices and gold; less for FX crosses; crypto options are venue-specific."
  styles_timeframes: "Book-level."
  evidence: "idea"
  known_failures: ["implied data paid or missing for many CFDs"]
  performance_note: "Keeps size in high-but-easing states."
  survival_note: "Cuts early in inverting-curve stress."
  ledger_ids: ["volatility_target", "cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-053: implied/realised ratio is the forward input."

- id: "A3-structure-regimes-scenarios-053"
  name: "Forward-looking volatility input: implied over realised ratio"
  source: "research/R5-mql5-corpus-ideas.md:126 (MQL5 23734, gold)"
  kind: "measure/telemetry"
  what_it_does: "Most sizing rules look back at realised volatility; implied volatility looks forward. Use the implied-to-realised ratio as a size input where options exist. The article warns it is 'not a timing trigger'. Its data bridge (compute outside, publish JSON, read in a service) works for any data."
  inputs: ["implied volatility", "realised volatility"]
  outputs: ["ratio and stress word"]
  assumptions: ["option data available and timely"]
  levels: ["unit", "portfolio"]
  instrument_classes: ["metals", "indices", "FX"]
  class_notes: "Gold, indices and major FX have options; most CFDs and many crypto venues do not."
  styles_timeframes: "Intraday to swing sizing."
  evidence: "author backtest"
  known_failures: ["not a timing trigger", "variance risk premium makes the ratio usually above one"]
  performance_note: "Cuts size before realised volatility catches up."
  survival_note: "Earlier warning than realised-only sizing."
  ledger_ids: ["context_size_modifier", "volatility_target"]
  new_variables:
    - name: "implied_realised_vol_ratio"
      what: "Implied over realised volatility per instrument with options."
  qmx_layer: ["X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-074: combine with activity and spread stress into one forward stress multiplier (R5 combination 12)."

- id: "A3-structure-regimes-scenarios-054"
  name: "Multi-horizon realised volatility forecaster (HAR-RV)"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:24 (Corsi 2009, https://doi.org/10.1093/jjfinec/nbp001); research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:50-54 (HAR used for Monday variance)"
  kind: "measure/telemetry"

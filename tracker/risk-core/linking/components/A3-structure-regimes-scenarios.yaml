  source: "expansion/drafts-stopped/X4-scenarios.md:459-469 (X4-scenarios-35)"
  kind: "scenario"
  what_it_does: "A 20 % currency move in minutes; stops fill 10 % through; the broker's book is wrecked; negative balances appear. The only sizing defence: per-driver exposure small enough that a 20 % gap costs at most the buffer before the floor, plus a broker with negative-balance protection (to check per broker). Kill switch all with close-and-pause after the event; reconcile hold. Sim pass: SNB replay with the cap on: worst loss as a share of seed per cap level. Draft guess: L1 / S5."

- id: "A3-structure-regimes-scenarios-056"
  name: "Regime-weighted conformal calibration of a tail-loss bound"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:190,210; paper https://arxiv.org/abs/2602.03903 (Taming Tail Risk 2026)"
  kind: "measure/telemetry"
  what_it_does: "Calibrate a GARCH-based 99 % VaR against recent forecast errors with regime weighting. On a CRSP index sample: 0.63 % exceedances with a 381 bp average bound, against 1.94 % and 260 bp uncalibrated, and 1.14 % and 330 bp for a feedback method. Fewer breaches cost a wider bound. Value depends on the base forecaster; it helps most when that adapts slowly."
  inputs: ["base VaR forecast", "recent forecast errors", "regime weights"]
  outputs: ["calibrated tail-loss bound"]
  assumptions: ["enough effective sample in the regime"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["indices"]
  class_notes: "Shown on one equity index; needs re-validation per class."
  styles_timeframes: "Daily book-level."
  evidence: "author backtest"
  known_failures: ["coverage results, not returns or drawdown", "does not replace a hard account stop"]
  performance_note: "Capital efficiency falls as coverage improves: an explicit trade."
  survival_note: "Fewer tail breaches of the bound."
  ledger_ids: ["portfolio_daily_risk_budget"]
  new_variables:
    - name: "calibrated_tail_bound"
      what: "Conformally calibrated tail-loss bound for the book or a class."
  qmx_layer: ["X3", "X4"]
  link_hints:

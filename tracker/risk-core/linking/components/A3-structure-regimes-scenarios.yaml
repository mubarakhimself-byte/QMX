- id: "A3-structure-regimes-scenarios-163"
  name: "Effective independent bets (N_eff) next to the unit count"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:197-210,278; research/R4-alphaxiv/chat-02-breadth-effective-bets.md:16-35,49,75"
  kind: "measure/telemetry"
  what_it_does: "For N equal bets with average correlation rho, N_eff = N / (1 + (N - 1) rho) and the Sharpe ceiling is (per-bet Sharpe) / sqrt(rho) however many bets: at 0.05R per trade and rho 0.05 the ceiling is 0.22. Spectral counts on the shrunk correlation of net unit returns (participation ratio, entropy effective rank) describe the return universe; risk-contribution concentration (1 / sum RC_i^2) describes the allocation; the diversification ratio compares standalone with portfolio risk. Publish spectral rank, allocation concentration and out-of-sample incremental net performance together. Ten scalpers on USD pairs in the London-New York overlap may be two or three bets."
  inputs: ["net unit returns at the risk horizon", "weights", "covariance"]
  outputs: ["N_eff spectral", "N_eff allocation", "diversification ratio"]
  assumptions: ["shrunk covariance", "correlation of returns at the decision horizon"]
  levels: ["cluster", "methodology", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "The correlation that bites is shared exposure (USD pairs on one release, classes on one risk-off day) and edge fading in one logic, not noise between hours."
  styles_timeframes: "All; the frequency thesis rests on it."
  evidence: "idea"
  known_failures: ["a high rank is not evidence of diversified alpha", "awkward with negative contributions"]
  performance_note: "Breadth across classes and hours is worth more than more units on one theme."
  survival_note: "Shows when ten units are one bet."
  ledger_ids: ["effective_independent_bets", "effective_bets_drop_trip", "live_unit_count", "unit_result_correlation"]
  new_variables: []
  qmx_layer: ["X2", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-193: crowding scenario reports N_eff."
    - "A3-structure-regimes-scenarios-161: N_eff sets the parent limit."

- id: "A3-structure-regimes-scenarios-164"
  name: "Correlation in the edge: one logic fading everywhere, caught on the pooled stream"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:209; expansion/drafts-stopped/X4-scenarios.md:79-89 (X4-04)"
  kind: "detector"
  what_it_does: "All edges of one logic can fade together in a regime change: a correlation in the edge itself that no bet count removes. Pool the R of every unit sharing a logic and run a CUSUM on the pooled stream; a pool of ten sees a drop in days where one unit needs about 240 trades. The step is one size level down for the methodology, not off, undone on new evidence."
  inputs: ["methodology tag per unit", "trade R per unit"]
  outputs: ["pooled drift state", "methodology size step"]
  assumptions: ["units share one logic"]
  levels: ["methodology"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Mean-reversion units across classes fail together when markets trend."
  styles_timeframes: "All; strongest for many small scalpers of one logic."
  evidence: "idea"
  known_failures: ["pooled correlated units overstate evidence"]
  performance_note: "A cheap step-down, no unit killed for a bad week."
  survival_note: "Catches the regime failure no single unit sees."
  ledger_ids: ["drift_state", "cusum_limit", "drift_size_down_step"]
  new_variables:
    - name: "methodology_pooled_cusum"
      what: "CUSUM on the pooled R of all units sharing one logic."
  qmx_layer: ["X3", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-194: the X4 scenario that states it."

- id: "A3-structure-regimes-scenarios-165"
  name: "Crowding scenario: many similar agents turn one headline into a crash"
  source: "research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:65-89; paper https://www.alphaxiv.org/abs/2609.19705 (FARSIGHT 2026)"
  kind: "scenario"
  what_it_does: "In a simulated market driven by LLM agents, one fake headline crashed the market in all runs with 400 agents (2 % with 100, 92 % with 200); 400 sell-on-fall agents deepened a 2010-sized crash from 9.2 % to 17.3 %; the exchange LULD pause never triggered in headline runs. A fast path plus hard loss limits (halt any agent losing over 3 % of a full position, using broker prices, not text) removed both effects at a cost of 'a few false halts per calm hour'; a breached limit must halt, not sell (agents selling after true bad news overshot by 9.6-11.1 %)."
  inputs: ["agent population", "shared feed", "loss limits"]
  outputs: ["crash depth with and without halts"]
  assumptions: ["agents share a signal or feed"]
  levels: ["system", "portfolio"]
  instrument_classes: ["stocks", "crypto"]
  class_notes: "Worst where many retail bots trade the same thin market (small-cap crypto, single stocks)."
  styles_timeframes: "All."
  evidence: "simulation"
  known_failures: ["simulated single stock; hypothetical populations"]
  performance_note: "Halts cost a few false halts per calm hour."
  survival_note: "Shows why QMX's own units sharing one signal are one risk."
  ledger_ids: ["kill_switch_effect_matrix", "bms_circuit_breaker"]
  new_variables: []
  qmx_layer: ["X4", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-193: crowding inside QMX."
    - "A3-structure-regimes-scenarios-138: fake news is the trigger."


- id: "A3-structure-regimes-scenarios-141"
  name: "'Exchange resumed' is not a re-enable signal"
  source: "research/R4-alphaxiv/R4-alphaxiv-synthesis.md:290-293,371 (High Frequency Trading and Mini Flash Crashes 1211.6667; Breaking news 2603.22835; Agentic LOBs 2609.31260); chat-08-risk-off-regimes.md:177"
  kind: "gate/test"
  what_it_does: "Breakers around news can interrupt price discovery; 'wait, then resume' does not mean conditions normalised. After a halt or event, require spreads, depth and fills back inside collars before re-entry, then re-enter small and staggered. During an event, use spread, liquidity and price checks so exits are not sent into a stale market."
  inputs: ["spread, depth, fill quality after resumption"]
  outputs: ["re-enable allowed or not"]
  assumptions: ["post-event baselines exist"]
  levels: ["node", "cluster"]
  instrument_classes: ["stocks", "indices", "futures", "crypto"]
  class_notes: "Stocks and futures halts; crypto venue outages."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["collars too tight delay re-entry for hours"]
  performance_note: "Avoids re-entering into the second wave."
  survival_note: "No re-entry while liquidity is still missing."
  ledger_ids: ["isolation_end_rule", "sqs_score"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-107: the staged resume this gates."

- id: "A3-structure-regimes-scenarios-142"
  name: "Macro event agent: researcher plus verifier, pre-release estimate with expiry"
  source: "research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:85-93,127,185; paper https://arxiv.org/abs/2608.30110 (LiveMacroEval 2026)"
  kind: "agent role"
  what_it_does: "A web-search-enabled model produces hourly pre-release nowcasts for 16 US indicators in a fixed key=value format. GPT-5's aggregate score tied the Bloomberg consensus; a researcher-plus-independent-verifier team scored +0.020 against -0.080 for a plain prompt and got direction right on 54 % vs 38 % of releases. As a risk input it emits a pre-release surprise or regime estimate that expires at the next relevant release."
  inputs: ["point-in-time releases and vintages", "consensus snapshot", "release calendar"]
  outputs: ["nowcast", "regime probabilities", "event flags", "valid_until"]
  assumptions: ["scored against genuinely unknown future releases"]
  levels: ["portfolio", "system"]
  instrument_classes: ["FX", "indices", "metals", "futures"]
  class_notes: "FX needs pair-relative surprises (both currencies' releases); crypto has no market close to anchor macro to."
  styles_timeframes: "Event-driven context for all styles."
  evidence: "controlled test (live forecast scoring against consensus; not trading P&L)"
  known_failures: ["small release sample", "plug-in improvement not significant", "shared misses on sharp reversals"]
  performance_note: "Forecast skill, not yet a costed strategy."
  survival_note: "Pre-release caution where surprise risk is high."
  ledger_ids: ["news_impact_level_map", "decision_freshness_bound"]
  new_variables: []
  qmx_layer: ["X7", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-041: feeds the slow macro governor."
    - "A3-structure-regimes-scenarios-145: one of the three bounded agents."

- id: "A3-structure-regimes-scenarios-143"

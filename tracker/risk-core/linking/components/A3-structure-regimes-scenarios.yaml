- id: "A3-structure-regimes-scenarios-149"
  name: "Common-shock construction and accumulation accounting"
  source: "research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:103-112 (Marshall, Olkin 1967; Li et al. 2025 reinsurance with common shock dependence)"
  kind: "scenario"
  what_it_does: "From reliability: one event can hit several components at once, beyond what pairwise correlations describe. Model a common shock per driver that hits every exposed unit together, aggregate exposures to the same event, and include uncertainty about dependence rather than treating positions as separate claims. At minimum stress cross-asset repricing, spread and slippage explosions, gaps or halts, margin increases, broker or data failures, and many strategies exiting together."
  inputs: ["driver tags", "shock size per driver", "exposure per unit"]
  outputs: ["joint loss per common shock"]
  assumptions: ["drivers identified"]
  levels: ["portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Broker and data failures are common shocks across every class routed through that broker."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["'set every correlation to one' is not enough; revalue actual instruments and execution"]
  performance_note: "Only shared exposure is charged, not every position."
  survival_note: "Prices the joint hit pairwise models miss."
  ledger_ids: ["portfolio_exposure", "loss_event_window"]
  new_variables:
    - name: "common_shock_size_by_driver"
      what: "Stress move per shared driver applied to all exposed units at once."
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-131: driver tags define the shocks' reach."
    - "A3-structure-regimes-scenarios-150: the scenario-loss matrix holds the results."

- id: "A3-structure-regimes-scenarios-150"
  name: "Common scenario-loss matrix with a tail-loss (CVaR) constraint"

- id: "A3-structure-regimes-scenarios-104"
  name: "Peer-comparison outlier ejection with growing ejection time and a cap"
  source: "research/R7-software-patterns-self-configuring.md:297-312 (Envoy outlier detection)"
  kind: "brake"
  what_it_does: "A host is ejected by count (5 consecutive errors) or by peer comparison (success rate below mean - 1.9 x stdev of its peers), only with at least 100 requests per interval and at least 5 qualifying hosts. Ejection time is 30 s x the number of consecutive ejections, capped at 300 s, and shrinks as the host behaves; at most 10 % of a cluster is ejected at once; enforcement can start at 0 % (shadow) and ramp. The closest existing shape for market isolation and a book or BMS breaker: compare a market or unit with its peers, cap the share isolated, lengthen isolation on repeats."
  inputs: ["per-unit or per-market performance", "peer group", "sample counts"]
  outputs: ["ejected yes or no", "ejection duration"]
  assumptions: ["peers comparable", "minimum sample met"]
  levels: ["unit", "cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Peer groups must be within one class or methodology; FX has many peers, energy few."
  styles_timeframes: "All; scalpers reach the sample fastest."
  evidence: "live"
  known_failures: ["in a class-wide shock every peer is bad, so peer comparison misses it", "low-traffic units never reach the sample"]
  performance_note: "Only true outliers are removed; the rest of the peer group trades on."
  survival_note: "Repeat offenders stay out longer; the cap stops mass isolation."
  ledger_ids: ["isolation_end_rule", "isolation_scope", "brake_state"]
  new_variables:
    - name: "peer_ejection_sd_factor"
      what: "Standard deviations below the peer mean that eject a unit or market."
    - name: "max_isolated_share"
      what: "Largest share of a group isolated at once."
    - name: "enforcement_ramp_pct"
      what: "Share of ejections actually enforced, from 0 % shadow upward."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-107: ejection growth on repeats is the retrip back-off."
    - "A3-structure-regimes-scenarios-095: class-wide shocks need the co-move score instead."

- id: "A3-structure-regimes-scenarios-105"
  name: "Bulkhead: compartments of open risk per unit and market"

- id: "A3-structure-regimes-scenarios-107"
  name: "Isolation lifecycle: evidence, time to live, staged resume, retrip back-off, lockout"
  source: "expansion/drafts-stopped/X4-scenarios.md:177-187,483-492 (X4-12, X4-37); grounding/G10-brakes-decay-slots-all-generations.md:378 (idea 6: evidence and an end, April effective_until); research/R3-edge-verification-and-analogues.md:208 (reclosers); research/R5-mql5-corpus-ideas.md:541 (restore ladder)"
  kind: "brake"
  what_it_does: "Every isolation has evidence and an end: a time to live, or tells clearing. Release is staged: half size for a settling time, full after N clean minutes with tells still clear. A second trip inside the settling time doubles the next time to live; repeated failure locks the scope out until a human resets. Optionally one minimum-size probe trade before full restore (half-open)."
  inputs: ["isolation start and evidence", "tells after release", "trip count"]
  outputs: ["isolation state over time", "resume size fraction", "lockout"]
  assumptions: ["tells observable after release"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Energy limit moves and futures halts mean risk uncontained: no auto-restart (chat-06). Stocks need post-reopen stability."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["a timer alone can release into an aftershock", "April news levels cleared by timer while 'automated triggers cannot de-escalate' (contradiction)"]
  performance_note: "Trading returns automatically when evidence clears, without waiting for a click."
  survival_note: "No all-at-once reopening cluster; aftershocks caught small."
  ledger_ids: ["isolation_end_rule", "risk_stop_resume_rule", "brake_state"]
  new_variables:
    - name: "isolation_ttl"
      what: "Time to live of an isolation before review."
    - name: "settling_time"
      what: "Time at reduced size after release."
    - name: "resume_size_fraction"
      what: "Size fraction during settling."
    - name: "isolation_retrip_backoff"
      what: "Multiplier on the next time to live after a retrip."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-104: ejection time grows with repeats."
    - "A3-structure-regimes-scenarios-168: separate trip and clear thresholds (stress persistence)."


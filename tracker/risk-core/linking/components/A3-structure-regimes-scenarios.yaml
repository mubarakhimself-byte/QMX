  outputs: ["risk group per instrument"]
  assumptions: ["the wrapper tracks the underlying intraday"]
  levels: ["system", "cluster"]
  instrument_classes: ["crypto", "stocks", "metals"]
  class_notes: "Crypto ETFs and metal ETFs behave like their underlyings; index CFDs like the index future."
  styles_timeframes: "Intraday 15m in the study; applies to every isolation scope."
  evidence: "author backtest"

    - "A3-structure-regimes-scenarios-005: the one-bar delay test probes the same timing sensitivity."

- id: "A3-structure-regimes-scenarios-013"
  name: "Per-class scalping realism on a small account"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:149-165 (assistant)"
  kind: "other: class feasibility map"
  what_it_does: "A per-class verdict on whether scalping can fit a small loss budget: unlevered spot crypto and FX with true micro lots and logged fills are testable; liquid low-price stocks maybe; micro index futures, metals micro contracts sometimes; energy and full-size futures generally not. A contract that meets margin is not one that fits the risk budget."
  inputs: ["min trade size per product", "tick value", "typical stop in ticks", "stressed slippage"]
  outputs: ["feasible, test only, or not feasible per class and product"]
  assumptions: ["account size known", "product specs current"]
  levels: ["system", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "FX: markup vs raw-plus-commission, last-look, Sunday open. Indices: futures and CFDs are different products. Metals: micro gold testable. Energy: natural gas hardest. Crypto: spot over perps for liquidation risk, one deep venue. Stocks: fractional shares not always available intraday or short."
  styles_timeframes: "Scalper 1m-5m."
  evidence: "idea"
  known_failures: ["stale as the account grows", "broker-specific; must be re-derived per broker"]
  performance_note: "Steers early units to classes where they can actually trade at size."
  survival_note: "Keeps units out of products whose minimum risk already breaks the budget."
  ledger_ids: ["min_lot", "instrument_class", "value_per_point"]
  new_variables: []
  qmx_layer: ["X0"]
  link_hints:
    - "A3-structure-regimes-scenarios-002: derived mechanically by the min-lot veto."
    - "A3-structure-regimes-scenarios-014: the binding cost per class explains the verdicts."

- id: "A3-structure-regimes-scenarios-014"
  name: "Which cost binds per class: spread, fee or commission"
  source: "research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:16-20,134-142; research/R6-alphaxiv-papers/R6-synthesis.md:152-162"
  kind: "cost model"
  what_it_does: "The binding cost line differs by class: on the tightest crypto books exchange fees bind (5 bp maker, 10-20 bp taker round trip against a 1.3 bp gross 15-minute reversal); on retail FX and CFDs the spread and swap bind; on micro futures the fixed commission per contract binds (2 MNQ points is 0.8-1.8 bp). The cost model must be per class."
  inputs: ["fee schedule", "spread distribution", "commission per contract", "swap and funding"]
  outputs: ["binding cost component per instrument", "round-trip cost in return units"]
  assumptions: ["fee tier and account type known"]
  levels: ["unit", "system"]
  instrument_classes: ["crypto", "FX", "futures", "indices", "metals"]
  class_notes: "As stated per class above; stocks add per-share fees and borrow; energy adds roll."
  styles_timeframes: "Scalpers and short intraday."
  evidence: "author backtest"
  known_failures: ["fee tiers change with volume", "no paper measured retail FX scalper edge after spread"]
  performance_note: "Tells a crypto mean-reversion unit it must be a maker to have a chance."
  survival_note: "Prevents one cost model applied to every symbol."
  ledger_ids: ["spread_cost", "commission_cost", "swap_financing_cost", "funding_cost", "round_trip_cost_r"]
  new_variables: []
  qmx_layer: ["X0", "X1"]
  link_hints:
    - "A3-structure-regimes-scenarios-009: the venue ledger measures the binding component."

- id: "A3-structure-regimes-scenarios-015"
  name: "OTC FX dealer skew: repeat same-side trades get worse prices for a while"
  source: "research/R6-alphaxiv-papers/T-03-macro-and-microstructure.md:130-143; paper https://www.alphaxiv.org/abs/2601.13421 (Barzykin, HSBC 2026)"
  kind: "cost model"
  what_it_does: "In OTC FX the dealer is the market. After a client fill the dealer's quote jumps and relaxes back exponentially (transient impact); below an inventory threshold the dealer only internalises. A retail scalper repeating same-direction trades within minutes should expect a skewed quote."
  inputs: ["recent same-side fills per pair and broker", "time since last fill"]
  outputs: ["expected extra cost for a repeat same-side entry"]
  assumptions: ["the broker internalises or hedges like the model's dealer"]
  levels: ["trade", "unit", "cluster"]
  instrument_classes: ["FX", "metals"]
  class_notes: "Specific to OTC FX and CFD brokers who internalise; exchange books behave differently."
  styles_timeframes: "Scalpers that re-enter the same pair quickly; several units on one pair."
  evidence: "simulation"
  known_failures: ["dealer side at institutional sizes; no retail data"]
  performance_note: "Spacing same-side entries saves spread."
  survival_note: "Several units piling into one pair pay more than the sum of single trades."
  ledger_ids: ["spread_cost", "slippage_cost", "positions_per_instrument"]
  new_variables:
    - name: "same_side_reentry_cooldown_s"
      what: "Minimum gap between same-direction entries on one pair and broker."
  qmx_layer: ["X2", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-011: markout per broker, hour and side measures the skew."
    - "A3-structure-regimes-scenarios-193: many units on one pair is the crowding scenario."

- id: "A3-structure-regimes-scenarios-016"
  name: "Time-of-day volatility forecast for the planned hold (multiplicative component model)"
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:67-85; Andersen, Bollerslev 1997; https://www.alphaxiv.org/abs/2111.02376 (2021)"
  kind: "sizing rule"
  what_it_does: "Forecast volatility for a trade's planned holding window as seasonal bucket pattern x the day's volatility level x short-term clustering. Convert the forecast and a fixed dollar budget into size; cut size when the forecast for the hold is elevated."
  inputs: ["timestamped returns in consistent buckets", "day-level volatility", "recent clustering", "planned holding window"]
  outputs: ["volatility forecast for the hold", "size scale"]
  assumptions: ["enough comparable sessions per bucket", "buckets defined per instrument and time zone"]
  levels: ["trade", "unit"]
  instrument_classes: ["FX", "indices", "stocks", "crypto", "metals"]
  class_notes: "A fixed clock fails for 24/7 crypto, where weekend and funding cycles matter (Periodicity in Cryptocurrency Volatility and Liquidity, 2109.12142). FX needs pair-specific zones and DST. Retail CFD quotes may not match exchange data. Few trades a day make fine buckets noisy; pool or shrink."
  styles_timeframes: "Intraday 5m-60m; also scalpers by session."
  evidence: "author backtest"
  known_failures: ["a seasonal profile misses news shocks and unusual opening gaps", "U-shape is common, not universal"]
  performance_note: "Keeps size steady in risk terms across the day instead of shrinking everything."
  survival_note: "Shrinks size in the hours that move most against a fixed stop."
  ledger_ids: ["volatility_target", "session_multiplier", "context_size_modifier"]
  new_variables:
    - name: "intraday_vol_bucket_profile"
      what: "Per-instrument seasonal volatility by time bucket, refreshed on a schedule."
  qmx_layer: ["X0", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-017: cost buckets must be estimated beside the volatility buckets."
    - "A3-structure-regimes-scenarios-037: the modern, measured form of the old session multiplier."

- id: "A3-structure-regimes-scenarios-017"
  name: "Estimate time-of-day volatility and execution cost separately"
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:26-34,141-142; research/R2-trader-practice-windows-drift-isolation-breadth.md:53 (Ito-Hashimoto)"
  kind: "measure/telemetry"
  what_it_does: "Busy hours can mean deep, wide, fast, or all three. Keep two separate per-instrument time-bucket tables, one for volatility and one for spread and slippage; never apply one open or overlap multiplier to every market. FX spreads are narrowest in London hours and widest at 21:00-22:00 GMT; opens themselves had insignificant spread effects."
  inputs: ["returns per bucket", "quoted and effective spread per bucket", "slippage per bucket"]
  outputs: ["volatility profile", "cost profile", "hours where cost and risk disagree"]
  assumptions: ["the unit's own venue feeds the cost table"]
  levels: ["unit", "system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "FX: rollover and Sunday open spikes. Indices: cash open is liquid and fast. Energy: EIA hour. Crypto: no session, venue-specific deep hours."
  styles_timeframes: "Scalpers and intraday."
  evidence: "author backtest"
  known_failures: ["holidays and half days distort both tables unless flagged"]
  performance_note: "A volatile but cheap hour can stay open for a unit whose stop scales."
  survival_note: "Stops units from trading quiet but expensive hours."
  ledger_ids: ["spread_cost", "session_windows"]
  new_variables:
    - name: "cost_by_hour_profile"
      what: "Spread and slippage by instrument, hour and session, separate from volatility."
  qmx_layer: ["X0", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-016: the volatility half of the pair."
    - "A3-structure-regimes-scenarios-084: the record that holds the cost half."

- id: "A3-structure-regimes-scenarios-018"
  name: "Flatten by a deadline with a buffer before the close; size carried positions for gaps"
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:40-44"
  kind: "exit/stop"
  what_it_does: "A unit that must be flat by session end exits at a deadline set some minutes before the real close, not at the last moment, tested against the venue's closing auction, halt and holiday rules. Anything allowed to carry through a close or break is sized against a gap, with reserve for correlated positions gapping together."
  inputs: ["venue session calendar", "deadline buffer", "gap allowance per instrument"]
  outputs: ["flatten instruction at the deadline", "gap-sized size for carried positions"]
  assumptions: ["calendar includes holidays and early closes"]
  levels: ["trade", "unit"]
  instrument_classes: ["stocks", "indices", "futures", "FX", "metals", "crypto"]
  class_notes: "Stocks and cash indices close daily; futures have maintenance breaks; FX closes for the weekend; crypto never closes but has thin hours."
  styles_timeframes: "Intraday and ORB (never hold overnight per the operator); swing carries by design."
  evidence: "idea"
  known_failures: ["closing orders can slip or partially fill", "a break mid-session needs its own deadline"]
  performance_note: "Keeps intraday units out of gap risk they are not paid for."
  survival_note: "Removes overnight gap exposure from flat-by-close styles."
  ledger_ids: ["forced_flat_instant", "window_forced_flat", "max_hold_time", "gap_loss_beyond_stop"]
  new_variables:
    - name: "flatten_deadline_buffer_min"
      what: "Minutes before the session close at which flat-by-close units exit."
  qmx_layer: ["X0", "X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-025: the gap allowance for what does carry."
    - "A3-structure-regimes-scenarios-215: the weekend gap scenario tests this rule."

- id: "A3-structure-regimes-scenarios-019"
  name: "Per-class starting windows and caution hours for a small account"
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:126-142 (assistant, UTC test windows)"
  kind: "config/override pattern"
  what_it_does: "Default test windows per class, to be replaced by measured ones: FX majors 12:00-16:00 UTC (JPY, AUD, NZD also Asia), caution at rollover 21:00-22:00, releases and late Friday; US indices after the opening auction settles, caution at the cash open, releases, thin overnight futures; metals London-New York overlap, caution at US inflation and jobs; energy active US hours with an explicit EIA policy (Wednesday 10:30 New York); crypto venue-specific deep hours, caution at weekends, funding times, maintenance; stocks regular hours after the auction."
  inputs: ["instrument class", "venue calendar", "DST rules"]
  outputs: ["default allowed and caution windows per class"]
  assumptions: ["windows are starting points, re-measured per venue"]
  levels: ["system", "unit"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Listed per class in what_it_does."
  styles_timeframes: "Scalpers and intraday."
  evidence: "idea"
  known_failures: ["clock windows break twice a year at DST", "venue hours differ from published convention"]
  performance_note: "Gives a new unit sensible hours on day one."
  survival_note: "Keeps day-one units out of rollover, Sunday open and event bursts."
  ledger_ids: ["session_windows", "daily_dead_zone_width", "session_handover_buffer_width", "instrument_class"]
  new_variables: []
  qmx_layer: ["X0", "X1"]
  link_hints:
    - "A3-structure-regimes-scenarios-033: measured sniping slices replace these defaults."
    - "A3-structure-regimes-scenarios-022: windows are stated in the market's own zone."

- id: "A3-structure-regimes-scenarios-020"
  name: "Size session-open breakout units as one family"
  source: "research/R5-mql5-corpus-ideas.md:100 (MQL5 17745, Decoding Opening Range Breakout, 2025)"
  kind: "allocator"
  what_it_does: "Three ORB variants on the US open combined showed max drawdown about 10 % against 15 %+ alone, with monthly correlation about 0.3. Treat session-open units as one family and size the family, not each unit; the correlation depends on the period."
  inputs: ["family membership", "family P&L correlation"]
  outputs: ["family risk budget", "per-member share"]
  assumptions: ["opens are correlated but not identical"]
  levels: ["methodology", "cluster"]
  instrument_classes: ["indices", "stocks"]
  class_notes: "US open only in the article; FX opens (London, New York), metals (Comex) and futures (maintenance reopen) differ."
  styles_timeframes: "ORB intraday."
  evidence: "author backtest"
  known_failures: ["author replaced the paper's stop with a 1 % stop and 2 % risk as impractical for retail", "backtest correlation depends on the period"]
  performance_note: "Family sizing lets each open trade while the family stays inside one budget."
  survival_note: "Stops several ORB units from stacking one risk-off open."
  ledger_ids: ["family_daily_budget", "per_trade_cap_by_family", "cluster_exposure_cap"]
  new_variables: []
  qmx_layer: ["X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-032: breadth through opens multiplies the family; this caps it."
    - "A3-structure-regimes-scenarios-163: N_eff of the family sets the true breadth."

- id: "A3-structure-regimes-scenarios-021"
  name: "Relative-volume 'in play' gate: allowed to trade today"
  source: "research/R5-mql5-corpus-ideas.md:101 (MQL5 23226); research/R2-trader-practice-windows-drift-isolation-breadth.md:61 (R37:72, net Sharpe 2.81 for top 20); grounding/G7-unit-inputs-qmb-mis-instruments.md:159"
  kind: "gate/test"
  what_it_does: "An open-range unit trades a market only on days when relative volume at the open is unusual (stocks 'in play'). Pre-screen on price, volume and ATR. Where no real volume exists (spot FX), the stand-in is tick rate against usual."
  inputs: ["volume at the open vs its 20-day median by minute of day", "price, ATR"]
  outputs: ["in play today yes or no per market"]
  assumptions: ["real volume available (stocks, index futures, crypto spot)"]
  levels: ["unit"]
  instrument_classes: ["stocks", "indices", "futures", "crypto"]
  class_notes: "Strongest on stocks; FX and CFDs only have tick rate, never called volume in the MIS plan."
  styles_timeframes: "ORB and session-open intraday."
  evidence: "author backtest"
  known_failures: ["win rate below 30 % needs streak brakes that expect long losing runs", "the 29 % to 1,637 % figure is a cited paper claim, not retested"]
  performance_note: "Concentrates an ORB's trades on days when the open carries information."
  survival_note: "Fewer dead-day breakouts and their stop-outs."
  ledger_ids: ["rvol_multiplier", "session_windows"]
  new_variables:
    - name: "rvol_open_threshold"
      what: "Relative volume at the open needed for an in-play day."
  qmx_layer: ["X0", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-077: the old RVOL multiplier is the size version of this gate."
    - "A3-structure-regimes-scenarios-020: family sizing for the in-play ORB units."

- id: "A3-structure-regimes-scenarios-022"
  name: "Session clock contract: broker time zone, DST and the market's own zone"
  source: "research/R5-mql5-corpus-ideas.md:103 (MQL5 16171); grounding/G9-runtime-brakes-isolation-evidence.md:105-109; grounding/G7-unit-inputs-qmb-mis-instruments.md:162"
  kind: "config/override pattern"
  what_it_does: "Every session rule is written in the market's own time zone and checked against the venue's reported session; the broker's server time zone and DST rules are detected (for example from NFP release times) before any session test. The unit's sessions field already holds name, calendar_ref, zone and windows."
  inputs: ["broker server time", "release timestamps", "market calendar and zone"]
  outputs: ["correct session windows per market", "DST mismatch alarm"]
  assumptions: ["calendars per market exist (forex, CME, index CFDs, crypto UTC)"]
  levels: ["system", "node", "unit"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Forex has no Tokyo/London/New York sessions in the shipped calendar; its day ends at the 17:00 New York rollover. Crypto is UTC with funding clocks. Futures need maintenance breaks."
  styles_timeframes: "Every session-bound style."
  evidence: "old QMX rule (sessions field built on a branch; no runtime gate reads it)"
  known_failures: ["US and UK DST change on different dates", "provider calendars may carry wrong times"]
  performance_note: "Keeps window-based edges in the hours they were measured in."
  survival_note: "Stops entries landing in the wrong hour for weeks after a DST shift."
  ledger_ids: ["session_windows", "day_boundary"]
  new_variables:
    - name: "dst_mismatch_check"
      what: "Self-check that a calendar's session times match the venue's reported session."
  qmx_layer: ["X1"]
  link_hints:
    - "A3-structure-regimes-scenarios-218: the DST scenario is the test of this contract."

- id: "A3-structure-regimes-scenarios-023"
  name: "Gate sessions on measured volatility, not on clock flags"
  source: "research/R5-mql5-corpus-ideas.md:105 (MQL5 22516; 22274 importance 25.6 % vs 2.5 %)"
  kind: "gate/test"
  what_it_does: "In a walk-forward model, session volatility columns carried 25.6 % of feature importance against 2.5 % for session flags. Gate or size by the session's measured volatility state rather than by which named session it is."

- id: "A3-structure-regimes-scenarios-001"
  name: "Three-number sleeve record: routine risk, stress loss, feasible size"
  source: "research/R4-alphaxiv/chat-23-A-portfolio-level-sizing.md:106-128 (assistant); research/R4-alphaxiv/R4-alphaxiv-synthesis.md:73"
  kind: "measure/telemetry"
  what_it_does: "Every sleeve (a unit or a cluster) carries three numbers on one account-currency loss scale: routine risk (volatility or expected shortfall at its holding horizon), stress loss (its loss under shared shocks with correlations rising), and feasible size (loss, margin and notional of the smallest allowed position, gaps and stop slippage included). Volatility spreads the budget; it never defines it alone."
  inputs: ["net P&L per sleeve on a common clock", "stress scenario set", "instrument min lot, tick value, margin", "gap and slippage allowances"]
  outputs: ["routine risk per sleeve", "stress loss per sleeve", "feasible minimum-position loss", "deployable yes or no"]
  assumptions: ["returns synchronised across sleeves", "a scenario set exists", "broker metadata current"]
  levels: ["unit", "cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Same three numbers everywhere; what drives each differs. FX: pip value, conversion, stop-out rules. Indices: CFD vs future vs ETF multipliers, overnight gaps. Metals: contract size, roll. Energy: gaps and limit moves dominate stress loss. Crypto: liquidation can beat the stop, venue and funding are implementation risk. Futures: margin rises with volatility. Stocks: earnings gaps, borrow."
  styles_timeframes: "All styles. Feasible size binds scalpers on a small account; stress loss binds swing and anything held over a close."
  evidence: "idea"
  known_failures: ["covariance-based routine risk understates crisis co-movement", "few trades per sleeve make routine risk noisy", "stress loss is only as good as the scenario set"]
  performance_note: "A sleeve with low stress loss can earn more budget than an equal share would give it."
  survival_note: "Refuses sleeves whose smallest position already breaches their budget; stress loss bounds the joint hit."
  ledger_ids: ["open_risk_at_stop", "gap_loss_beyond_stop", "min_lot", "lot_step", "margin_used", "portfolio_exposure"]
  new_variables:
    - name: "sleeve_routine_risk_usd"
      what: "Volatility or ES of a sleeve's P&L at its holding horizon, in account currency."
    - name: "sleeve_stress_loss_usd"
      what: "Sleeve loss under the standing scenario set with correlations raised."
    - name: "sleeve_feasible_min_loss_usd"
      what: "Loss at the stop of the smallest allowed position, gaps and slippage included."
  qmx_layer: ["X0", "X2", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-002: feasible size is the input to the min-lot veto."
    - "A3-structure-regimes-scenarios-159: stress loss is what the survival gate reads."
    - "A3-structure-regimes-scenarios-028: the worst-move table sets the gap part of stress loss."

- id: "A3-structure-regimes-scenarios-002"
  name: "Round toward less risk, skip below one lot increment"
  source: "research/R4-alphaxiv/chat-29-G-multi-asset-normalisation.md:96-101; chat-24-B-scalping-low-timeframe.md:31; chat-23-A-portfolio-level-sizing.md:46; research/R3-edge-verification-and-analogues.md:309 (worked number)"
  kind: "gate/test"
  what_it_does: "Turn the continuous target quantity into lots by rounding down to the lot step; if it is below one step, place no trade. Never round up to reach a budget. Recompute portfolio risk after rounding and accept unused risk. R3's worked number: the same 16 % volatility target on $500 gives a tradable EURUSD micro lot but rounds a Micro E-mini to zero."
  inputs: ["continuous target quantity", "lot step and minimum lot", "cost and gap reserve per unit"]
  outputs: ["rounded quantity or no-trade", "unused risk", "skip reason below_min_lot"]
  assumptions: ["lot metadata correct per broker", "the budget is the binding constraint, not margin"]
  levels: ["trade", "unit", "account"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Lot granularity is a real per-class variable. FX micro lots fit a small budget; micro index futures and crude often round to zero on $500; crypto spot and fractional shares fit; energy and full-size futures rarely do."
  styles_timeframes: "Scalpers and intraday on a small account; less binding as the account grows."
  evidence: "idea"
  known_failures: ["a no-trade band is needed or rounding noise causes churn", "skipping silently hides that a class is untradable at this size"]
  performance_note: "Prevents the hidden size-up that rounding up would create; frees risk for classes that fit."
  survival_note: "Never lets a minimum lot breach the per-trade budget."
  ledger_ids: ["min_lot", "lot_step", "max_lot", "lot_size", "rounding_residue_r", "value_per_point"]
  new_variables:
    - name: "class_feasibility_flag"
      what: "Whether a class or instrument can be traded at all at the current budget and min lot."
  qmx_layer: ["X0", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-013: the per-class scalping verdict is this veto applied to $500."
    - "A3-structure-regimes-scenarios-007: the size bound feeds the quantity this rounds."

- id: "A3-structure-regimes-scenarios-003"
  name: "Edge-to-cost admission gate (2x stressed cost, 3x for negative skew)"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:129-140 (assistant's operational proposal)"
  kind: "gate/test"
  what_it_does: "A scalper may trade only when the lower confidence bound of its expected gross edge per trade is at least twice its stressed expected round-trip cost, three times for negative-skew strategies or thin live evidence. Gross edge is measured from decision-time mid to planned-exit mid on all signals, not only filled ones; cost from fills against contemporaneous mids plus fees, funding, rejects and requotes. Recomputed live in rolling session-aware windows with session-clustered errors."
  inputs: ["gross edge per signal (decision mid to exit mid)", "round-trip cost from fills", "fees, funding, reject and requote costs", "session labels"]
  outputs: ["admit, observe, or refuse", "edge-to-cost ratio with its lower bound"]
  assumptions: ["enough independent sessions for a credible lower bound", "cost measured on the venue the unit will trade"]
  levels: ["unit", "methodology"]
  instrument_classes: ["FX", "indices", "metals", "crypto", "futures", "stocks"]
  class_notes: "Cost unit differs by class: spread binds FX and CFDs, taker fees bind crypto, fixed commission per contract binds micro futures. Stress cost must include rollover and news spikes in FX and metals, funding in perps."
  styles_timeframes: "Scalper 1m-5m mainly; also short intraday."
  evidence: "idea"
  known_failures: ["fill-only edge estimates are biased by selective limit fills", "quiet-session averages hide event-hour costs", "too sparse evidence leaves the bound undefined, so the unit waits"]
  performance_note: "Kills cost-negative units before they bleed; the survivors keep their full frequency."
  survival_note: "The slow bleed from a thin edge (A3-structure-regimes-scenarios-197) is stopped at admission."
  ledger_ids: ["round_trip_cost_r", "min_net_rr_gate", "viability_cost_fraction_max", "unit_cost_target", "cost_stress_multiple", "expectancy_r"]
  new_variables:
    - name: "edge_to_cost_ratio_lcb"
      what: "Lower confidence bound of gross edge per trade divided by stressed round-trip cost."
    - name: "edge_to_cost_min_ratio"
      what: "Admission bar for the ratio, per skew class (2 normal, 3 negative skew in the source)."
  qmx_layer: ["X0", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-004: the same gross-edge-over-cost number runs live as a no-trade filter."
    - "A3-structure-regimes-scenarios-005: the five-gate falsification protocol is the backtest side of this gate."
    - "A3-structure-regimes-scenarios-084: the hourly cost profile supplies the stressed cost."

- id: "A3-structure-regimes-scenarios-004"
  name: "Cost-aware no-trade filter: trade only if the forecast clears lambda times cost"
  source: "research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:52-73; paper https://www.alphaxiv.org/abs/2606.00060 (Bysik, Slepaczuk 2026)"
  kind: "gate/test"
  what_it_does: "Change a position only if the absolute forecast exceeds lambda x cost x the absolute position change (lambda = 2 in the paper). On hourly BTC futures at 10 bp cost it turned a naive -64 % a year into +65 % a year and cut trades from 10,619 to 251."
  inputs: ["forecast magnitude per decision", "round-trip cost per unit turnover", "proposed position change"]
  outputs: ["trade or hold"]
  assumptions: ["the forecast magnitude is calibrated", "cost is known per instrument"]
  levels: ["trade", "unit"]
  instrument_classes: ["crypto"]
  class_notes: "Shown on BTC futures only. Crypto hourly moves often clear 10 bp; FX majors move less per hour, so the same lambda would block almost every FX trade unless spreads are tiny. Indices and metals sit between."
  styles_timeframes: "Hourly in the paper; plausible for intraday and short swing, harsh for 1m scalpers."
  evidence: "author backtest"
  known_failures: ["best cost-aware strategy did not beat buy-and-hold on Sharpe after Holm correction", "profitable in only 16 of 27 folds, many folds under 20 trades", "long-short versions became sparse above 10 bp"]
  performance_note: "Turns a cost-negative forecaster into a positive one by trading rarely; any positive lambda helped."
  survival_note: "Cuts turnover-driven bleed; does nothing for gap risk."
  ledger_ids: ["round_trip_cost_r", "trade_rate", "spread_cost_guard"]
  new_variables:
    - name: "cost_filter_lambda"
      what: "Multiple of round-trip cost a forecast must clear before a position change."
  qmx_layer: ["X1", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-003: promotion gate and live filter share one number."
    - "A3-structure-regimes-scenarios-085: the spread-against-cost guard is the node-side form of this filter."

- id: "A3-structure-regimes-scenarios-005"
  name: "Five-gate falsification with a friction floor and a one-bar delay test"
  source: "research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:24-50; paper https://www.alphaxiv.org/abs/2605.04004 (Mesfin 2026)"
  kind: "gate/test"
  what_it_does: "A bar-based intraday signal passes only if all five hold at once: out-of-sample net t-stat at least 2, at least 30 trades per fold, positive net, same sign every out-of-sample year, permutation p below 0.05. Before that, gross edge must clear a per-instrument friction floor in the instrument's own units, and a +1 bar delay re-run must not flip the sign. On 947 days of 5-minute MNQ, none of 14 retail families passed; 11 had gross edge (0.07-1.5 points) below the 2-point cost."
  inputs: ["signal at bar close, entry next open", "per-instrument round-trip friction in native units", "walk-forward folds"]
  outputs: ["pass or fail per family with the failing gate", "delay-sensitivity verdict"]
  assumptions: ["bar data reflect what could be traded", "friction stated in the instrument's own units"]
  levels: ["unit", "methodology"]
  instrument_classes: ["futures", "indices", "metals"]
  class_notes: "MNQ and MGC micro futures. The draft charged MGC the MNQ point cost ($20 instead of $5): exactly the cross-instrument unit error a template running many symbols must block. Gold OU mean reversion had an 8-hour half-life, too slow for intraday."
  styles_timeframes: "Intraday 5m; the survivors held 60-75 minutes."
  evidence: "author backtest"
  known_failures: ["53+ parameter combinations tried before the control was locked, so its out-of-sample t is optimistic", "a London signal flipped from t = +4.30 to -2.78 with a 15-minute delay", "bar data cannot tell a real edge from an artefact; tick data needed"]
  performance_note: "Spares the book from promoting public patterns that cannot pay their friction."
  survival_note: "Blocks the commonest way a retail intraday unit dies: cost larger than edge."
  ledger_ids: ["walk_forward_out_of_sample_months", "min_trades_for_verdict", "round_trip_cost_r", "effective_tries"]
  new_variables:
    - name: "friction_floor_native_units"
      what: "Round-trip friction per instrument in points, pips or ticks of that instrument."
    - name: "delay_sign_flip_check"
      what: "Re-run with +1 bar latency; a sign flip means do not promote."
  qmx_layer: ["X0", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-003: the friction floor is the backtest twin of the edge-to-cost gate."
    - "A3-structure-regimes-scenarios-012: the delay flip is the same crowding at bar boundaries."

- id: "A3-structure-regimes-scenarios-006"
  name: "Break-even win probability with cost: p_BE = (S + C) / (T + S)"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:33-41"
  kind: "measure/telemetry"
  what_it_does: "For stop distance S, target T and round-trip cost C in price units, the win rate needed to break even is (S + C) / (T + S). A target close to the spread plus fees leaves no room for slippage. It is a floor: gaps, partial fills and changing costs are ignored."
  inputs: ["stop distance", "target distance", "round-trip cost"]
  outputs: ["break-even win rate", "margin of the unit's win rate over it"]
  assumptions: ["fixed stop and target", "cost known per instrument and session"]
  levels: ["trade", "unit"]
  instrument_classes: ["FX", "indices", "metals", "crypto", "futures", "stocks"]
  class_notes: "Cost in the instrument's own price units; wide-spread CFDs and taker-fee crypto push p_BE up most for tight scalps."
  styles_timeframes: "Scalper 1m-5m, where T is small relative to C."
  evidence: "idea"
  known_failures: ["fast-invalidation cuts change the loss side, so a fixed S misstates it", "ignores gaps and partial fills"]
  performance_note: "Shows which target and stop pairs can pay at all on a given venue."
  survival_note: "Flags units whose win rate sits inside the cost margin."
  ledger_ids: ["breakeven_win_rate", "round_trip_cost_r", "target_r", "stop_distance", "win_rate"]
  new_variables: []
  qmx_layer: ["X0", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-003: p_BE margin is a quick read of the edge-to-cost ratio."

- id: "A3-structure-regimes-scenarios-007"
  name: "Size bound with stop, cost and stressed exit slippage in the denominator"
  source: "research/R4-alphaxiv/chat-27-E-microstructure.md:30-36; chat-24-B-scalping-low-timeframe.md:24-31; chat-25-C-intraday-day-trading.md:18-24"
  kind: "sizing rule"
  what_it_does: "Quantity Q <= R / (D x V + C + S): dollar risk budget R over stop distance D times value per price unit V, plus round-trip cost C and stressed stop slippage S per unit. Use the larger of expected and stressed costs; if the stop is set from mid, the spread is in C. Margin is never the risk budget."
  inputs: ["dollar risk budget", "stop distance", "value per price unit", "round-trip cost", "stressed exit slippage"]
  outputs: ["maximum quantity before rounding"]
  assumptions: ["the stop is set from the trade's invalidation, not from the size", "stressed slippage estimated per venue and session"]
  levels: ["trade"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Stressed slippage S is small for FX majors in liquid hours, large for energy at inventory reports, crypto in liquidations, index CFDs at the cash open."
  styles_timeframes: "All; S matters most for scalpers and news-adjacent intraday."
  evidence: "idea"
  known_failures: ["S estimated from quiet hours understates event fills", "a stop does not guarantee its fill price through gaps"]
  performance_note: "Keeps size honest without shrinking units that trade in cheap hours."
  survival_note: "Per-trade loss stays inside the budget even when exits slip."
  ledger_ids: ["risk_amount_usd", "stop_distance", "value_per_point", "slippage_cost", "spread_cost", "gap_loss_beyond_stop"]
  new_variables:
    - name: "stressed_exit_slippage_per_unit"
      what: "Slippage on a stop exit under stressed conditions, per instrument, venue and session."
  qmx_layer: ["X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-084: the hourly cost profile supplies C and S."
    - "A3-structure-regimes-scenarios-066: the OFI-depth law gives a depth-scaled S."

- id: "A3-structure-regimes-scenarios-008"
  name: "Size negative-skew styles on tail loss, not variance"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:49-53; research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:47-63 (Landolfi 2026, https://www.alphaxiv.org/abs/2608.00127)"
  kind: "sizing rule"
  what_it_does: "Many small wins with rare large losses is negative skew. Size such units on expected shortfall and stress scenarios (gaps, stop slippage, correlated positions), not on win rate or variance, and cut size further than a symmetric unit would get. Landolfi's simulations put mean-reversion and short-vol drawdown worst cases at 1.30-1.34x the Gaussian figure."
  inputs: ["unit's trade P&L distribution", "style archetype", "stress scenario losses"]
  outputs: ["tail-based size multiplier", "ES per unit"]
  assumptions: ["the tail is visible in the record or the scenario set", "style archetype known"]
  levels: ["unit", "methodology"]
  instrument_classes: ["FX", "indices", "metals", "crypto"]
  class_notes: "Crypto and index CFDs have the fattest tails; FX mean-reversion scalpers carry the flash-crash and fix tail."
  styles_timeframes: "Mean-reversion scalpers, grid-like intraday, short-vol carry."
  evidence: "simulation"
  known_failures: ["a short record has no tail in it", "ES from a calm window understates"]
  performance_note: "Lets symmetric styles keep full size while only the cliff-shaped ones shrink."
  survival_note: "Bounds the one loss that erases many wins."
  ledger_ids: ["mean_loss_r", "payoff_ratio", "win_rate", "excursion_mae_mfe_r"]
  new_variables:
    - name: "unit_expected_shortfall_r"
      what: "Average loss in the worst tail of a unit's trade distribution, in R."
    - name: "skew_class"
      what: "Archetype tag (negative skew, symmetric, positive skew) that selects the sizing basis."
  qmx_layer: ["X0", "X2"]
  link_hints:
    - "A3-structure-regimes-scenarios-003: the 3x edge-to-cost bar applies to the same negative-skew class."
    - "A3-structure-regimes-scenarios-155: liquidity inside scenarios supplies the tail."

- id: "A3-structure-regimes-scenarios-009"
  name: "Venue cost ledger split into spread-crossing and size impact"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:111-127; paper https://www.alphaxiv.org/abs/2405.18936 (Eisler, Muhle-Karbe 2024)"
  kind: "cost model"
  what_it_does: "Record every order's schedule, fills and mid path; separate a linear per-unit part (spread crossing, execution quality) from a size-related impact part; compare against a reference schedule. Keep the ledger per instrument, venue, order type and session, with ordinary and stressed estimates kept apart. In the paper's model even 1,000 orders leave the naive linear-cost estimate statistically weak."
  inputs: ["fills and quantities", "time-varying mid", "order size and timing", "reference benchmark"]
  outputs: ["cost estimate and decomposition per cell", "its standard error"]
  assumptions: ["an exchange-style mid exists", "enough orders per cell"]
  levels: ["trade", "unit", "node"]
  instrument_classes: ["stocks", "futures", "FX", "crypto"]
  class_notes: "Built for institutional broker execution of larger orders. Retail CFD and dealer FX need last-look, requote and reject costs recorded as their own fields; crypto per venue."
  styles_timeframes: "Scalpers most; any unit with many fills."
  evidence: "author backtest"
  known_failures: ["trades concentrated in one session or regime overstate evidence", "does not capture dealer last-look"]
  performance_note: "Better cost numbers widen the set of units that can be admitted honestly."
  survival_note: "Long ledgers reveal cost drift before P&L does."
  ledger_ids: ["spread_cost", "slippage_cost", "commission_cost", "round_trip_cost_r", "cost_drift_multiple"]
  new_variables:
    - name: "cost_cell_key"
      what: "Instrument x venue x order type x session key for cost estimates."
  qmx_layer: ["X1", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-084: the hourly cost profile is the record this ledger fills."
    - "A3-structure-regimes-scenarios-083: broker execution-quality record adds asymmetry and p95."

- id: "A3-structure-regimes-scenarios-010"
  name: "Latency discretion for marketable limit orders"
  source: "research/R4-alphaxiv/chat-24-B-scalping-low-timeframe.md:94-109; Cartea, Jaimungal, Sanchez-Betancourt 2021 https://doi.org/10.1142/S0219024921500357; Ma, Saggese, Smith 2025 https://www.alphaxiv.org/abs/2504.00846"
  kind: "other: execution parameter"
  what_it_does: "Choose how far a marketable limit may walk the book by trading the extra cost of a worse price against the penalty of a miss, given how the book moves while the order is in flight. The output is a per-venue price tolerance, possibly state-dependent."
  inputs: ["decision and arrival timestamps", "book state at decision and arrival", "fills, rejects, misses", "cost of a missed trade"]
  outputs: ["price discretion per venue and state"]
  assumptions: ["exchange-style marketable limit orders", "measured reject and fill outcomes"]
  levels: ["trade", "node"]
  instrument_classes: ["futures", "crypto", "stocks", "FX"]
  class_notes: "Retail CFD brokers may expose no book; dealer last-look and requotes must be measured, not assumed. Crypto books are per venue."
  styles_timeframes: "Scalpers where the signal decays in seconds."
  evidence: "simulation"
  known_failures: ["fitted in ordinary conditions, misprices fills at news and rollover", "excludes queue position and partial fills (2025 paper)"]
  performance_note: "Fewer missed good entries at bounded extra cost."
  survival_note: "Caps the worst price an entry can take."
  ledger_ids: ["slippage_cost", "decision_freshness_bound"]
  new_variables:
    - name: "marketable_limit_discretion_ticks"
      what: "How many ticks a marketable limit may walk, per venue and state."
  qmx_layer: ["X1"]
  link_hints:
    - "A3-structure-regimes-scenarios-012: bar-boundary bursts are the states where discretion should tighten."

- id: "A3-structure-regimes-scenarios-011"
  name: "Post-fill markout as the toxicity check"
  source: "research/R4-alphaxiv/chat-27-E-microstructure.md:16-20,101-103; research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:93-115 (Albers et al. 2025, https://www.alphaxiv.org/abs/2502.18625)"
  kind: "measure/telemetry"
  what_it_does: "Record the mid at 1 s, 5 s and 60 s after every fill and the sign-adjusted move against the fill, grouped by instrument, venue, session and news regime. On Binance BTC perps, 232,897 live minimum-size maker orders showed fills drifting against the maker ('fill and be killed'); back-of-queue fills almost always lost and naive market making ran at an annualised Sharpe of -109."
  inputs: ["fill price, side, time", "mid path after the fill", "queue position where known"]
  outputs: ["markout per horizon per cell", "fill-quality metric beside fill rate"]
  assumptions: ["a reliable mid exists after the fill", "timestamps aligned"]
  levels: ["trade", "unit", "node"]
  instrument_classes: ["crypto", "futures", "stocks", "FX"]
  class_notes: "Queue mechanics apply to central books (futures, crypto, stocks). In retail FX and CFDs the broker is the counterparty: markout then measures dealer skew and last-look, not queue toxicity."
  styles_timeframes: "Scalpers and any passive-entry unit."
  evidence: "live"
  known_failures: ["one venue, one week, minimum size only", "the profitable reversal model needed sub-second data and co-located speed"]
  performance_note: "Separates units whose fills are cheap from units whose fills are traps; a reversal model turned the round trip from -0.44 bp to +0.71 bp net in the study."
  survival_note: "A worsening markout is an input signal that arrives within tens of fills, before P&L tests."
  ledger_ids: ["slippage_cost", "cost_drift_multiple", "excursion_mae_mfe_r"]
  new_variables:
    - name: "fill_markout_bp"
      what: "Sign-adjusted mid move against the fill at 1 s, 5 s and 60 s."
  qmx_layer: ["X0", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-015: in OTC FX the markout reads dealer skew."
    - "A3-structure-regimes-scenarios-082: markout is one feature in the execution anomaly brake."

- id: "A3-structure-regimes-scenarios-012"
  name: "Avoid market orders at bar-boundary bursts; jitter scheduled order times"
  source: "research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:117-133; paper https://www.alphaxiv.org/abs/2607.09426 (Kim, Hansen 2026)"
  kind: "gate/test"
  what_it_does: "On Binance perps the first 10 seconds of each quarter hour carry 26 % more trades and 26 % larger absolute returns, driven by algorithms on calendar bars. A template whose entries fire at bar close sits in that crowd; delay or jitter order placement off the boundary."
  inputs: ["clock position within the bar", "order type"]
  outputs: ["placement delay or jitter"]
  assumptions: ["other bots trade calendar bars on the same venue"]
  levels: ["trade", "node"]
  instrument_classes: ["crypto", "stocks", "FX"]
  class_notes: "Measured on crypto perps; the authors cite similar clock bursts in US equities and FX."
  styles_timeframes: "Any bar-close entry from 1m to 1h."
  evidence: "author backtest"
  known_failures: ["aggregate trades only, no trader IDs", "about 0.5 bp per trade: an execution effect, not an edge"]
  performance_note: "Small saving per trade that adds up over high trade counts."
  survival_note: "Lowers adverse selection on entries."
  ledger_ids: ["slippage_cost"]
  new_variables:
    - name: "bar_boundary_jitter_s"
      what: "Seconds to delay or jitter order placement away from bar boundaries."
  qmx_layer: ["X1", "X2"]
  link_hints:

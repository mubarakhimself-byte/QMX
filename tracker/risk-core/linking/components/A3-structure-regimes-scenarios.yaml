- id: "A3-structure-regimes-scenarios-161"
  name: "Parent limit below the sum of its children, sized on how often they lose together"
  source: "research/R1-platforms-risk-sizing-extensibility.md:290-299 (RiskMetrics Technical Document 1996, section 3.1)"
  kind: "budget"
  what_it_does: "VaR limits give a common denominator and include diversification, so 'the risk limit at higher levels can be lower than the sum of risk limits of units reporting to it' (chart: a business area at $20MM over groups at $10MM, $12MM and $8MM). Each unit keeps its own limit; the level above holds a smaller limit than the sum, sized on how often the units lose together. Section 3.2 checks the risk model daily against realised P&L."
  inputs: ["child limits", "co-loss behaviour"]
  outputs: ["parent limit"]
  assumptions: ["one money unit for every level"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Same at every level."
  styles_timeframes: "All."
  evidence: "live"
  known_failures: ["diversification credit vanishes when units lose together"]
  performance_note: "Children keep full limits; the parent does not divide its limit by N."
  survival_note: "The parent binds when children lose together."
  ledger_ids: ["portfolio_daily_risk_budget", "bms_daily_loss_limit", "unit_daily_loss_limit"]
  new_variables: []
  qmx_layer: ["X2", "X3"]
  link_hints:

  source: "research/R4-alphaxiv/chat-16-trading-costs-retail-fx-crypto.md:18,27,33 (paper https://www.alphaxiv.org/abs/1806.04460, Foreign Exchange Markets with Last Look 2018)"
  kind: "cost model"
  what_it_does: "Last look can narrow quoted spreads while rejecting trades, including slow traders' most profitable ones: rejected orders are selected, not random. A tighter quote is not lower effective cost. Track acceptance and rejection rates and the outcomes of rejected requests alongside quoted spread and realised fills, per broker and account type."
  inputs: ["order requests", "rejections", "price after rejection"]
  outputs: ["rejection rate", "cost of rejected trades", "effective spread"]
  assumptions: ["rejections logged"]
  levels: ["trade", "node"]
  instrument_classes: ["FX", "metals"]
  class_notes: "Retail FX and CFD brokers; exchange books have no last look."
  styles_timeframes: "Scalpers."
  evidence: "simulation"
  known_failures: ["model, not retail data"]
  performance_note: "Picks the broker with the lowest effective, not quoted, cost."
  survival_note: "Exposes hidden adverse selection."
  ledger_ids: ["spread_cost", "slippage_cost"]
  new_variables:
    - name: "rejection_rate"
      what: "Share of order requests the broker rejects, with the price path after rejection."
  qmx_layer: ["X1", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-083: add rejections to the broker record."
    - "A3-structure-regimes-scenarios-015: dealer skew is the other dealer-side cost."

- id: "A3-structure-regimes-scenarios-239"
  name: "Cost on the combined flow reaching one venue, through one versioned cost interface"
  source: "research/R4-alphaxiv/chat-16-trading-costs-retail-fx-crypto.md:10,16,39-49 (AutoQuant https://www.alphaxiv.org/abs/2512.22476)"
  kind: "cost model"
  what_it_does: "In one BTC perpetual case, annualised return was 522.5 % with zero costs, 430.8 % with fees only and 272.6 % with fees, slippage and funding. Backtest and live monitor call one versioned cost interface and log a reconcilable ledger per order or interval (quote, fill, fee, spread, slippage, impact, reject or partial status, swap or funding). Funding is applied at the venue's funding timestamp to the position held then. Because many units trade at once, costs come from the combined orders reaching the same venue (shared liquidity, queue competition, fee tiers), with unit-level attribution kept."
  inputs: ["all units' orders per venue", "fee tiers", "funding schedule"]
  outputs: ["cost per unit from combined flow", "predicted vs realised cost residuals"]
  assumptions: ["one cost model version shared by backtest and live"]
  levels: ["unit", "portfolio", "node"]
  instrument_classes: ["crypto", "FX", "futures"]
  class_notes: "Perps need funding alignment; FX needs swap and weekday rules."
  styles_timeframes: "Scalpers most."
  evidence: "author backtest"
  known_failures: ["specific to one strategy family and sample"]
  performance_note: "Netting orders on one venue can lower total cost."
  survival_note: "Units cannot each assume the whole book's liquidity."
  ledger_ids: ["funding_cost", "swap_financing_cost", "cost_drift_multiple", "round_trip_cost_r"]
  new_variables: []
  qmx_layer: ["X1", "X2", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-084: the record behind the interface."
    - "A3-structure-regimes-scenarios-232: combined exits in scenarios use the same logic."

- id: "A3-structure-regimes-scenarios-240"
  name: "Re-rank units under alternate execution assumptions"
  source: "research/R4-alphaxiv/chat-16-trading-costs-retail-fx-crypto.md:19,29 (https://www.alphaxiv.org/abs/2610.05077)"
  kind: "gate/test"
  what_it_does: "Across 2,462 synthetic runs, rank agreement between near-ideal and default-stress execution was 0.21 (Kendall) in a high-volatility two-asset setting vs 0.82 in calm. Compare short-horizon units under several execution assumptions; a cost correction applied to a leaderboard does not preserve its order."
  inputs: ["unit results under several execution models"]
  outputs: ["rank stability", "units whose rank depends on execution"]
  assumptions: ["execution variants defined"]
  levels: ["unit", "methodology"]
  instrument_classes: ["crypto", "FX", "futures"]
  class_notes: "Strongest where volatility is high."
  styles_timeframes: "Short-horizon units."
  evidence: "simulation"
  known_failures: ["short compressed experiment"]
  performance_note: "Avoids promoting a unit whose edge exists only under ideal fills."
  survival_note: "Exposes execution-fragile units before live."
  ledger_ids: ["cost_stress_multiple"]
  new_variables: []
  qmx_layer: ["X5", "X0"]
  link_hints:

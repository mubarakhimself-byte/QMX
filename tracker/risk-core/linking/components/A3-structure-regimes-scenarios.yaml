- id: "A3-structure-regimes-scenarios-138"
  name: "News provenance and corroboration gate; cap any single item's effect"
  source: "research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:97-112; paper https://www.alphaxiv.org/abs/2610.26438 (Fake News, Real Crashes 2026); research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:119,207"
  kind: "gate/test"
  what_it_does: "In about 10,000 sandbox decisions, prompt injection succeeded 14 %, fabricated news 62 %, two 30-word templates 100 %; removing credibility cues ('BREAKING', a named source) dropped success to 0 % with the same false claim. Bigger models stop shallow attacks but not fact poisoning; peer debate failed; only hierarchical aggregation helped. News output never sizes or triggers a trade alone: it may only reduce risk, or must agree with a non-news signal after a provenance check; cap the size any one item can cause; many agents on one feed are one correlated risk."
  inputs: ["news item and its source", "independent confirmation", "non-news signal"]
  outputs: ["accepted or rejected item", "capped effect"]
  assumptions: ["source allow-list maintained"]
  levels: ["system", "portfolio"]
  instrument_classes: ["stocks", "crypto", "FX", "indices"]
  class_notes: "Crypto and social feeds are noisier; equities studied."
  styles_timeframes: "All agent-fed risk inputs."
  evidence: "simulation"
  known_failures: ["simulated sandbox; one reference agent design"]
  performance_note: "Keeps good news signals usable by filtering fakes."
  survival_note: "One fake headline cannot crash the book."
  ledger_ids: ["decision_freshness_bound"]
  new_variables:
    - name: "single_item_effect_cap"
      what: "Largest risk change any single unverified news item may cause."
  qmx_layer: ["X3", "X7"]
  link_hints:
    - "A3-structure-regimes-scenarios-165: FARSIGHT's crowding crash is the market-level version."

- id: "A3-structure-regimes-scenarios-139"
  name: "Observability rule: act only after news is public; never test an LLM on news it saw in training"
  source: "research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:114-130; paper https://www.alphaxiv.org/abs/2609.23703 (MFAST 2026)"
  kind: "gate/test"
  what_it_does: "No position before the news is public; after-close articles trade the next eligible day; run a stricter one-day-delay test. Evaluate an LLM only on news after its training cut-off. With these rules, MFAST's LLaMA-3 long-short Sharpe was 2.85 (95 % CI 2.31-3.34) at 5 bp, deflated Sharpe 2.19, stable from 0 to 50 bp and 1-5 day holds."
  inputs: ["publication time", "ingestion time", "model cut-off date"]
  outputs: ["eligible decision time", "contamination flag"]
  assumptions: ["timestamps trustworthy"]
  levels: ["system"]
  instrument_classes: ["stocks"]
  class_notes: "Firm news, daily horizon; FX, indices and commodities react to macro releases and need a different pipeline."
  styles_timeframes: "Swing in the paper; the rule binds every news use."
  evidence: "author backtest"
  known_failures: ["revise-and-resubmit paper", "capacity binds in small stocks", "pretraining exposure cannot be fully ruled out"]
  performance_note: "Keeps a real news edge measurable."
  survival_note: "Stops look-ahead from faking news value."
  ledger_ids: ["decision_freshness_bound"]
  new_variables: []
  qmx_layer: ["X5", "X7"]
  link_hints:
    - "A3-structure-regimes-scenarios-067: one news clock for agent inputs and execution brakes (T-04 combination)."
    - "A3-structure-regimes-scenarios-057: the macro form of point-in-time discipline."

- id: "A3-structure-regimes-scenarios-140"
  name: "News-attributed jump risk as an event-risk reduction signal"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:201,213; paper https://www.alphaxiv.org/abs/2604.13458 (Interpretable Systematic Risk around the Clock 2026)"
  kind: "detector"
  what_it_does: "Link high-frequency equity and E-mini futures jumps to contemporaneous LLM-classified news topics. Macro-jump factor Sharpe 0.78; an annual real-time topic-selection strategy Sharpe 0.95 vs 0.28 intraday-only. Risk use: an exposure-reduction signal around unusually large classified jumps, capped by affected factor and session."
  inputs: ["high-frequency futures and equity prices", "timestamped news", "topic classifier"]
  outputs: ["jump with topic label", "exposure cut by factor"]
  assumptions: ["classification errors controlled", "overnight gaps handled"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["indices", "futures", "stocks"]
  class_notes: "US equity and E-mini only."
  styles_timeframes: "Intraday book-level."
  evidence: "author backtest"

  source: "research/R6-alphaxiv-papers/T-02-trading-styles-scalping-intraday.md:75-91; paper https://www.alphaxiv.org/abs/2608.21888 (Kitron, Wengrowicz 2026)"
  kind: "config/override pattern"
  what_it_does: "A matched protocol found significant 15-minute reversal in 90 % of 183 crypto pairs against 2.7 % of 187 US stocks; US funds wrapping crypto or metals inherit the behaviour of what they wrap. Group an ETF or CFD on a commodity with the commodity, not with equities, for both edge checks and risk isolation."

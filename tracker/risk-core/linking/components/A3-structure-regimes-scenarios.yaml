- id: "A3-structure-regimes-scenarios-152"
  name: "Coherent driver hypotheticals with a path shape, selected by state"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:37; chat-26-D-macrostructure.md:214 (combination 8: filtered state selects scenarios)"
  kind: "scenario"
  what_it_does: "Shock drivers and their linkages, not single tickers: equity sell-off plus volatility spike, currency moves, wider funding spreads and less depth; or an energy shock with inflation and rate repricing, index moves and correlated FX. Add the path shape (gap, grind, whipsaw, one-way trend) and a volatility-regime transition. The current filtered macro state proposes which hypotheticals apply; scenario limits stay operative even if the state reads calm."

- id: "A3-structure-regimes-scenarios-228"
  name: "Event-window policy by event type: flat through, cool down, never widen the stop"
  source: "research/R4-alphaxiv/chat-09-news-event-risk.md:12-36 (assistant; classics Andersen, Bollerslev, Diebold, Vega 2003; Ederington, Lee 1993; Fleming, Remolona 1999; Patell, Wolfson 1984; Lee, Mucklow, Ready 1993)"
  kind: "brake"
  what_it_does: "Starting policy for units not built to trade the event. High-impact macro release: stop initiating shortly before, flatten or sharply cut through the release, resume after a 10-15 minute minimum cooldown. Central-bank decision and press conference are two separate windows; stay reduced until after the press conference. Earnings: no short-horizon position through a known report; after off-hours news wait for regular-session liquidity. Unscheduled shock: a market-data or news circuit breaker blocks entries, cancels stale orders and reduces risk under preset loss and liquidity limits. Opens, closes and auctions: suppress new scalps 5-15 minutes after a major open and around the close. Widening the stop is not an event response. Resume when the unit's own execution conditions recover, not on a timer; apply the restriction at the shared layer so many small units cannot rebuild one large position into the same event."
  inputs: ["event type and timestamp", "instrument mapping", "execution conditions after the event"]
  outputs: ["pre-event stop-entry time", "flatten or reduce instruction", "resume condition"]
  assumptions: ["event types classified", "execution baselines per instrument and session"]
  levels: ["unit", "cluster", "portfolio", "node"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "A US equity open is not the same event as a Tokyo FX hand-off; crypto has no cash open. Stocks need earnings and halt handling; futures need settlement windows."
  styles_timeframes: "Scalpers and intraday; event-tested units exempt."
  evidence: "idea"
  known_failures: ["fixed durations do not fit every instrument and event", "flat-through costs the move for units that could have traded it"]
  performance_note: "'Trade the event' stays possible for units with separate out-of-sample net results."
  survival_note: "Keeps scalpers out of the minutes when spreads, slippage and gaps exceed their edge."
  ledger_ids: ["news_blackout_before", "news_blackout_after", "warm_up_window", "stop_widening_allowed", "window_forced_flat"]
  new_variables:
    - name: "post_event_cooldown_min"
      what: "Minimum wait after a release before new entries, then execution-based resume."
    - name: "event_type_policy"
      what: "Per event type: flatten, reduce, block entries, or trade (event-tested units only)."
  qmx_layer: ["X3", "X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-229: event-time measurement calibrates the windows."
    - "A3-structure-regimes-scenarios-126: the old soft kill is the staged-exit form."
    - "A3-structure-regimes-scenarios-136: the stop-suspension trap it rules out."

- id: "A3-structure-regimes-scenarios-229"
  name: "Calibrate event windows in event time against matched non-event periods"
  source: "research/R4-alphaxiv/chat-09-news-event-risk.md:16,38-40; https://www.alphaxiv.org/abs/2411.16244 (What events matter for exchange rate volatility? 2024); https://www.alphaxiv.org/abs/2601.08962 (jumps after earnings 2026)"
  kind: "measure/telemetry"
  what_it_does: "The initial repricing after a release is fast, but abnormal volatility and impaired liquidity can outlast the first move; a market may have reacted before it is cheap or safe to trade. Track realised volatility, quoted and effective spreads, depth, slippage and fill rates in event time against matched non-event periods, per instrument, event type and session, and set the window from where they return to normal."
  inputs: ["event timestamps", "volatility, spread, depth, slippage, fill rate by minute"]
  outputs: ["recovery time per instrument and event type"]
  assumptions: ["enough past events per instrument"]
  levels: ["system", "unit"]
  instrument_classes: ["FX", "indices", "metals", "energy", "futures", "stocks"]
  class_notes: "Treasuries and FX studied classically; earnings for stocks."
  styles_timeframes: "Scalpers and intraday."
  evidence: "author backtest"
  known_failures: ["recovery differs by surprise size"]
  performance_note: "Windows as short as the data allow."
  survival_note: "Resumes only after liquidity, not just price, has recovered."
  ledger_ids: ["news_blackout_after", "news_impact_level_map"]
  new_variables: []
  qmx_layer: ["X3", "X6"]
  link_hints:

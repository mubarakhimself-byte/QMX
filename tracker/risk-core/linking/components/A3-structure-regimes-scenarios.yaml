  instrument_classes: ["indices", "FX", "metals", "crypto", "stocks"]
  class_notes: "Works on any class with a clean realised volatility series; crypto weekends need explicit treatment."
  styles_timeframes: "Daily-horizon forecasts for intraday and swing."
  evidence: "author backtest"
  known_failures: ["misses jumps", "intraday seasonality needs a separate model"]
  performance_note: "Better volatility forecasts tighten size errors."

- id: "A3-structure-regimes-scenarios-126"
  name: "Soft kill for scheduled news: staged exits, settling time, reduced weights"
  source: "grounding/G10-brakes-decay-slots-all-generations.md:222 (KSA:316-374), :385 (idea 10)"
  kind: "exit/stop"
  what_it_does: "Three kill modes: hard kill (black swan, close everything now, slippage accepted); soft kill for scheduled news (block entries at T-15, exit in 25 % chunks every 2 minutes from T-13 to T-5, flat by T-5, settling 15 minutes after, unit weights x0.1 until volatility normalises); connectivity kill (broker-side hard stop on every order). In current terms the soft kill is an exit policy, not a window, because windows never close positions."
  inputs: ["release time", "open positions in scope", "volatility after release"]
  outputs: ["staged exit schedule", "post-release weight"]
  assumptions: ["the unit's style should not hold through the release"]
  levels: ["position", "unit", "node"]
  instrument_classes: ["FX"]
  class_notes: "FX-only spec; would apply to index and gold units around US data."
  styles_timeframes: "Intraday and scalpers; not swing units built to hold."
  evidence: "old QMX rule (specified in April; never ran)"
  known_failures: ["staged exits into pre-release spread widening cost money", "x0.1 weights have no derivation"]
  performance_note: "Exits before the spread blows out."
  survival_note: "Flat through the most gap-prone minutes."
  ledger_ids: ["soft_kill_exit_schedule", "window_forced_flat", "kill_switch_effect_matrix"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-210: exits must never be blocked by a window."
    - "A3-structure-regimes-scenarios-136: the opposite (suspending stops) is a trap."

- id: "A3-structure-regimes-scenarios-127"
  name: "News protection window: block new entries in scope, never exits"
  source: "grounding/G10-brakes-decay-slots-all-generations.md:239-245 (DOCS/components/qmf-risk.md:131-135, registry variables 471-497); grounding/G9-runtime-brakes-isolation-evidence.md:102-104"
  kind: "brake"
  what_it_does: "News is a protection window that blocks new entries on in-scope instruments and nothing else; exits are never blocked. Scope comes from dated per-instrument currency-exposure records, never from the symbol name; a missing record means affected plus an alarm. Provider impact labels are stored as given; severity to window width is a node mapping, widths blank (the +/-15 minutes was withdrawn). A blocked trade is still journalled on the veto path so decay sensing keeps its data. Pair-scoped blackouts are built, with no live skip."
  inputs: ["calendar events", "currency-exposure records", "severity-to-width map"]
  outputs: ["blocked entries per instrument and window", "veto journal rows"]
  assumptions: ["exposure records maintained"]
  levels: ["node", "unit"]
  instrument_classes: ["FX", "metals", "indices"]
  class_notes: "Exposure records cover currencies; non-FX mapping undefined."
  styles_timeframes: "All."
  evidence: "old QMX rule (current docs; built off the unit path; parked by the unit plan)"
  known_failures: ["widths blank", "news protection parked along with news trading"]
  performance_note: "Exits stay free, so units can manage their own risk."
  survival_note: "Missing scope fails toward blocking."
  ledger_ids: ["news_blackout_before", "news_blackout_after", "news_impact_level_map", "applies_to_open_positions"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:

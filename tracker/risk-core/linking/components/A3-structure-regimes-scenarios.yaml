- id: "A3-structure-regimes-scenarios-122"
  name: "Immune brake: accumulate weak danger signals, act at once on clear danger"
  source: "research/R5-mql5-corpus-ideas.md:471-480 (IV.6, MQL5 20479, 20430, 24251, 23983), :555 (combination 19)"
  kind: "brake"
  what_it_does: "Borrowed from dendritic cells and danger theory: integrate several weak danger signals (spread percentile, execution anomaly, changepoint probability, loss streak in R) over a window and act only once enough has gathered; clear-danger signals (broker disconnect, state mismatch) act at once; an inflammation term raises sensitivity during news windows. Meant to cut false alarms against single-threshold brakes."

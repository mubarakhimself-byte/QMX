- id: "A3-structure-regimes-scenarios-234"
  name: "Cross-class contagion as a time-indexed dependency graph"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md (turn 3 'Cross-class contagion')"
  kind: "scenario"
  what_it_does: "Represent a stress as a graph of common shocks and conditional links, each edge with direction, plausible lag, stress regime and evidence source, not one static correlation matrix. Examples: an inflation surprise moves rates, FX, gold and index futures, then margin and volatility force reductions; an energy delivery shock moves front-month and spreads, then inflation expectations, rates, FX and sectors; a crypto liquidation spreads across venues through arbitrage and shared collateral, with contagion to equities as a separate testable link. Where history is short or sessions differ, impose the missing shock and vary the lag; keep a scenario with one market closed or one venue down."

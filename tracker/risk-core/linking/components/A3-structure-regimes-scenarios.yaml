- id: "A3-structure-regimes-scenarios-098"
  name: "Liquidity commonality: spreads widening together across a class"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:166-167 (Mancini, Ranaldo, Wrampelmeyer 2013; Karnaukh, Ranaldo, Soderlind 2015)"
  kind: "detector"
  what_it_does: "FX liquidity moves in common across currencies and with stocks and bonds, falls when funding is tight and global risk rises, and co-moves more in stress; liquidity risk hit carry trades in 2007-2009. Spread is observed directly, so a joint spread widening across a class is a fast risk-off tell."
  inputs: ["spreads across instruments of a class"]
  outputs: ["common liquidity factor", "joint widening flag"]
  assumptions: ["spreads from the same broker are comparable over time"]
  levels: ["portfolio"]
  instrument_classes: ["FX", "indices", "futures"]
  class_notes: "Strongest documented in FX; a broker-wide spread event (one liquidity provider pulling quotes) looks the same and is still a reason to stop entries."
  styles_timeframes: "Scalpers and carry most exposed."
  evidence: "author backtest"
  known_failures: ["cannot tell a market event from a broker event alone"]
  performance_note: "No cost when liquidity is normal."
  survival_note: "Fast; observed, not estimated."
  ledger_ids: ["sqs_score", "cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-222: spreads widen everywhere scenario."


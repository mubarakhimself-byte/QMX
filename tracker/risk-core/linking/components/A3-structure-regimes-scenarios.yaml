- id: "A3-structure-regimes-scenarios-025"
  name: "Gap allowance for held positions and a Friday-flat rule for styles that never hold"
  source: "expansion/drafts-stopped/X4-scenarios.md:337-347 (X4-scenarios-25); research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:44"

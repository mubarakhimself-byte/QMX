- id: "A3-structure-regimes-scenarios-055"
  name: "Prediction-market macro probabilities as a crypto volatility input"
  source: "research/R4-alphaxiv/chat-26-D-macrostructure.md:192,199; paper https://www.alphaxiv.org/abs/2604.01431 (Kalshi macro contracts 2026)"
  kind: "measure/telemetry"
  what_it_does: "Daily changes in Kalshi macro probabilities (rates, CPI, recession) forecast five-day crypto realised volatility for some channels; one high-signal example implies about 7 % less BTC weight under inverse-volatility sizing. A volatility input, not a direction signal."
  inputs: ["daily macro-probability changes", "crypto realised volatility", "USD, equity, volatility controls"]

- id: "A3-structure-regimes-scenarios-123"
  name: "Keep three signals apart: strategy decay, bucket stress, account drawdown"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:161-164,179-187"
  kind: "config/override pattern"
  what_it_does: "Alpha decay says this strategy may no longer have an edge (cut that strategy, even in a calm bucket); regime stress says this market bucket is abnormal (cut the bucket); drawdown says the account has less capacity (cut the book). Order of checks: validate feed and clock; local strategy and bucket risk; portfolio limits; safe execution (staged reduction, halts, thin books); re-risk slowly on market and data recovery in capped steps."

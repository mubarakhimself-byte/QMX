- id: "A3-structure-regimes-scenarios-030"
  name: "Contexts, not sessions: overlapping positions are related only by the same-bet check"
  source: "seeds/SEEDS.md:684-690 (D10, operator M8 question, M10 acceptance: 'thinking in context, not sessions, makes sense'); expansion/drafts-stopped/X1-template-shape.md:547 (X1-74)"
  kind: "config/override pattern"
  what_it_does: "Units do not switch by named session. Each unit reads context words (for example mean-reverting, stressed) and its own windows; two positions in an overlap are not a contradiction because each is sized on its own and they are related only through the same-bet check. Overrides may later be keyed by an MIS context word rather than a session name."
  inputs: ["context words per market", "same-bet exposure"]
  outputs: ["per-unit behaviour by context", "same-bet trim when overlap positions share a driver"]
  assumptions: ["unit reads compile (they do not today)", "a same-bet check exists"]
  levels: ["unit", "portfolio"]
  instrument_classes: ["FX", "crypto", "futures", "indices", "metals"]
  class_notes: "The operator's case: FX, crypto perps and futures traded at once across Tokyo, London and New York."
  styles_timeframes: "All styles running across 24 hours."
  evidence: "idea"
  known_failures: ["context words need an MIS that runs; the board fails open today"]
  performance_note: "Units keep trading through overlaps instead of being switched off by a clock."
  survival_note: "Shared exposure is caught by the same-bet check, not by session rules."
  ledger_ids: ["session_windows", "context_size_modifier", "board_stale_after"]
  new_variables: []
  qmx_layer: ["X0", "X1"]
  link_hints:

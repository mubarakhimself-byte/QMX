# ---------- 4. Risk-off detection and market, class or region isolation ----------

- id: "A3-structure-regimes-scenarios-088"
  name: "Financial turbulence (Mahalanobis distance) as a nowcast per bucket"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:97-112; Kritzman, Li 2010 https://doi.org/10.2469/faj.v66.n5.3; research/R2-trader-practice-windows-drift-isolation-breadth.md:165"
  kind: "detector"
  what_it_does: "T_t = (y_t - mu)' Sigma^-1 (y_t - mu) / N: how unusual today's joint return vector is given individual scales and cross-asset covariance. A large value flags an unusual joint move as it happens. The paper says it does not anticipate the first extreme event, but turbulence persists once started, and returns to risk are weaker in turbulence; its carry example used a 30-day average and trailing three-year quintiles with a one-day lag."
  inputs: ["synchronised return vector of a bucket", "reference mean and covariance (shrunk)"]
  outputs: ["continuous turbulence score", "percentile vs the bucket's own time-of-day-aware history"]
  assumptions: ["enough assets and history to invert covariance", "valid synchronised returns"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Small buckets (two or three crypto coins) make the inverse unstable: use a broader liquid proxy basket or shrinkage. Never fill closed stock markets with zero returns when crypto keeps moving."
  styles_timeframes: "Book-level; daily in the paper, intraday untested."
  evidence: "author backtest"
  known_failures: ["false alarms on harmless asset-specific news", "large returns can drive it without any dependence change", "covariance inversion fragile with few assets or stale prices"]
  performance_note: "Scaling down in persistent turbulence avoided weak-return periods in the paper's carry example."
  survival_note: "Fast flag that a bucket is moving abnormally together."
  ledger_ids: ["cross_market_stress_reading", "market_isolation_trigger"]
  new_variables:
    - name: "bucket_turbulence_pct"
      what: "Turbulence percentile per bucket against its own time-of-day-aware history."
  qmx_layer: ["X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-089: correlation surprise explains why turbulence is high."
    - "A3-structure-regimes-scenarios-093: the bucket-local isolation rule reads it."

- id: "A3-structure-regimes-scenarios-089"
  name: "Correlation surprise: turbulence over magnitude surprise"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:77-95; Kinlaw, Turkington 2013 https://link.springer.com/article/10.1057/jam.2013.27"
  kind: "detector"
  what_it_does: "Magnitude surprise is turbulence ignoring covariance (average squared standardised surprise). CS = T / MS; above 1 the joint pattern is more unusual than individual moves suggest (usual co-movers diverging or usual independents converging). On daily data, among the top 20 % magnitude-surprise days, next-day magnitude surprise was higher when CS exceeded 1, decaying over days 2-5."
  inputs: ["return vector", "historical means, volatilities, covariance"]
  outputs: ["CS score", "joint flag high MS and CS > 1"]
  assumptions: ["long lookbacks (10 years equities, 3 years FX in the study)"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["indices", "FX", "stocks"]
  class_notes: "Studied on equity universes and currencies, daily. Intraday asynchrony across sessions breaks it."
  styles_timeframes: "Book-level, next-day information."
  evidence: "author backtest"
  known_failures: ["unstable when magnitude surprise is near zero", "spikes on tiny noisy returns unless filtered to high MS"]
  performance_note: "Separates dependence breaks from mere big moves, so local cuts can be targeted."
  survival_note: "Next-day warning after a dependence dislocation."
  ledger_ids: ["cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-088: its numerator."
    - "A3-structure-regimes-scenarios-091: ARR + CS + turbulence is the local contagion trigger (chat-08 combination A)."

- id: "A3-structure-regimes-scenarios-090"
  name: "Absorption ratio: share of variance in the top principal components"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:30; research/R2-trader-practice-windows-drift-isolation-breadth.md:164 (Kritzman, Li, Page, Rigobon 2011); research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:41-43"
  kind: "detector"
  what_it_does: "Estimate the covariance of a basket, take its eigenvalues, and report the share of total variance absorbed by the top fifth of components. It rises when markets couple; spikes came before major US crashes. A slower confirmation signal; lookback and update frequency set its responsiveness. A PCA version on 5-minute returns is enough to start."
  inputs: ["rolling return panel", "covariance estimate"]
  outputs: ["absorption ratio and its change"]
  assumptions: ["aligned calendars", "basket large enough"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["indices", "stocks", "FX", "crypto"]
  class_notes: "Within-class use is strongest: FX pairs on USD, crypto on BTC. A cross-class basket mixes sessions."
  styles_timeframes: "Book-level, minutes to days."
  evidence: "author backtest"
  known_failures: ["rolling statistic, no guaranteed advance warning", "noisy for small baskets"]
  performance_note: "When a class's many units become one bet, its cap can shrink before losses."
  survival_note: "Confirms coupling for class-level cuts."
  ledger_ids: ["effective_independent_bets", "effective_bets_drop_trip", "cross_market_stress_reading"]
  new_variables:
    - name: "class_absorption_ratio"
      what: "Share of a class's return variance in its top principal components."
  qmx_layer: ["X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-117: rising absorption tightens the class cluster cap."
    - "A3-structure-regimes-scenarios-163: the eigenvalue spectrum also gives N_eff."

- id: "A3-structure-regimes-scenarios-091"
  name: "Autoencoder reconstruction ratio (nonlinear absorption ratio)"
  source: "research/R6-alphaxiv-papers/T-07-risk-off-isolation-stress.md:24-47; paper https://www.alphaxiv.org/abs/2002.02008 (Lim, Zohren, Roberts 2020); chat-08-risk-off-regimes.md:60-75"
  kind: "detector"
  what_it_does: "Replace PCA with a denoising autoencoder: ARR = reconstruction error / total squared returns over a window; low ARR means high co-movement (ARR is about 1 - AR). On 11 US sector indices with one-second returns and time of day as input (out of sample 2016-2019), autoencoder R^2 0.461 vs PCA 0.340; ARR improved 5-minute and 1-hour volatility R^2 and crash AUROC (0.598 vs 0.587 at 5 minutes), but hurt 1-day and 1-week forecasts."
  inputs: ["synchronised one-second returns", "time of day"]
  outputs: ["ARR per window"]
  assumptions: ["many clean series in the bucket"]
  levels: ["cluster"]
  instrument_classes: ["indices"]
  class_notes: "Not for buckets of two or three instruments; retrain and revalidate per class; 24/7 crypto needs explicit stale-price rules."
  styles_timeframes: "Short-horizon brake input (5 minutes to 1 hour)."
  evidence: "author backtest"
  known_failures: ["gains small", "a 'crash' is a z-score below -1.5, not a real crash", "deep model needs retraining", "no dependable minutes-ahead lead time"]
  performance_note: "Short-horizon volatility forecasts improve slightly."
  survival_note: "Short-horizon brake input, not a forecast."
  ledger_ids: ["cross_market_stress_reading"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-090: start with PCA; ARR only where buckets are large."

- id: "A3-structure-regimes-scenarios-092"
  name: "Two-layer risk-off signal stack, no single master score"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:35-47,127; research/R2-trader-practice-windows-drift-isolation-breadth.md:159-172"
  kind: "detector"
  what_it_does: "Fast layer: turbulence, correlation surprise, and spread and volatility against their usual levels for that hour (minutes). Slow confirmation: absorption ratio, graph and eigenvalue measures, correlation windows (a day). The fast tells drive caution; slow ones confirm class cuts. No method gives a dependable minutes-ahead warning; set thresholds by measured utility (false triggers, missed episodes, drawdown avoided at fixed exposure), not label accuracy."
  inputs: ["fast tells per bucket", "slow coupling measures"]
  outputs: ["caution state", "confirmed stress state"]
  assumptions: ["each layer validated walk-forward at the decision cadence"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "The useful extra tell for a class switch is co-movement: many instruments in one class showing wide spreads or a volatility jump at once."
  styles_timeframes: "Book-level."
  evidence: "idea"
  known_failures: ["thresholds untested for intraday", "a $500 account may gain more from simple caps than from a high-dimensional detector"]
  performance_note: "Fast tells release quickly, so lost trading time is short."
  survival_note: "Two layers reduce single-signal false cuts."
  ledger_ids: ["cross_market_stress_reading", "market_isolation_trigger"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-095: the class co-move score is the fast class tell."
    - "A3-structure-regimes-scenarios-122: the immune brake integrates the layers over time."

- id: "A3-structure-regimes-scenarios-093"
  name: "Bucket-local isolation rule (cut the implicated bucket, keep a separate whole-book control)"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:114-127,152-159 (assistant's starting design); R4 synthesis :324"
  kind: "brake"
  what_it_does: "Compute stress per bucket (class, session or region) from instruments that actually trade in it. Normalise each bucket's score to its own trailing, time-of-day-aware distribution and alert on a high percentile. On alert: block new entries in the bucket and cut its open risk by a pre-approved step; on persistent stress pause the bucket. One extreme instrument cuts its own cluster only. Leave other buckets running unless the whole-book control fires."
  inputs: ["bucket stress scores", "bucket membership", "pre-approved step size"]
  outputs: ["bucket no-new-entries", "bucket risk step-down", "bucket pause"]
  assumptions: ["bucket panels synchronised", "human-approved thresholds"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Crypto-only cut needs local crypto turbulence or low ARR plus crypto CS where enough coins exist. Asian-session index cut uses only Asian-session instruments. Energy front-month squeezes cut that contract cluster, not all commodities."
  styles_timeframes: "All styles inside a bucket."
  evidence: "idea"
  known_failures: ["small buckets cannot support covariance methods", "untested thresholds"]
  performance_note: "Other buckets keep their full frequency through a local shock."
  survival_note: "Stops a local blow-up spreading through the book."
  ledger_ids: ["isolation_scope", "market_isolation_trigger", "isolation_end_rule"]
  new_variables:
    - name: "bucket_alert_percentile"
      what: "Percentile of a bucket's stress score that raises an alert."
    - name: "bucket_risk_step"
      what: "Pre-approved fraction of a bucket's open risk cut on alert."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-102: the operator's isolation protocol, made local."
    - "A3-structure-regimes-scenarios-178: grid selectivity: the smallest domain trips first."

- id: "A3-structure-regimes-scenarios-094"
  name: "Unknown is not calm: bad data blocks new risk"
  source: "research/R4-alphaxiv/chat-08-risk-off-regimes.md:43,124,181; chat-26-D-macrostructure.md:102,154; chat-29-G-multi-asset-normalisation.md:33; research/R5-mql5-corpus-ideas.md:542 (combination 6: Safe Mode, reject-all)"
  kind: "gate/test"
  what_it_does: "Validate the feed and market clock first. If prices are stale, a venue is down, or a contract is rolling, the bucket's state is 'unknown' and new entries there are blocked. A closed market is never a zero-return observation; crypto moving does not make a stale equity price valid. Uncertainty blocks new risk and never falls back to default sizing."
  inputs: ["feed freshness", "market clock", "roll state", "venue status"]
  outputs: ["state unknown flag", "no new entries in the bucket"]
  assumptions: ["calendar-aware stale rules (closed FX at the weekend is not a fault)"]
  levels: ["node", "cluster"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Futures rolls and stock halts are data events; crypto venue outages are common."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["the MIS board path fails open today", "a degraded mode that keeps trading on defaults (MQL5 23629) is the counter-example"]
  performance_note: "Small cost: only the unknown bucket waits."
  survival_note: "No sizing on stale or missing state."
  ledger_ids: ["feed_stale_after", "board_stale_after", "kill_switch_detector_posture"]
  new_variables:
    - name: "bucket_state_unknown"
      what: "Bucket flag when its data are stale, missing, rolling or halted."
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-115: isolation needs fail-closed, the board fails open."

- id: "A3-structure-regimes-scenarios-095"
  name: "Class co-move score from per-instrument tells"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:172,280; expansion/drafts-stopped/X4-scenarios.md:129-139 (X4-08)"
  kind: "detector"
  what_it_does: "The share of a class's instruments beyond their usual spread or volatility for this hour (or SQS-blocked, or stressed-labelled), plus any calendar event tagged to the class. When K of N instruments trip together, the class, not one instrument, is the problem."
  inputs: ["per-instrument spread and volatility percentiles for the hour", "SQS blocks", "calendar tags"]
  outputs: ["co-move score per class", "class caution trigger"]
  assumptions: ["calendar-aware baselines", "enough instruments per class"]
  levels: ["portfolio", "cluster"]
  instrument_classes: ["FX", "indices", "metals", "crypto", "futures", "energy", "stocks"]
  class_notes: "FX has many instruments for a ratio; energy and metals have few, so K of N is coarse there."
  styles_timeframes: "Book-level, minutes."
  evidence: "idea"
  known_failures: ["holiday afternoons look unusual everywhere unless baselines know the calendar"]
  performance_note: "Cheap, built from readings that already exist."
  survival_note: "Catches a class going bad before losses arrive."
  ledger_ids: ["sqs_score", "cross_market_stress_reading", "market_isolation_trigger", "instrument_class"]
  new_variables:
    - name: "co_move_score"
      what: "Share of a class's instruments tripping a stress tell at the same time."
    - name: "co_move_k_of_n"
      what: "Number of instruments that must trip together to flag the class."
  qmx_layer: ["X3", "X6"]
  link_hints:
    - "A3-structure-regimes-scenarios-109: requires two tells to agree."
    - "A3-structure-regimes-scenarios-198: class turns toxic scenario."

- id: "A3-structure-regimes-scenarios-096"
  name: "Exchange two-layer breaker pattern: per-product pauses, one market-wide stop"
  source: "research/R2-trader-practice-windows-drift-isolation-breadth.md:129-140,181-185"
  kind: "brake"
  what_it_does: "Single products pause on their own: Limit Up-Limit Down pauses one stock for 5 minutes if price stays outside a 5/10/20 % band around the last 5 minutes' average (bands double near open and close); CME dynamic breakers halt one future for 2 minutes on a +/-10 % move in a rolling 60 minutes (metals), with bands that move with the market; velocity logic halts on too far, too fast. Market-wide breakers at 7 % and 13 % halt 15 minutes; 20 % halts for the day. A pause is normal; a whole-day stop is the top level only."
  inputs: ["price vs moving reference band", "short-lookback velocity", "index level vs prior close"]
  outputs: ["per-product pause", "market-wide halt"]
  assumptions: ["bands move with the market"]
  levels: ["trade", "cluster", "portfolio", "system"]
  instrument_classes: ["stocks", "futures", "indices", "metals"]
  class_notes: "QMX analogue: instrument caution, class isolation, BMS-wide stop. FX and crypto have no exchange breakers; QMX must supply its own."
  styles_timeframes: "All."
  evidence: "live"
  known_failures: ["the exchange pause alone did not stop simulated agent crashes (FARSIGHT)", "resumption does not mean normal conditions"]
  performance_note: "Pausing one product keeps the rest trading."
  survival_note: "Top level stops everything only in extreme moves."
  ledger_ids: ["kill_switch_scope", "bms_circuit_breaker", "isolation_scope"]
  new_variables: []
  qmx_layer: ["X3"]
  link_hints:
    - "A3-structure-regimes-scenarios-097: the velocity tell is the QMX version of velocity logic."
    - "A3-structure-regimes-scenarios-141: 'exchange resumed' is not a re-enable signal."

- id: "A3-structure-regimes-scenarios-097"
  name: "Velocity tell: too far, too fast"
  source: "expansion/drafts-stopped/X4-scenarios.md:415 (X4-31); research/R2-trader-practice-windows-drift-isolation-breadth.md:137"
  kind: "detector"
  what_it_does: "A price moving further than a band in a short lookback raises a short instrument caution; several instruments showing it at once raise a class isolation; at the top level it can raise the kill switch automatically."
  inputs: ["price path over a short lookback", "per-instrument velocity band"]
  outputs: ["instrument caution", "class isolation input"]
  assumptions: ["band set per instrument"]
  levels: ["trade", "cluster", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "crypto", "futures", "stocks"]
  class_notes: "Crypto wicks and the 2016 GBP flash crash are the cases; bands per class."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["fires after the move; protects re-entry, not the stop already filled"]
  performance_note: "Stops units re-entering a broken market."

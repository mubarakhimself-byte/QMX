- id: "A3-structure-regimes-scenarios-159"
  name: "Stress results as survival gates, marginal stress contribution as the growth control"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:60-67"
  kind: "budget"
  what_it_does: "Survival gates: for every credible historical, hypothetical and reverse-stress scenario, stressed loss plus stressed exit cost and margin needs stay inside his loss, drawdown and capital limits, counting shared exposures. Growth controls: size live risk by each unit's marginal contribution to portfolio stress loss and liquidity demand, not by equal shares or a cap on unit count; a unit that lowers stress loss or holds up across scenario families earns more. Keep a buffer for model error; never relax a gate because a calm-trained generator says risk fell. Promotion includes passing the same tests against the existing live book."
  inputs: ["scenario-loss matrix", "his limits", "marginal contributions"]
  outputs: ["pass or fail per book state", "budget per unit by stress contribution"]
  assumptions: ["scenario set credible"]
  levels: ["unit", "portfolio", "account"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Same rule; marginal contributions differ by class."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["false precision about the worst case"]
  performance_note: "Hard limits only on credible paths to ruin; flexible budgets for units that improve the book under stress."
  survival_note: "Survival tested on joint scenarios before money moves."
  ledger_ids: ["portfolio_floor", "bms_buffer_before_floor", "unit_capital_share"]
  new_variables:
    - name: "marginal_stress_contribution"
      what: "Change in portfolio stress loss from adding a unit at its proposed size."
  qmx_layer: ["X2", "X4", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-001: per-sleeve stress loss."
    - "A3-structure-regimes-scenarios-150: the matrix it reads."


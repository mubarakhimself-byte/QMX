- id: "A3-structure-regimes-scenarios-109"
  name: "Two tells must agree, baselines know the calendar, every isolation records its precision"
  source: "expansion/drafts-stopped/X4-scenarios.md:141-151 (X4-09); research/R3-edge-verification-and-analogues.md:259-263 (alarm fatigue 85-99 %), :217 (aviation: alert only if action needed); research/R2-trader-practice-windows-drift-isolation-breadth.md:280"
  kind: "gate/test"
  what_it_does: "An isolation needs two tells to agree (spread and volatility, or spread and calendar), a minimum co-move count and a calendar-aware baseline. Afterwards it records whether a loss followed in the class within the window (its precision); recall is checked on historical shocks. A noisy isolation rule is a defect: clinicians mute alarms when 85-99 % need no action."
  inputs: ["tells", "calendar", "post-isolation outcomes"]
  outputs: ["isolation allowed", "precision and recall per rule"]
  assumptions: ["outcomes labelled after each isolation"]
  levels: ["portfolio", "system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Holiday and half-day baselines per calendar; forex has no holiday calendar today."
  styles_timeframes: "All."
  evidence: "idea"
  known_failures: ["precision needs many fires to estimate"]
  performance_note: "Fewer false isolations, fewer missed entries."
  survival_note: "A trusted brake is not muted."
  ledger_ids: ["brake_precision", "market_isolation_trigger"]
  new_variables:
    - name: "isolation_two_tell_rule"
      what: "Which pairs of tells must agree before an isolation."

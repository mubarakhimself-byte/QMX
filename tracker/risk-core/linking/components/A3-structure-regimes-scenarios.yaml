- id: "A3-structure-regimes-scenarios-153"
  name: "Reverse stress testing: start from the failure and search back"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:27,39 (https://www.alphaxiv.org/abs/2606.09274; large deviations 2606.31122)"
  kind: "scenario"
  what_it_does: "Define failure outcomes first (breach of drawdown or loss budget, margin shortfall, forced liquidation, cannot exit within a time or cost), then search for the least-implausible joint market and execution path that produces each, at portfolio and cluster level. Add credible finds to the standing library. The 2026 conditional framework compares Gaussian, semiparametric and local historical resampling."
  inputs: ["failure definitions", "joint model of drivers and execution"]
  outputs: ["most plausible failure paths"]
  assumptions: ["a model of joint moves"]
  levels: ["cluster", "portfolio", "account"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Same method; drivers per class."
  styles_timeframes: "Book-level."
  evidence: "simulation"
  known_failures: ["nonparametric version has low dispersion when few observations sit near the target stress"]
  performance_note: "Finds the specific weak spot instead of shrinking everything."
  survival_note: "Finds failures nobody specified."
  ledger_ids: ["portfolio_floor", "kill_line_floor", "margin_used"]
  new_variables: []
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-147: finds go into the standing library."

- id: "A3-structure-regimes-scenarios-154"
  name: "Synchronised multivariate block bootstrap, stratified by regime"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:41,53; research/R1-platforms-risk-sizing-extensibility.md:119 (StrategyQuant block bootstrap, 2025-26)"
  kind: "scenario"
  what_it_does: "Resample synchronised multivariate blocks so the same dates move together across assets; blocks long enough to keep intraday patterns and volatility persistence; stratify or reweight by regime. An iid bootstrap destroys clustering; independent asset bootstraps destroy the joint events the test is for."
  inputs: ["synchronised history", "block length", "regime labels"]
  outputs: ["resampled joint paths"]
  assumptions: ["history contains relevant crises"]
  levels: ["portfolio", "unit"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "24/7 crypto and 24/5 FX need aligned blocks."
  styles_timeframes: "All."
  evidence: "simulation"
  known_failures: ["cannot invent a crash absent from the record", "over-repeats a few crisis blocks"]
  performance_note: "Realistic growth distributions with clustering."
  survival_note: "Keeps joint tails in the sample."
  ledger_ids: ["monte_carlo_shuffle_count"]
  new_variables:
    - name: "bootstrap_block_length"
      what: "Length of synchronised blocks in the stress bootstrap."
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-156: tail extrapolation fills what blocks cannot invent."

- id: "A3-structure-regimes-scenarios-155"
  name: "Liquidity and execution inside every scenario"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:14,43"
  kind: "scenario"
  what_it_does: "Reprice exits with stressed spreads, lower depth, larger slippage and impact, latency, partial fills and gaps through stops; include venue hours, fees, funding and margin changes. Positions too large for the book exit as a sequence that consumes depth; never assume every unit can close at the mark at once. Without tick depth, use explicit conservative liquidity haircuts as a range."
  inputs: ["stressed spread and depth assumptions", "exit sequences"]
  outputs: ["scenario losses including execution"]
  assumptions: ["execution haircuts stated"]
  levels: ["position", "portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Thin CFDs at night, crypto liquidations, energy at inventory reports."
  styles_timeframes: "All; most for many small units exiting together."
  evidence: "idea"
  known_failures: ["haircuts are guesses without tick data"]
  performance_note: "Avoids penalising units that trade liquid hours."
  survival_note: "The dangerous case is many small units exiting into the same vanished liquidity."
  ledger_ids: ["slippage_cost", "gap_loss_beyond_stop", "spread_cost"]
  new_variables:
    - name: "stress_liquidity_haircut"
      what: "Spread and depth haircut range used to revalue exits in scenarios."
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-226: liquidity hole on one instrument scenario."

- id: "A3-structure-regimes-scenarios-156"
  name: "Tail-preserving scenario generation: extremal dependence, not just marginal tails"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:16,22-29,45-54 (SSGEN 2608.13056; Tail-GAN 2203.01664; Quant GANs 1907.06673; CoFinDiff 2503.04164; Diffusion Factor Models 2504.06566)"
  kind: "scenario"
  what_it_does: "For rare joint losses, matching each asset's tail is not enough; the generator must preserve the directions in which several factors become extreme together. SSGEN learns tail directions from intermediate exceedances and extrapolates magnitudes. GANs and VAEs learn broad patterns but not reliable joint-tail frequency; diffusion offers conditioning; a Gaussian copula has no tail dependence and a t-copula imposes symmetric tail dependence; regime-switching helps only with credible persistence. Use generators to broaden scenarios, never as the authority on how bad losses get."
  inputs: ["multi-asset history", "tail threshold"]
  outputs: ["synthetic joint-tail scenarios"]
  assumptions: ["stable tail estimation from limited data"]
  levels: ["portfolio"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Factor-structured diffusion assumes sub-Gaussian factors; heavy-tailed crypto and energy break that."
  styles_timeframes: "Book-level."
  evidence: "simulation"
  known_failures: ["threshold choice", "trained on calm samples it reports lower risk"]
  performance_note: "More scenario breadth without inventing fear."
  survival_note: "Extrapolates joint tails beyond history."
  ledger_ids: []
  new_variables: []
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-157: validate generated paths downstream."

- id: "A3-structure-regimes-scenarios-157"
  name: "Validate generated scenarios through the downstream strategy, not by looks"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:26,56 (Beyond Visual Realism 2601.12990)"
  kind: "gate/test"
  what_it_does: "Visual similarity and stylised-fact checks can coexist with implausible trading outcomes. Generated scenarios earn credibility by passing out-of-sample, regime-aware tests on what QMX cares about: marginal and joint tail exceedances, co-loss breadth across units, volatility clustering and regime duration, drawdown depth and length, portfolio loss, margin, liquidation time and execution cost after replay through the units, with uncertainty intervals."
  inputs: ["synthetic and observed paths", "unit replay"]
  outputs: ["pass or fail per generator"]
  assumptions: ["observed episodes to compare"]
  levels: ["system"]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "stocks"]
  class_notes: "Evidence from one equity index and a momentum strategy."
  styles_timeframes: "All."
  evidence: "author backtest"
  known_failures: ["few observed tail episodes to compare against"]
  performance_note: "Avoids over-constraining on unrealistic paths."
  survival_note: "Avoids trusting a generator that misses joint losses."
  ledger_ids: []
  new_variables: []
  qmx_layer: ["X4", "X5"]
  link_hints:
    - "A3-structure-regimes-scenarios-158: co-loss breadth is one of the checks."


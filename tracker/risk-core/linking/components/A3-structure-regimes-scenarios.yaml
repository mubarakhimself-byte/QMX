  class_notes: "Crypto news is 24/7 with authenticity as the core risk; FX headlines map to every pair holding the currency; energy price-impact windows are very short."
  styles_timeframes: "Context for all; never in a scalper's decision loop."
  evidence: "idea"
  known_failures: ["fabricated news fools agents (62 % attack success in a sandbox)", "headlines arrive after the price moved"]
  performance_note: "Value must show in paired tests against no agent."

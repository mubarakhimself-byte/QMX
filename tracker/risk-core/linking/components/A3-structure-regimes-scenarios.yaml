  assumptions: ["the slice is chosen on one period and judged on a later one"]
  levels: ["unit", "methodology"]
  instrument_classes: ["FX", "indices", "metals", "crypto", "futures", "stocks"]
  class_notes: "Windows concentrate activity and liquidity; for scalpers a lower-cost window can turn gross edge net. That is a cost effect, not new edge."

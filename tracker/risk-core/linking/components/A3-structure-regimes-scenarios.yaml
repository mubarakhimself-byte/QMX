- id: "A3-structure-regimes-scenarios-230"
  name: "Tail-GAN: a scenario generator trained on strategy P&L tails"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md:68-93 (turn 2); paper https://www.alphaxiv.org/abs/2203.01664"
  kind: "scenario"
  what_it_does: "Train a generator so that benchmark strategies' P&L on generated paths matches their VaR and ES on history (a tail-sensitive discriminator), then sample paths and run the strategies to get their loss distributions. On a synthetic five-asset set, out-of-sample VaR/ES relative error 4.6 % vs 3.4 % for historical simulation and 21.3 % for WGAN; on 20 stocks with one month of training, 25.6 % vs 25.9 % historical. It beat a general GAN, not historical simulation."
  inputs: ["synchronised multi-asset prices", "benchmark strategy code with costs", "tail level"]
  outputs: ["path generator", "strategy loss distributions"]
  assumptions: ["representative strategies in the training suite"]
  levels: ["unit", "portfolio"]
  instrument_classes: ["stocks"]
  class_notes: "Price-only; the authors name order-book data as the needed extension for high-frequency strategies."
  styles_timeframes: "Book-level; scalpers need order-book extensions."
  evidence: "author backtest"
  known_failures: ["strategies not in training are not covered", "no spread, depth, queue or gap costs"]
  performance_note: "Scenario breadth tuned to what QMX's own units lose on."
  survival_note: "Tails matched on strategy P&L, not just prices."
  ledger_ids: []
  new_variables: []
  qmx_layer: ["X4"]
  link_hints:
    - "A3-structure-regimes-scenarios-156: SSGEN adds joint-tail extrapolation (chat-15 combination: Tail-GAN + SSGEN + execution-cost stress)."
    - "A3-structure-regimes-scenarios-155: execution overlay it lacks."

- id: "A3-structure-regimes-scenarios-231"
  name: "Correlation stress through interpretable factors, with reverse stress in a plausibility region"
  source: "research/R4-alphaxiv/chat-15-stress-scenarios.md (turn 2, Packham, Woebbeking); paper https://www.alphaxiv.org/abs/2107.06839"
  kind: "scenario"
  what_it_does: "Map assets to sparse factors (country, industry), fit a parametric correlation structure, estimate its parameter history, generate scenarios by moving factor parameters into valid correlation matrices, and revalue risk; for reverse stress, find the worst factor configurations inside a Mahalanobis or highest-density plausibility region. On North American and European stocks, 1-day 99 % stressed VaR often exceeded unstressed VaR by more than 50 % in normal markets; the gap shrank in 2008 and 2020, when the stress was partly realised."
  inputs: ["return panel", "asset-to-factor map", "exposures"]
  outputs: ["interpretable correlation scenarios", "stressed VaR"]
  assumptions: ["factor map meaningful"]
  levels: ["cluster", "portfolio"]
  instrument_classes: ["stocks", "indices"]
  class_notes: "For QMX, factors would be the driver tags (currency, region, class)."
  styles_timeframes: "Book-level."

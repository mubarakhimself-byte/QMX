- id: "A3-structure-regimes-scenarios-024"
  name: "Split cash-session and overnight risk"
  source: "research/R4-alphaxiv/chat-25-C-intraday-day-trading.md:53 (The Cross-Section of Intraday and Overnight Returns, 2016); chat-29-G-multi-asset-normalisation.md:121; R4 synthesis :254"

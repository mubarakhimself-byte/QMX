- id: A4-template-agents-telemetry-195
  name: Pool by default; an instrument or session earns its own parameter only on forward evidence, and every override records its evidence and expiry
  source: research/R4-alphaxiv/chat-17-self-configuring-parameters.md:25-48 and :119-131 and :142-156 (assistant's design)
  kind: config/override pattern
  what_it_does: >-
    Keep a versioned group default plus an explicit override layer; no override is a valid and common
    outcome. An override needs a plausible mechanism, enough independent evidence (as a starting rule 100
    effective trades across 30 or more sessions for an instrument, 60 instances of a session for a session
    override, and two different volatility conditions), a material and persistent difference after costs, a
    win against the default on identical untouched forward windows, and a gain that pays for its extra knobs.
    Each override records its evidence window, effective sample size, uncertainty, last update and expiry.
    Pool estimation information, not every raw value - contract facts stay exact per instrument, execution
    costs are local by venue, session and size, normalised stops and thresholds pool within a strategy
    family, session windows are aligned to each market's calendar before sharing, roll and corporate-action
    rules are never pooled.
  inputs:
    - group defaults, per-instrument and per-session evidence
  outputs:
    - pooled value or an approved override with its record
  assumptions:
    - groups are economically meaningful (class, venue, liquidity tier, family, session)
  levels: [unit, methodology, cluster]
  instrument_classes: [FX, indices, metals, energy, crypto, futures, stocks (guidance per class, no test)]
  class_notes: >-
    FX and index futures give many correlated intraday observations; energy should not pool crude, gas and
    products; crypto's abundant bars overstate sample size; single stocks need delisting and corporate-action
    handling. Count distinct days, sessions and regimes, not bars.
  styles_timeframes: all; session overrides matter most for session-open and scalper units
  evidence: idea (assistant's design; it says no source shows partial pooling raised held-out returns)
  known_failures:
    - pooling is worse than no pooling if the group is wrong
  performance_note: "[judgment] fewer noisy per-instrument settings, so placement across many markets is cheaper to run."
  survival_note: "[judgment] a market cannot get its own looser setting from a lucky stretch."
  ledger_ids: [instrument_class, session_windows, calibration_min_trades, edge_range]
  new_variables:
    - name: override_evidence_record
      line: evidence window, effective sample, uncertainty, last update and expiry stored with every override
    - name: override_min_independent_evidence
      line: effective trades and distinct sessions an instrument or session needs before its own parameter
  qmx_layer: [X1, X2]
  link_hints:
    - A4-template-agents-telemetry-050, the override chain these overrides sit in
    - A4-template-agents-telemetry-196, the shrinkage that sets the pooled value
    - A4-template-agents-telemetry-185, timeframe and session axes

- id: A4-template-agents-telemetry-196
  name: Empirical-Bayes shrinkage of each instrument's estimate toward its group, with edge shrunk toward zero
  source: research/R4-alphaxiv/chat-17-self-configuring-parameters.md:71-91 (assistant's description of a standard method)
  kind: control loop
  what_it_does: >-
    For a statistic such as net edge, normalised stop distance or session cost, estimate each instrument's
    value and variance from its own data, estimate the group mean and between-instrument variance, and pull
    noisy estimates toward the group mean with weight tau squared over tau squared plus the instrument's
    variance. It returns a shrunk estimate, its uncertainty and the weight. Edge is shrunk toward zero or a
    conservative prior, never toward an optimistic group average, and group priors are estimated inside the
    training part of each chronological test.
  inputs:
    - per-instrument estimates with variances, group membership
  outputs:
    - shrunk estimates, uncertainty, shrinkage weights
  assumptions:
    - instruments in a group are genuinely related; uncertainty counts independent days, not trades
  levels: [unit, methodology]
  instrument_classes: [all; never shrink contract facts such as tick size or minimum order]
  class_notes: groups by class, venue, liquidity tier and family; membership changes only under a declared rule
  styles_timeframes: all
  evidence: idea (statistical method; no multi-instrument trading comparison in the sources)
  known_failures:
    - stale group estimates after a regime shift; leakage if priors use evaluation data
  performance_note: "[judgment] a new market inherits a sensible value at once instead of a placeholder."
  survival_note: "[judgment] weak evidence cannot produce a confident edge."
  ledger_ids: [calibration_shrink_k, edge_range, kelly_shrink_factor]
  new_variables:
    - name: pooling_group
      line: the group an instrument's estimates shrink toward
  qmx_layer: [X1, X2]
  link_hints:
    - A4-template-agents-telemetry-015, borrowed priors
    - James-Stein post-selection Sharpe (Pav 2026, in A1)
    - A4-template-agents-telemetry-055, the class rung of the fallback ladder

- id: A4-template-agents-telemetry-197
  name: Re-estimation cadence by layer and rate limits per update, with only tightening automatic
  source: research/R4-alphaxiv/chat-17-self-configuring-parameters.md:127-129 (assistant's starting governance numbers)
  kind: control loop
  what_it_does: >-
    Update execution-state estimates (volatility, spread) continuously or daily, but apply strategy
    parameters only at scheduled boundaries; refit instrument posteriors and eligible overrides weekly,
    group priors monthly and group definitions quarterly. A regime alarm may trigger review or a
    risk-reducing response, never fresh tuning. A parameter may move at most 5 % of its normalised value per
    weekly update (0.1 group standard deviations for a bounded threshold) and must re-pass validation before
    the next move. Automatic changes are confined to state estimates or tightening; loosening risk or a new
    override is a human decision.
  inputs:
    - schedule, proposed change, validation result
  outputs:
    - applied, capped or deferred change
  assumptions:
    - parameters are on normalised scales
  levels: [unit, methodology, cluster]
  instrument_classes: [all]
  class_notes: no class content
  styles_timeframes: all; weekly cadence is slow for scalpers' state estimates, which update daily
  evidence: idea (assistant's starting values, not results)
  known_failures:
    - a tightening-only automatic path can ratchet a good unit down with no automatic way back [judgment]
  performance_note: "[judgment] stops chasing a short-lived backtest win."
  survival_note: "[judgment] no automatic loosening."
  ledger_ids: [calibration_cadence_trades, drift_size_down_step, grow_back_rule]
  new_variables:
    - name: parameter_move_cap_per_update
      line: most a self-configured parameter may move in one scheduled update, on its normalised scale
  qmx_layer: [X1, X2]
  link_hints:
    - A4-template-agents-telemetry-004, direction-split motion with rate caps
    - A4-template-agents-telemetry-199, conservative bandits for the way back up

- id: A4-template-agents-telemetry-198
  name: Offline tuning that penalises unstable search and picks plateaus, then locks parameters for a rolling forward test (TPE-AS, AlgoXpert)
  source: research/R4-alphaxiv/chat-17-self-configuring-parameters.md:50-58 and :93-117 and :166 (2504.13529, 2603.09219, 2405.14262, assistant's claims)
  kind: gate/test
  what_it_does: >-
    Bayesian optimisation is used only for bounded, offline searches. An adaptive TPE raises a penalty on
    variability as the budget is used up; over 500 steps it reported the highest Sharpe in 8 of 12 scenarios
    and the lowest optimisation variance in all 12 (variance 0.309 against 1.367 for plain TPE). AlgoXpert's
    protocol selects from a stable parameter region, runs rolling forward tests, locks parameters before the
    final out-of-sample test and stresses costs. A Supertrend study's optimised maximum profit was worse than
    default for one of five stocks and gave no forward evidence.
  inputs:
    - bounded parameter space, net risk-aware objective
  outputs:
    - stable candidate region, locked parameters
  assumptions:
    - the objective is net of costs and the evaluator fixed
  levels: [unit]
  instrument_classes: [portfolio models (undisclosed); USDJPY (AlgoXpert); stocks (Supertrend)]
  class_notes: generic
  styles_timeframes: offline research
  evidence: author backtest (search stability, not live robustness; AlgoXpert OOS Sharpe 2.34 on one asset with simplified execution)
  known_failures:
    - low variance across trials can still mean every trial is overfit to one backtest
  performance_note: "[judgment] cheaper, steadier tuning of template dials."
  survival_note: "[judgment] plateaus over peaks reduces fragility."
  ledger_ids: [walk_forward_efficiency_min, cost_stress_multiple]
  new_variables: []
  qmx_layer: [X5, X1]
  link_hints:
    - A4-template-agents-telemetry-126, AutoQuant's two-stage screen
    - A4-template-agents-telemetry-016, OtterTune's explore and exploit

- id: A4-template-agents-telemetry-199
  name: Online choice among a few pre-approved configurations by a conservative bandit with the group default as the baseline arm
  source: research/R4-alphaxiv/chat-17-self-configuring-parameters.md:54 and :182-188 (Conservative Bandits 1602.04282, Rotting Bandits 1702.07274, assistant's combinations)
  kind: control loop
  what_it_does: >-
    For continual adaptation, a Bayesian state update or bandit chooses among a small set of configurations
    tuned offline, with the current group default as the baseline arm. Conservative UCB explores a new arm
    only when a lower-confidence estimate says the cumulative reward stays above a baseline-relative floor.
    Rotting bandits discount stale rewards so a favoured arm is dropped when its edge decays; de-risking is
    fast, re-risking slow and evidence-gated.
  inputs:
    - approved configurations, live net rewards
  outputs:
    - the configuration in force
  assumptions:
    - rewards meet the bandit's assumptions; jumps and execution failures are outside its guarantee
  levels: [unit]
  instrument_classes: [none tested]
  class_notes: no class content
  styles_timeframes: high-frequency units reach decisions faster
  evidence: idea (bandit theory; no trading test in the sources)
  known_failures:
    - nonstationary markets break the guarantees
  performance_note: "[judgment] a unit can move to a better configuration live without a new version per move, inside a floor."
  survival_note: "[judgment] exploration cannot cost more than a set budget below the default."
  ledger_ids: [grow_back_rule, number_motion_mode]
  new_variables:
    - name: approved_config_set
      line: the few configurations a unit's live bandit may choose among
  qmx_layer: [X1, X2]
  link_hints:
    - A4-template-agents-telemetry-007, Simplex fallback to a safe controller
    - A4-template-agents-telemetry-041, whether an arm switch is a calibration row or a version

- id: A4-template-agents-telemetry-200
  name: Layered limits with watch, intervene and hard levels; local layer acts first for ordinary breaches, the account stop never waits
  source: research/R4-alphaxiv/chat-07-layered-limits-alarm-fatigue.md:30-41 and :55-71 (IEEE C37.112 relay coordination applied by the assistant)
  kind: other (limit coordination)
  what_it_does: >-
    Compute a small shared set of risk measures consistently at strategy, cluster, asset-class and account
    scope, aggregating correlated strategies by shared exposure. Each layer has its own job - strategy stops
    and reduces itself; cluster pauses a group sharing a signal, venue, path or factor; asset class acts on
    combined class exposure; the account keeps an independent hard ceiling and kill path. Each limit has a
    watch, an intervention and a hard level with hysteresis and cooldown. Ordinary breaches are handled by
    the most local layer first with wider layers as backup, but no grading delay is ever put on a hard account
    breach.
  inputs:
    - shared risk measures per scope
  outputs:
    - layer actions, grouped incidents
  assumptions:
    - trading has no physically isolated zones, so upper layers guard against common-mode failure
  levels: [unit, cluster, portfolio, account]
  instrument_classes: [all]
  class_notes: futures, ETFs and CFDs on one index are one position; FX pairs aggregate by currency
  styles_timeframes: all
  evidence: idea (engineering standard and assistant's adaptation; no trading miss or nuisance rates)
  known_failures:
    - the 0.3 to 0.5 s relay interval is not a trading delay and must not be copied
  performance_note: "[judgment] a local trip stops one unit instead of the book."
  survival_note: "[judgment] the account stop stays independent of every lower service."
  ledger_ids: [brake_state, cluster_exposure_cap, account_daily_loss_limit, daily_loss_warning_fraction]
  new_variables:
    - name: limit_levels
      line: watch, intervene and hard thresholds for one limit, with hysteresis
  qmx_layer: [X3, X1]
  link_hints:
    - A4-template-agents-telemetry-063, trading states per scope
    - grid selectivity and reclosers (R3 3.1, in A2)
    - A4-template-agents-telemetry-201, notification kept separate

- id: A4-template-agents-telemetry-201
  name: Enforcement apart from notification; every alert rationalised with cause, scope, priority, action, owner and deadline; shelving never masks a trip
  source: research/R4-alphaxiv/chat-07-layered-limits-alarm-fatigue.md:43-46 and :61-77 (ANSI/ISA-18.2-2016, EEMUA 191, SRE burn rates, applied by the assistant)
  kind: measure/telemetry
  what_it_does: >-
    Risk enforcement and human notification are separate systems; suppressing or deduplicating a page never
    suppresses a trip. Each alert is tested by whether it needs a specific human action and by when, and is
    rationalised with cause, scope, priority, response and owner; otherwise it is a dashboard metric, log or
    digest item. Alerts are grouped by incident with contributors listed, repeats suppressed while unchanged,
    escalated if worse or unresolved. Shelving is temporary, scoped and audited. For one operator who may be
    asleep, a page is not protection - the account stops safely without acknowledgement and escalation goes
    to another contact or service.
  inputs:
    - limit events, incidents
  outputs:
    - pages, digests, logs
  assumptions:
    - each alert has an owner and a deadline
  levels: [unit, cluster, account, node]
  instrument_classes: [all]
  class_notes: crypto has no quiet hours; the book needs an explicitly safe unattended mode
  styles_timeframes: all
  evidence: idea (process-industry alarm standards and SRE practice; no trading test)
  known_failures:
    - quieter alerting can hide missed events unless misses are measured too
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] he is woken only for decisions that remain, and safety does not wait for him."
  ledger_ids: [liveness_heartbeat_cadence]
  new_variables:
    - name: alert_rationale
      line: cause, scope, priority, action, owner and deadline recorded for every alert type
  qmx_layer: [X6]
  link_hints:
    - A4-template-agents-telemetry-157, aviation alert-only-if-action
    - A4-template-agents-telemetry-160, deduplication by root cause
    - A4-template-agents-telemetry-151, the shipped phone pushes

- id: A4-template-agents-telemetry-202
  name: Measure the trip tax - replay each trip for units paused, time lost, forgone net P&L, exit costs and loss avoided, beside missed or late trips
  source: research/R4-alphaxiv/chat-07-layered-limits-alarm-fatigue.md:109-123 (Drew et al. 2014 ICU alarm study, ISA-18.2, SRE; assistant's proposal)
  kind: gate/test
  what_it_does: >-
    No source gives a trading false-trip budget, so the book measures its own. Replay each proposed trip on
    historical or simulated data and record strategies paused, duration, forgone net P&L, exit costs and loss
    avoided; count missed and late interventions separately; stratify by asset, session, news, liquidity and
    correlated breach. Alert-quality signals - false-trip rate, duplicate rate, acknowledgement delay,
    unresolved duration, repeated trips after re-enable. The ICU study recorded 2,558,760 alarms in 31 days
    (187 per bed per day), and 88.8 % of 12,671 annotated arrhythmia alarms were false.
  inputs:
    - trip history, market data, outcomes
  outputs:
    - trip tax and miss counts per brake
  assumptions:
    - the replay can price both sides fairly
  levels: [unit, cluster, portfolio]
  instrument_classes: [all; stratified by class]
  class_notes: session opens and news windows produce alert bursts, so stratification by time context matters
  styles_timeframes: all
  evidence: idea (method proposal; the ICU numbers are observational evidence of alarm burden, not trading)
  known_failures:
    - loss avoided needs a counterfactual that can be gamed [judgment]
  performance_note: "[judgment] puts a money number on over-tripping, so brakes are tuned for growth too."
  survival_note: "[judgment] misses are counted beside nuisance, so quieter brakes are not blindly preferred."
  ledger_ids: [brake_precision, breaker_fire_density]
  new_variables:
    - name: trip_tax
      line: forgone net P&L and exit cost of a brake's fires minus the loss they avoided, per period
  qmx_layer: [X6, X3, X5]
  link_hints:
    - A4-template-agents-telemetry-156, brake precision
    - random-control brake test (MQL5 23482, in A2)
    - A4-template-agents-telemetry-186, the replay tool

- id: A4-template-agents-telemetry-203
  name: Alert timing per market - brief higher watch sensitivity at opens and news with grouped notifications, and "risk is high" kept apart from "risk can be exited"
  source: research/R4-alphaxiv/chat-07-layered-limits-alarm-fatigue.md:89-107 (assistant's per-class guidance)
  kind: measure/telemetry
  what_it_does: >-
    At scheduled opens and news windows, raise watch sensitivity briefly and group notifications instead of
    lowering hard protection. When liquidity or venue status (halts, limit moves, rejections, outages) makes
    exit uncertain, the incident's urgency rises and the position is tracked until it is actually reduced; a
    halt or rejected order is never counted as risk controlled.
  inputs:
    - time context, venue and limit states, exit liquidity
  outputs:
    - watch level, incident urgency
  assumptions:
    - venue and limit states are fed to the node
  levels: [unit, account, node]
  instrument_classes: [FX, indices, metals, energy, crypto, futures, stocks]
  class_notes: >-
    FX sessions, rollovers and releases are liquidity regimes; indices at cash open and close; metals and
    energy limit moves and expiry; crypto 24/7 with venue outages; futures limit states; stocks halts and LULD.
  styles_timeframes: session-open and news-sensitive units most
  evidence: idea (assistant's guidance)
  known_failures:
    - burst suppression that also delays a real hard breach
  performance_note: "[judgment] fewer pages at opens means fewer needless manual pauses."
  survival_note: "[judgment] a position that cannot be exited is never shown as safe."
  ledger_ids: [warm_up_window, news_blackout_before, kill_switch_level]
  new_variables:
    - name: exit_capacity_state
      line: whether a position can currently be reduced (halt, limit move, outage), shown with its risk
  qmx_layer: [X6, X3]
  link_hints:
    - A4-template-agents-telemetry-201, notification policy
    - session-open caution windows (SEEDS D9, in A3)

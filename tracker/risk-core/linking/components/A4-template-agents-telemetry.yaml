- id: A4-template-agents-telemetry-134
  name: An LLM-free fast risk loop with four states and hysteresis, the LLM only after a rule trigger, and a kill path that never calls a model (SwingGuard, FARSIGHT)
  source: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:76-95 (SwingGuard 2610.12988, R6 read); research/R6-alphaxiv-papers/T-06-drawdown-kill-switches-layered-limits.md:195-213 (FARSIGHT 2609.19705, R6 read)
  kind: control loop
  what_it_does: >-
    A 5-minute controller runs apart from daily agents - a rule screen, a 6-hour accumulation check, then an
    LLM diagnosis only if triggered - and keeps NORMAL, ALERT, SURVIVAL, RECOVERY with hysteresis, minimum
    holds and staged re-entry (ALERT compresses exposure, SURVIVAL forces zero). Removing the fast loop did
    the most damage (Sharpe 1.87, drawdown 14.19 %). FARSIGHT found none of 15 academic LLM trading designs
    had a halt that skips inference; hard loss limits on broker prices plus a fast path removed agent-caused
    crashes at the cost of a few false halts per calm hour, tuned by one threshold.
  inputs:
    - 5-minute bars, positions, broker prices
  outputs:
    - risk state and capped exposure
  assumptions:
    - limits read broker prices, not agent text
  levels: [unit, portfolio, account]
  instrument_classes: [crypto (SwingGuard); single stock simulated market (FARSIGHT)]
  class_notes: crowding risk is worst where many bots trade one thin market (small-cap crypto, single stocks)
  styles_timeframes: any unit with agent inputs
  evidence: author backtest (SwingGuard, survives 50 bp costs at Sharpe 2.15) and simulation (FARSIGHT)
  known_failures:
    - a breached limit must halt, not sell everything (sellers overshot by 9.6 to 11.1 %)
  performance_note: "[judgment] the fast loop added more than the agents' extra steps in the ablation."
  survival_note: "[judgment] no model inference stands between a breach and a halt."
  ledger_ids: [brake_state, kill_switch_detector_posture]
  new_variables:
    - name: false_halt_threshold
      line: single threshold per layer tuned from logged false halts
  qmx_layer: [X3, X7]
  link_hints:
    - A4-template-agents-telemetry-063, trading states
    - A4-template-agents-telemetry-156, false halts logged as brake precision
    - G2 ruling 5, no agents in the fast lane

- id: A4-template-agents-telemetry-135
  name: A read-only explainer agent - narrates incidents, explains a size or a zone change in plain words, never trips or clears anything
  source: research/R4-alphaxiv/chat-06-kill-switches-breakers.md:154 (Online Safety Monitoring 2607.02510); expansion/drafts-stopped/X5-edge-verification.md:317-323 (X5-29); expansion/drafts-stopped/X1-template-shape.md:423-429 (X1 idea 47)
  kind: agent role
  what_it_does: >-
    A read-only LLM summarises incidents, explains which strategies share exposure and drafts a review
    checklist; it is never the detector, breaker or re-enable authority, because it can be late, wrong or
    poisoned by the same inputs. X5 has an agent write each zone change in plain words from the formula's
    inputs; X1 has a skill that walks receipts and the override chain to explain a size in ten words. The
    text is attached, never used as an input.
  inputs:
    - journals, receipts, formula inputs
  outputs:
    - plain-word notes
  assumptions:
    - explanations are generated from recorded inputs only
  levels: [trade, unit, portfolio]
  instrument_classes: [all]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea
  known_failures:
    - a fluent explanation can wave a real failure through if the same agent built the unit

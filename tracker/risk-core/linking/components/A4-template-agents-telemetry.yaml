  styles_timeframes: all research
  evidence: author backtest (2608.27734 - with every trial counted, no LLM-discovered strategy passed certification across two models and up to 100 candidates)
  known_failures:
    - the promotion bar rises faster than the best in-sample Sharpe as trials grow
  performance_note: "[judgment] honest counts stop wasting live money on lucky winners."
  survival_note: "[judgment] the search cannot hide its failures."
  ledger_ids: [effective_tries]
  new_variables:

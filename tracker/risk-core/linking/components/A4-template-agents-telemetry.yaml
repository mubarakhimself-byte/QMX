- id: A4-template-agents-telemetry-168
  name: One execution and cost convention shared by backtest, paper and live, reconciled; the risk model checked daily against realised results
  source: research/R6-alphaxiv-papers/T-11-costs-and-self-configuring-parameters.md:189-207 (AutoQuant 2512.22476, R6 read); research/R1-platforms-risk-sizing-extensibility.md:297 (RiskMetrics section 3.2)

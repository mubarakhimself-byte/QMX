    - A4-template-agents-telemetry-165, the verification passport the packet reads

- id: A4-template-agents-telemetry-121
  name: Anytime-valid promotion ledger - hash-frozen candidates funded from a lifetime error budget, cost-aware betting score, next-session start
  source: research/R6-alphaxiv-papers/T-09-validation-against-overfitting.md:11-39 (Promote 2611.03384, R6 read); research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:160
  kind: gate/test
  what_it_does: >-
    Each candidate rule (code, universe, parameters, sizing, rebalance, cost model) is frozen and hashed and
    gets testing wealth from a lifetime budget summing to at most 1. From the next return it bets on a
    clipped, cost-adjusted score averaged over a fixed bet grid; it promotes when the product crosses 1 over
    alpha times its wealth, and trading starts the next period. Abandoning refunds nothing; any change,
    revival or restart is a new candidate.
  inputs:
    - frozen candidates, post-birth net returns
  outputs:
    - promote or not, with an audit trail
  assumptions:
    - a bounded, clipped score per period
  levels: [unit, methodology, system]
  instrument_classes: [ETF and industry panels]
  class_notes: scale and clipping must be set per class; crypto scores clip more often
  styles_timeframes: all; weak edges (5 bp per session) never crossed in the test
  evidence: simulation (3,000 null paths - repeated unadjusted tests promoted a false rule in 94.5 %, Promote 0.0 %) plus author backtest (market replay promoted zero rules after costs)
  known_failures:
    - it does not prove the edge is still alive at deployment; conservative with correlated variants
  performance_note: "[judgment] promotion can be checked any day without inflating false passes."
  survival_note: "[judgment] a crossing is an authorisation request, not an order; he still promotes."
  ledger_ids: [sequential_evidence_pass, effective_tries]
  new_variables:
    - name: lifetime_testing_wealth
      line: error budget shared by all candidates ever born
  qmx_layer: [X5, X7]
  link_hints:
    - A4-template-agents-telemetry-110, the search ledger
    - multi-stream e-detectors for demotion (R6 T-08, in A2), one evidence currency for both


    - A4-template-agents-telemetry-186, sizing-only replay fills the money record from history

# ---------------------------------------------------------------- C. Cascading config, overrides and defaults

- id: A4-template-agents-telemetry-043
  name: Policy level above all levels, scope restrictions and object merge (VS Code settings)
  source: research/R7-software-patterns-self-configuring.md:356-363 (VS Code user and workspace settings docs, CHECKED)
  kind: config/override pattern
  what_it_does: >-
    Later scopes override earlier ones (default, user, remote, workspace, folder, language-specific).
    Policy settings set by an administrator override every scope. Some application-wide settings cannot be
    overridden by a workspace at all. Primitive values are replaced; object values are merged.
  inputs:
    - values per scope, policy values, per-setting scope restrictions
  outputs:
    - the effective value per setting
  assumptions:
    - each setting declares which scopes may set it
  levels: [unit, cluster, portfolio, account, system]
  instrument_classes: [none (software)]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea (production software, CHECKED)
  known_failures:
    - merging objects can mix two levels' halt lists in a way nobody chose [judgment]
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] the account (his) is the policy level no unit or agent can override."
  ledger_ids: [risk_fraction, kill_line_floor, account_daily_loss_limit]
  new_variables:
    - name: settable_by_levels
      line: which levels may set a number (for example unit and Book, never agent)
    - name: policy_value
      line: a value set at the policy (account) level that beats every scope
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-044, CSS gives the reversed "important" rule for outer limits
    - A4-template-agents-telemetry-050, the QMX override chain
    - A4-template-agents-telemetry-009, hard limits that clamp even manual input

- id: A4-template-agents-telemetry-044
  name: Most specific wins for normal values; outer level wins for values marked important (CSS cascade)
  source: research/R7-software-patterns-self-configuring.md:349-354 (MDN cascade introduction, CHECKED)
  kind: config/override pattern
  what_it_does: >-
    For normal declarations precedence runs user agent, then user, then author, so the most specific origin
    wins. For declarations marked important the order reverses, so the outermost origin wins.
  inputs:
    - values per level, important flags
  outputs:
    - effective value
  assumptions:
    - each limit can be marked normal or important by its owner

- id: A4-template-agents-telemetry-107
  name: News agent producing event records that separate event time from availability time, with the post-cutoff evaluation rule
  source: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:86 and :176; research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:114-130 (MFAST 2609.23703, R6 read); research/R5-mql5-corpus-ideas.md:169 (MQL5 17986)
  kind: agent role
  what_it_does: >-
    Each item becomes a record with source, headline id, entity and instrument mapping, publication time,
    ingestion time, event class, polarity or impact, confidence, and duplicate or correction status.
    Headlines are evidence, never instructions. MFAST's rules: no position before the news is public,
    after-close news trades next day, and an LLM is evaluated only on news after its training cutoff.
    MQL5 17986 ends warning that trading at or after releases is very risky; agents tag events, not trades.
  inputs:
    - timestamped, entity-resolved headlines from allow-listed sources
  outputs:
    - event records with impact and confidence
  assumptions:
    - availability time can be measured
  levels: [unit, cluster, portfolio]
  instrument_classes: [stocks in MFAST; R6 says FX, indices and commodities react to macro releases, not firm news]
  class_notes: calendars keyed on currency do not reach indices, metals, energy or crypto (MQL5 24250); mapping events to those is an agent job with a human check
  styles_timeframes: daily news swing in MFAST; for QMX scalpers, event windows and de-risking only
  evidence: author backtest (MFAST, post-cutoff out-of-sample June 2024 to January 2026, Sharpe 2.85 after 5 bp, revise-and-resubmit)
  known_failures:
    - news may be priced before the next feasible fill; a delayed-signal test is needed
  performance_note: "[judgment] the event map lets brakes and windows cover non-FX classes."
  survival_note: "[judgment] one uncorroborated headline cannot force a trade."
  ledger_ids: [news_blackout_before, news_blackout_after, news_impact_level_map, news_region_shift]
  new_variables:
    - name: event_available_time
      line: time the system could first know an event, separate from when it happened
  qmx_layer: [X7, X4]
  link_hints:
    - A4-template-agents-telemetry-108, fake-news defences
    - A4-template-agents-telemetry-113, contamination controls
    - news windows and soft kill (G10 7, in A3)

- id: A4-template-agents-telemetry-108
  name: Defences against fabricated news - provenance, a cap on any single item's effect, hierarchical aggregation, one feed counted as one risk
  source: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:97-112 (Fake News, Real Crashes 2610.26438, R6 read)
  kind: agent role
  what_it_does: >-
    In about 10,000 sandbox decisions on 15 US stocks, fabricated news moved LLM trading agents 62 % of the
    time and two 30-word templates 100 %; removing credibility cues (a named source, BREAKING) dropped it to
    0 % with the same false claim. Bigger models stop shallow attacks but not fact poisoning; peer debate
    fails; only hierarchical aggregation reduced success. Defences - news output never sizes or triggers a
    trade alone, provenance checks or agreement with a non-news signal, a cap on what one item can cause,
    and many agents on one feed treated as one correlated risk.
  inputs:
    - news items, source metadata, other signals
  outputs:
    - accepted or rejected items, capped effect
  assumptions:
    - a non-news signal exists to cross-check
  levels: [unit, portfolio]
  instrument_classes: [stocks (test); crypto news and social feeds are noisier]
  class_notes: crypto's 24/7 social flow is the most exposed
  styles_timeframes: any unit that reads news
  evidence: simulation (paper-trading sandbox attack benchmark)
  known_failures:
    - attacks work across vendors and when blended into real feeds
  performance_note: "[judgment] neutral; it protects the news de-risking path from being gamed."
  survival_note: "[judgment] stops one fake item from moving many units at once."
  ledger_ids: [news_impact_level_map]
  new_variables:
    - name: single_item_effect_cap
      line: most risk change one unverified news item may cause
  qmx_layer: [X7, X3]
  link_hints:
    - A4-template-agents-telemetry-109, deterministic boundary over agent votes
    - A4-template-agents-telemetry-138, red-team tests

- id: A4-template-agents-telemetry-109
  name: A deterministic enforcement boundary instead of agent votes; feasibility guaranteed by projection (Poisoning Agentic Alpha, OpenPM)
  source: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:66 and :117 and :150-156 (2608.24069 and OpenPM 2608.09988, assistant's claims)
  kind: gate/test
  what_it_does: >-
    A compromised terminal decision role bypasses all upstream deliberation, so voting or adding agents is
    no substitute for a deterministic boundary. In OpenPM six channel analysts score names, a constructor
    LLM proposes weights, and a deterministic critic projects them onto long-only, name-count, per-name,
    liquidity, cash and turnover limits; the critic, not the LLM, guarantees feasibility. Results depended on
    analyst quality (strong capture, 4 of 5 constructors beat equal weight; weak, none).
  inputs:
    - agent proposals, hard constraints
  outputs:
    - projected feasible proposal
  assumptions:
    - every limit is expressible as a constraint
  levels: [unit, portfolio]
  instrument_classes: [stocks (S&P 500, 44 trading days)]
  class_notes: generic
  styles_timeframes: slow allocation; the principle applies to any agent output
  evidence: author backtest (OpenPM short single window, no market impact, called upper bounds)
  known_failures:
    - IEX top-of-book fills only; short window
  performance_note: "[judgment] upstream signal quality mattered more than which LLM constructed the book."
  survival_note: "[judgment] no LLM number reaches the order path unchecked."
  ledger_ids: [max_position_size_lots, per_instrument_exposure_cap]
  new_variables: []
  qmx_layer: [X7, X1]
  link_hints:
    - A4-template-agents-telemetry-131, Steward's invariant core
    - A4-template-agents-telemetry-091, the guard as the projection point

- id: A4-template-agents-telemetry-110
  name: Append-only search ledger counting every candidate, failures included, with full-cohort metrics
  source: research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:20 and :35 and :89 and :99 (What survives honest evaluation 2608.27734, R6 read; Auditing LLM Alpha-Factor Mining 2610.29500, assistant's claim)
  kind: measure/telemetry
  what_it_does: >-
    Every evaluated candidate, including syntax failures, rejected and abandoned branches and logic-changing
    repairs, gets an immutable trial id with parents, hypothesis, prompt and tool trace, model and version,
    cutoff evidence, code and data hashes, universe, parameters, seed, split, cost model, metrics and
    decision. Selection-aware statistics are computed on the whole search. An audit found a retained
    positive-only catalogue could not support its claim; the remedy is to keep the whole cohort and state
    which candidates each metric averages.
  inputs:
    - every evaluation the harness runs
  outputs:
    - trial ledger, trial count for deflation
  assumptions:

- id: A4-template-agents-telemetry-106
  name: Microstructure agent - deterministic features in code, LLM summaries at a slow cadence, and a veto on capacity
  source: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:84 and :174; research/R4-alphaxiv/conv-02-ai-quant-trading-design.md:236-252; operator M7 (SEEDS D6, agents summarise microstructure per session or market)
  kind: agent role

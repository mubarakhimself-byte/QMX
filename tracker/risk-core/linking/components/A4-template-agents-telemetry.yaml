    Spread, depth imbalance, trade-flow imbalance, volatility, liquidity gaps and venue state are computed
    by code; an agent only summarises them at a cadence where its latency is acceptable and emits short-lived
    conditions such as liquidity_thin with a proposed risk reduction. conv-02 lets this profile veto a
    strategy on capacity or implementability even when its simulated Sharpe looks good. He imagined agents
    summarising microstructure per session or market for units.
  inputs:

    - A4-template-agents-telemetry-037, pinning

- id: A4-template-agents-telemetry-040
  name: Upgrader chain required for every stored shape; a snapshot from another fingerprint starts cold
  source: grounding/G8-unit-chassis-and-extensibility.md:203-208 (A10, unit/upgrade.py, protocol/unit.py:923-960)
  kind: versioning/rollout pattern
  what_it_does: >-
    A hosted unit's snapshot holds every block's state and the moved numbers. A snapshot from another
    compiled fingerprint, state schema or Python version starts the unit cold and says why; calibrated
    values can be carried in separately. Every stored shape (unit, entry, check, behaviour) needs an
    upgrader chain before a new schema can ship.
  inputs:
    - snapshot, compiled fingerprint
  outputs:
    - warm start, or cold start with a reason
  assumptions:
    - fingerprints change on every version
  levels: [unit]
  instrument_classes: [all classes the unit trades]
  class_notes: sizer state is per market, so a cold start resets per-market house money and streaks
  styles_timeframes: all
  evidence: old QMX rule (built in the unit stack, runs on the unit path)
  known_failures:
    - any new version restarts block memory; a stateful sizer loses its state on every version
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] a cold start can reset loss counters that live only in block state; counters must survive versions."
  ledger_ids: [state_carry_rule, paper_to_live_carry_rule]
  new_variables: []
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-037, profile-only changes need an exemption from cold start
    - loss counters survive restarts and date changes (R4 chat-06, in A2)

- id: A4-template-agents-telemetry-041
  name: Identity table mapping each edit to none, calibration row, new version or new unit, editable by him
  source: grounding/G8-unit-chassis-and-extensibility.md:193-201 (identity/table.py, qmx_control/service.py:352-388); expansion/drafts-stopped/X1-template-shape.md:315-321 (X1 idea 34)
  kind: versioning/rollout pattern
  what_it_does: >-
    One table maps each edit label to its result, whether it is a counted try and whether his click is
    needed before live; an unnamed edit is a new unit. Motion inside a range is a calibration row; a fixed
    value, range, rule or block-version change is a new version; a block swap or a new role (the first halt)
    is a new unit. X1 proposes new labels so a risk-profile change can be a version, not a new unit.
  inputs:
    - the diff between two unit documents
  outputs:
    - result, counted try, click needed
  assumptions:
    - the defaults live in Settings and he can change them
  levels: [unit]
  instrument_classes: [all]
  class_notes: no class content
  styles_timeframes: all
  evidence: old QMX rule (built in the unit stack; its defaults run)
  known_failures:
    - under the defaults the rip-out of the placeholder sizer makes every unit a new unit with a fresh record (G8 3.6)
  performance_note: "[judgment] a profile-version label would keep QMB and paper evidence across a sizer swap."
  survival_note: "[judgment] every risk change is counted and clicked, which stops silent drift."
  ledger_ids: [effective_tries]
  new_variables:
    - name: identity_profile_version_change
      line: edit label for a change inside a risk profile, defaulting to a new version
  qmx_layer: [X1, X5]
  link_hints:
    - A4-template-agents-telemetry-038, a migration map could justify the cheaper label
    - A4-template-agents-telemetry-042, two records is the no-ruling alternative

- id: A4-template-agents-telemetry-042
  name: Two records per unit, logic in R across versions and money per profile version
  source: expansion/drafts-stopped/X1-template-shape.md:323-329 (X1 idea 35); grounding/G8-unit-chassis-and-extensibility.md:318-322 (the judge is size-blind)
  kind: measure/telemetry

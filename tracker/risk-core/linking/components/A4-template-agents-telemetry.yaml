- id: A4-template-agents-telemetry-130
  name: A minimal complete research harness from idea to human promotion, in eight steps
  source: research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:91-104 and :170-174 (assistant's design)
  kind: workflow
  what_it_does: >-
    Register the hypothesis; freeze the experiment contract; generate through a typed interface or sandboxed
    code with causality checks; evaluate in stages with realistic costs, keeping every failure; refine
    within a budget and ledger with a champion and archive; freeze, hash and validate once on a sealed
    window; run a paper qualification on the production feed; hand the human a promotion packet, not an
    order. Any change repeats the gates.

- id: A4-template-agents-telemetry-029
  name: Starter budget for a new strategy raised in stages; risk daily, allocation weekly, review monthly
  source: research/R4-alphaxiv/chat-23-A-portfolio-level-sizing.md:93 and :147 (assistant's operating proposal, not a paper result)
  kind: versioning/rollout pattern
  what_it_does: >-
    A newly promoted strategy enters at 10 to 25 % of its eventual risk budget and is raised in stages on
    live net performance, costs, slippage, realised risk and its marginal diversification. Risk limits are
    recomputed daily and may cut at once; planned allocation changes happen weekly; a full review monthly,
    earlier only on an alarm, a logic change or a limit hit.
  inputs:
    - live net results, cost and slippage, realised risk, marginal diversification
  outputs:
    - the strategy's current share of its eventual budget
  assumptions:
    - stages are judged on enough trades
  levels: [unit, portfolio]
  instrument_classes: [all seven classes named in the question; no class-specific test]
  class_notes: no class-specific rule given
  styles_timeframes: all; a weekly cadence fits scalpers, ORB needs longer stages [judgment]
  evidence: idea (assistant's proposal)
  known_failures:
    - stages measured in calendar weeks are unfair to low-frequency units
  performance_note: "[judgment] gives a promoted unit a stated path to full size."
  survival_note: "[judgment] a new unit's first live trades are small."
  ledger_ids: [size_ramp_to_full, size_levels, kelly_probation_discount]
  new_variables:
    - name: starter_budget_share
      line: share of eventual risk budget a newly promoted unit starts at
    - name: review_cadence
      line: how often limits, allocation and a full review run
  qmx_layer: [X2, X1]
  link_hints:
    - A4-template-agents-telemetry-013, warm-up ramp shape
    - April 0.85 Kelly probation discount (G10 5.1, in A1)

- id: A4-template-agents-telemetry-030
  name: Shadow a new version on the live unit's own trades as would_have rows before it may size
  source: expansion/drafts-stopped/X1-template-shape.md:339-345 (X1 idea 37); grounding/G8-unit-chassis-and-extensibility.md:308 (would_have kind, open body); research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:73
  kind: versioning/rollout pattern
  what_it_does: >-
    The old profile sizes the live trades; the proposed profile computes its own decision on the same
    trades and is journalled as would_have for N trades. A card then compares the two. The unit journal has
    a would_have kind with an open body and nothing writes it today. conv-01 adds keeping shadow
    observations after a suspension.
  inputs:
    - live decisions, the proposed profile
  outputs:
    - would_have rows, comparison card
  assumptions:
    - both profiles can run in the guard on the same inputs
  levels: [unit, position]
  instrument_classes: [none tested]
  class_notes: no class content
  styles_timeframes: all; scalpers reach N fast
  evidence: idea
  known_failures:
    - shadow sizing cannot see the market impact or rejections a bigger live size would cause
  performance_note: "[judgment] a better profile proves itself without risking a dollar."
  survival_note: "[judgment] nothing new sizes live before it has a shadow record."
  ledger_ids: []
  new_variables:
    - name: shadow_trades_before_live
      line: trades a proposed profile must shadow before it may size live
  qmx_layer: [X1, X6]
  link_hints:
    - A4-template-agents-telemetry-023, dry-run metrics in Argo are the same idea
    - A4-template-agents-telemetry-191, resilience4j METRICS_ONLY is the brake form of shadow

- id: A4-template-agents-telemetry-031
  name: Every resolved value has a required default and a reason code; evaluation never throws (OpenFeature)
  source: research/R7-software-patterns-self-configuring.md:251-264 (OpenFeature spec flag evaluation and types, CHECKED)
  kind: config/override pattern
  what_it_does: >-
    Every evaluation call must pass a default value and must return it on any abnormal execution instead of
    failing. Each value comes back with a reason: static, default, targeting match, split, disabled, stale,
    or error.
  inputs:
    - the number's sources and their health
  outputs:
    - value plus reason code
  assumptions:

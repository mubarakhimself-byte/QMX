- id: A4-template-agents-telemetry-190
  name: Eject outliers by peer comparison with a minimum sample, cap the share ejected, grow ejection time with repeats, ramp enforcement from zero (Envoy)
  source: research/R7-software-patterns-self-configuring.md:297-312 (Envoy outlier detection docs and API, CHECKED)
  kind: detector
  what_it_does: >-
    A host is ejected after 5 consecutive errors or when its success rate is below the mean minus 1.9
    standard deviations of its peers; it counts only with 100 requests per interval and detection is skipped
    with fewer than 5 qualifying hosts. Ejection lasts 30 s times the number of repeats, capped at 300 s, and
    shrinks as the host behaves. At most 10 % of a cluster is ejected at once. Enforcement is a percent
    chance, so it can start at 0 (shadow) and ramp up.
  inputs:
    - per-unit or per-market results, peers
  outputs:
    - isolated units or markets with an end time
  assumptions:
    - peers are comparable
  levels: [unit, cluster, portfolio]
  instrument_classes: [none (software)]

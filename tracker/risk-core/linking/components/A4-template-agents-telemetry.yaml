- id: A4-template-agents-telemetry-159
  name: Three-zone state - green carry on, yellow gather evidence, red act - because no single threshold avoids both errors (Basel traffic light)
  source: research/R3-edge-verification-and-analogues.md:92-98 (BIS 1996 backtesting framework, READ); expansion/drafts-stopped/X5-edge-verification.md:125-131 (X5-06)
  kind: measure/telemetry
  what_it_does: >-
    A bank counts days its loss beat its 99 % risk estimate over 250 days - 0 to 4 green, 5 to 9 yellow, 10
    or more red. There is no single cutoff that both rarely rejects an accurate model and rarely accepts a
    bad one, so yellow asks for more information and red brings an automatic penalty. Causes are sorted into
    model integrity, imprecision, bad luck and intraday trading.
  inputs:
    - exception count over a window
  outputs:
    - zone and cause class
  assumptions:
    - zones are set by known probabilities
  levels: [unit, methodology]
  instrument_classes: [bank trading books]
  class_notes: no class content
  styles_timeframes: all
  evidence: live (regulatory practice); an accurate model lands yellow or red 10.8 % of years (R3 arithmetic)
  known_failures:
    - a 97 % model still lands green 12.8 % of years
  performance_note: "[judgment] yellow means hold size, not cut."
  survival_note: "[judgment] red acts without waiting."
  ledger_ids: [drift_state]
  new_variables: []
  qmx_layer: [X6, X5]
  link_hints:
    - A4-template-agents-telemetry-165, zone on screen
    - two-speed drift (R5 combo 4, in A2)


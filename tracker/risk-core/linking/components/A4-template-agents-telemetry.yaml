- id: A4-template-agents-telemetry-066
  name: Fixed stage order alpha, portfolio, risk, execution; chained risk models where the newest target wins; insights that expire (LEAN)
  source: research/R1-platforms-risk-sizing-extensibility.md:48-61 and :87-108 (LEAN source and docs, CHECKED)
  kind: other (pipeline)
  what_it_does: >-
    Each stage is a model class with one method to override: alpha emits insights, portfolio construction
    turns them into targets, risk management returns adjusted targets, execution places orders. Several
    risk models chain; each receives the output of the one before and the newest target per symbol wins.
    An insight carries an expiry; when it expires and nothing renews it, the position is flattened.
  inputs:
    - insights, targets
  outputs:
    - adjusted targets, orders
  assumptions:
    - risk only shrinks or blocks; built-in risk models never grow a position
  levels: [trade, position, portfolio]
  instrument_classes: [stocks, futures, FX, crypto, options (LEAN's supported classes)]
  class_notes: LEAN sizes by share of portfolio value, never from the stop, so its maths does not carry to stop-distance sizing; its staging does (R1 1.2)
  styles_timeframes: all
  evidence: idea (production platform, CHECKED source)
  known_failures:
    - the portfolio drawdown model forgets its high once it fires and re-arms at once (a cliff, R1 1.4)
  performance_note: "[judgment] a stated stage order makes plug-in risk pieces composable."
  survival_note: "[judgment] expiring intents close positions whose reason went stale."
  ledger_ids: [control_rank_table, max_hold_time]
  new_variables:
    - name: intent_valid_until
      line: expiry of an entry intent; past it the position is closed unless renewed
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-014, smallest-cap combiner as an alternative to newest-wins
    - A4-template-agents-telemetry-104, agent proposals also carry valid_until


- id: A4-template-agents-telemetry-111
  name: Agents compose only registry-validated typed tools, so leakage is blocked by construction
  source: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:28-48 (2608.27734, R6 read); research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:56 and :66-72 (AQuA 2608.12841)
  kind: gate/test
  what_it_does: >-
    The agent cannot write arbitrary code; it calls typed tools that assemble a declarative plan from
    registered features, signal nodes and portfolio archetypes, and the harness validates each call. A
    deliberately leaky oracle with Sharpe 35 still passed Deflated Sharpe and PBO, so leakage must be
    blocked by the tool layer. AQuA's agents composed factors from a registered causal operator vocabulary
    after a look-ahead bug (current-day total volume) escaped both generator and LLM reviewer.
  inputs:
    - registries of point-in-time features and operators
  outputs:
    - validated plans only
  assumptions:
    - registries are point-in-time correct
  levels: [unit, system]
  instrument_classes: [stocks and ETFs; crypto 5-minute factors in AQuA]
  class_notes: generic; registries must encode class calendars, rolls and funding times
  styles_timeframes: all research
  evidence: author backtest (planted-oracle test)
  known_failures:
    - statistics cannot catch leakage; a missing operator limits what agents can express
  performance_note: "[judgment] agents can search freely inside a safe language (AQuA's asymmetric freedom)."
  survival_note: "[judgment] look-ahead cannot be expressed, so cannot be promoted."
  ledger_ids: []
  new_variables: []
  qmx_layer: [X5, X7]
  link_hints:

  kind: measure/telemetry
  what_it_does: >-
    With many strategies monitored at once, false alarms are controlled across the set; to target a false
    demotion rate q over a horizon, each stream gets alpha q over H (for 20 strategies at q 0.05, cut at an
    e-value of 400). Each demotion records whether it came from statistical evidence of failure, a
    distribution-change warning, or a pre-authorised loss rule. The observation unit is a completed position
    campaign, not a fill.

- id: A4-template-agents-telemetry-058
  name: A declared fail mode on every piece for missing inputs or a dead risk layer
  source: research/R1-platforms-risk-sizing-extensibility.md:345-349 and :391 (Zipline on_error, RiskGate reject-all, freqtrade fallback, CHECKED); research/R5-mql5-corpus-ideas.md:54 and :598 (23629 degraded mode trap); expansion/drafts-stopped/X1-template-shape.md:481-487 (X1 idea 54)

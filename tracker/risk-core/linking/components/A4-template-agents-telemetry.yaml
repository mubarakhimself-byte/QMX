- id: A4-template-agents-telemetry-061
  name: One confirmed, persisted day baseline for every limit, surviving restarts
  source: research/R5-mql5-corpus-ideas.md:242 (MQL5 24396, 24397); research/R5-mql5-corpus-ideas.md:238 (21313); research/R5-mql5-corpus-ideas.md:554 (combo 18)
  kind: config/override pattern
  what_it_does: >-
    The day's starting balance is suggested, confirmed by the trader, persisted and restored on restart;
    rollover closes the old session before opening the new; live readings stay separate from stored rules.
    A daily limit measured from a balance that moved after a restart is called a classic bug. R5 combo 18
    joins this with a set session start and a server-time DST contract into one definition of the day.
  inputs:
    - suggested baseline, his confirmation, server time and DST
  outputs:
    - a persisted day baseline every limit reads
  assumptions:
    - one reset hour in server time across instruments
  levels: [account, unit]
  instrument_classes: [FX and CFDs (prop-firm monitor)]
  class_notes: crypto trades through weekends, so its "day" must be declared; futures halts and stock closes freeze positions at the boundary
  styles_timeframes: all with daily limits
  evidence: author backtest (MECH, the author's own code checks)
  known_failures:
    - a moving baseline after a restart lets a daily limit be breached twice
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] a daily brake means the same thing after a crash."
  ledger_ids: [day_boundary, day_start_equity, account_daily_loss_limit]
  new_variables:
    - name: day_baseline_confirmation
      line: whether the day's starting equity is computed, or computed and confirmed
  qmx_layer: [X1, X3]
  link_hints:
    - A4-template-agents-telemetry-059, declared limit basis
    - loss counters survive restarts and date changes (R4 chat-06, in A2)

- id: A4-template-agents-telemetry-062
  name: Limits as testable invariants with precise definitions, one permission gate with reasons, setups that expire
  source: research/R5-mql5-corpus-ideas.md:238-241 and :426-439 (MQL5 21313, 21995, 22560, 23100, Engineering Trading Discipline series)
  kind: config/override pattern
  what_it_does: >-
    Each discipline rule is written as an invariant with exact definitions of "entry" and "day" (a confirmed
    DEAL_ENTRY_IN across the whole account, manual trades included). A timer re-checks every open position
    and restores compliance. Whitelist, hours, news and daily count join one engine, and setups get a
    lifecycle with confirmation, expiry, freshness, session and lock, all through one CanTrade() with reasons.
  inputs:
    - rules with definitions, open positions, setups
  outputs:
    - allow or refuse with a reason, restored compliance
  assumptions:
    - one gate sees every entry, including manual ones
  levels: [trade, position, account]
  instrument_classes: [FX on demo accounts]
  class_notes: margin checks must be per symbol across classes (24392)
  styles_timeframes: all
  evidence: author backtest (DEMO scenario tests by the author)
  known_failures:
    - Part 7's equity governance result had no control (R5 trap 1)
  performance_note: "[judgment] neutral; rules become testable, which makes brake tuning measurable."
  survival_note: "[judgment] a removed stop or a manual edit is caught by re-validation."
  ledger_ids: [session_fills, positions_per_instrument]
  new_variables:
    - name: open_position_revalidation_interval
      line: how often every open position is re-checked against its rules
  qmx_layer: [X1, X3]
  link_hints:
    - A4-template-agents-telemetry-091, the guard as the one gate
    - A4-template-agents-telemetry-155, count every refusal by reason

- id: A4-template-agents-telemetry-063
  name: Trading states as the spine of every brake (ACTIVE, REDUCING, HALTED, RESTORE)
  source: research/R1-platforms-risk-sizing-extensibility.md:323 (Nautilus trading states, CHECKED); research/R1-platforms-risk-sizing-extensibility.md:196 (MQL5 15085 RESTORE state); expansion/drafts-stopped/X1-template-shape.md:97-103 (X1 idea 8)
  kind: config/override pattern
  what_it_does: >-
    Nautilus has ACTIVE (all allowed), REDUCING (only reduce-only orders) and HALTED (cancels and queries
    only, even protective stops denied). MQL5 15085 adds OK, DAILY_LOSS, RESTORE, OVERALL_LOSS states with
    size restored only at a better price within a wait window. X1 makes every brake and accelerator a
    transition between ACTIVE, REDUCING, HALTED and RESTORE per scope, each with a reason.
  inputs:
    - brake events, scope
  outputs:
    - trading state per scope with its reason
  assumptions:
    - exits always run in HALTED (his rule C21); Nautilus's HALTED denies protective stops and must not be copied there
  levels: [unit, cluster, portfolio, account]
  instrument_classes: [all Nautilus classes; FX multi-currency in 15085]
  class_notes: no class content
  styles_timeframes: all
  evidence: author backtest (15085, small gains); Nautilus state machine in production, CHECKED
  known_failures:
    - HALTED that blocks protective stops (X1 collision 6)
  performance_note: "[judgment] REDUCING lets a unit keep trading smaller instead of stopping."
  survival_note: "[judgment] one vocabulary for every brake at every scope."
  ledger_ids: [brake_state, kill_switch_level, risk_stop_resume_rule]
  new_variables:
    - name: trading_state
      line: ACTIVE, REDUCING, HALTED or RESTORE per scope
    - name: state_transition_table
      line: which events move which scope between states
  qmx_layer: [X1, X3]
  link_hints:
    - A4-template-agents-telemetry-134, SwingGuard's NORMAL, ALERT, SURVIVAL, RECOVERY with hysteresis
    - A4-template-agents-telemetry-010, Stitch tactics with costs
    - X1 P15, mapping kill levels onto trading states


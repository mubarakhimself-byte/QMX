- id: A4-template-agents-telemetry-054
  name: Derivation as a swappable block that writes a receipt for every value
  source: expansion/drafts-stopped/X1-template-shape.md:223-237 (X1 ideas 23 and 24); operator M10 ("What if I want to change the way it is derived?", SEEDS D46, D29)
  kind: config/override pattern
  what_it_does: >-
    A new component type, derivation, computes a number from facts (equity, costs, record, his limits,
    state) and writes a calibration receipt with its inputs and old and new value. Changing how a number is
    derived means swapping the derivation block or its parameters. Today's motion rules are one family;
    boot, schedule, record and state derivations would join them.
  inputs:
    - facts, the current value, derivation parameters
  outputs:
    - the value, a receipt row
  assumptions:
    - the compiler lets a sizer-bound number move through a derivation (today it cannot, G8 3.10)
  levels: [trade, unit, cluster, portfolio]
  instrument_classes: [all]
  class_notes: derivations read class facts (lot step, cost profile, funding) from the instrument record
  styles_timeframes: all
  evidence: idea (operator's requirement; X1 design)
  known_failures:
    - a derivation that reads many inputs becomes hard to explain; receipts must name them
  performance_note: "[judgment] Kelly, house money or budget-split derivations can be swapped in without a new schema."
  survival_note: "[judgment] every size traces to a few numbers with a reason (the volleyball rule, A13)."
  ledger_ids: [number_motion_mode, risk_fraction, kelly_fraction_raw]
  new_variables:
    - name: derivation_rule
      line: entry id and version of the block that derives a number
    - name: derivation_receipt
      line: calibration row body with derivation id, inputs, old and new value
  qmx_layer: [X1, X2]
  link_hints:

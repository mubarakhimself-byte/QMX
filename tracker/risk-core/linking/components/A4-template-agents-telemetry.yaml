    - A4-template-agents-telemetry-147, the propose, shadow, card, click loop would carry the plan

- id: A4-template-agents-telemetry-022
  name: Declared, versioned, pulled and reconciled desired state with no blind retries (GitOps, Argo CD)
  source: research/R7-software-patterns-self-configuring.md:196-209 (OpenGitOps principles, Argo CD auto sync, CHECKED)
  kind: versioning/rollout pattern
  what_it_does: >-
    Desired state is declarative, versioned and immutable, pulled by agents and reconciled continuously.
    Argo CD syncs once per commit and parameters, never retries a failed sync for the same commit, keeps
    self-heal off by default, and forbids manual rollback while automated sync drives the same app.
  inputs:
    - versioned desired state, sync history
  outputs:
    - deployed version or a recorded failure
  assumptions:
    - every version is immutable once published
  levels: [unit, node]
  instrument_classes: [none (software)]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea (production software, CHECKED)
  known_failures:
    - automation and a person driving the same unit at once produce flapping
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] a unit version that failed to deploy is not retried until a new version exists."
  ledger_ids: []
  new_variables:
    - name: deploy_retry_rule
      line: whether a failed deploy of the same unit version may be retried
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-087, Library items are already immutable versions
    - A4-template-agents-telemetry-034, Knight Capital shows what dormant code and no rollback cost

- id: A4-template-agents-telemetry-023
  name: Progressive rollout steps judged by a reusable analysis template with three outcomes (Argo Rollouts)
  source: research/R7-software-patterns-self-configuring.md:215-224 (Argo Rollouts analysis docs, CHECKED)
  kind: versioning/rollout pattern
  what_it_does: >-
    A rollout is a list of steps (set a 20 % share, pause, run analysis). A parameterised analysis template
    defines metrics, frequency and pass or fail conditions; each run ends Successful, Failed or Inconclusive,
    and the rollout continues, aborts or pauses for a human. Dry-run metrics are measured but never decide.
  inputs:
    - new version, share schedule, analysis template, failure limit
  outputs:
    - continue, roll back, or pause for his card
  assumptions:
    - a share of a unit's size or markets can be given to the new version
  levels: [unit, cluster]
  instrument_classes: [none (software)]
  class_notes: >-
    For a multi-market unit the share can be markets; for a single-market unit it must be size; for
    crypto 24/7 a time share is possible, for FX a session share [judgment].
  styles_timeframes: all; scalpers reach an analysis sample in days, ORB in weeks
  evidence: idea (production software, CHECKED)
  known_failures:
    - an analysis with too few samples passes or fails by luck; Kayenta asks 50 points per metric
  performance_note: "[judgment] a new sizer earns its record beside the old one instead of costing it (G8 3.6)."
  survival_note: "[judgment] only a small share is exposed to a bad version, and inconclusive means a person looks."
  ledger_ids: [size_ramp_to_full]
  new_variables:
    - name: rollout_share_steps
      line: share of size or markets the new version gets at each step
    - name: analysis_outcome
      line: pass, fail or inconclusive for one analysis run
  qmx_layer: [X1, X5]
  link_hints:
    - A4-template-agents-telemetry-025, Kayenta judge for the analysis step
    - A4-template-agents-telemetry-030, would_have rows are the dry-run metrics
    - A4-template-agents-telemetry-121, Promote's funded test could be the analysis template

- id: A4-template-agents-telemetry-024
  name: Declared time to promote and to roll back; no judging while another loop moves the version (Flagger)
  source: research/R7-software-patterns-self-configuring.md:228-233 (Flagger deployment strategies, CHECKED)
  kind: versioning/rollout pattern
  what_it_does: >-
    Minimum time to promote is interval times max weight over step weight; time to roll back is interval
    times the failure threshold. Advancement halts while metrics fail, while a webhook fails, or while an
    autoscaler is resizing the canary. At the threshold all traffic returns to the primary.
  inputs:
    - interval, step weight, max weight, failure threshold
  outputs:
    - stated promote and rollback times, then the decision
  assumptions:
    - the canary is not being changed by another loop during judgment
  levels: [unit]
  instrument_classes: [none (software)]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea (production software, CHECKED)
  known_failures:
    - judging a version while its own motion engine moves its numbers mixes two effects
  performance_note: "[judgment] stated times make the ramp plannable."
  survival_note: "[judgment] the rollback time is known before the ramp starts."
  ledger_ids: [calibration_cadence_trades]
  new_variables:
    - name: rollout_time_to_promote
      line: stated minimum time or trades for a version to reach full share
    - name: rollout_time_to_rollback
      line: stated time or trades a failing version can run before it is pulled
  qmx_layer: [X1, X6]
  link_hints:
    - A4-template-agents-telemetry-023, the rollout it times
    - A4-template-agents-telemetry-080, motion must be frozen during the judging window

- id: A4-template-agents-telemetry-025
  name: Canary judged against a fresh baseline running at the same time, critical metrics and no-data failure (Kayenta)
  source: research/R7-software-patterns-self-configuring.md:235-249 (Spinnaker canary judge and best practices, CHECKED)
  kind: gate/test
  what_it_does: >-
    The canary is compared with a baseline of the current version started at the same time, same size and
    same traffic, not with production history. A Mann-Whitney test per metric needs 98 % confidence with a
    dead zone around zero; a critical metric failing scores zero; half or more metrics with no data fail.
    About 50 data points per metric are needed.
  inputs:
    - metrics from canary and baseline over the same window
  outputs:
    - pass, marginal or fail score
  assumptions:
    - the old version can run beside the new one (paper or shadow) on the same markets
  levels: [unit]
  instrument_classes: [none (software)]
  class_notes: >-
    A same-time baseline controls for regime, session and news days that differ between a new version's
    window and the old version's past record.
  styles_timeframes: all; the 50-point rule is fast for scalpers, slow for ORB
  evidence: idea (production software, CHECKED)
  known_failures:
    - the QMX judge is size-blind (G8 5.3), so a sizing change needs money measures added before this can judge it
  performance_note: "[judgment] stops a good new sizer being blamed for a bad market week."
  survival_note: "[judgment] a critical metric (drawdown, floor distance) can veto alone."
  ledger_ids: [replay_match_floor]
  new_variables:
    - name: canary_critical_metrics
      line: metrics whose failure alone fails a new version
  qmx_layer: [X5, X1]
  link_hints:
    - A4-template-agents-telemetry-035, a paper twin is the running baseline
    - A4-template-agents-telemetry-042, the money record per profile version gives the money metrics

- id: A4-template-agents-telemetry-026
  name: Partial, time-limited canary with metrics split by canary and control, including a live canary across markets
  source: research/R3-edge-verification-and-analogues.md:112-116 (Google SRE canarying, READ); research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:96-101; expansion/drafts-stopped/X5-edge-verification.md:525-531 (X5-55)
  kind: versioning/rollout pattern
  what_it_does: >-
    A canary is a partial, time-limited deployment of a change evaluated against the rest as control; it
    must be big and long enough to be representative, and metrics must be split, because a 5 % canary
    failing 20 % of requests shows as 1 % overall. Applied to parameters (conv-01): roll a change to a
    small exposure slice first and stagger recoveries. X5-55 promotes a multi-market unit live on a subset
    of its markets with the rest on paper.
  inputs:
    - change, canary share, control, split metrics
  outputs:
    - widen, hold or roll back
  assumptions:
    - canary and control see comparable markets
  levels: [unit, cluster]
  instrument_classes: [none (software); X5-55 aimed at multi-market units]
  class_notes: canary markets must share a class bucket with control markets, or the split compares classes, not versions [judgment]
  styles_timeframes: multi-market units of any style
  evidence: idea (production practice in software, READ; the trading form is an idea)
  known_failures:
    - today a second deployment of one unit version on another market is refused (G9 3.2)
  performance_note: "[judgment] money at risk stays small while proof runs."
  survival_note: "[judgment] stagger stops many units restarting or retuning together."
  ledger_ids: [size_ramp_to_full]
  new_variables:
    - name: canary_share
      line: share of a unit's markets or size that runs the new version live
  qmx_layer: [X1, X5]
  link_hints:
    - A4-template-agents-telemetry-023, the rollout machinery
    - A4-template-agents-telemetry-003, the retune share cap is the stagger

- id: A4-template-agents-telemetry-027
  name: Payouts from live rounds only; start unstaked or small (Numerai)
  source: research/R3-edge-verification-and-analogues.md:107-110 (Numerai staking docs, READ)

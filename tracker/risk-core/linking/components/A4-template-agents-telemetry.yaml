    next bar; net return equals raw minus fees, slippage and funding) and reconciled offline and live-style
    replay to zero differences. Its cost ablation cut CAGR from 5.2 (zero cost) to 4.3 (fees) to 2.7 (full
    costs). RiskMetrics checks the risk model daily by comparing the risk estimate with realised P&L.

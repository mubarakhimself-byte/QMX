    layer is down: RiskGate rejects every trade, Nautilus denies when the account cannot be resolved,
    freqtrade falls back to the proposed stake. MQL5 23629 keeps trading on conservative defaults when the
    controller is gone, which R5 marks as a trap. X1 puts fail_closed, fall_back_to_default or
    fall_back_to_position_rules on every number, brake and derivation.
  inputs:

- id: A4-template-agents-telemetry-120
  name: Human-signed promotion packet of one immutable artifact, to paper only, where any change is a new candidate (AllPath)
  source: research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:41 and :102 and :162 (AllPath 2610.26662, assistant's claim); grounding/G9-runtime-brakes-isolation-evidence.md:121-127 (C-23 promote)
  kind: workflow
  what_it_does: >-
    The human reviews an immutable, reproducible package - thesis, artifact hash, every tried candidate and
    failure, fold and out-of-sample results, cost sensitivity, drawdown and exposure, capacity, leakage
    checks, model cutoff and paper record - and promotes that exact version. No agent can approve its own
    proposal; changes show as a current diff. The assistant says the human gate should promote to paper
    only, with live money a separate later decision. QMX's promote endpoint answers only to the operator.
  inputs:
    - frozen artifact and its evidence
  outputs:
    - promotion of that exact version
  assumptions:
    - the deployment system accepts only signed artifacts
  levels: [unit]
  instrument_classes: [all]
  class_notes: no class content
  styles_timeframes: all
  evidence: old QMX rule (C-23 operator-only promote is built); AllPath is an operational case study, not evidence of alpha
  known_failures:
    - a packet too long to read turns the click into a formality [judgment]
  performance_note: "[judgment] he clicks on evidence, not on feel."
  survival_note: "[judgment] the version that trades is the version he saw."
  ledger_ids: [paper_to_live_carry_rule]
  new_variables: []
  qmx_layer: [X5, X7]
  link_hints:

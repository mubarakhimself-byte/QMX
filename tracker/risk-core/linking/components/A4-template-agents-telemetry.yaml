  performance_note: "[judgment] fallback to position rules keeps a healthy unit trading through a flaky account fact."
  survival_note: "[judgment] uncertainty blocks new risk and never falls back to default sizing (R5 combo 6)."
  ledger_ids: [board_stale_after, decision_freshness_bound, feed_stale_after]
  new_variables:

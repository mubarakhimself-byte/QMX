- id: A4-template-agents-telemetry-126
  name: Auto-tuning in two stages with fixed screening rules over rolling windows and a cost grid, a blind hold-out, and an ok, watch, kill guard (AutoQuant)
  source: research/R6-alphaxiv-papers/T-11-costs-and-self-configuring-parameters.md:186-208 (AutoQuant 2512.22476, R6 read)
  kind: control loop
  what_it_does: >-
    Stage I tunes a 4-hour momentum family by Bayesian optimisation on a training window. Stage II screens
    the pool across rolling windows and a nine-scenario cost grid (fees and funding varied) with fixed rules
    (monthly return at least 0.5 %, worst-scenario month at least 0, mean drawdown at most 30 %, switch
    density at most 12 %). A live guard issues ok, watch or kill. Robust selection lowered drawdown
    (validation 0.231 against 0.318) with lower return; residual PBO stayed 0.586.
  inputs:
    - candidate settings, cost scenarios, rolling windows
  outputs:
    - robust settings, guard state
  assumptions:
    - one execution convention across backtest and live (it reconciled to zero differences)
  levels: [unit]
  instrument_classes: [crypto perpetuals (BTC, ETH, SOL, AVAX)]
  class_notes: funding is crypto-only; FX and CFDs need swap and rollover, futures roll cost, in the same grid
  styles_timeframes: 4-hour momentum
  evidence: author backtest (post-ETF blind hold-out - buy-and-hold beat both)
  known_failures:
    - robust selection is a fragility filter, not an alpha source; validation window reused in Stage II
  performance_note: "[judgment] self-configured numbers that survive cost stress are less fragile, not better."
  survival_note: "[judgment] fixed screening rules are safe defaults for any auto-tuning."
  ledger_ids: [cost_stress_multiple, effective_tries, drift_state]
  new_variables:
    - name: tuning_screen_rules
      line: fixed robustness rules a tuned setting must pass across windows and cost scenarios
  qmx_layer: [X1, X2, X5]
  link_hints:
    - A4-template-agents-telemetry-016, the explore step this screens
    - A4-template-agents-telemetry-168, one execution and cost ledger

- id: A4-template-agents-telemetry-127
  name: Memory, skills and tools as three registries, each with its own promotion gate, and a lifecycle for agent-built tools
  source: research/R4-alphaxiv/conv-02-ai-quant-trading-design.md:362-535
  kind: workflow
  what_it_does: >-
    A successful run does not automatically become memory, a skill or a tool. A skill is a versioned package
    with an input contract, procedure, outputs and a promotion rule (for example passed on three distinct
    candidates); a tool is narrow and deterministic. Agent tools go repeated workflow, proposal, contract
    and permissions, sandboxed implementation, tests and replay, benchmark against the old workflow, then a
    versioned registry or discard. No agent-built tool may have brokerage, order-routing, secret or
    unrestricted network rights.
  inputs:
    - candidate memory items, skills, tools
  outputs:
    - promoted or discarded items
  assumptions:
    - QMA flag - the agent system's registries; flagged, not designed
  levels: [system]
  instrument_classes: [FX and crypto examples]
  class_notes: no class content
  styles_timeframes: research
  evidence: idea (assistant's design; cites skills papers as reading, not results)
  known_failures:
    - skills that benchmark well and break when tasks shift (Demystifying Agent Skills, 2608.14036)
  performance_note: "[judgment] agents get tools (D42) that are tested before trusted."
  survival_note: "[judgment] no tool reaches money."
  ledger_ids: []
  new_variables: []
  qmx_layer: [X7]
  link_hints:

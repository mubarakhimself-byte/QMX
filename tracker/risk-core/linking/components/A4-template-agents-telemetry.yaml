- id: A4-template-agents-telemetry-167
  name: Keep every execution sample for median and p95 slippage, entry and exit apart; slippage measured from node order rows; agents diagnose fills
  source: research/R5-mql5-corpus-ideas.md:350 (MQL5 22998); grounding/G9-runtime-brakes-isolation-evidence.md:139-145; expansion/drafts-stopped/X5-edge-verification.md:477-483 (X5-49)
  kind: measure/telemetry
  what_it_does: >-
    Measure slippage, observed spread, requotes and slippage asymmetry between entries and exits, keeping
    every sample for median and p95; the measure covers the whole path (PC, VPS, network, broker). On QMX,
    each entry's send row has the stop and its distance from the reference price and the filled row has the
    venue price, so slippage per entry can be computed; no script does yet. X5 has an agent (or a script
    first) write per-instrument, per-hour slippage and cost profiles from node rows.
  inputs:
    - node order rows, reconciler slippage, market spread by hour
  outputs:
    - cost profiles per instrument and hour
  assumptions:
    - demo fills are a weak stand-in for live
  levels: [trade, unit, account]
  instrument_classes: [FX and gold mainly in the corpus]
  class_notes: QMB reads a 168-hour cost profile per market and nothing writes one (G9 5.2)
  styles_timeframes: scalpers most of all
  evidence: author backtest (22998 demo probes)
  known_failures:

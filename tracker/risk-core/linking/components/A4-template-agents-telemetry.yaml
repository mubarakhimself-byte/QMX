  styles_timeframes: all automated trading
  evidence: live (real-money failure, regulator's order)
  known_failures:
    - a half-deployed version on one of several machines; dormant flags reused
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] a release check and an order-rate guard are cheap insurance against a system failure, one of the two causes he accepts for touching the floor."
  ledger_ids: [crash_loop_max_restarts]
  new_variables: []
  qmx_layer: [X1, X6]
  link_hints:

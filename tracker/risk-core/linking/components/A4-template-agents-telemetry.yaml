- id: A4-template-agents-telemetry-131
  name: Agents write intent only; a protected code core sizes, builds orders and holds the brakes, unreachable by any edit (Steward)
  source: research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:50-74 (Steward 2610.30557, R6 read); research/R5-mql5-corpus-ideas.md:172 (MQL5 21115)
  kind: agent role
  what_it_does: >-
    Four analysts emit typed reports; a portfolio manager emits only symbol, target weight (at most 20 %),
    conviction and a named condition that would prove the thesis wrong; code builds orders. The core uses
    the agent's stop or 2 ATR, widens any stop closer than 1 ATR, sizes at the minimum of the target weight
    and 0.5 % of equity at the stop, skips entries more than 5 % from market and reward-to-risk below 1.2.
    No LLM number reaches the broker unchecked. MQL5 21115 has per-symbol agents with a coordination layer
    enforcing portfolio limits while execution and risk stay in MQL5.
  inputs:
    - typed analyst reports, the manager's intent
  outputs:
    - orders sized by code
  assumptions:
    - the core is unreachable by self-edits at the type level
  levels: [trade, position, unit]
  instrument_classes: [stocks (US equities)]
  class_notes: generic shape; ATR rules would be per class
  styles_timeframes: swing
  evidence: author backtest (five months, 102 trading days on a paper account; a 2015-2026 backtest of the core lowered max drawdown under all 50 random entry policies)
  known_failures:
    - one configuration, one rising window, fills not simulated
  performance_note: "[judgment] agents add synthesis; mechanical exits add the rest (by code grading)."
  survival_note: "[judgment] contained a 24.6 % sector drawdown to a 0.3 % loss; no injected instruction was followed."
  ledger_ids: [risk_fraction, stop_distance, min_net_rr_gate]
  new_variables: []
  qmx_layer: [X7, X1, X2]
  link_hints:
    - A4-template-agents-telemetry-119, code grading
    - A4-template-agents-telemetry-132, governed self-evolution
    - G2 ruling 5, agents never touch money


- id: A4-template-agents-telemetry-157
  name: Alert only on conditions that need action, one at a time by priority; hard envelope limits act silently (aviation)
  source: research/R3-edge-verification-and-analogues.md:215-222 (FAA alerting guidance; Airbus envelope protection, READ)
  kind: measure/telemetry

    - A4-template-agents-telemetry-135, the narrator agent can draft the postmortem

- id: A4-template-agents-telemetry-034
  name: Deployment and rollback controls as important as strategy logic (Knight Capital failure)
  source: research/R4-alphaxiv/chat-06-kill-switches-breakers.md:45 (SEC order 34-70694, 2013, via the assistant)
  kind: versioning/rollout pattern
  what_it_does: >-
    In 2012 faulty automated order flow from dormant code ran about 45 minutes, sent more than 4 million
    orders and lost more than $460 million. The lesson drawn: versioned releases, removing dormant code, and
    controls that stop erroneous orders before they reach the market.

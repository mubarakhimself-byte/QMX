- id: A4-template-agents-telemetry-074
  name: Central risk oracle answering approved, lot and reason for many EAs, rejecting all when unreachable (RiskGate)
  source: research/R1-platforms-risk-sizing-extensibility.md:192 (MQL5 article 21720); expansion/drafts-stopped/X1-template-shape.md:539 (X1 idea 70, wild)
  kind: other (service contract)
  what_it_does: >-
    EAs produce only signals and send symbol, side, stop and strategy id as JSON over localhost TCP to one
    service, which answers approved, lot and reason. Rules run as a pipeline: validate, hard account
    blockers, per-strategy rules, portfolio rules, then compute size; examples are a 2 % daily loss, 0.5 %
    per trade, and halving the lot when the same correlation group is already open. Offline means reject all.
  inputs:
    - signal with stop and strategy id, position registry
  outputs:
    - approved or not, lot, reason
  assumptions:
    - one process sees every EA's intents
  levels: [trade, unit, account]
  instrument_classes: [FX, metals (MT5)]
  class_notes: correlation groups are set by hand in the article
  styles_timeframes: all

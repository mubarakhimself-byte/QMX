- id: A4-template-agents-telemetry-028
  name: Three-stage path backtest, venue paper, small live, with each gap measured per strategy
  source: research/R6-alphaxiv-papers/T-11-costs-and-self-configuring-parameters.md:210-222 (Can AI Make Money in Crypto, arXiv 2609.34510, R6 read); research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:146 (turn 3)
  kind: versioning/rollout pattern
  what_it_does: >-
    One benchmark runs every method through historical backtest, prospective paper trading on the real
    exchange, and real-money live trading. Strong backtests did not transfer; paper was closer to live but
    a gap stayed; no method beat the market live, and price discrepancies grew from paper to live.
  inputs:
    - the same strategy in three lanes
  outputs:
    - backtest-to-paper gap, paper-to-live gap, per strategy
  assumptions:
    - the paper lane uses the real venue's prices
  levels: [unit]
  instrument_classes: [crypto]
  class_notes: >-
    QMX paper is a zero-slippage simulation (G9 3.1), so its paper-to-live gap would be larger than venue
    paper; FX and CFD demo fills come from the broker's demo server, a weak stand-in.
  styles_timeframes: all; LLM decisions took about 187 s and agents about 523 s against 18.6 s for ML
  evidence: live (short real-money phase of about four weeks) plus author backtest
  known_failures:

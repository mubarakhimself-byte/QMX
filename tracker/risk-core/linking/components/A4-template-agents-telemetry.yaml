- id: A4-template-agents-telemetry-155
  name: Count every refusal by reason with the right denominator, so refusals do not read as decay
  source: research/R5-mql5-corpus-ideas.md:260 (MQL5 23983); grounding/G10-brakes-decay-slots-all-generations.md:317 (DOCS qmf-risk.md:157)
  kind: measure/telemetry
  what_it_does: >-
    A veto rate quoted at 3.5 % was wrong because 109 of 143 signals never reached the gate; brake reports
    must count every refusal by reason against the signals that actually reached it, on a path-independent
    split. Gen 3 counted door refusals and suppressions so that neither arbitration nor doors read as decay.
  inputs:

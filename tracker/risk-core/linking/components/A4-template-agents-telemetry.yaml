    and kill switches, then execution, then agents' advisory signals; agents may propose context or a bounded
    reduction but cannot loosen limits, revive expired signals, change their own deployment or send broker
    instructions. QMX's rulings say the same - only he promotes, the only automatic change is a unit's own
    risk rule stopping it, agents never touch money, only the node sends orders, nothing a unit needs depends
    on the router, MIS, PC link or Library.

- id: A4-template-agents-telemetry-032
  name: Loss budget alerting by burn rate over two windows, page versus ticket (SRE)
  source: research/R7-software-patterns-self-configuring.md:330-343 (Google SRE workbook alerting on SLOs, CHECKED); research/R3-edge-verification-and-analogues.md:244-257 (READ)
  kind: measure/telemetry
  what_it_does: >-
    A budget is the loss allowed over a window; burn rate is how fast it is used (1 spends it exactly by the
    window's end). Recommended tiers: 2 % of the monthly budget in 1 hour (burn 14.4) pages, 5 % in 6 hours
    pages, 10 % in 3 days opens a ticket. A short window of 1/12 of the long one must agree, so the alert
    resets fast. Low-traffic services need their own rule.
  inputs:
    - budget, losses over a long and a short window
  outputs:
    - page, ticket or nothing
  assumptions:
    - the budget is stated in one money unit per level
  levels: [unit, cluster, portfolio, account]
  instrument_classes: [none (software)]
  class_notes: >-
    Crypto 24/7 has no daily close to reset a window; FX weekends pause burn; low-frequency ORB units are
    the "low-traffic services" that need their own rule.
  styles_timeframes: all; frequency-aware by construction because it measures money, not loss counts
  evidence: idea (production SRE practice, CHECKED)
  known_failures:
    - a naive rule could alert 144 times a day while the target is still met
  performance_note: "[judgment] avoids stopping a unit on spikes that the budget can absorb."
  survival_note: "[judgment] a fast burn halts, a slow burn sizes down, a ticket asks for review."
  ledger_ids: [period_loss_budget, budget_remaining, unit_daily_loss_limit, portfolio_daily_risk_budget, brake_state]
  new_variables:
    - name: burn_rate_tiers
      line: budget share per window that pages, sizes down or opens a ticket
    - name: burn_short_window_ratio
      line: short window as a share of the long one (1/12 in the source)
  qmx_layer: [X3, X6]
  link_hints:
    - A4-template-agents-telemetry-033, the budget policy that follows a spent budget
    - count brakes scaled to trade count (A2); burn rates are the money alternative the lead's sim asked for
    - A4-template-agents-telemetry-157, page only when action is needed

- id: A4-template-agents-telemetry-033
  name: Budget spent means freeze changes; one incident over 20 % of budget means a postmortem (SRE error budget policy)
  source: research/R7-software-patterns-self-configuring.md:340-343 (SRE error budget policy, CHECKED)
  kind: workflow

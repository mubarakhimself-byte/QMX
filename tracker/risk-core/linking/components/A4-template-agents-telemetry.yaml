- id: A4-template-agents-telemetry-037
  name: Saved work pins the block version it was built with; new versions sit beside old ones (n8n, X1)
  source: research/R1-platforms-risk-sizing-extensibility.md:247-251 (n8n node versioning docs, versioned-node-type.ts, CHECKED); expansion/drafts-stopped/X1-template-shape.md:331-337 (X1 idea 36)
  kind: versioning/rollout pattern
  what_it_does: >-
    A node can serve several versions; a saved workflow keeps the version it was built with after a new one
    ships, and newly added nodes get the latest. X1 applies this to risk profiles: a unit version pins its
    profile version and fingerprint and moves to a new one by his click at the next flat.
  inputs:
    - unit version, available profile versions
  outputs:
    - pinned profile per unit, adoption at next flat
  assumptions:
    - old versions stay runnable
  levels: [unit]
  instrument_classes: [none (software)]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea (n8n production behaviour, CHECKED; the QMX Pin shape exists in model.py)
  known_failures:
    - the snapshot rule cold-starts all block state on any fingerprint change (G8 3.7), so a profile-only change would also reset logic state
  performance_note: "[judgment] running units are never silently changed, so their records stay comparable."
  survival_note: "[judgment] no surprise changes on the money path."
  ledger_ids: [state_carry_rule]
  new_variables:
    - name: profile_version_pin
      line: profile version and fingerprint a unit version runs
    - name: adopt_at_next_flat
      line: whether a new profile version waits for the unit to be flat
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-038, migration map for moving a pinned unit forward
    - A4-template-agents-telemetry-039, the anti-pattern this avoids

- id: A4-template-agents-telemetry-038
  name: Migration map from an old block version to a new one with a parameter transform (Simulink forwarding tables)
  source: research/R7-software-patterns-self-configuring.md:429-436 (MathWorks linked blocks and forwarding tables, CHECKED); expansion/drafts-stopped/X1-template-shape.md:559-562 (P1)
  kind: versioning/rollout pattern
  what_it_does: >-
    A linked block stores only its changed parameters. A forwarding table maps an old block path and
    version to a new one, with a function that maps old parameters to new; it applies when a model opens or
    a block is replaced. Links can be locked, disabled, restored or broken.
  inputs:
    - old block version, new block version, parameter transform
  outputs:
    - the upgraded binding with mapped parameters
  assumptions:
    - the old parameters have a meaning in the new block
  levels: [unit]
  instrument_classes: [none (software)]
  class_notes: no class content
  styles_timeframes: all
  evidence: idea (production engineering tool, CHECKED; broken-link limit SNIPPET)
  known_failures:
    - broken or disabled links cannot be upgraded through the table
  performance_note: "[judgment] swapping the placeholder sizer for a real one could become a version that keeps the record, not a new unit."
  survival_note: "[judgment] a declared map can be reviewed; an implicit swap cannot."
  ledger_ids: []
  new_variables:
    - name: block_migration_map
      line: old block id and version to new id and version, with a parameter transform
  qmx_layer: [X1]
  link_hints:
    - A4-template-agents-telemetry-041, the identity table would treat a mapped swap as a version
    - A4-template-agents-telemetry-040, upgrader chains are the same idea for stored shapes

- id: A4-template-agents-telemetry-039

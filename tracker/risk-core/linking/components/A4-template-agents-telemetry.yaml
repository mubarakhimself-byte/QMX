  source: expansion/drafts-stopped/X1-template-shape.md:273-279 (X1 idea 29); research/R3-edge-verification-and-analogues.md:311-322 and :338; research/R4-alphaxiv/conv-01-multi-strategy-risk-management.md:96-104

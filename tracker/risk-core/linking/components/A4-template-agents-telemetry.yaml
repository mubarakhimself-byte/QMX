- id: A4-template-agents-telemetry-129
  name: Loop budgets, stop rules and escalation against agents that do not stop; harness changes driven by observed failures
  source: research/R4-alphaxiv/conv-02-ai-quant-trading-design.md:110-126 and :585-608 (When Agents Do Not Stop 2607.01641; Agentic Harness Engineering 2604.25850)
  kind: workflow
  what_it_does: >-
    Loop engineering defines when an agent retries, what new evidence it needs, the stopping budget and what
    failure routes back to hypothesis revision. Agents need explicit budgets, checkpoints and escalation
    paths because they can loop forever; a harness can improve its prompts, tools and topology from observed
    failures rather than by intuition.
  inputs:

- id: A4-template-agents-telemetry-113
  name: Model-training contamination treated apart from code leakage - pinned model snapshots, logged cutoffs, quarantined outside text
  source: research/R4-alphaxiv/chat-18-agent-harness-alpha-discovery.md:37 and :96; research/R6-alphaxiv-papers/T-04-agents-macro-micro-news.md:127-129 (MFAST cutoff rule)
  kind: gate/test
  what_it_does: >-
    A causally correct pipeline does not stop a model from having seen the test period or a published
    backtest in training. Pin model snapshots, record documented cutoffs and retrieval sources, disable
    unlogged browsing, timestamp or quarantine outside text, and freeze model and protocol before a genuinely
    prospective test. Never evaluate an LLM on news it may have seen in training.
  inputs:
    - model id and cutoff, retrieval logs
  outputs:
    - contamination status per evaluation
  assumptions:
    - providers document cutoffs
  levels: [system]
  instrument_classes: [all]
  class_notes: no class content
  styles_timeframes: all agent research
  evidence: idea (assistant's recommendation; MFAST applies the cutoff rule)
  known_failures:

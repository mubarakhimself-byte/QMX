# ---------------------------------------------------------------- E. Agents and workflows

- id: A4-template-agents-telemetry-104
  name: Agents as evidence interpreters that send typed, expiring, de-risking-only proposals to a deterministic risk service
  source: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:57-105 and :170-195 (assistant's design, citing OpenPM 2608.09988)
  kind: agent role
  what_it_does: >-
    Each agent emits a schema-validated record with instrument, venue, event time, available time, as_of,
    valid_until, evidence ids, confidence, flags and a risk_scale_proposal clamped to 0 to 1, so it can only
    reduce risk. A deterministic service checks schema, freshness, source allow-list, enums, bounds and
    instrument mapping, aggregates, applies hard limits and outputs an approved multiplier, never an order.
    Stale, malformed, contradictory or low-confidence input maps to a conservative default; loss of the
    service means no agent-driven change.
  inputs:
    - agent records with expiry and provenance
  outputs:
    - approved risk multiplier per instrument or unit
  assumptions:
    - the risk service, not the agent, owns limits
  levels: [unit, cluster, portfolio]
  instrument_classes: [all seven; class-specific fields (FX pair and relative surprise, futures contract month, crypto venue and product, stock ticker and filing accession)]
  class_notes: crypto news is 24/7 and authenticity is the core risk; FX headlines map to every pair sharing a currency
  styles_timeframes: slow lane for macro and news; never inside a scalper's decision loop
  evidence: idea (assistant's architecture; the papers it cites test pieces, not this whole design)
  known_failures:
    - de-risk-only proposals still cost growth if they fire on noise; their value must be tested against no agent
  performance_note: "[judgment] a measured cut around bad conditions can save drawdown worth more than missed trades; it must be proven per class."
  survival_note: "[judgment] an agent can never raise risk, change limits or send an order."
  ledger_ids: [context_size_modifier, decision_freshness_bound, news_impact_level_map]
  new_variables:
    - name: agent_risk_scale
      line: approved de-risking multiplier from agent proposals, in 0 to 1
    - name: agent_signal_valid_until
      line: expiry after which an agent proposal no longer counts
  qmx_layer: [X7, X3]
  link_hints:
    - A4-template-agents-telemetry-105, A4-template-agents-telemetry-106, A4-template-agents-telemetry-107, the three agents feeding it
    - A4-template-agents-telemetry-137, ablation tests to prove value
    - A4-template-agents-telemetry-014, smallest-cap combiner inside the service

- id: A4-template-agents-telemetry-105
  name: Macro agent emitting a regime probability vector with invalidation conditions and expiry at the next release
  source: research/R4-alphaxiv/chat-28-F-agents-macro-micro-news.md:82 and :130-138 and :172 (LiveMacroEval 2608.30110, assistant's claim); research/R4-alphaxiv/conv-02-ai-quant-trading-design.md:203-234 (macro profile, regime artifact)
  kind: agent role
  what_it_does: >-
    The agent reads only point-in-time releases, vintages, scheduled-event metadata and computed market
    features, and emits probabilities over states such as risk_on, risk_off, inflation_shock and uncertain,
    with cited inputs and an expiry at the next relevant release. conv-02 adds invalidation conditions and
    expected impact windows, and scores the agent on calibration and transition calls, not P&L.
    LiveMacroEval's live pre-release test found GPT-5 tied the Bloomberg consensus overall but varied by
    indicator; a researcher plus independent verifier got direction right 54 % against 38 %.
  inputs:
    - point-in-time macro releases and vintages, release calendar, market features
  outputs:
    - regime probabilities, event flags, invalidation conditions, expiry
  assumptions:
    - free-text narrative never becomes a risk instruction
  levels: [portfolio, cluster]
  instrument_classes: [FX, indices, metals, energy, crypto, futures, stocks (US indicators in the test)]
  class_notes: >-

  kind: config/override pattern
  what_it_does: >-
    Each limit picks its basis from an enumeration: money or percent, measured from base balance, the day's
    level, the balance high-water mark or the equity high-water mark; percent may apply to balance, net
    profit, free margin or equity. G11 found "5 % drawdown" meant four things across generations; X1 puts
    equity series (realized or marked) and base on every money row.
  inputs:
    - the limit, its declared series and base
  outputs:
    - an unambiguous limit
  assumptions:
    - the host can compute every series a rule names
  levels: [unit, cluster, portfolio, account]
  instrument_classes: [FX and metals in the articles]
  class_notes: crypto has no day close, so "day level" needs a declared reset hour [judgment]
  styles_timeframes: all
  evidence: author backtest (15085 tested cutting half at part of the limit, small gains); 17249 idea-level
  known_failures:
    - halt blocks assume marked equity no host supplies (G11 2.2)
  performance_note: "[judgment] neutral."
  survival_note: "[judgment] a brake that names its base cannot be misread after a restart."
  ledger_ids: [brake_equity_basis, sizing_equity_basis, high_water_mark_equity, day_start_equity]

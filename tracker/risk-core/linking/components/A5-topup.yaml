# ---------------------------------------------------------------- 17. R8 gap 1: stop-loss and exit evidence

- id: A5-topup-079
  name: "Stopping-premium pre-check: measure the unit's own persistence before it gets a stop, and report a stop as two numbers"
  source: "research/R8-gap-topup.md:38-63,89-100,664 (Kaminski and Lo 2014, https://ideas.repec.org/a/eee/finmar/v18y2014icp234-254.html, abstract; Lei and Li 2009, secondary)"
  kind: gate/test
  what_it_does: "Under a random walk a simple stop-and-re-enter rule always lowers expected return; with momentum it can add; with mean reversion it sells the dip. So before a unit gets a stop beyond its disaster stop, measure the autocorrelation of its own P&L or price at its holding horizon: positive allows a tighter stop, negative means only a wide stop sized as insurance. Report every stop's effect as the change in mean return and the change in volatility (and tail), never as 'fewer big losses'. Lei and Li: over 1970-2005 neither fixed nor trailing volatility-scaled stops changed return level; trailing stops cut the spread of returns."
  inputs: ["unit P&L or price series at holding horizon", "stop rule", "re-entry rule"]
  outputs: ["autocorrelation verdict", "delta mean return", "delta volatility and tail"]
  assumptions: ["enough history at the holding horizon", "re-entry rule is part of the test"]
  levels: [unit, methodology]
  instrument_classes: ["US equities to bonds, monthly 1950-2004 (thesis)", "index futures daily (journal)", "NYSE/AMEX stocks (Lei-Li)"]
  class_notes: "Trend-prone futures and FX trends suit stops; intraday FX crosses and index futures at short horizons often mean-revert, where stops cost most. The 1950-2004 gain depended on bonds rallying when stocks fell, which 2022 broke."
  styles_timeframes: "any unit with a holding horizon long enough to measure persistence; scalpers need block persistence tests"
  evidence: author backtest
  evidence_note: "Kaminski thesis: some stop rules added 50-100 bp a month during stop-out periods; label Abstract. Lei-Li via a careful secondary summary."
  known_failures: ["gains measured only during stop-out periods", "persistence shifts by era"]
  performance_note: "A stop is kept where it adds return, priced as insurance where it does not."
  survival_note: "Stops still cap tails; this rule only stops them being sold as edge."
  ledger_ids: [stop_policy_per_style, stop_distance]
  new_variables: [{name: horizon_autocorrelation, note: "autocorrelation of a unit's P&L at its own holding horizon"}]
  qmx_layer: [X3, X5]
  link_hints: ["A2-brakes-drift-exits-249: stops help or hurt by momentum or reversion", "A5-topup-131: block persistence test", "R8 combination 3: autocorrelation check plus stopping premium decides tight catastrophe stop vs wide insurance stop"]

- id: A5-topup-080
  name: "Stop fill at the stressed spread, an execution-delay option, and quick re-entry"
  source: "research/R8-gap-topup.md:65-88,700 (Lo and Remorov 2017, Journal of Financial Markets 34, secondary)"
  kind: exit/stop
  what_it_does: "Model a stop's fill at the spread prevailing in a stress window, not the average spread, because spreads blow out exactly when stops fire. For slower units allow a declared 'confirm on the close' or next-period execution option and test it against the immediate stop, because prices revert after a trigger. Allow quick re-entry after a stop-out where the unit's tests support it. On US stocks 1964-2014 tight stops cut returns significantly, mostly through costs; wide 10-day stops matched buy-and-hold risk-adjusted with lower downside volatility, higher skew and smaller drawdown; next-day execution beat same-close execution, by a lot for tight stops."
  inputs: ["stop rule", "stressed spread model", "execution option", "re-entry rule"]
  outputs: ["stop fill price assumption", "chosen execution timing"]
  assumptions: ["spread history in stress windows exists per instrument"]
  levels: [trade, unit]
  instrument_classes: ["US common stocks (daily)"]
  class_notes: "FX majors and index futures have small cost parts but may show more reversion; energy around inventory reports and indices at the open have large stress spreads."
  styles_timeframes: "swing and slow intraday; scalpers cannot wait a bar"
  evidence: author backtest
  evidence_note: "Simulations plus history with 0.2 % average half-spread; many settings on one sample (snooping risk flagged); single stocks only."
  known_failures: ["broker fees and impact left out", "delay option is a risk for units with gap exposure"]
  performance_note: "Avoids the post-trigger reversal tax on slower units."
  survival_note: "Prices stops honestly at stressed spreads."
  ledger_ids: [spread_cost, slippage_cost, stop_buffer]
  new_variables: [{name: stop_execution_mode, note: "immediate or confirm-on-close execution of a stop, declared per unit"}]
  qmx_layer: [X3]

- id: A5-topup-083
  name: "Two separate knobs: stop width from volatility times a horizon factor, size from the risk budget; tightening a stop never buys size"
  source: "research/R8-gap-topup.md:141-159,654-658 (Carver 2020, https://qoppac.blogspot.com/2020/02/what-is-right-way-to-set-stop-losses.html, read)"
  kind: config/override pattern
  what_it_does: "Set the trailing stop at X times the instrument's annual volatility, with X chosen from the intended holding period, not from capital (X = 0.5 at 20 % volatility gives a 10 % stop; a market four times as volatile gets a stop four times wider and a quarter of the size). Size comes separately from the risk budget, so money at the stop stays equal. Rule for QMX: tightening a stop to fit more size is refused unless the unit's own tests show the tighter stop keeps its edge after costs. Carver's opinions: a breakeven stop is just another fixed stop; profit targets suit only mean reversion; time stops make little sense for trend."
  inputs: ["instrument volatility", "holding-period factor X", "risk budget"]
  outputs: ["stop distance", "size"]
  assumptions: ["volatility estimate at the right horizon"]
  levels: [trade, unit]
  instrument_classes: ["futures (slow trend practice)"]
  class_notes: "Lets one stop rule transfer across FX, indices, metals, energy and crypto, widening as volatility rises."
  styles_timeframes: "trend units in the source; untested for scalpers"
  evidence: idea
  evidence_note: "Practitioner opinion with worked examples, no backtest in the post."
  known_failures: ["differs from size = budget / stop when someone tightens the stop to fit size"]
  performance_note: "Keeps size from being inflated by artificially tight stops."
  survival_note: "Money at the stop is the same in every market."
  ledger_ids: [stop_distance, risk_fraction, trailing_stop_setting]
  new_variables: [{name: stop_horizon_factor, note: "multiple of annual volatility used for stop width, set from the holding period"}]

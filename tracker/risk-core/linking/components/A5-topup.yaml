- id: A5-topup-081
  name: "For a trend unit the trend's own reversal is the exit; the hard stop is a wide catastrophe stop; always test 'no extra stop'"
  source: "research/R8-gap-topup.md:102-121,695-696 (Clare, Seaton, Smith, Thomas 2013, https://openaccess.city.ac.uk/id/eprint/17842/, read)"
  kind: exit/stop
  what_it_does: "On the S&P 500 1988-2011 with 0.2 % cost, a 200-day breakout without an extra stop had Sharpe 0.56 against 0.31 for buy-and-hold; adding trailing stops gave 3 % -0.11, 5 % 0.08, 7 % 0.31, 10 % 0.52, 12 % 0.54, 15 % 0.49; none beat the plain trend exit, and a purchase-cost stop helped nothing. So a trend unit's primary exit is its own reversal signal, its hard stop sits wide where it rarely fires, and no stop is added to any unit without a 'same unit, no extra stop' baseline. End-of-month decisions were as good as daily."
  inputs: ["trend unit", "candidate stop rules", "cost model"]
  outputs: ["exit design with baseline comparison"]
  assumptions: ["the unit has a slower exit signal of its own"]
  levels: [trade, unit]
  instrument_classes: ["stock index (S&P 500, long only)"]

- id: A5-topup-069
  name: "Input-shift monitor by rank martingales, kept apart from the net-return test"
  source: "research/R4-alphaxiv/chat-22b-saved-diffusion-control-quantaalpha.md:213-217 (Anytime-Valid Distribution Shift Detection via Predictive Rank Martingales 2609.00536)"
  kind: detector
  what_it_does: "Keep a frozen reference distribution for a unit's live features or forecast residuals and test for shifts with rank-based martingales: an order feature for directional change and a dispersion feature for centre-versus-tail change. A shift alarm triggers review, a size cut or a pre-funded revalidation epoch; it never rewrites the rule or recycles old evidence. Realised net returns are watched separately by a registered, cost-aware sequential test, because input shift is an early warning, not proof of decay."

- id: A5-topup-131
  name: "Block-persistence test: measure regime persistence in block sums, scanning block sizes with tries counted"
  source: "research/R9-accelerators-and-brake-pairs.md:32-34,303-315,343,542 (R9 script)"
  kind: gate/test
  what_it_does: "A good/bad regime of 60 %/45 % wins lasting 50 trades on average gives a lag-1 autocorrelation of single trades of only about 0.02, which needs about 10,000 trades to detect at two standard errors. Correlations of consecutive block P&L sums show it far sooner: for a 500-trade regime, 50-trade blocks give 0.46 and detect it in about 950 trades (10-trade blocks 0.175, about 1,300). The right block size is near the regime length, so scan block sizes and count each try. No study measures win or regime persistence in intraday strategies after costs; every unit measures its own before any persistence accelerator switches on."
  inputs: ["unit trade results in order", "candidate block sizes"]
  outputs: ["block autocorrelation by size", "pass or fail with tries counted"]
  assumptions: ["enough trades for the block size"]
  levels: [unit, methodology]
  instrument_classes: ["simulation"]
  class_notes: "No class evidence; must be measured per unit."
  styles_timeframes: "fast units reach the trade counts first"
  evidence: simulation
  evidence_note: "R9 arithmetic; model limits stated (+-1R trades, no gaps, no costs beyond win rate)."
  known_failures: ["scanning many block sizes inflates false passes unless tries are counted"]
  performance_note: "Turns accelerators on where persistence is real."
  survival_note: "Keeps them off where it is not."
  ledger_ids: [effective_tries]
  new_variables: [{name: block_persistence_score, note: "autocorrelation of consecutive block P&L at the chosen block size"}]
  qmx_layer: [X5, X2]
  link_hints: ["A5-topup-121: the press it gates", "A5-topup-119: pressing", "A5-topup-132: streak-bias correction"]

- id: A5-topup-132
  name: "Streak-bias correction: 'win rate after k wins' inside a finite record is biased low"
  source: "research/R9-accelerators-and-brake-pairs.md:297,539 (Miller and Sanjurjo, Econometrica 86(6) 2018, 1902.01265, read)"
  kind: gate/test
  what_it_does: "Measuring the proportion of wins after k wins inside a finite sequence is biased against finding persistence: for 100 fair trials and k = 5 the expected proportion is about 0.35, not 0.50; for k = 3 the 'after 3 hits minus after 3 misses' gap is biased by about -8 points. Corrected, the canonical 'no hot hand' data show +13 points (p < .01). Any QMX test of streak persistence must apply the correction (or compare with shuffled sequences of the same length)."
  inputs: ["unit's win-loss sequence", "k"]
  outputs: ["bias-corrected streak effect"]
  assumptions: ["sequence length known"]
  levels: [unit, methodology]
  instrument_classes: ["none (statistics)"]
  class_notes: "No class difference."
  styles_timeframes: "all"
  evidence: controlled test
  evidence_note: "Peer-reviewed statistical result, read."
  known_failures: ["correction assumes i.i.d. under the null"]
  performance_note: "Real streaks are not missed."
  survival_note: "Fake ones are not chased."
  ledger_ids: [loss_streak]
  new_variables: []
  qmx_layer: [X5]
  link_hints: ["A5-topup-131: block test", "A2-brakes-drift-exits-136: fixed-count placebo test"]

- id: A5-topup-133
  name: "AIMD day pair with memory: x0.7 after a bad day, +0.05 after a green day, slowing near the last trip"

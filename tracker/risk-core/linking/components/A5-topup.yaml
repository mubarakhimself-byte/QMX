# ---------------------------------------------------------------- 13. R4 chat-22b (DPCC, QuantaAlpha)

- id: A5-topup-065
  name: "Receding-horizon constrained order planner: propose, project onto limits, execute one step, observe, replan"
  source: "research/R4-alphaxiv/chat-22b-saved-diffusion-control-quantaalpha.md:14-31,83-115,183-199,230 (Diffusion Predictive Control with Constraints 2412.09342; DiRecT 2606.15359 challenge)"
  kind: control loop
  what_it_does: "Generate several short candidate position or order paths, project each onto the feasible set (gross and net exposure, per-instrument size, turnover, margin, participation, drawdown cushion), tighten the limits by an assumed model-error margin, execute only the next slice, update from fills and replan. The first thing to build is the simplest form: a deterministic pre-trade projection that clips or rejects a proposed order against explicit limits, with a hard fallback, independent of the unit. In the robot test, tightening lifted 'constraints and goal' success from 49 % to 98 % with 0.0 mean violations."
  inputs: ["proposed order or path", "positions, equity and high-water mark", "limits", "execution and fill model", "model-error margin"]
  outputs: ["clipped or rejected next order", "fallback or de-risk instruction if nothing is feasible"]
  assumptions: ["a credible error bound exists", "constraints are convex enough to project"]
  levels: [position, unit, portfolio]
  instrument_classes: ["robotics simulation (no market test)"]
  class_notes: "Drawdown is path-dependent, so the state must carry equity and its running peak; gaps, halts and shortfalls make a planned path infeasible, especially in energy, single stocks and crypto weekends. About 80 ms per action rules it out for a scalper's order loop; fine for slower risk planning."
  styles_timeframes: "intraday and slower execution; not tick-level"
  evidence: simulation
  evidence_note: "Robot manipulator with 96 demonstrations; no trading result. DiRecT argues projecting noisy intermediate samples over-constrains generation."
  known_failures: ["a planned-drawdown constraint is not a realised-drawdown guarantee", "admissible paths are not plausible paths when used for stress generation"]
  performance_note: "Clipping instead of refusing keeps more of a proposal's intent."
  survival_note: "Every order passes a deterministic feasibility layer before it leaves."
  ledger_ids: [open_risk_ceiling, max_position_size_lots, margin_used, floor_touch_size_bound]
  new_variables: [{name: constraint_tightening_margin, note: "buffer subtracted from each limit for model error"}]
  qmx_layer: [X3, X2]
  link_hints: ["A4-template-agents-telemetry-109: deterministic enforcement boundary with feasibility by projection", "A2-brakes-drift-exits-003: order-boundary worst-case loss veto", "A1-sizing-allocation-038: drawdown cushion as the exposure bound (chat-22b combination 1)", "A5-topup-066: certify a smaller margin online"]


- id: A5-topup-129
  name: "Calm-volatility scaling with a calm-duration guard, paired with an instant cut on spikes"
  source: "research/R9-accelerators-and-brake-pairs.md:239-244,506-508,528 (Harvey, Hoyle, Korgaonkar, Rattray, Sargaison, Van Hemert 2018 abstract; Danielsson, Valenzuela, Zer 2018 abstract)"
  kind: sizing rule
  brake_or_accelerator: "pair / coupled pair (environment boost up slowly, spike cut down at once)"
  what_it_does: "Exposure proportional to target over forecast volatility, so size rises when markets are calm. The Sharpe gain is confined to risk assets (equity, credit); for bonds, currencies and commodities Sharpe is unchanged but extreme returns fall in every class, because large losses come when volatility is already high and the position small. Across up to 211 years and 60 countries, prolonged low volatility predicted banking crises while volatility itself did not, so a calm-duration guard stops further levering after a long calm spell. Pair: a spike cuts at once; calm raises toward a cap, slowly."
  inputs: ["forecast volatility (session-normal for scalpers)", "target volatility", "calm duration", "cap"]
  outputs: ["exposure multiplier"]
  assumptions: ["forecast is point in time"]
  levels: [unit, portfolio]
  instrument_classes: ["equity, credit, bonds, FX, commodities (studies)"]
  class_notes: "Equity indices and credit-like CFDs: Sharpe gain plausible. FX, bonds, commodities: tail control only. Crypto: weekend volatility leads Monday risk elsewhere."
  styles_timeframes: "all; scalpers use the session's normal volatility"
  evidence: author backtest
  evidence_note: "Abstracts only; in real time across 103 strategies the gain did not hold (Cederburg et al., A1-010)."
  known_failures: ["jump after a quiet spell", "estimate lags a gap", "resizing costs"]
  performance_note: "Higher Sharpe for risk-asset units."
  survival_note: "Smaller positions when volatility is high cut tails in all classes."
  ledger_ids: [volatility_target]
  new_variables: [{name: calm_duration_guard, note: "length of calm after which volatility scaling stops levering further"}]
  qmx_layer: [X2, X3]
  link_hints: ["A1-sizing-allocation-010: volatility-managed exposure", "A3-structure-regimes-scenarios-047: volatility scaling with a cap", "A5-topup-097: pooled volatility forecasts"]

- id: A5-topup-130
  name: "Priced reinstatement: a spent risk layer is refilled for a charge, never for free"
  source: "research/R9-accelerators-and-brake-pairs.md:265-268,481 (Munich Re, Features of Non-Proportional Reinsurance 2021, snippet; Topstep payouts, read; microfinance progressive lending, snippet)"

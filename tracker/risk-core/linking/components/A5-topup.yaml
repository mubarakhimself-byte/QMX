- id: A5-topup-121
  name: "Block-persistence press-and-ease pair (equity-curve scaling), switched on only after the unit's own block test passes"
  source: "research/R9-accelerators-and-brake-pairs.md:202-209,500-502,527 (Ehsani and Linnainmaa, NBER w25551, JF 2022, read; R9 script)"
  kind: sizing rule
  brake_or_accelerator: "pair / coupled pair (persistence press up, ease down)"
  what_it_does: "Size by the unit's own recent block P&L: after a good block press, after a bad block ease, with a dead band (+-5R in the script). Across 20 academic factors from 1963 the average factor earned 52 bp a month after a positive year and 1-2 bp after a negative one (t = 4.67); winners-only Sharpe 1.33 vs 1.06 equal weight, time-series long-short 0.98; so most of the value came from dropping the losers (the brake half). Switch it on only after the unit's block test passes."

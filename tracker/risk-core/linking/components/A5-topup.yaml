- id: A5-topup-145
  name: "Two ledgers: money ledger for brakes (cuts by size, scratches at cost), event ledger as decay evidence (FI rate, scratch rate, full-stop share)"
  source: "research/R9-accelerators-and-brake-pairs.md:425-431,448-453 (R9 script; Rogatko et al. 2015 ordinal grades; FDA titration grade-2 switch)"
  kind: config/override pattern
  brake_or_accelerator: "brake (counting rule for every brake)"
  what_it_does: "A fast-invalidation unit (45.5 % wins, half of losers cut at -0.3R, same +0.10R edge) trips '3 in a row' on 60 % of days against 41 % for an equal-edge unit, though it risks less money; counting a breakeven as a loss doubles a count brake's firing (57 % vs 28 % at 10 trades for a unit with 15 % scratches). So brakes act on a money ledger (a cut counts by its size, a scratch by its costs), and a separate event ledger (fast-invalidation rate, scratch rate, full-stop share, stop slippage) feeds decay detection: a rising full-stop share or falling fast-invalidation precision says the edge is changing before money shows it. Breakevens neither extend nor reset a loss streak in any surviving count rule; medicine counts only graded, dose-limiting events."
  inputs: ["trade outcomes with exit mechanism", "cut sizes", "costs"]
  outputs: ["money ledger for brakes", "event ledger rates for decay"]
  assumptions: ["every trade row carries its exit mechanism"]
  levels: [trade, unit]
  instrument_classes: ["simulation"]
  class_notes: "Intraday units with dynamic SL/TP moving to breakeven produce many scratches; this matters most there."
  styles_timeframes: "scalpers with fast invalidation; intraday with breakeven moves"
  evidence: simulation
  evidence_note: "R9 script plus clinical grading practice; answers his A28/C33 point that brakes must count fast-invalidation cuts and exits."
  known_failures: ["MQL5 1367 convention counts a breakeven as a loss: the trap"]
  performance_note: "Units that cut losers early are not punished for it."
  survival_note: "The event ledger shows decay before the money ledger does."
  ledger_ids: [loss_counting_rule, loss_points_total, qualifying_loss_threshold_r, breaker_fire_density, exit_reason_code]
  new_variables: [{name: event_ledger_rates, note: "fast-invalidation, scratch and full-stop rates per unit used as decay evidence"}]
  qmx_layer: [X3, X6]
  link_hints: ["A2-brakes-drift-exits-091: loss points", "A2-brakes-drift-exits-090: qualifying-loss counting rule", "A2-brakes-drift-exits-086: breaker-fire density as decay evidence", "A2-brakes-drift-exits-270: his rule that every number includes FI cuts"]

- id: A5-topup-146
  name: "Drawdown rule as a decay detector, with a threshold that widens with time in service"
  source: "research/R9-accelerators-and-brake-pairs.md:38,434-439,553-554 (Van Hemert, Ganz, Harvey et al., Drawdowns, SSRN 3583864; Man Group 'You're fired', read)"
  kind: detector
  brake_or_accelerator: "brake / demotion (decay sensor)"
  what_it_does: "At Sharpe 0.5 and 10 % volatility over 10 years, the chance of a maximum drawdown of 1, 2, 3 and 4 annual standard deviations is 97.1 %, 43.0 %, 9.9 % and 1.5 %. For managers of constant skill a total-return rule separates good from bad better than a drawdown rule; when good managers turn bad at 0.5 % a month, drawdown rules match or beat total return because they weight recent history. A drawdown rule is 'poor man's volatility scaling'; taking risk in bursts raises the chance of hitting a level; and since the chance of touching a level rises with time even for an unchanged manager, the threshold should widen with time in service or be read as a rate. That is the old circuit breaker's real job (his A26): a decay sensor, not a skill measure."
  inputs: ["unit drawdown", "time in service", "unit Sharpe and volatility"]
  outputs: ["decay flag", "time-adjusted threshold"]
  assumptions: ["Sharpe and volatility estimates for the unit"]
  levels: [unit, cluster]
  instrument_classes: ["fund managers (study)"]
  class_notes: "No class difference."
  styles_timeframes: "all; matters most for long-lived units"
  evidence: simulation
  evidence_note: "Simulation study by a large manager, summary read."
  known_failures: ["a fixed drawdown threshold fires on healthy units more the longer they run"]
  performance_note: "Avoids firing good, old units on ordinary drawdowns."
  survival_note: "Catches decaying units earlier than total return."
  ledger_ids: [breaker_fire_density, equity_drawdown_halt, decay_alarm_expectancy_r]
  new_variables: [{name: drawdown_threshold_time_scaling, note: "rule by which a unit's drawdown trigger widens with time in service"}]

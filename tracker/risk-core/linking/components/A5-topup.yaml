  outputs: ["size multiplier"]
  assumptions: ["day results available per unit"]
  levels: [unit]
  instrument_classes: ["simulation"]
  class_notes: "Thresholds in R or percent must scale with each unit's trade frequency."
  styles_timeframes: "day-budget units"
  evidence: simulation
  evidence_note: "R9 script, 400 paths per scenario (about +-2 points noise on drawdown odds)."
  known_failures: ["fat tails, gaps and correlated units make every number worse"]
  performance_note: "Same growth per risk, better under regimes."
  survival_note: "Deep-drawdown odds cut by more than half."
  ledger_ids: [drawdown_pressure_multiplier, session_result_r]
  new_variables: [{name: aimd_cut_factor, note: "multiplier after a breach day (script 0.7)"}, {name: aimd_add_step, note: "additive step after a good day (script 0.05)"}]
  qmx_layer: [X2, X3]

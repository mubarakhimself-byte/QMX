  kind: control loop
  what_it_does: "A policy agent reads a batch of decision traces with realised outcomes and rewrites the trading agent's procedure (tools, evidence checks, signal combination) for the next batch. In the paper a 5-day update interval did best on average among 1, 3, 5 and 7 days and daily updates did worst, consistent with chasing noisy feedback. Governance: limits, permissions, order types and stop behaviour sit in a service the policy agent cannot edit; any edit that changes entries, exits, sizing or exposure becomes a new candidate needing replay, fresh evidence and human promotion; every version is kept for rollback."

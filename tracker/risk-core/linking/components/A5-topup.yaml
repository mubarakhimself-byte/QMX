  evidence_note: "Randomised clinical trial of the nomogram; mapping to units is R9's [judgment]."
  known_failures: ["band and steps need calibration per unit"]
  performance_note: "Under-exposure is corrected as actively as over-exposure."
  survival_note: "Large deviations get large cuts."
  ledger_ids: [sqs_hysteresis_band]
  new_variables: [{name: size_dead_band, note: "range of the evidence signal inside which size does not change"}]
  qmx_layer: [X2, X3]
  link_hints: ["A5-topup-113: coupled pair", "A5-topup-137: settle before the next change", "A2-brakes-drift-exits-008: separate trip and clear thresholds"]


# ---------------------------------------------------------------- 8. R4 chat-17 (self-configuring parameters): parts A4 did not take

- id: A5-topup-048
  name: "Pooling policy per parameter type: pool normalised statistics, keep costs local, never pool market mechanics"
  source: "research/R4-alphaxiv/chat-17-self-configuring-parameters.md:142-156 (assistant)"
  kind: config/override pattern
  what_it_does: "Pool estimation information, not every raw value, down a hierarchy instrument -> liquidity, venue or session subgroup -> class -> family default. Volatility scaling: pool model structure and priors within comparable products, update levels locally, never pool raw volatility across unlike products. Spread, slippage, impact, borrow and funding: estimate per instrument, venue, session and size, with a class model only as a prior. Stops and thresholds in normalised units: pool within a family and similar microstructure. Session windows: share labels only after aligning each market's calendar. Rolls, expiries, corporate actions and funding schedules: never pool the rule. Edge: pool its uncertainty, shrink weak evidence toward zero, not toward the group average."
  inputs: ["parameter type", "group hierarchy", "per-instrument estimates and variances"]
  outputs: ["pooled, local or exact value per parameter, with the rule that produced it"]
  assumptions: ["parameters are expressed on comparable scales (volatility units, cost over spread)"]
  levels: [unit, cluster, methodology]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "single stocks"]
  class_notes: "FX and index futures: many bars but serially correlated; FX costs vary by broker. Metals: precious and industrial need not share liquidity or sessions. Energy: crude, gas and products are poor candidates for one pool (seasonality, expiry, delivery, roll). Crypto: 24/7, fragmented venues and funding inflate apparent sample size. Futures: continuous series depend on roll choices. Stocks: delistings, corporate actions, uneven history. Count distinct days or sessions and regimes, not bars."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "Assistant's policy; no study here shows partial pooling raised net out-of-sample returns."
  known_failures: ["a group default pulled from unlike products", "pooling a mechanics rule silently mis-times a roll or funding charge"]
  performance_note: "Thin-record units borrow stable estimates instead of trading on noise."
  survival_note: "Execution costs and market mechanics never inherit a friendlier neighbour's numbers."
  ledger_ids: [calibration_shrink_k, judge_market_shrink_k, calibration_min_trades]
  new_variables: [{name: pooling_rule_per_parameter, note: "declared pool, local or exact treatment for each parameter type"}]
  qmx_layer: [X1, X2]
  link_hints: ["A4-template-agents-telemetry-195: pool by default, overrides earn their place", "A4-template-agents-telemetry-196: empirical-Bayes shrinkage with edge toward zero", "A1-sizing-allocation-166: partial pooling per market and cell", "A5-topup-099: R8 gap 5 pooling evidence (Chen-Dim, Bollerslev, Carver, Jones-Shanken)"]


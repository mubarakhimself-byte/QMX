  qmx_layer: [X4, X6]
  link_hints: ["A3-structure-regimes-scenarios-157: validate generated scenarios through the downstream strategy", "A4-template-agents-telemetry-138: red-team agents", "A5-topup-088: conditional fill"]

- id: A5-topup-090
  name: "Data-driven reverse stress test: average the factor moves on the days the book lost more than X"

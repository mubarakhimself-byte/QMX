  known_failures: ["edge estimates lag, so a real decay is caught late", "he still wants fast money brakes (C19); this rule covers unit sizing only"]
  performance_note: "Keeps size on units in an ordinary losing patch, which is where much of the recovery return is."
  survival_note: "Money brakes stay at book and cluster level, so safety does not depend on the edge estimate."

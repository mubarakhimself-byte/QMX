- id: A5-topup-013
  name: "Drawdown-constrained growth optimum by transformation, with the discrete-time caveat"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:19,62-64,129 (Cherny and Obloj 2013 https://www.alphaxiv.org/abs/1110.6289; Kardaras, Obloj, Platen 2017 https://www.alphaxiv.org/abs/1206.2305; Klass and Nowicki 2005; Hernandez-Bustos and Hernandez-Hernandez 2023)"
  kind: sizing rule
  what_it_does: "Turn a drawdown-constrained growth problem into an unconstrained one with modified utility, so the constrained long-run growth policy is built from the ordinary growth-optimal portfolio through a drawdown transformation. The result is a state-dependent exposure tied to the cushion above the drawdown floor. Klass and Nowicki show the continuous-time Grossman-Zhou rule is not always optimal in discrete time; discrete-time work uses dynamic programming instead."
  inputs: ["growth-optimal (Kelly) exposure", "current wealth and running maximum", "drawdown floor fraction"]
  outputs: ["constrained exposure multiplier from the cushion"]
  assumptions: ["a return model the growth-optimal portfolio can be computed for", "continuous trading for the classic result"]
  levels: [portfolio, unit]
  instrument_classes: ["theory (no class)"]
  class_notes: "Gappy classes (energy, single stocks, crypto weekends) break the continuous-time assumption most."
  styles_timeframes: "theory; discrete trading at any timeframe needs the DP form"
  evidence: idea
  evidence_note: "Theory only; no universal growth-cost number. Assistant's account."
  known_failures: ["not a plug-in for a gappy, discrete, multi-unit book", "growth cost depends on parameters and utility"]
  performance_note: "Gives a principled reason why size can grow back after new highs instead of staying cut."
  survival_note: "Under the model, a positive floor rules out ruin; jumps outside the model are not covered."
  ledger_ids: [rising_floor_fraction, high_water_mark_equity, kelly_fraction_raw]
  new_variables: []
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-037: Grossman-Zhou cushion sizing", "A1-sizing-allocation-038: Hsieh pathwise version for discrete steps", "A5-topup-017: chat-04 combination 1, conservative edge sizing inside the drawdown cushion, then a restart rule"]

- id: A5-topup-014
  name: "Equity-curve filter judged by a pre-registered walk-forward that reports time out and rebound missed"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:18,39,74-78,140-144 (AllocateSmartly, Surfing the Equity Curve 2026, practitioner, https://allocatesmartly.com/surfing-the-equity-curve-using-trend-following-to-switch-strategies-on-and-off/)"
  kind: gate/test
  what_it_does: "Before any equity-curve or loss-trigger overlay goes live, compare it with unfiltered trading on the same walk-forward periods with fees, slippage and switching cost. Fix lookback and re-entry before the holdout, test persistent and mean-reverting regimes, and report exposure time, return, Sharpe, drawdown, turnover and rebound missed. The broad practitioner test (100+ tactical strategies from 1973, monthly filters) improved max drawdown almost always but every variant lost on return and Sharpe."
  inputs: ["unit trade or period returns", "filter rule fixed in advance", "cost and switching cost model"]
  outputs: ["filtered vs unfiltered metrics including time out and rebound missed", "pass or refuse"]
  assumptions: ["the filter is fixed before the holdout", "switching costs are charged"]
  levels: [unit, methodology]
  instrument_classes: ["ETFs and tactical allocation (practitioner study)"]

- id: A5-topup-144
  name: "Money brake at the unit's own k-th percentile of daily P&L for its trade count (frequency-scaled)"
  source: "research/R9-accelerators-and-brake-pairs.md:37,413-432,441-446,547-548 (R9 script)"
  kind: brake
  brake_or_accelerator: "brake / trip (latch)"
  what_it_does: "Count brakes punish frequency and good habits: for a healthy 55 % unit '3 losses in a row' fires on 14 % of days at 4 trades a day, 41 % at 10, 59 % at 16 and 91 % at 40. A money brake set at the unit's own 1st percentile of daily P&L fires on 1-3 % of days at every trade count; its level moves with frequency (-4R at 4 trades, -6R at 10, -8R at 16, -10R at 40), rising more slowly than root N because drift is positive. Two ways to scale: (a) the unit's own k-th percentile for its trade count, from its record or approved backtest; (b) daily standard deviations, sigma_day = sqrt(N) x sigma_trade x risk per trade. Low-frequency units need a minimum number of events before a count signal."
  inputs: ["unit's daily P&L distribution or per-trade sigma", "trades per day", "k"]
  outputs: ["daily money brake level", "trip"]
  assumptions: ["the unit's approved distribution is current"]
  levels: [unit]
  instrument_classes: ["simulation"]
  class_notes: "No class difference; frequency, not class, sets the level."
  styles_timeframes: "every frequency; scalpers at 40 trades a day most"
  evidence: simulation
  evidence_note: "R9 script on 20,000 simulated days per unit."

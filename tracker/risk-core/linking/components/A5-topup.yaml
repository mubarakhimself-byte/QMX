  styles_timeframes: "any unit with a measurable win rate and payoff"
  evidence: simulation
  evidence_note: "Worked Bernoulli example; no drawdown or ruin comparison."
  known_failures: ["not a drawdown control", "penalty weight is another tuned number"]
  performance_note: "Keeps most of the growth while making the path much smoother."
  survival_note: "Lower log-growth variance means fewer deep drawdowns at the same edge."
  ledger_ids: [kelly_fraction_raw, kelly_multiplier]

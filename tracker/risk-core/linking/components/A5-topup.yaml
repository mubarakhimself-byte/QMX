# ---------------------------------------------------------------- 7. R4 chat-14 (early exit, meta-labelling, exit classifiers)

- id: A5-topup-043
  name: "Hold-or-exit classifier for open trades trained on hindsight-optimal exit labels"
  source: "research/R4-alphaxiv/chat-14-early-exit-meta-labelling.md:12-24,95-109,175-177 (MLP-Initialized RL for Exit Timing in SPX Short-Straddle Portfolios, 2026, https://www.alphaxiv.org/abs/2610.13126)"
  kind: exit/stop
  what_it_does: "For each historical trade find the feasible exit time that would have maximised net profit after costs and a minimum hold; label states before it 'hold' and from it 'exit'; train a classifier on the open trade's current state (unrealised P&L, time held, time to expiry, moneyness, value against entry, spread and quote availability, volatility, time of day). Live, it sees only the current state and returns an exit probability and hold or exit. Sizing stays in the risk layer."
  inputs: ["open-trade state features", "hindsight-optimal exit labels (training only)", "execution costs"]
  outputs: ["exit probability", "hold or exit action"]
  assumptions: ["labels built on training episodes only", "chronological split by episode"]
  levels: [trade, position]
  instrument_classes: ["index options (SPX short straddles, 30-minute quotes)"]
  class_notes: "One strategy, one market; no evidence for FX scalpers or futures. Short-volatility exits behave unlike trend exits."
  styles_timeframes: "multi-day options holds in the evidence"
  evidence: author backtest
  evidence_note: "Locked 2024-26 test: 35.01 % vs 11.56 % hold-to-expiry; Sharpe 1.651 vs 0.441; max drawdown 4.04 % vs 12.82 %. Hit rate 56.2 % (559 trades) vs 56.9 % (425): hit rate is not exit precision. Mechanical exits lost to holding (5-day -2.12 %, 25 %/50 % target-stop 1.91 %, combined 1.15 %). RL fine-tuning 37.54 % / 1.705 not significant; RL from scratch 0.18 % / -0.102."
  known_failures: ["no 2008- or March-2020-style shock in the test", "some continuation bars synthetic", "states within a trade are dependent; random row splits leak"]
  performance_note: "The one direct result where a state-based exit raised return and Sharpe together."
  survival_note: "Cut drawdown by about 8.8 points in that test; simple stops did not help there."
  ledger_ids: [exit_reason_code, excursion_mae_mfe_r, max_hold_time]
  new_variables: [{name: exit_model_probability, note: "model's probability that an open trade should be closed now"}]
  qmx_layer: [X3]
  link_hints: ["A2-brakes-drift-exits-241: survival-analysis hold-or-close exit (another state-based exit)", "A2-brakes-drift-exits-249: stops help or hurt depending on momentum or reversion; mechanical exits lost here", "A5-topup-045: validation before it may close live trades", "chat-14 combination 2: pair with certified alpha capacity (A2-brakes-drift-exits-210) so the open trade and the decaying opportunity are judged apart"]

- id: A5-topup-044
  name: "Meta-label probability to size: calibrate, compute net edge as a hurdle, size from the risk budget"
  source: "research/R4-alphaxiv/chat-14-early-exit-meta-labelling.md:32,65-77,111-120,204 (assistant; Label Unbalance in HFT 2503.09988)"
  kind: sizing rule
  what_it_does: "A secondary model, given the primary signal and decision-time context (volatility, spread, liquidity, time of day, regime, book exposure), estimates whether acting is worthwhile. Calibrate its probability on forward validation data; combine with the net payoff distribution of comparable trades: E[PnL] = p G - (1 - p) L - C. Trade only if that clears a hurdle for model uncertainty and book costs; take size from a separate loss budget, cap correlated exposure, use fractional Kelly only as a ceiling, and cut size when calibration is weak or the regime is outside training."
  inputs: ["primary signal", "context features", "calibrated probability p", "conditional average gain G and loss L", "round-trip cost C", "loss budget"]
  outputs: ["take or skip", "size within the budget"]
  assumptions: ["probabilities calibrated on forward data", "labels count one market event once"]
  levels: [trade, unit]
  instrument_classes: ["futures (Chinese futures, 1-minute labels, for the imbalance warning)"]
  class_notes: "At one-minute horizons after fees about 80 % of labels are neutral; scalpers on FX or index CFDs face the same imbalance."
  styles_timeframes: "entry filter for any style; most fragile for scalpers"
  evidence: idea
  evidence_note: "No paper here isolates meta-labelling's effect on returns; the formula is the assistant's design."
  known_failures: ["poor calibration", "class imbalance; resampling and focal loss sometimes did worse than none", "same probability, very different payoff tails"]
  performance_note: "Skips trades whose edge does not clear costs and model doubt, which is where thin edges leak."
  survival_note: "Size never comes from probability times maximum size."
  ledger_ids: [win_rate, average_win_r, mean_loss_r, round_trip_cost_r, kelly_cap, min_net_rr_gate]
  new_variables: [{name: meta_label_probability, note: "calibrated probability that acting on a primary signal pays after costs"}, {name: calibration_error, note: "forward calibration error of the meta-label model, used to shrink size"}]
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-033: probability-based bet sizing with active-bet averaging", "A1-sizing-allocation-138: edge-to-cost admission gate", "A3-structure-regimes-scenarios-006: break-even win probability with cost", "A5-topup-074: label imbalance fixes and threshold choice for scalpers", "R8 1.7: Joubert 2023 (snippet): calibration helps fixed sizing curves, not learned ones; calibrate before any fixed curve and re-check live"]

- id: A5-topup-045
  name: "Exit-model validation before it may close live trades: episode splits, early-exit costs, paired policies, false-exit budget, shadow"
  source: "research/R4-alphaxiv/chat-14-early-exit-meta-labelling.md:36,40-50,122-136,169 (assistant)"
  kind: gate/test
  what_it_does: "Five steps. Split by time and by trade episode, purging overlapping label windows. Replay the decision process with only then-known information, charging spread, fees, slippage, funding, latency, gaps and the cost of exiting early (lost upside, re-entry). Compare on the same trades against the incumbent exit, a hard stop, a time exit and hold-to-original-exit, reporting net return, Sharpe, drawdown, tail loss, turnover, premature-exit regret, by regime and instrument. Stress barrier widths, horizon, decision frequency and fills; separate event from non-event days. Run in shadow and promote only through a forward test with pre-set minimum net benefit, drawdown limit and false-exit budget."
  inputs: ["exit model", "trade episodes and paths", "incumbent and simple exit policies", "cost model", "event flags known at decision time"]
  outputs: ["paired metrics", "premature-exit regret", "false-exit count against budget", "promote or keep in shadow"]
  assumptions: ["the decision cadence tested is one the system can execute"]

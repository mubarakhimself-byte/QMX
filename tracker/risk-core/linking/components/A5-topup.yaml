- id: A5-topup-134
  name: "Memory ceiling after a trip: regrow fast to below the trip level, then slowly near it (ssthresh, CUBIC plateau)"
  source: "research/R9-accelerators-and-brake-pairs.md:353-354,374,397,524,558 (TCP Reno ssthresh; CUBIC RFC 9438 via implementations, snippet)"
  kind: control loop
  brake_or_accelerator: "restore / memory ceiling"

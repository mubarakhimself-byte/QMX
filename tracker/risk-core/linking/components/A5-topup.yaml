  link_hints: ["A2-brakes-drift-exits-139: two-arm entries-fixed exit test", "A2-brakes-drift-exits-140: counterfactual exit replayer with trial counting", "A2-brakes-drift-exits-225: exit change judged as alpha or as risk control", "A2-brakes-drift-exits-270: every simulation includes fast-invalidation cuts"]

- id: A5-topup-046
  name: "Barrier width from volatility with a cost floor"
  source: "research/R4-alphaxiv/chat-14-early-exit-meta-labelling.md:149-165 (assistant's design heuristic)"
  kind: exit/stop
  what_it_does: "Set stop, target and fast-invalidation distances as d = max(k x sigma_h, c_min x round-trip cost), where sigma_h is volatility over the intended hold and round-trip cost includes spread, fees, expected slippage and funding or carry. k, the cost floor and the exit threshold are calibrated on forward data per instrument and unit. Session ends, expiry, rolls and funding timestamps are explicit vertical barriers only where the unit's design says so."
  inputs: ["holding-horizon volatility", "round-trip cost", "k and c_min", "session and event calendar"]
  outputs: ["barrier distances", "vertical barrier time"]
  assumptions: ["costs measured, not assumed", "volatility estimated at the hold horizon"]
  levels: [trade]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "single stocks"]
  class_notes: "FX: session spread and rollover; session end as barrier only for intraday units. Indices: cash close vs overnight futures risk. Metals: contract tick value, roll. Energy: expiry, limits, inventory releases. Crypto: no close, so a maximum hold; funding timestamps and maintenance. Futures: barriers in ticks per contract. Stocks: earnings and halts; a stop cannot fill at its trigger after a gap."
  styles_timeframes: "scalpers most: a barrier inside the cost band is a coin flip paying the spread"
  evidence: idea
  evidence_note: "Design heuristic, 'not a universally validated formula'."
  known_failures: ["barriers that ignore gaps overstate stop effectiveness"]
  performance_note: "Stops and fast cuts are never placed where costs alone trigger them."

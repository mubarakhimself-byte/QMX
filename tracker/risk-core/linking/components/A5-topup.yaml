- id: A5-topup-118
  name: "One rule: size in proportion to the cushion above an anchor on one ledger (house money and reverse house money together)"
  source: "research/R9-accelerators-and-brake-pairs.md:30-31,165-177,491-493,522 (Grossman-Zhou 1993; Hsieh 2303.02613 Lemma 3.1, read; GitBook ladder G6 3.11; MQL5 1367); research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:16,37 (CPPI and TIPP)"
  kind: sizing rule
  brake_or_accelerator: "pair / coupled pair (cushion leverage above the anchor, taper below it)"
  what_it_does: "Under a floor the growth-optimal size is proportional to the cushion; Hsieh's bound is exposure <= (d_max - d) / (1 - d) x equity / worst one-step loss. With a fixed anchor (day start, seed, a dollar floor) gains widen the cushion and the rule presses (house money), losses narrow it and the rule cuts (reverse house money). With a trailing anchor (running peak, TIPP) a new high lifts the floor too, so the rule never goes above baseline: a pure brake. The anchor decides whether a cushion rule is an accelerator. Day multiplier (L + P) / L: 1.5x at +0.5 % with a 1 % limit, 1.05x with the old 10 % limit; the GitBook ladder (share per R = (1 - K/E) / 7, 2.9 % at $250 to 12 % at $1,250) is the same CPPI shape at Book level. One anchor means the two halves cannot contradict each other."
  inputs: ["P&L since the anchor", "loss limit L", "anchor type (fixed or trailing)", "worst one-step loss"]
  outputs: ["size multiplier above or below 1"]
  assumptions: ["a real loss limit exists at that scope", "the account floor is never moved by a restart"]
  levels: [unit, portfolio, account]
  instrument_classes: ["simulation (R9 script)", "ETF and BTC (Hsieh restart tests)"]
  class_notes: "The worst one-step loss differs by class (gappy energy, crypto weekends, single stocks); the cushion bound is only as good as that number."
  styles_timeframes: "day-budget units at unit scope; Book or BMS with a dollar floor"
  evidence: simulation
  evidence_note: "R9 script (400 paths, +-1R trades, 0.5 % base risk): independent trades 0.600 growth per unit of risk vs 0.603 constant; regimes 0.796 vs 0.583 (50-trade) and 0.855 vs 0.604 (500-trade). Theory: Grossman-Zhou, Hsieh-Barmish."
  known_failures: ["without persistence it only moves risk around", "a deep drawdown tail under slow regimes (73 % of paths over 25 % in the 500-trade regime)"]
  performance_note: "Captures most of the gain when results persist (+37 % and +42 % growth per risk in the script)."
  survival_note: "The same rule cuts automatically as the scope loses."
  ledger_ids: [floor_touch_size_bound, cushion_share_per_trade, house_money_multiplier, drawdown_pressure_multiplier, day_start_equity]
  new_variables: [{name: cushion_anchor_type, note: "fixed (accelerates and brakes) or trailing (brakes only) anchor of a cushion rule"}]
  qmx_layer: [X2, X3]
  link_hints: ["A1-sizing-allocation-036: floor-touch size bound from the cushion", "A1-sizing-allocation-037: cushion sizing under a rising floor", "A1-sizing-allocation-038: pathwise cushion x direction", "A1-sizing-allocation-042: fixed-dollar floor ladder as accelerator", "A5-topup-010: the floor never resets"]

- id: A5-topup-119
  name: "Pressing after wins (anti-martingale): worth k x rho R per trade, nothing when results are independent"
  source: "research/R9-accelerators-and-brake-pairs.md:185-192,303-315 (Liu, Tsai, Wang, Zhu 2010 abstract; Frino et al. 2008 snippet; R9 script)"
  kind: accelerator
  brake_or_accelerator: "accelerator / persistence press"
  what_it_does: "Size up after a win or a winning run, down after losses. With independent trades the growth-optimal policy is a constant fraction, so any outcome-conditioned rule at best matches a constant of the same average size; in the script every pressing rule earned 0.59-0.61 growth per unit of risk against 0.603 for a constant. Sizing 1 + k after a win and 1 - k after a loss adds about k x rho R per trade over the same average constant: at rho 0.05 and k 0.5 that is +0.025R, half a thin +0.05R edge; at rho 0.02, +0.01R. Professionals do press (TAIFEX market makers take more afternoon risk after morning gains), but no study shows it paid."
  inputs: ["recent outcomes or day P&L", "k", "measured persistence rho"]
  outputs: ["size multiplier"]
  assumptions: ["results persist at the unit's horizon"]
  levels: [trade, unit]
  instrument_classes: ["simulation", "index options market makers (behaviour)"]
  class_notes: "No class-specific evidence; high-frequency units cross day thresholds by chance more often."
  styles_timeframes: "all; noisier for fast units"
  evidence: simulation
  evidence_note: "R9 script plus behavioural abstracts; no evidence pressing pays."
  known_failures: ["independent outcomes make it a disguised size increase", "many units press on one shared move"]
  performance_note: "+k x rho R per trade where persistence is real."
  survival_note: "Same drawdown as a bigger constant when it is not."
  ledger_ids: [house_money_multiplier]
  new_variables: [{name: press_step_k, note: "size step after a win or loss in a pressing rule"}]
  qmx_layer: [X2]
  link_hints: ["A5-topup-131: block test before any press", "A1-sizing-allocation-068: event-windowed, book-capped house money"]


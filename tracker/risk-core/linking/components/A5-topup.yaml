  styles_timeframes: "monthly in the evidence; intraday units must run their own test"
  evidence: author backtest
  evidence_note: "Practitioner study, not peer reviewed; filtered portfolios invested 69-96 % of the time; only one variant improved the Ulcer Performance Index and the authors judged it noise; switching cost omitted."
  known_failures: ["lookback selected after the fact", "hysteresis reduces whipsaw but cannot make a weak signal predictive"]
  performance_note: "Prevents a drawdown-cutting filter from silently costing growth."
  survival_note: "Drawdown cut is real but bought with return, so it must be priced against simpler safety."
  ledger_ids: [walk_forward_in_sample_months, walk_forward_out_of_sample_months]

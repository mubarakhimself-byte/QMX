- id: A5-topup-076
  name: "Research harness with information, action and commitment boundaries, a fixed optimisation budget, and reliability judged apart from profit"
  source: "research/R4-alphaxiv/chat-22e-saved-quantharness-tradingr1.md:14-18,68-100,157-165,199 (Reliable Before Profitable: QuantHarness 2610.26101)"
  kind: workflow
  what_it_does: "A request becomes a task contract and strategy specification; every input is bound to a confirmed source, field and frequency (unresolved stays unresolved); an output protocol and plan precede code; validation must pass before any backtest; optimisation is bounded (three evaluations and one final submission per task) with a final period used once. Three runtime boundaries: information (each stage gets only its own runtime card), action (only registered tools for that stage, checked at call time), commitment (a lifecycle transition commits only when the guard finds the required evidence). The agent proposes state changes but cannot accept its own candidate. The first thing to build is the immutable candidate-and-evidence packet."
  inputs: ["research request", "data catalogue", "tool registry", "optimisation budget"]
  outputs: ["frozen candidate with linked spec, bindings, code hash, validation, trial history, costed backtest", "run record including failed outputs"]
  assumptions: ["the harness core runs outside the agent"]
  levels: [methodology]
  instrument_classes: ["Chinese A-shares (FinRelBench)"]
  class_notes: "Bindings must carry each class's mechanics: FX pip and rollover, index vehicle type, metals and energy contract and roll, crypto venue and funding, futures tick value and margin, stocks point-in-time constituents."
  styles_timeframes: "research process for every style"
  evidence: controlled test
  evidence_note: "Task success 90.72 % vs 74.23-84.54 % on 97 tasks; boundary stress tests 0/30 violations with each boundary vs 11/30, 22/30, 14/30 without; organised artifacts recovered 100 % of evidence and replayed 44/44 decisions vs 43.2 %/0 and 27.6 %/0. Financially, ten daily-score tasks averaged -3.27 % a year, Sharpe -0.219: reliable is not profitable."
  known_failures: ["benchmark is explicit rule-based A-share tasks", "no human-review latency or fatigue measured"]
  performance_note: "Fewer wasted promotions of strategies that are not what was asked for."
  survival_note: "Stops rule changes smuggled in through code repairs and peeking at the final period."
  ledger_ids: [effective_tries]
  new_variables: [{name: optimisation_eval_budget, note: "maximum optimisation evaluations per candidate before final submission"}]

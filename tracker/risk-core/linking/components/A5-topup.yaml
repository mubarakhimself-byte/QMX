# ---------------------------------------------------------------- 20. R8 gap 4: energy

- id: A5-topup-094
  name: "Energy overlay on the general machinery: event and roll calendars as data, gas apart from crude, inventory releases as jumps for both"
  source: "research/R8-gap-topup.md:407-478,498-513,681-685,713-718 (CME CL specs, read; EIA schedules, read; Halova, Kurov, Kucher 2014; Loutia et al. 2016; Mou 2010; Bollerslev et al. 2018; Carver 2026)"
  kind: config/override pattern
  what_it_does: "Energy needs no special sizing formula: general volatility-scaled sizing (notional = risk budget / (instrument volatility x contract value per point)) plus three overlays. (1) Event calendar as data with its own refresh: EIA petroleum normally Wednesday 10:30 ET and gas storage Thursday 10:30 ET, shifted in holiday weeks (once to Monday 5:00 pm); OPEC meetings with a decision-type field (cuts and holds move price more; WTI and Brent differ). Inventory releases are jump events for crude and gas units alike: no new entries in the window, positions cut or stops widened before, gap factor raised. (2) Roll calendar per contract from the exchange: CL last trade is 3 business days before the 25th of the prior month, so roll or close several days before; index roll windows (Goldman roll) are predictable flow and cost more to roll into. (3) Natural gas gets its own volatility and event set (storage report, weather season)."
  inputs: ["exchange contract calendars", "EIA and OPEC schedules", "instrument volatility", "contract value per point"]
  outputs: ["event windows", "roll dates", "energy-specific gap factor", "size"]
  assumptions: ["calendars refreshed by a job, never hard-coded"]
  levels: [unit, cluster]
  instrument_classes: ["energy (WTI crude, natural gas, products)"]
  class_notes: "CL: 1,000 barrels, $10 per tick, Globex Sunday-Friday 5:00 pm-4:00 pm CT with a daily 60-minute break. Pooled volatility models forecast energy risk as well as other classes (Bollerslev), and crude, heating oil, gasoline and gas pooled with most futures in Carver's run."
  styles_timeframes: "all energy units; event windows bind intraday and scalpers most"
  evidence: live
  evidence_note: "Contract and schedule facts read from exchange and EIA pages; event-response sizes from snippets (about 10 % gas move per 1 % inventory shock, units to check); Goldman-roll front-running Sharpe up to 4.39 (2000-2010, abstract)."
  known_failures: ["holiday schedule shifts break hard-coded windows", "negative-price expiry (April 2020) if held to the end"]
  performance_note: "Energy units trade normally outside a few dated windows instead of being banned."
  survival_note: "Known jump events and roll gaps never catch a unit unprepared."
  ledger_ids: [news_blackout_before, news_blackout_after, window_forced_flat, gap_loss_beyond_stop]
  new_variables: [{name: energy_event_calendar, note: "EIA, OPEC and roll dates per energy instrument, refreshed as data"}]
  qmx_layer: [X0, X1, X4]
  link_hints: ["A3-structure-regimes-scenarios-143: energy event windows", "A3-structure-regimes-scenarios-129: calendar ingest fails closed when stale", "A5-topup-084: gap factor in the stop", "A5-topup-097: pooled volatility dynamics"]


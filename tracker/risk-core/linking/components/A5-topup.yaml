# ---------------------------------------------------------------- 1. R4 chat-02 turns 2-3 (breadth)

- id: A5-topup-001
  name: "Entropy effective number of bets on the book's own weights, conditional on what can be changed"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:86-103 (Meucci, Managing Diversification 2009, https://papers.ssrn.com/sol3/papers.cfm?abstract_id=1358533, assistant's account)"
  kind: measure/telemetry
  what_it_does: "Eigendecompose the covariance of unit returns, express the current weights in those uncorrelated directions, and take each direction's share of book variance p_i. ENB = exp(-sum p_i log p_i): 1 when all risk sits in one direction, the number of directions when spread evenly. A conditional version keeps only directions the allocator can actually move under its constraints, so the book is not credited with diversification it cannot use."
  inputs: ["net-of-cost unit return series aligned at the book's risk horizon", "shrunk covariance estimate", "current unit weights or risk shares", "allocation constraints (for the conditional version)"]
  outputs: ["ENB number", "per-direction risk shares p_i (more diagnostic than the number)", "conditional ENB over feasible reallocations"]
  assumptions: ["covariance is estimated on the same returns used for risk control", "enough overlapping history for small eigenvalues to mean something"]
  levels: [portfolio, cluster, account]
  instrument_classes: ["stocks (paper's 30-stock and full-market illustrations)"]
  class_notes: "FX: a calm covariance hides the shared USD leg, so ENB looks high until a dollar shock. Crypto: one market factor dominates, ENB near 1-2 whatever the token count. Futures across classes give the most real directions. Indices and single stocks collapse into equity beta under stress."
  styles_timeframes: "book-level statistic; any mix of styles once returns are put on one clock"
  evidence: idea
  evidence_note: "Model-based illustrations in the paper (about 5.5 and 9 effective relative bets), not realised performance; assistant's summary, paper not read by R6."
  known_failures: ["inherits every covariance error; short, overlapping or on/off histories make small directions unreliable", "a calm-period covariance overstates diversification just before correlations jump", "variance-based: says nothing about tail loss, liquidity or whether directions carry distinct alpha"]
  performance_note: "Shows where a new unit adds a risk direction the book lacks, so budget can go to real diversification rather than to more of the same bet."
  survival_note: "A falling ENB is an early sign that many units have become one bet; compare base and stressed estimates rather than trusting one count."
  ledger_ids: [effective_independent_bets, effective_bets_drop_trip, unit_result_correlation]
  new_variables: [{name: enb_conditional, note: "ENB counted only over directions the allocator may change"}, {name: enb_risk_shares, note: "per-direction share of book variance behind the ENB number"}]
  qmx_layer: [X6, X2]
  link_hints: ["A1-sizing-allocation-106: same family (spectral rank, RC concentration); ENB is the portfolio-weighted member of that set", "A1-sizing-allocation-093: chat-02 combination 1, ENB + HRP + Ledoit-Wolf shrinkage: allocate by cluster, then check ENB actually rose", "A1-sizing-allocation-098: shrink or denoise the covariance before ENB", "A3-structure-regimes-scenarios-049: compute ENB under a stressed correlation floor as well as calm", "A5-topup-004: run ENB on residualised returns so shared USD or equity beta is not counted as breadth"]

- id: A5-topup-002
  name: "Forecast breadth counted in independent opportunities, with an overlap correction"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:105-120 (Grinold 1989; Clarke, de Silva, Thorley 2002; Harvey, Liu, Zhu 2016; assistant's account)"
  kind: measure/telemetry
  what_it_does: "Count breadth as independent forecast opportunities, not signals or bars. Estimate skill from out-of-sample forecast-and-outcome pairs, discount nominal bets for correlation among forecasts (B_eff = B / (1 + (B - 1) rho)), and also for serial overlap: a signal every bar on one persistent move is one opportunity, not many. The result says how much breadth could raise the information ratio; it is not a risk cap."
  inputs: ["per-unit forecasts and realised targets at the decision horizon (out of sample)", "correlation of forecasts or forecast errors across units", "holding-period overlap per unit"]
  outputs: ["effective forecast breadth", "information coefficient per unit", "breadth-implied information ratio ceiling (with transfer coefficient and costs kept separate)"]
  assumptions: ["forecasts are logged in a comparable form across units", "out-of-sample pairs exist; backtest-selected winners do not count"]
  levels: [unit, cluster, portfolio, methodology]
  instrument_classes: ["equities (theory)"]
  class_notes: "Scalpers firing on every bar of one move need the overlap correction most. FX units long EUR/USD and short USD/CHF on one signal are one bet. Session variants of one logic count once unless their forecast errors differ."
  styles_timeframes: "matters most for high-frequency scalpers and session-open families"
  evidence: idea
  evidence_note: "Theoretical scaling law; the assistant stresses it is not evidence that adding units raises realised return."
  known_failures: ["IC and correlation are unstable with short, sparse or on/off histories", "breadth gains saturate when units share information", "a large agent-generated library inflates apparent breadth through false discoveries (Harvey-Liu-Zhu)"]
  performance_note: "Tells the allocator when a new unit adds forecast information rather than more of the same, which is where breadth pays."
  survival_note: "Stops a book of many correlated small edges from being sized as if it had many independent ones."
  ledger_ids: [effective_independent_bets, trade_rate, effective_tries]
  new_variables: [{name: forecast_breadth_effective, note: "independent forecast opportunities after correlation and overlap discounts"}]
  qmx_layer: [X6, X5]
  link_hints: ["A1-sizing-allocation-105: the law itself; this adds the overlap and out-of-sample counting rules", "A5-topup-007: feeds the breadth haircut chain", "A2-brakes-drift-exits-161: observation unit as non-overlapping risk blocks, the same overlap idea for verification"]

- id: A5-topup-003
  name: "Breadth-to-budget procedure: breadth spreads a fixed total, never raises it, recomputed on two clocks"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:136-147 and :212 (assistant's procedure)"
  kind: workflow
  what_it_does: "Set the total risk budget from survival limits first (volatility, stress loss, gap and liquidity scenarios). Estimate breadth three ways (universe spectral rank, book ENB, forecast breadth) and use the lowest relevant conservative estimate. Allocate across clusters grouped by exposure and failure mode (illustration: equal shares, any cluster capped at 20 % of total), then within a cluster by marginal risk with a residual buffer. Monitor exposures continuously or daily, refresh correlations at least weekly, and redo the full breadth allocation monthly or on a regime or universe change."
  inputs: ["survival limits (volatility, stress loss)", "three breadth estimates", "cluster map", "per-unit marginal risk and conservative net edge"]
  outputs: ["total risk budget in money", "per-cluster budgets and caps", "per-unit risk contributions", "recompute schedule and triggers"]
  assumptions: ["a stress scenario set exists", "clusters are defined by measured behaviour, not labels"]
  levels: [portfolio, cluster, unit]
  instrument_classes: ["all (procedure)"]
  class_notes: "24/7 crypto needs at least weekly correlation refresh; FX and index clusters split by USD and equity beta; energy needs a supply-shock scenario in the total."
  styles_timeframes: "book-level; the monthly full refresh suits mixed scalper and intraday books, the daily layer catches fast changes"
  evidence: idea
  evidence_note: "Assistant's procedure with an illustrative $100,000 / eight clusters / $12,500 each / $20,000 cap example."
  known_failures: ["noisy weekly covariance causes churn unless shrinkage, turnover limits and review slow it", "an equal cluster split ignores clusters with no real edge"]
  performance_note: "Budget flows to clusters that add independent risk, and a new unit earns risk only by improving net book growth or stress survival in walk-forward tests."
  survival_note: "Breadth can never be a reason to raise total risk, which closes the 'more units, more risk' trap."
  ledger_ids: [portfolio_daily_risk_budget, cluster_exposure_cap, effective_independent_bets]
  new_variables: [{name: breadth_estimate_used, note: "which of the three breadth numbers bound the allocation"}, {name: cluster_risk_share_cap, note: "maximum share of total risk for one cluster (illustration 0.20)"}, {name: breadth_refresh_cadence, note: "slow clock for the full breadth reallocation (illustration monthly)"}]
  qmx_layer: [X2, X1]
  link_hints: ["A1-sizing-allocation-107: same three-level hierarchy; this adds the 'lowest relevant breadth' rule and the two clocks", "A1-sizing-allocation-086: parent below the sum of children", "A3-structure-regimes-scenarios-159: stress results as the survival gate on the total", "A5-topup-001: ENB is one of the three breadth numbers"]

- id: A5-topup-004
  name: "Residualised breadth: count a unit's leftover P&L after shared exposures, on calm and stressed covariance"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:156-174 (assistant; cross-asset network study 2605.30442)"
  kind: measure/telemetry
  what_it_does: "Before counting breadth, regress each unit's net returns (and forecast errors) on shared exposures: USD and funding, equity beta, commodity growth and inflation, rates, crypto beta, volatility and liquidity. Only the residual counts as a separate bet, and only if it stays separate in stress and after costs. Use a calm covariance for normal allocation, a stressed covariance for caps, and a conservative blend for the breadth number; session variants of one logic count together unless their residual P&L differs."
  inputs: ["unit net returns and forecast errors", "factor return series (USD index, equity index, commodity, rates, crypto index, volatility)", "calm and stressed estimation windows"]
  outputs: ["residual P&L per unit", "residual breadth (calm, stressed, blended)", "factor loadings per unit and cluster"]
  assumptions: ["factor series are available point in time", "enough history in a stressed window"]
  levels: [unit, cluster, portfolio]
  instrument_classes: ["FX", "indices", "single stocks", "metals", "energy", "crypto", "futures"]
  class_notes: "FX majors share the USD leg; long and short versions of one FX signal are not two bets. Index scalpers, sector and single-stock units may be one equity-beta cluster. Gold loads on real rates and USD; copper and oil share growth. Crypto token count is a poor breadth proxy. Futures across classes are the richest universe but tick size and horizon still split them. Crypto weekends need explicit dependence tests, not assumed diversification."
  styles_timeframes: "all; session-open families and 24/7 crypto books need it most"
  evidence: idea
  evidence_note: "Assistant's operational rule; the 381-asset network study (2605.30442) is cited for stress mixing across classes."
  known_failures: ["factor set incomplete, so a hidden shared driver stays counted as breadth", "calendar alignment of crypto with traditional markets understates weekend coupling"]
  performance_note: "A modest-Sharpe unit with a real residual can earn budget that a high-Sharpe clone of an existing bet cannot."
  survival_note: "Breadth falls automatically when a cluster's stressed correlation rises, so caps tighten before the shock arrives in full."
  ledger_ids: [effective_independent_bets, currency_exposure_limit, cluster_exposure_cap]
  new_variables: [{name: residual_breadth, note: "breadth counted on residual P&L after shared factor exposures"}, {name: factor_exposure_set, note: "declared list of shared exposures removed before counting breadth"}]
  qmx_layer: [X6, X2, X4]
  link_hints: ["A1-sizing-allocation-114: currency-leg exposure is the FX half of this", "A3-structure-regimes-scenarios-048: factor-exposure caps use the same factor set", "A3-structure-regimes-scenarios-029: group instruments by underlying process", "A5-topup-006: stress transmission monitor tells when to switch to the stressed covariance"]

- id: A5-topup-005
  name: "Admit a new sleeve by its marginal effect on the book, not by its own Sharpe or by model count"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:176-187 (2507.15876 CTA replication; 2501.07135 network momentum; 2506.09330 TrendFolios; 2501.03938 in- and out-of-sample Sharpe)"
  kind: gate/test
  what_it_does: "Judge a candidate unit by what it does to the whole book out of sample after costs: change in book Sharpe, max drawdown, tail loss, worst cluster contribution and turnover. A lower-Sharpe sleeve can earn a place if it diversifies (a 0.37-Sharpe short-trend sleeve cut book drawdown from 20.3 % to 14.9 %); several model variants with 0.71-0.89 P&L correlation to a baseline count as one related sleeve."
  inputs: ["book returns with and without the candidate (walk-forward, net)", "candidate-to-existing P&L correlations", "stress scenario losses"]
  outputs: ["marginal Sharpe, drawdown and stress-loss change", "admit, admit as related sleeve, or refuse"]
  assumptions: ["the book's existing units have comparable net return records", "the test window includes at least one stress episode"]
  levels: [unit, cluster, portfolio, methodology]
  instrument_classes: ["futures (CTA studies)", "ETFs (TrendFolios)"]
  class_notes: "Futures trend sleeves: horizon and tick size decide whether fast trend still adds. For FX and crypto, run it on residualised returns or every USD or crypto-beta clone looks additive."
  styles_timeframes: "all; especially candidate scalpers that look different by name but trade the same move"
  evidence: author backtest
  evidence_note: "Author backtests in recent preprints (CTA replication 2010-2025; network momentum 2005-2024 net Sharpe 0.364 vs 0.233); TrendFolios is in-sample ETF data with higher return but lower Sharpe (0.48 vs 0.51)."
  known_failures: ["one sample period decides the marginal effect", "higher growth with higher volatility can masquerade as better breadth (TrendFolios)", "replication ratio falls as weak signals are added (2501.03938)"]
  performance_note: "Lets budget go to the sleeve that improves the book even when its own Sharpe looks weak."
  survival_note: "Refuses clones that add hidden concentration and cost while looking like breadth."
  ledger_ids: [unit_result_correlation, effective_independent_bets]
  new_variables: [{name: marginal_book_effect, note: "change in book net Sharpe, drawdown and stress loss from adding one unit"}]
  qmx_layer: [X5, X2]
  link_hints: ["A1-sizing-allocation-106: the third number of its three-number test is exactly this", "A2-brakes-drift-exits-204: replication-ratio haircut applied to the candidate", "A3-structure-regimes-scenarios-236: trend decay by tick size and horizon decides whether fast trend adds"]

- id: A5-topup-006
  name: "Stress-transmission monitor across classes (who transmits risk changes in turbulence)"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:162,168,196,206 (Regime connectedness study 2605.30442, 381 assets; Engle DCC)"
  kind: detector
  what_it_does: "Track turbulence and directional spillover among crypto, FX and equity groups on synchronised daily data. In the cited study fiat turbulence became the leading net transmitter in the high-turbulence state and module boundaries between classes weakened. When the stressed dependence estimate rises, cut effective breadth and tighten cluster caps rather than waiting for a trailing covariance."
  inputs: ["synchronised daily prices for crypto, FX, equity indices", "USD index, VIX", "rolling correlations or sparse networks", "explicit weekend data"]
  outputs: ["turbulence state", "net transmitter ranking by class", "breadth cut and cap-tightening signal"]
  assumptions: ["weekend crypto data are kept, not interpolated away", "lead time and false alarms are measured before use"]
  levels: [portfolio, cluster, system]
  instrument_classes: ["crypto", "FX", "stocks (S&P 500)"]
  class_notes: "FX: low full-sample correlation is no stress guarantee; dollar funding stress transmits. Crypto: within-class correlation already high; weekend coupling understated by alignment. Indices and stocks: within-group correlation positive and rises."
  styles_timeframes: "daily book-level monitor; too slow to act inside a scalper's session"
  evidence: idea
  evidence_note: "Monitoring hypothesis from one network study; the assistant says to test lead time and false alarms first. Not an alpha signal."
  known_failures: ["no lead time reported", "network estimates noisy and sensitive to window", "calendar interpolation hides weekend stress"]
  performance_note: "Keeps the book from paying for diversification that is about to vanish."
  survival_note: "Tightens caps on the class that will transmit the shock, before losses arrive together."
  ledger_ids: [cross_market_stress_reading, effective_bets_drop_trip, cluster_exposure_cap]
  new_variables: [{name: stress_transmitter_state, note: "which class group is the net transmitter in the current turbulence state"}]
  qmx_layer: [X3, X4, X6]
  link_hints: ["A3-structure-regimes-scenarios-121: same family of graph and spectral detectors, also with no lead time", "A3-structure-regimes-scenarios-234: contagion graph as the scenario side", "A3-structure-regimes-scenarios-046: DCC as the correlation engine (chat-02 combination 3)", "A3-structure-regimes-scenarios-088: turbulence index per bucket"]

- id: A5-topup-007
  name: "Breadth haircut chain: breadth-implied return, cut for dimension and history, then a multiple-testing bar"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:204,210 (combinations 2 and 5: Grinold; Jacquier, Muhle-Karbe, Mulligan 2501.03938; Harvey-Liu-Zhu 2016; Kan-Zhou; HRP; Bailey et al. PBO)"
  kind: workflow
  what_it_does: "Estimate expected return from independent forecast breadth, then haircut it by the expected out-of-sample replication ratio for the number of signals and assets and the length of history, then require a promotion threshold that accounts for how many candidates were searched. A variant shrinks each unit's edge toward its family mean and rejects any cluster whose edge depends on one backtest split."
  inputs: ["effective forecast breadth", "signal count, asset count, training length", "number of candidates tried", "family or cluster mean edge"]
  outputs: ["haircut expected edge per unit and cluster", "pass or fail against a multiple-testing-aware bar"]
  assumptions: ["the trial ledger counts every candidate", "family priors exist"]
  levels: [methodology, cluster, unit]
  instrument_classes: ["all (method)"]
  class_notes: "Most needed where agents generate many near-identical candidates on one class, for example many FX scalper variants."
  styles_timeframes: "promotion-time workflow for every style"
  evidence: idea
  evidence_note: "Assistant's combination of published methods; not tested together."
  known_failures: ["replication-ratio formula assumes linear signals", "families defined loosely let a weak unit borrow a strong prior"]
  performance_note: "Keeps strong, few-signal units at full value while trimming crowded weak ones."
  survival_note: "Stops the agent-search pipeline from promoting breadth that is really selection luck."
  ledger_ids: [effective_tries, deflated_sharpe_min, pbo_pass_threshold]
  new_variables: []
  qmx_layer: [X5, X7]
  link_hints: ["A5-topup-002: input breadth", "A2-brakes-drift-exits-204: replication-ratio haircut", "A2-brakes-drift-exits-182: t-ratio above 3 bar", "A1-sizing-allocation-028: hierarchical shrinkage toward the family prior", "A2-brakes-drift-exits-180: PBO by CSCV for the narrow-split check"]

- id: A5-topup-008
  name: "Latent-state edge tracker per sleeve: skill, exposure, horizon and execution as separate time-varying states"
  source: "research/R4-alphaxiv/chat-02-breadth-effective-bets.md:208 (combination 4: Is Trend Still Your Friend? 2607.01550 with Benhamou et al. Bayesian graphical CTA decomposition 2507.15876)"
  kind: detector
  what_it_does: "Model each sleeve's forecast skill, cluster exposures, horizon contribution and execution conditions as latent states that move over time. Flag an abrupt fall in skill separately from ordinary noise, and cut or freeze a sleeve when its posterior edge falls or stressed execution cost rises. The trend study's post-2009 break shows slow rolling averages miss structural change."
  inputs: ["sleeve returns", "factor and horizon decomposition", "execution cost series"]
  outputs: ["posterior edge per sleeve", "abrupt-decay flag", "cut or freeze recommendation"]
  assumptions: ["a factor decomposition of each sleeve is stable enough to fit", "execution costs are logged per trade"]
  levels: [unit, cluster]
  instrument_classes: ["futures (trend studies)"]
  class_notes: "Small-tick futures decayed most after 2009; FX and crypto trend sleeves need their own tick and cost tiers."
  styles_timeframes: "trend and breakout sleeves, daily data"
  evidence: idea
  evidence_note: "Assistant's pairing of two papers; neither tests the combined tracker."
  known_failures: ["state-space fits are fragile on short records", "confuses cost rise with skill decay unless execution is its own state"]
  performance_note: "Keeps a sleeve trading through noise while catching a real break earlier than a moving average."
  survival_note: "Separates edge decay from execution trouble, so the right response fires."
  ledger_ids: [drift_state, cost_drift_multiple]
  new_variables: []
  qmx_layer: [X3, X5]
  link_hints: ["A2-brakes-drift-exits-174: separate edge decay from spread, slippage and implementation faults", "A2-brakes-drift-exits-172: three break detectors with three jobs", "A3-structure-regimes-scenarios-236: trend decay by tick size and horizon"]

# ---------------------------------------------------------------- 2. R4 chat-04 (drawdown-controlled sizing)

- id: A5-topup-009
  name: "Drawdown control by level: hard floor on the whole book, caps on clusters, only a soft overlay per unit"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:37-41,80-86,95-111,158-166 (assistant's design)"
  kind: config/override pattern
  what_it_does: "Put the non-negotiable drawdown floor on combined marked-to-market book equity, with a high-water mark that survives unit additions, removals and reallocations. Put caps on clusters sharing a driver (USD, equity beta, short volatility, related energy contracts). At unit level use drawdown, edge uncertainty, execution and decay only for soft throttling or review. Do not give every unit its own hard independent drawdown stop by default: a shared transient shock then cuts many noisy units at once."
  inputs: ["book equity marked to market", "book high-water mark", "cluster exposures", "unit drawdown, edge estimate, execution record"]
  outputs: ["book exposure scale from the cushion", "cluster cap state", "unit throttle or review flag"]
  assumptions: ["one combined equity series exists for the book", "clusters are defined by shared drivers", "the rule is calibrated to each unit's holding period and marks"]
  levels: [portfolio, cluster, unit, account]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "single stocks (assistant's table)"]
  class_notes: "FX: weekend reopen gaps and leverage. Indices: overnight gap stress apart from the cash session. Metals: split precious from industrial. Energy: wider jump scenarios, inventory releases, limit moves, rolls. Crypto: liquidation on perpetuals can beat the stop; venue and stablecoin risk sit outside a price model. Futures: variation margin turns a loss into a liquidity event. Stocks: earnings gaps, halts, borrow recalls. In every class a margin call can arrive before a smooth drawdown rule reacts."
  styles_timeframes: "scalpers: intraday loss accumulation and outages; overnight holders: close-to-open moves; slower units: long drawdowns and financing"
  evidence: idea
  evidence_note: "Assistant's synthesis of Grossman-Zhou, Hsieh 2023/2026 and the AllocateSmartly study; no paper tests the three-level split."
  known_failures: ["margin call or forced liquidation before the drawdown rule acts", "historical minima mistaken for physical bounds", "independent per-unit stops synchronise after a common shock"]
  performance_note: "Noisy units keep trading through local drawdowns that are diversification at book level."
  survival_note: "The hard floor sits where ruin is experienced, the whole book, so it cannot be dodged by reallocating."
  ledger_ids: [high_water_mark_equity, portfolio_floor, bms_buffer_before_floor, cluster_exposure_cap, equity_drawdown_halt]
  new_variables: [{name: unit_drawdown_role, note: "declared role of unit-level drawdown: soft throttle, review flag, or (opt-in) hard stop"}]
  qmx_layer: [X3, X1]
  link_hints: ["A2-brakes-drift-exits-004: three-level brake hierarchy, tightest wins; this says which level holds the hard drawdown limit", "A1-sizing-allocation-038: pathwise cushion rule for the book floor", "A2-brakes-drift-exits-132: his rule that the floor is almost never touched, BMS buffer above it", "A5-topup-010: the anchors this rule must never reset"]

- id: A5-topup-010
  name: "Two anchors: a unit's working anchor may restart, the account floor and book high-water mark never do"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:40,72,86,150,164; research/R9-accelerators-and-brake-pairs.md:36,264,402 (Hsieh 2303.02613 READ: BTC 20.18 % against a 20 % cap)"
  kind: config/override pattern
  what_it_does: "Keep two references apart. A local restart may reset a unit's working drawdown reference so it can trade again after a near-breach. The account floor and the book's global high-water mark are never reset by a restart, a reallocation, a payout or a version change. Hsieh's restart re-arms sizing but its BTC run ended at 20.18 % drawdown against a 20 % cap, which is what happens when the working anchor is treated as the floor."
  inputs: ["unit working anchor", "book high-water mark", "account floor"]
  outputs: ["drawdown measured against both anchors", "refusal of any reset that touches the floor"]
  assumptions: ["anchors are persisted and survive restarts", "a restart is logged as an event, not a fresh start"]
  levels: [unit, portfolio, account]
  instrument_classes: ["ETF (VT)", "crypto (BTC)"]
  class_notes: "Same everywhere; crypto's 24/7 marks make restarts more frequent, so the separation matters more there."
  styles_timeframes: "all"
  evidence: author backtest
  evidence_note: "Hsieh 2023 out-of-sample: VT +20.97 % with restart vs -8.42 % without, both at the 10 % cap; BTC +101.82 % vs +17.41 % but 20.18 % drawdown. One asset each, one period."
  known_failures: ["resetting the local clock hides cumulative deterioration if read as recovery", "a payout or re-seed quietly moving the anchor"]
  performance_note: "Restart lets a unit trade again after a near-breach instead of sitting at zero size just as opportunities return."
  survival_note: "The account-level guarantee holds across any number of unit restarts."
  ledger_ids: [high_water_mark_equity, portfolio_floor, kill_line_floor, state_carry_rule]
  new_variables: [{name: unit_working_anchor, note: "resettable drawdown reference for one unit, distinct from the book high-water mark"}]

# ---------------------------------------------------------------- 11. R4 chat-21 (multi-agent market simulation for testing risk rules)

- id: A5-topup-059
  name: "Paired-seed control ablation in an interactive simulator, with production units behind an exchange adapter"
  source: "research/R4-alphaxiv/chat-21-multi-agent-market-simulation.md:45-63,101-118,171-177 (ABIDES 1904.12066; ABIDES-Gym 2110.14771; assistant's test plan)"
  kind: gate/test
  what_it_does: "Run production unit code unchanged behind a simulated broker or exchange adapter, each unit as its own agent with its real cadence, sizing, latency and cancels, and a separate portfolio-risk agent that can reject, cancel, freeze or set reduce-only. Verify the adapter on known order traces first. For every baseline path, rerun with common random seeds: full book and controls, controls off, and one control off at a time; sweep participation, depth, latency and trigger levels. Exercise three stress families: herding (shared price, news, drawdown or model-version triggers), liquidity withdrawal (depth down, spreads up, cancels up, slow replenishment), cascades (initial shock plus price-triggered selling, margin liquidation, cross-asset moves)."
  inputs: ["unit code and adapters", "calibrated and adverse background populations", "seed set", "risk controls"]
  outputs: ["per-control effect on drawdown, expected shortfall, time to trigger, fill quality, residual exposure, false halts"]
  assumptions: ["background populations are calibrated per venue on held-out data"]
  levels: [system, portfolio, unit]

- id: A5-topup-127
  name: "Slow start with a first-warning switch for new or returning units (accelerated titration)"
  source: "research/R9-accelerators-and-brake-pairs.md:233-237,497-499,529 (Rogatko, Cook-Wiens, Tighiouart, Piantadosi 2015, read; TCP slow start)"
  kind: accelerator
  brake_or_accelerator: "accelerator / slow start with first-warning switch"
  what_it_does: "The FDA imposed accelerated titration: one patient per dose level until the first grade-2 event, then at least 3 per level; never raise more than 100 % at a time, and no more than 50 % after the first grade-2 event. For units: from the smallest level, double per clean cohort while nothing has gone wrong; the first warning (a money event or a graded event, not any loss) halves size and switches to small steps and bigger cohorts. Scale the starting size to the unit, as dose to body weight, not a standard dose."
  inputs: ["events since promotion or restart", "warning definition", "cohort size"]

- id: A5-topup-022
  name: "Staged cut ladder in R from the unit's high-water mark at its assigned risk"
  source: "research/R4-alphaxiv/chat-05-allocation-across-strategies.md:40,114 (assistant's pod-style policy)"
  kind: brake
  brake_or_accelerator: "brake / step ladder"
  what_it_does: "Keep a high-water mark on net P&L at the unit's assigned risk, measured in R (a pre-defined unit of expected loss at that risk, not dollars). At 2R below the mark halve the budget and freeze scaling; at 3R drop to a small diagnostic budget; at 4R stop new risk and require human review. An operational violation, corrupt data or unbounded exposure stops the unit at once whatever its P&L. Hysteresis and minimum review intervals stop repeated cut and re-entry."
  inputs: ["unit net P&L at assigned risk", "unit high-water mark", "R definition", "operational fault flags"]
  outputs: ["budget level (full, half, diagnostic, stopped)", "scaling freeze", "human review request"]
  assumptions: ["R is fixed per unit before trading", "the mark is unitised so allocation changes do not move it"]
  levels: [unit, cluster]
  instrument_classes: ["all (policy)"]
  class_notes: "Gap-prone classes can jump past two rungs at once; the ladder must act on the deepest rung reached."
  styles_timeframes: "all; R-based, so frequency-neutral in depth but not in how often it is reached"
  evidence: idea
  evidence_note: "Assistant's starting policy; no public causal evidence that pod stop-outs help long-run returns."
  known_failures: ["crystallises a temporary slump and misses the recovery", "fast units reach 2R by chance more often"]
  performance_note: "Keeps a unit trading at reduced size rather than off, so recovery is still captured in part."
  survival_note: "Bounds each unit's damage in R and adds an operational stop that ignores P&L."
  ledger_ids: [drift_size_down_step, equity_drawdown_halt, high_water_mark_equity]
  new_variables: [{name: unit_cut_ladder_r, note: "R depths for halve, diagnostic and stop (illustration 2, 3, 4)"}]
  qmx_layer: [X3]

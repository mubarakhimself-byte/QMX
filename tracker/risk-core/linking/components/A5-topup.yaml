  evidence: idea
  evidence_note: "Assistant's protocol; the SPX study's locked test and training-only labels are cited as the pattern."
  known_failures: ["F1 or hit rate chosen instead of portfolio outcome", "event exposure learned by accident"]
  performance_note: "Measures exits that sacrificed later gains as well as losses closed early."

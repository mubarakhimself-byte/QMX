- id: A5-topup-015
  name: "Unit-health gate plus a capped per-position uncertainty limit"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:138,152 (Sanderink, When Alpha Breaks, 2026, https://www.alphaxiv.org/abs/2603.13252)"
  kind: gate/test
  what_it_does: "Two separate questions: should this model trade at all (a point-in-time health gate trained on its own matured prediction errors), and which positions deserve caution (a tail cap on the most uncertain predictions, rather than shrinking every position by inverse uncertainty). In the equity-ranker test the model-specific gate beat a VIX-percentile gate (AUROC 0.721 vs 0.449; final period 0.750 vs 0.504) and the cap lifted final-period Sharpe from 0.375 to 0.925."
  inputs: ["matured live-style prediction errors", "per-position predicted uncertainty", "point-in-time features"]
  outputs: ["trade or stand down for the model", "position size cap for high-uncertainty predictions"]
  assumptions: ["prediction errors are logged and matured without look-ahead", "uncertainty estimates rank positions usefully"]
  levels: [unit, position]
  instrument_classes: ["single stocks (AI-exposed US equity ranker)"]
  class_notes: "Evidence is one model and universe. For FX or futures units the gate needs the unit's own error history; market-wide stress (VIX) is a different signal from model health."
  styles_timeframes: "ranking models with daily or slower rebalancing"
  evidence: author backtest
  evidence_note: "Holdout results on one narrow universe; the assistant warns against carrying them to other classes untested."
  known_failures: ["needs a long matured error record", "one-universe result"]
  performance_note: "Trading only while the model is healthy and capping its worst-uncertainty bets raised Sharpe in the test."
  survival_note: "Model failure and market stress are different signals; the gate catches the first, which a market-stress brake misses."
  ledger_ids: [drift_state]

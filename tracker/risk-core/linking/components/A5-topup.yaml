  outputs: ["group and within-group weights"]
  assumptions: ["enough history for posterior estimates", "the learner cannot exceed tilt bounds"]
  levels: [portfolio, cluster]
  instrument_classes: ["stocks (sector-balanced US equities, monthly)"]
  class_notes: "Monthly US equities only; always-on cross-asset scalpers with short lives may not support the posterior or the learner."

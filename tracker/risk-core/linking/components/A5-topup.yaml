- id: A5-topup-084
  name: "Kelly at the stop with costs and a gap factor in R units"
  source: "research/R8-gap-topup.md:172-185,654-658,706-707 (worked arithmetic, [judgment] of the R8 author)"
  kind: sizing rule
  what_it_does: "With a stop the loss is close to 1R, so the binary Kelly fraction of equity at the stop is f* = p - (1 - p) / b. With costs c in R on both sides: f* = [p (b - c) - (1 - p)(1 + c)] / [(b - c)(1 + c)]; p = 0.45, b = 2 gives 17.5 % without costs and about 12 % at c = 0.1R. Halving the stop doubles c in R, which is why tight stops lose after costs. If stop fills average g times R after gaps and slippage, use loss = g + c. A breakeven move adds a third outcome (a scratch at about -c), so two-outcome Kelly overstates the edge; use the full outcome distribution. Full Kelly from estimates is far too large; shrink it."
  inputs: ["win rate p", "average win b in R", "cost c in R", "gap factor g"]
  outputs: ["cost-aware Kelly fraction at the stop (a ceiling)"]
  assumptions: ["p and b are honest, shrunk estimates"]
  levels: [trade, unit]
  instrument_classes: ["arithmetic (no market test)"]
  class_notes: "Energy around inventory reports and index futures at the open have g well above 1; FX majors near 1 in liquid hours."
  styles_timeframes: "all; matters most for scalpers where c is a large share of R"
  evidence: idea
  evidence_note: "Worked math in R8, marked [judgment]."
  known_failures: ["three-outcome units need the full distribution", "estimation error in p and b"]
  performance_note: "Shows exactly how much edge a stop change costs before it ships."
  survival_note: "Gap factor keeps money at risk honest for gappy classes."
  ledger_ids: [kelly_fraction_raw, round_trip_cost_r, gap_loss_beyond_stop, win_rate, average_win_r]
  new_variables: [{name: stop_gap_factor, note: "average stop fill as a multiple of R after gaps and slippage"}]
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-030: Kelly as a ceiling on the budget price", "A1-sizing-allocation-139: break-even win rate after costs", "A1-sizing-allocation-028: shrink toward the family prior (R8 combination 1)", "A2-brakes-drift-exits-234: breakeven creates scratch trades"]

# ---------------------------------------------------------------- 18. R8 gap 2: fast invalidation and early exits

- id: A5-topup-085
  name: "Flag any size increase proposed right after a loss (get-even brake), for humans and agents"
  source: "research/R8-gap-topup.md:204-227,701-702 (Garvey, Murphy, Wu 2005, Do losses linger?, read); research/R9-accelerators-and-brake-pairs.md:362-366 (credit-limit lesson)"
  kind: brake
  brake_or_accelerator: "brake / gate"
  what_it_does: "150 Nasdaq prop day traders (13-minute holds, 1.3 million trades) traded more, bigger and wider after a morning loss and not after gains; the traders with a significant get-even bias lost $4,300-14,400 more a year; costs ($1.66 million) turned a near-breakeven book (gross -$45,000) into a large loss. Any human or agent that can change sizes intraday gets an alert or block on 'risk raised after a loss'. R9's credit-limit lesson points the same way: whoever asks hardest for more limit is the one it profits least, so an agent that keeps asking for size gets the slowest accelerator."
  inputs: ["proposed size or frequency change", "session P&L before the proposal", "proposer identity"]
  outputs: ["flag, block or slow-path for the proposal"]
  assumptions: ["size changes go through one channel that sees the session result"]
  levels: [unit, system]
  instrument_classes: ["US stocks (human day traders)"]
  class_notes: "A behaviour result; applies to any discretionary or agent override in every class."
  styles_timeframes: "intraday; scalpers and intraday units with agent or human overrides"
  evidence: live
  evidence_note: "Real-money human traders at one firm, one year after decimalisation."
  known_failures: ["a planned house-money step after a gain is not the target; only increases after losses"]
  performance_note: "Removes a measured money-losing behaviour."
  survival_note: "Stops a losing session from compounding through bigger bets."
  ledger_ids: [session_result_r, loss_streak]
  new_variables: [{name: post_loss_raise_flag, note: "proposal to raise risk while the session is below its anchor"}]
  qmx_layer: [X3, X7]
  link_hints: ["A2-brakes-drift-exits-092: reverse house money", "A2-brakes-drift-exits-018: de-risk-only agent channel", "A5-topup-118: same-ledger cushion rule cuts size below the anchor automatically"]

- id: A5-topup-086
  name: "Edge-versus-time curve and edge ratio per unit: time stop where the edge is spent; 'the move was inside the signal bar' as a named failure"
  source: "research/R8-gap-topup.md:229-269,703-705 (Mesfin 2026, https://www.alphaxiv.org/abs/2605.04004, read; Sweeney 1997 and Faith 2007 E-ratio, not read)"
  kind: exit/stop
  what_it_does: "Plot each unit's average signed return by bars since entry, and its edge ratio (average favourable over average adverse excursion in ATR, N bars after entry). If the edge is realised in the first k bars, a time stop near k bars or an exit when the trade has not moved favourably by bar k is grounded in the unit's own data; take the time stop where the edge ratio peaks. On MNQ 5-minute bars (2021-2025, 2.0-point friction) 11 of 14 retail signal families earned 0.07-1.50 points gross; the two that passed used fixed time exits (about 60-65 minutes); a London signal flipped from t +4.30 to -2.78 when entry was delayed one 15-minute bar; Asia expansion-bar continuation had t -11.5; an opening-range pullback was stopped out 80.7 % of the time."
  inputs: ["closed trade paths", "bars since entry", "ATR"]
  outputs: ["edge-versus-time curve", "edge ratio by bar", "time-stop bar k"]
  assumptions: ["enough trades per bar bucket", "costs charged at each exit time"]
  levels: [trade, unit]
  instrument_classes: ["index micro futures (MNQ)", "micro gold (weaker)"]
  class_notes: "Cost floor in points is contract-specific; FX and crypto units need their own curves by session."
  styles_timeframes: "scalpers and intraday breakout units"
  evidence: author backtest
  evidence_note: "One independent researcher, walk-forward with three out-of-sample years; 53+ settings tried, said openly."
  known_failures: ["in-sample curves move with regime and volatility"]
  performance_note: "Exits at the point the unit's own edge is spent, which keeps the edge it has."
  survival_note: "Stops units holding into the reversal after a first-bar move."
  ledger_ids: [max_hold_time, excursion_mae_mfe_r]
  new_variables: [{name: edge_time_curve, note: "average signed return by bars since entry for a unit"}, {name: time_stop_bars, note: "bars after which a non-progressing trade is closed"}]
  qmx_layer: [X3, X6]
  link_hints: ["A2-brakes-drift-exits-236: time exit and stale close", "A2-brakes-drift-exits-239: stop width at winners' MAE percentile", "A2-brakes-drift-exits-252: fast invalidation near 0.35R", "R8 combination 2: MAE invalidation + edge curve + search accounting (A5-topup-087)"]

- id: A5-topup-087
  name: "An invalidation rule must beat 'no early cut' and 'cut one bar later' after costs, and is counted as a trial"
  source: "research/R8-gap-topup.md:189-202,264-279,659-663 (R8 synthesis of Lo-Remorov, Clare et al., 2604.27150; [judgment])"
  kind: gate/test
  what_it_does: "Set the early-cut level from the adverse-excursion distribution of the unit's own winners (if 90 % of winners never go below -0.4R, a -0.5R cut loses at most about 10 % of winners) and the time stop from the edge curve. Before it goes live it must beat two baselines after costs, out of sample: no early cut, and the same cut one bar later; every setting tried counts as a trial for deflated Sharpe. A thesis-based invalidation (a named falsifying condition) is safer than a price-only fraction because it does not fire on noise. No published cost-adjusted test of 'cut at a fixed fraction of the stop' exists, so this must be measured on QMX's own trade paths."
  inputs: ["winners' adverse excursions", "candidate cut levels", "trade paths", "trial ledger"]
  outputs: ["cut level and time stop that passed, or refusal"]
  assumptions: ["trade paths stored at bar resolution"]
  levels: [trade, unit, methodology]
  instrument_classes: ["all (method)"]
  class_notes: "Noisy mean-reverting intraday FX and index units are where tight cuts lose to reversal."
  styles_timeframes: "scalpers and fast invalidation"
  evidence: idea
  evidence_note: "R8's synthesis; the literature gap is stated openly."
  known_failures: ["one-bar-later baseline is a single alternative; reversion may span more bars"]
  performance_note: "Keeps fast invalidation only where it adds after costs."
  survival_note: "Cuts losers early where the data say it pays."
  ledger_ids: [fast_invalidation_cut_r, fast_invalidation_trigger, effective_tries]
  new_variables: []
  qmx_layer: [X3, X5]
  link_hints: ["A2-brakes-drift-exits-253: thesis-based invalidation", "A2-brakes-drift-exits-270: every simulation includes fast-invalidation cuts", "A2-brakes-drift-exits-179: deflated Sharpe over tries", "A5-topup-045: exit-model validation protocol"]

# ---------------------------------------------------------------- 19. R8 gap 3: stress scenarios

- id: A5-topup-088
  name: "Conditional scenario fill: unstressed factors take their values given the stress, and scenario P&L is a calibrated band"
  source: "research/R8-gap-topup.md:301-342,708-710 (Cai, Haugh, Li 2026, https://www.alphaxiv.org/abs/2609.37273, read; Breuer et al. 2009, snippet)"
  kind: scenario
  what_it_does: "A scenario names its stressed factors and fills every other factor with its mean conditional on the stress (from a factor model or nearest-neighbour history) instead of zero; the conditional mean is the most plausible fill. Scenario P&L is reported as a prediction interval calibrated online (conformal, or kernel-weighting similar past days), not a single number. In simulated S&P-like books the conditional fill moved scenario P&L by up to about $44; naive intervals covered the truth under 10 % of the time in extreme cells against a 50 % target, calibrated ones near 50 %."
  inputs: ["stressed factor moves", "factor model or analogue history", "book exposures"]
  outputs: ["conditional factor moves", "scenario P&L band"]
  assumptions: ["a factor model covers the book's drivers", "history similar to the stress exists for kernel weighting"]
  levels: [portfolio, cluster, unit]
  instrument_classes: ["simulated equity and option books"]
  class_notes: "Option-heavy and leveraged books suffer most from convexity error; linear FX and futures books mostly from the unstressed-factor error."
  styles_timeframes: "book-level stress runs"
  evidence: simulation
  evidence_note: "Simulated markets; scaling to many factors open."
  known_failures: ["elliptical plausibility understates joint tails"]
  performance_note: "Fewer budget cuts from scenarios that exaggerate by zeroing related moves."
  survival_note: "Stops scenarios from understating loss by ignoring factors that move with the stress."
  ledger_ids: []
  new_variables: [{name: scenario_pnl_band, note: "calibrated interval for a scenario's book P&L"}]
  qmx_layer: [X4]
  link_hints: ["A3-structure-regimes-scenarios-152: coherent driver hypotheticals", "A3-structure-regimes-scenarios-231: reverse stress in a plausibility region (Breuer-style)", "A5-topup-089: daily backtest of the scenario engine (R8 combination 6)"]

- id: A5-topup-089

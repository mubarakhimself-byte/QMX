  evidence_note: "Six one-month windows, two backbones, three runs each: returns from -6.60 % to +6.84 %, MDD 0.94-9.13 %; static base beat it in April 2026 (11.64 % vs 3.69 %); 50-day run 10.56 % / 2.96 %. Edge kept under 10 bp costs with lower turnover."

  link_hints: ["A1-sizing-allocation-121: shed by priority class when budget tightens", "A3-structure-regimes-scenarios-159: marginal stress contribution as the growth control", "A2-brakes-drift-exits-122: BMS breaker", "A5-topup-138: any brake blocks every raise"]

- id: A5-topup-042
  name: "Tier feasibility per instrument: round down, re-estimate impact at the new size, zero if the minimum is too big"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:120-134 (assistant)"
  kind: gate/test
  what_it_does: "Define each tier in a common risk unit (stressed loss or expected shortfall), round the target down to tradable units, estimate participation and impact at the intended execution times at that size, then re-check book exposure. Size to the tightest of loss budget, impact, depth, operational limits and book capacity. Costs at each size come from fills or book data at that size, never by scaling tiny-size backtest costs linearly; a rung that pushes the order into a different execution regime is not credible."
  inputs: ["tier risk target", "lot step, minimum, multiplier, tick value", "depth and impact model at execution times", "book capacity"]
  outputs: ["feasible size or zero", "binding constraint named"]
  assumptions: ["depth or fill data exist at the intended size"]

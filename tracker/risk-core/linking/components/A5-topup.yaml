  styles_timeframes: "trend and breakout units, daily to monthly"
  evidence: author backtest
  evidence_note: "One index, long-only, long-horizon rules; read in full."
  known_failures: ["no intraday evidence"]
  performance_note: "Avoids stops that destroy the trend's Sharpe."
  survival_note: "A wide catastrophe stop still caps the tail."
  ledger_ids: [stop_policy_per_style, disaster_stop_distance]
  new_variables: []
  qmx_layer: [X3]
  link_hints: ["A2-brakes-drift-exits-257: wide disaster stop under fast invalidation", "A2-brakes-drift-exits-265: exit by trend or reversion state", "A2-brakes-drift-exits-139: two-arm entries-fixed exit test"]


- id: A5-topup-030
  name: "Evidence-count report: nominal observations beside non-overlapping episodes, independent blocks and distinct regimes"
  source: "research/R4-alphaxiv/chat-11-backtest-overfitting-validation.md:161-185 (assistant)"
  kind: measure/telemetry
  what_it_does: "Report every validation result with four counts: trading days, non-overlapping trade episodes, independent time blocks under the chosen bootstrap, and distinct regimes covered. For an idealised AR(1) series the effective sample for a mean is N (1 - rho) / (1 + rho), so rho = 0.9 leaves about 5 %; a unit holding h bars has overlapping h-bar outcomes that are not separate evidence. Estimate dependence at the unit's real decision and holding horizon."
  inputs: ["unit trade and bar records", "holding period", "lag-one autocorrelation", "regime labels"]
  outputs: ["nominal count", "effective count", "independent blocks", "regimes covered"]
  assumptions: ["regime labels exist point in time"]
  levels: [unit, methodology]
  instrument_classes: ["FX", "indices", "metals", "energy", "crypto", "futures", "single stocks"]
  class_notes: "FX: 20 pair units are not 20 markets; count decision episodes. Indices: bars cluster by session and share shocks. Crypto: 24/7 bars inflate nominal counts most; need distinct bull, bear, funding and liquidity regimes. Futures and energy: count on individual contracts. Stocks: common factors and events cut independence."
  styles_timeframes: "scalpers and intraday units, whose bar counts look large and are not"
  evidence: idea
  evidence_note: "Assistant's reporting rule with a standard AR(1) approximation."
  known_failures: ["real intraday returns are not stationary AR(1); clustering and shared shocks cut independence further"]
  performance_note: "Avoids waiting for evidence that is already sufficient by counting what matters."
  survival_note: "Avoids promoting on a sample that is mostly one session or one volatility episode repeated."
  ledger_ids: [verification_trades_needed, min_trades_for_verdict, trade_rate]
  new_variables: [{name: effective_observations, note: "dependence-adjusted count of independent observations behind a verdict"}, {name: regimes_covered, note: "distinct regimes represented in the evidence"}]
  qmx_layer: [X5, X6]
  link_hints: ["A2-brakes-drift-exits-161: observation unit as completed campaigns or non-overlapping risk blocks", "A2-brakes-drift-exits-181: trades-to-proof priced up front", "A5-topup-002: overlap correction for breadth"]


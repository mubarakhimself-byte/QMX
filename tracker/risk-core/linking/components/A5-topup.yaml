  kind: control loop
  brake_or_accelerator: "pair / coupled pair"
  what_it_does: "One blood test drives both directions: under 35 s a big bolus and +4 units per hour; 35-45 s a smaller bolus and +2; 46-70 s no change (dead band); 71-90 s -2; over 90 s hold 60 minutes and -3. Steps grow with distance from the band, and under-dosing is treated as harm too (recurrent clots 5x more frequent on the standard-dose arm; 97 % vs 77 % reached the therapeutic range within 24 hours). For units: one evidence signal, a dead band where size holds, step size scaled to how far outside the band the signal is."
  inputs: ["one evidence signal", "band edges", "step table"]
  outputs: ["size step up, hold or down"]
  assumptions: ["the signal measures both danger and under-exposure"]
  levels: [unit]
  instrument_classes: ["clinical (RCT)"]
  class_notes: "No class difference."
  styles_timeframes: "all"

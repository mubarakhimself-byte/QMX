  link_hints: ["A4-template-agents-telemetry-124: agent profiles as mini-harnesses with forbidden context", "A4-template-agents-telemetry-111: registry-validated typed tools", "A4-template-agents-telemetry-120: human-signed promotion packet", "chat-22e combination 1: QuantHarness + honest evaluation (A4-template-agents-telemetry-110) + Promote (A2-brakes-drift-exits-201)"]


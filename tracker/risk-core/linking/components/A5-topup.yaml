- id: A5-topup-049
  name: "Incident bundle protocol: deterministic service detects, the LLM explains measured components with evidence IDs"
  source: "research/R4-alphaxiv/chat-19-llm-agents-risk-monitoring.md:28-33,83-99,155 (assistant; Oculi 2608.28944 compute/LLM boundary; NEXTFUND 2607.11141 traces)"

- id: A5-topup-017
  name: "Layered drawdown controller: conservative edge sizing inside the book cushion, then a separate restart"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:40,150 (combination 1: Hsieh 2609.23272 + Hakobyan-Lototsky 2503.17927 + Hsieh 2303.02613)"

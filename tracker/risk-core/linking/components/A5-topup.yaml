  instrument_classes: ["method (no class)"]
  class_notes: "No class difference."
  styles_timeframes: "book-level"
  evidence: idea
  evidence_note: "Snippet-level reading of the paper; the method is standard."
  known_failures: ["few loss days give a noisy average", "history may not contain the next failure"]
  performance_note: "Cheap; no scenario list to maintain."
  survival_note: "Names the factor mix that would break the book."

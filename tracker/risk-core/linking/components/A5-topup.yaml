  styles_timeframes: "book-level"
  evidence: simulation
  evidence_note: "Simulated; the hidden-factor rotation is the R8 author's [judgment]."
  known_failures: ["one day's error is noisy; trend the log"]
  performance_note: "Trust in the stress engine is earned, so its limits can bind with less padding."

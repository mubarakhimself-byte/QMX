  link_hints: ["A2-brakes-drift-exits-166: input-first drift checks", "A3-structure-regimes-scenarios-123: keep strategy decay, bucket stress and account drawdown apart", "chat-04 combination 2: drawdown floor + this gate + tail cap", "chat-04 combination 4: risk-off monitor + global kill + staged re-enable (A2-brakes-drift-exits-007) needs model health and market stress as two inputs"]

- id: A5-topup-016
  name: "Ridge-penalised fractional Kelly: trade a third of growth for most of the variance"
  source: "research/R4-alphaxiv/chat-04-drawdown-controlled-sizing.md:124 (Hakobyan and Lototsky 2025, https://www.alphaxiv.org/abs/2503.17927)"
  kind: sizing rule
  what_it_does: "Pick the Kelly fraction by penalising log-growth variance (a ridge term) instead of using a fixed fraction. In a Bernoulli example with win probability 0.75, full Kelly had growth 0.13 and log-growth variance 0.22; the ridge-sized fraction had 0.08 and 0.03, about 38 % less growth for 86 % less variance."

  known_failures: ["persistence breaks abruptly and for everyone: momentum averaged -1.6 % (5th pct -8.8 %) in months of negative factor autocorrelation"]
  performance_note: "Nearly doubles growth per risk in slow regimes in the script."
  survival_note: "The ease half drops losers early."

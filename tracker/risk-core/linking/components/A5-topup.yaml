# ---------------------------------------------------------------- 15. R4 chat-22d (Label Unbalance in HFT, FinRL-X)

- id: A5-topup-074
  name: "Imbalanced short-horizon classifier: calibrate on the natural class mix, act on expected net value, never size by class weights"
  source: "research/R4-alphaxiv/chat-22d-saved-labelunbalance-finrlx.md:14-34,91-117,236 (Label Unbalance in High-frequency Trading 2503.09988)"

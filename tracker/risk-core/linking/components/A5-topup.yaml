# ---------------------------------------------------------------- 6. R4 chat-12 (safe de-risking and re-risking)

- id: A5-topup-037
  name: "Conservative UCB live gate: try the new unit or size only while a cumulative floor against the incumbent holds"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:18,24,52-62,142-143 (Conservative Bandits 2016, https://www.alphaxiv.org/abs/1602.04282; Conservative Contextual Linear Bandits 2017, 1611.06426; nonlinear extension 2412.06165)"
  kind: control loop
  brake_or_accelerator: "accelerator / budget-burn permit (R9 proposed kind)"
  what_it_does: "Keep a running safety budget: cumulative reward must stay above a chosen fraction of the incumbent's (or a no-trade baseline's) at every moment. Before each exploratory choice (a new unit, a bigger tier), compute a lower confidence bound on that budget if the candidate is played; play it only if the bound stays non-negative, otherwise play the incumbent. Under its stochastic assumptions the safety cost is an additive regret term, far cheaper than 'build a budget, then explore'."
  inputs: ["candidate and incumbent reward histories", "baseline return estimate (known or estimated)", "allowed slack alpha"]
  outputs: ["play candidate or fall back to incumbent", "safety budget balance"]
  assumptions: ["bounded, sub-Gaussian rewards", "feedback arrives each round", "a meaningful incumbent exists"]
  levels: [unit, methodology]
  instrument_classes: ["simulation (synthetic bandits; linear-context 100 arms, 40,000 rounds)"]
  class_notes: "Fat-tailed classes (crypto, energy, single stocks on events) break the sub-Gaussian assumption; P&L that matures late (funding, settlement) breaks round-by-round feedback."
  styles_timeframes: "fast units supply rounds quickly; slow units make the budget move slowly"
  evidence: simulation
  evidence_note: "Theory and synthetic experiments; constrained performance approaches ordinary UCB over time. No trading result."
  known_failures: ["guarantee is on mean reward, not realised tail loss", "a relative floor can approve a unit when both it and the book are losing; add absolute limits", "per-arm constraint does not protect against several units losing together"]
  performance_note: "Explores new sizes and units early instead of waiting for a full proof, at a bounded cost."
  survival_note: "Cumulative result never falls far below what the incumbent would have made."
  ledger_ids: [size_ramp_to_full, size_levels]
  new_variables: [{name: baseline_floor_fraction, note: "share of the incumbent's cumulative result the candidate must keep at every moment"}]
  qmx_layer: [X2, X5]
  link_hints: ["A4-template-agents-telemetry-199: conservative bandit choosing among pre-approved configurations", "A5-topup-038: Reserve-C4B refines how this budget is certified", "chat-12 combination 1: Conservative UCB + Reserve-C4B + Promote; keep the evidence ledger apart from the live-risk ledger (A2-brakes-drift-exits-201)", "A5-topup-141: same idea framed as a budget-burn permit pair"]

- id: A5-topup-038
  name: "Contrast certificate: judge candidate-minus-incumbent uncertainty directly, with prefix refresh"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:64-74,145 (Reserve-Aware Contrast Certificates for Conservative Bandits with Uncertain Baselines, 2026, https://www.alphaxiv.org/abs/2609.39106)"
  kind: gate/test
  what_it_does: "Instead of bounding the candidate and the incumbent separately (which charges twice for shared uncertainty), bound the candidate-minus-incumbent contrast from a shared confidence set, and allow the candidate if reserve plus that pessimistic bound stays above zero. A prefix refresh re-certifies earlier decisions as evidence grows without discarding credit already earned. Historical data improve estimates but never count as live deployment credit."
  inputs: ["candidate and incumbent features and rewards", "prior history", "confidence level", "allowed reserve"]
  outputs: ["admissible candidate or fallback", "updated reserve ledger"]
  assumptions: ["linear, stationary, sub-Gaussian rewards", "candidate and incumbent share risk (same instrument, hours, regime)"]
  levels: [unit, methodology]
  instrument_classes: ["simulation (linear, 256 episodes)"]
  class_notes: "Helps only where the new unit overlaps the incumbent's market and hours; a unit on another class or session shares little uncertainty."
  styles_timeframes: "any; most useful for variants of an existing unit"
  evidence: simulation
  evidence_note: "Fallback fell from 88.2 % to 19.4 % and reward ratio rose 1.0084 to 1.0557; with refresh 0.5 % and 1.0606; baseline-only history 91.8 % to 12.1 %. Unconstrained LinUCB broke the zero-reserve constraint in 16.4 % of episodes."
  known_failures: ["no robustness shown to drift, non-linear rewards or wrong noise bounds", "not a tail-loss or correlation guarantee"]
  performance_note: "A badly designed gate throws away most of the opportunity; this one recovered it in simulation."
  survival_note: "Keeps the anytime floor on conditional means."
  ledger_ids: []
  new_variables: []
  qmx_layer: [X5, X2]
  link_hints: ["A5-topup-037: the budget it certifies", "A1-sizing-allocation-064: loosen only on proof after a cut", "A2-brakes-drift-exits-178: paper twin beside a live unit gives the shared-uncertainty pairing"]

- id: A5-topup-039
  name: "Six-tier ramp for a newly promoted unit, stepped only on matured, independent evidence"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:28-41,88-101 (assistant's operational proposal, after Conservative Bandits and BOIN)"
  kind: accelerator
  brake_or_accelerator: "accelerator / evidence step-up"
  what_it_does: "Shadow first, then trade live at tiers of the unit's intended risk budget: 5, 10, 20, 35, 60, 100 % (turn 1 gives 10, 20, 35, 55, 75, 100). To step up, all of: two non-overlapping review windows with fully matured P&L and costs; at least 200 effectively independent trade clusters and 20 distinct sessions at that tier; a one-sided 95 % lower bound on net performance against the incumbent or no-trade above a minimum edge; a conservative upper bound on drawdown, expected shortfall and stress loss below hard limits; no open incident. Any one increase is capped at 25-50 % of the current allocation. If evidence is thin, hold the tier."
  inputs: ["tier", "matured P&L and costs per window", "trade clusters and sessions at tier", "confidence bounds on net edge and tail loss", "incident log"]
  outputs: ["step up, hold"]
  assumptions: ["the 5 % tier's total failure is tolerable under the book's loss budget", "trades from one burst or event count as one cluster"]
  levels: [unit]
  instrument_classes: ["all (policy)"]
  class_notes: "Round each tier down to tradable units; if one minimum contract exceeds the budget the tier is zero (futures, single stocks). Energy: slowest ramp, never step across a roll or inventory release. Crypto: blocks by session, weekday and weekend, venue and funding. FX: evidence by session and pair, pairs combined into currency exposure. Stocks: evidence across names, not many trades in one."
  styles_timeframes: "200 clusters and 20 sessions is weeks for a scalper, months for an intraday ORB"
  evidence: idea
  evidence_note: "Assistant's proposal; floors are 'sensible initial operating floors', not tested."
  known_failures: ["slow units take very long to climb (the 'too safe' tension)", "doubling size can change execution regime, so the evidence at one tier may not hold at the next"]
  performance_note: "Size grows as fast as independent evidence arrives, not on a calendar."
  survival_note: "A failed unit is caught at a small tier."
  ledger_ids: [size_levels, size_ramp_to_full, paper_min_trades, paper_min_days]
  new_variables: [{name: ramp_tiers, note: "ordered share-of-budget tiers for a new unit"}, {name: tier_min_clusters, note: "independent trade clusters required at a tier before stepping up"}, {name: tier_min_sessions, note: "distinct sessions required at a tier"}]
  qmx_layer: [X2, X5]
  link_hints: ["A1-sizing-allocation-052: BOIN levels, one at a time, lock out dangerous levels", "A1-sizing-allocation-053: trial phases as size stages", "A5-topup-040: the paired ramp-down", "A5-topup-042: tier feasibility per instrument", "A5-topup-127: slow start with a first-warning switch for faster early climbs"]

- id: A5-topup-040
  name: "Ramp-down faster than ramp-up: hard breach to zero, soft breach one tier down, cool-down, clean windows to climb"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:37-39,86,103 (assistant's policy; BE-BOIN 2509.11333 late-onset toxicity lesson)"
  kind: brake
  brake_or_accelerator: "brake / step ladder"
  what_it_does: "A hard loss-limit breach, bad marks or data, runaway orders or an exposure breach cut the unit to zero and require human re-promotion; it stays in shadow until it clears the 5 % tier again. A soft breach (drawdown-budget use past 80 %, or two windows with the lower confidence bound below the minimum edge) drops one tier at once; breaching the full loss budget stops it. After a soft cut: a two-session cool-down, one clean window to hold, two clean non-overlapping windows to climb. A delayed or unresolved loss may trigger a cut but never counts as positive evidence."
  inputs: ["hard and soft breach flags", "drawdown budget used", "window lower confidence bounds", "unresolved outcomes"]
  outputs: ["tier change (to zero, down one, hold)", "cool-down clock", "human re-promotion request"]
  assumptions: ["breach classes are declared in advance", "outcomes are marked matured or not"]
  levels: [unit]
  instrument_classes: ["all (policy)"]
  class_notes: "Settlement and funding delays (futures, crypto) mean more outcomes stay unresolved; they can only hurt, never help."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "Assistant's policy; the 'do not count unresolved outcomes as reassuring' rule comes from late-onset toxicity in dose finding."
  known_failures: ["one-tier drops are slow if a unit is truly broken but below the hard line"]
  performance_note: "A soft breach costs one tier, not the whole ramp."
  survival_note: "Cuts are immediate and climbs are slow, which is the asymmetry the chat calls the main lesson."
  ledger_ids: [size_levels, grow_back_rule, risk_stop_resume_rule]
  new_variables: [{name: soft_breach_budget_share, note: "share of drawdown budget used that counts as a soft breach (illustration 0.80)"}, {name: tier_cooldown_sessions, note: "sessions to wait after a soft cut before any increase (illustration 2)"}]
  qmx_layer: [X3]
  link_hints: ["A5-topup-039: the ramp it pairs with", "A2-brakes-drift-exits-045: lower fast, raise slowly, stale inputs conservative", "A5-topup-137: no new size change until the last one is measured", "chat-12 combination 2: after a changepoint alarm (A2-brakes-drift-exits-162) re-enable only through a fresh, pre-funded validation epoch"]

- id: A5-topup-041
  name: "Book-level ramp: units and book must both qualify; correlated units gate as one; cut the biggest stressed contributors first"
  source: "research/R4-alphaxiv/chat-12-safe-derisk-rerisk.md:41,105-109,172 (assistant)"

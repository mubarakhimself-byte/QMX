- id: A5-topup-018
  name: "Nested clustered optimisation (NCO) as the stable clustered baseline"
  source: "research/R4-alphaxiv/chat-05-allocation-across-strategies.md:59-74 (Nested Clustered Optimization Is One End of a Schur Bridge, 2026, https://www.alphaxiv.org/abs/2609.21271)"
  kind: allocator
  what_it_does: "Cluster units on their aligned return covariance; inside each cluster form a minimum-variance mix from that cluster's covariance block; treat each cluster mix as one asset and optimise budgets across clusters; multiply out to unit weights. The outer problem has one dimension per cluster, not per unit, which is steadier when units are many and history short."
  inputs: ["aligned unit returns", "cluster partition", "shrunk covariance estimator", "constraints (long-only, caps)"]
  outputs: ["cluster budgets", "within-cluster unit weights", "unit weights"]
  assumptions: ["clusters are stable between scheduled reruns", "only data available at rerun time are used"]
  levels: [portfolio, cluster, unit]
  instrument_classes: ["theory (no class)"]
  class_notes: "Cluster by shared driver, not label: FX by USD leg and carry, indices by regional equity beta, metals precious versus industrial, energy by product and contract month, crypto majors versus small tokens."
  styles_timeframes: "book-level, rerun on a schedule (weekly to monthly)"
  evidence: idea
  evidence_note: "Theory and construction paper; no realised return, Sharpe or drawdown reported. Exactness holds only unconstrained and fully invested."
  known_failures: ["within-cluster weights ignore cross-cluster covariance", "short or on/off histories make blocks noisy", "clusters change sharply when correlations move; frequent reruns cost turnover", "no protection by itself against shared drawdowns"]
  performance_note: "A steadier base than a full optimiser, so budget is not wasted on estimation noise."
  survival_note: "Needs cluster and unit caps on top; the optimiser alone can load a correlated cluster."
  ledger_ids: [cluster_exposure_cap, slot_rebalance_rule]
  new_variables: []
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-093: HRP, the other hierarchical baseline", "A5-topup-019: the Schur bridge extends NCO", "A1-sizing-allocation-095: inverse volatility as the simple control it must beat (HPO 2606.12612)", "A1-sizing-allocation-098: shrink the covariance first"]

- id: A5-topup-019
  name: "Schur-complement bridge between hierarchical and minimum-variance allocation, with a damping knob"
  source: "research/R4-alphaxiv/chat-05-allocation-across-strategies.md:76-86,183-185,212-213 (Schur Complementary Allocation 2411.05807; NCO-Schur bridge 2609.21271)"
  kind: allocator
  what_it_does: "At each split of the covariance into blocks, add back part of the cross-block information through a Schur-complement adjustment A - B D^-1 C scaled by gamma: gamma 0 is plain hierarchical allocation, gamma 1 recovers global minimum variance. The bridge applies this to a flat cluster partition using one representative 'knot' unit per cluster. Estimate gamma only in nested walk-forward tests, freeze clusters and knots between reviews, and cap turnover."
  inputs: ["shrunk covariance", "cluster partition and knot units", "gamma (damping)"]
  outputs: ["cross-aware cluster budgets and unit weights"]
  assumptions: ["the knot captures a cluster's cross-cluster dependence", "covariance not near singular"]
  levels: [portfolio, cluster]
  instrument_classes: ["simulation (500 synthetic assets, 60 observations)"]
  class_notes: "Most useful where clusters really co-move under stress (USD across FX and gold, equity beta across indices and stocks); least where clusters are near independent."
  styles_timeframes: "book-level, scheduled reviews"
  evidence: simulation
  evidence_note: "Variance simulation: higher gamma lowered out-of-sample variance, about 10 bp a year of return equivalent; constructed examples where an interior gamma is best. No live Sharpe or drawdown."
  known_failures: ["estimated cross-covariances unreliable for short histories", "reclustering or new knots break the error analysis", "extra estimation and rebalancing cost not shown to pay"]
  performance_note: "Recovers some diversification that a pure hierarchy throws away."
  survival_note: "Neutral; it is an estimator, so caps still carry survival."
  ledger_ids: [correlated_market_merge_threshold]
  new_variables: [{name: schur_gamma, note: "share of cross-cluster covariance information used in allocation, 0 to 1"}]
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-094: the same gamma knob family (Cotton gamma, CRISP) with a condition-number fallback", "chat-05 combination 1: Schur bridge + conservative gamma + conformal VaR cap (A1-sizing-allocation-169)", "chat-05 combination 3: hierarchy for who gets risk, capped fractional Kelly for the total (A5-topup-025)"]

- id: A5-topup-020
  name: "Bounded learned tilts on a Bayesian hierarchical risk-parity base (RL-BHRP)"
  source: "research/R4-alphaxiv/chat-05-allocation-across-strategies.md:88-106,171-181,215-216 (RL-BHRP 2025, https://www.alphaxiv.org/abs/2508.11856; Regime-Adaptive Continual Learning 2606.00143; Cost-Sensitive Online Window Size Selection 2609.29887)"
  kind: allocator
  what_it_does: "Shrink unit edges toward group means and the covariance with Ledoit-Wolf, compute hierarchical risk-balanced weights at group and within-group level, then let a learner choose tilts with penalties on turnover and on drift from equal risk contribution. The safer use (combination 2) lets the learner set only bounded tilts on the hierarchical base and lets a regime layer change the window or budget only after persistent evidence, with turnover and impact charged."

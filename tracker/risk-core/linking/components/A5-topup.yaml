  styles_timeframes: "all; scalpers' impact budgets bind first"
  evidence: idea
  evidence_note: "Assistant's guidance."
  known_failures: ["impact estimates at untested sizes are guesses until fills exist"]
  performance_note: "Stops a ramp from paying more in impact than the extra size earns."

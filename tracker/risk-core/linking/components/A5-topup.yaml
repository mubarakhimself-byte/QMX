# ---------------------------------------------------------------- 21. R8 gap 5: pooling parameters

- id: A5-topup-097
  name: "Pooled volatility dynamics with each instrument's own level"
  source: "research/R8-gap-topup.md:567-589,720-721 (Bollerslev, Hood, Huss, Pedersen 2018, Risk everywhere, RFS 31(7), read)"
  kind: measure/telemetry
  what_it_does: "Centre each realised-volatility model (HAR, MIDAS, the smooth HExp mix of exponential averages, plus a global factor) on the instrument's own long-run level so the remaining parameters are scale-free, then estimate those dynamics pooled across the whole book. In sample per-instrument fits win; out of sample the order reverses: HExp R-squared 47.3 % own, 48.7 % pooled by class, 49.2 % pooled across all; FX with HAR 28.6 % own vs 47.7 % pooled; forecast variance almost 30 % lower; a volatility-targeting investor gains close to 0.5 % of wealth a year over a static risk model, most of it kept after spreads with gradual rebalancing."
  inputs: ["intraday realised volatility per instrument", "instrument long-run level"]
  outputs: ["volatility forecast per instrument (20-day in the paper)"]
  assumptions: ["many instruments for the global factor"]
  levels: [unit, portfolio]
  instrument_classes: ["20 commodities", "21 equity indices", "8 bond futures", "9 currencies"]
  class_notes: "Crypto and single stocks not tested. A new instrument gets a usable forecast on day one. Overrides of the dynamics need evidence; they usually hurt."
  styles_timeframes: "20-day horizon in the paper; intraday units need session-matched versions"
  evidence: author backtest
  evidence_note: "Two decades of intraday data to September 2014, out-of-sample comparison; read."
  known_failures: ["global factor needs breadth", "horizon differs from scalpers' needs"]
  performance_note: "Better volatility forecasts make volatility-scaled sizing earn more."
  survival_note: "Thin-history instruments do not get noisy volatility estimates."
  ledger_ids: [volatility_target]
  new_variables: [{name: pooled_vol_dynamics, note: "shared, scale-free volatility model parameters for the book"}]
  qmx_layer: [X2, X6]
  link_hints: ["A3-structure-regimes-scenarios-054: HAR-RV forecaster", "A1-sizing-allocation-011: constant volatility target per instrument", "A5-topup-048: per-parameter pooling policy", "R8 combination 4: pooled volatility + pooled edge prior + history-weighted override (A5-topup-098, -099)"]

- id: A5-topup-098
  name: "Empirical-Bayes family shrink of edge: noise families shrink to zero, retired units stay in the prior"
  source: "research/R8-gap-topup.md:537-565,623-635,725-726 (Chen and Dim, High-throughput asset pricing, https://www.alphaxiv.org/abs/2311.10685, read; Jones and Shanken 2005, abstract)"
  kind: sizing rule
  what_it_does: "Treat each strategy's t-statistic as true performance plus noise; fit the distribution of true performance per family on a rolling window; predict each strategy's edge as its own result shrunk toward the family prior, in the simple case by a factor 1 - 1 / var(t within the family). A family whose t-statistics look like pure noise (variance near 1) shrinks to zero automatically, with no hand-set hurdle. The weight on a unit's own record rises with its precision (independent trades, not days live), and retired or killed units stay in the population that sets the prior, or the prior is too rosy."
  inputs: ["per-unit t-statistics or edges with standard errors", "family labels", "retired units' records"]
  outputs: ["shrunk edge per unit", "family shrink factor"]
  assumptions: ["families are meaningful groupings", "window can forget after breaks"]
  levels: [unit, cluster, methodology]
  instrument_classes: ["US stocks (136,000 long-short strategies)"]
  class_notes: "Method general; families might be logic families, classes or session families."
  styles_timeframes: "all"
  evidence: author backtest
  evidence_note: "Out of sample 1983-2020: top 1 % by shrunk Sharpe earned 5.7 % a year (Sharpe 1.46) vs 5.9 % for 200 published anomalies; ticker-based nonsense strategies shrunk 100 % to zero; -8 %/+9 % extremes shrunk to about -3 %/+2 %; strict multiple-testing hurdles rejected thousands that earned out of sample, Storey FDR did better; after the 2004 break predictions stayed too optimistic."
  known_failures: ["slow forgetting after structural breaks", "hand-chosen families"]
  performance_note: "Real families keep most of their edge; strict hurdles would have thrown it away."
  survival_note: "Agent-proposed families that are noise get zero edge, so zero size."
  ledger_ids: [kelly_shrink_factor, judge_market_shrink_k, edge_t_statistic]
  new_variables: [{name: family_shrink_factor, note: "1 - 1/var(t) within a family, the share of a unit's own edge kept"}]
  qmx_layer: [X2, X5]
  link_hints: ["A1-sizing-allocation-028: hierarchical shrinkage toward a family prior", "A4-template-agents-telemetry-196: empirical-Bayes toward the group", "A2-brakes-drift-exits-205: James-Stein shrink of the promoted winner", "A2-brakes-drift-exits-182: t above 3 hurdle (which this evidence warns is too strict)"]

- id: A5-topup-099
  name: "History-weighted blend of pooled and own estimates, with a calibrated distance test and a pooled-versus-own forecast test"
  source: "research/R8-gap-topup.md:591-622,637-643,722-724 (Carver 2026, pooling rule P&L estimates across instruments, read; Kutta, Schumann, Dette 2512.15592, abstract)"
  kind: config/override pattern
  what_it_does: "Compare instruments by the distance between their vectors of rule Sharpe ratios; calibrate a critical distance on random data by years of history (95 %: 1.65 at 1 year, 0.74 at 5, 0.53 at 10, 0.37 at 20, 0.26 at 40); pool two instruments unless their distance exceeds it. Default blend: pooled estimate under 5 years of history, own over 25, weight on pooled (25 - N) x 0.05 in between. Override an instrument out of its pool only when an interval for (own forecast error minus pooled error) lies below zero. Crypto pools with nothing by default; asset class or family is a fine first grouping."
  inputs: ["per-instrument rule Sharpe vectors", "years of history", "forecast errors own and pooled"]
  outputs: ["pool membership", "blend weight", "override verdict"]
  assumptions: ["rule Sharpe vectors comparable across instruments"]
  levels: [unit, cluster, methodology]
  instrument_classes: ["214 futures (trend, carry and other rules)"]
  class_notes: "Bitcoin and Ether formed their own groups; groups often did not match asset classes; most liquid futures pooled together."
  styles_timeframes: "parameter and edge estimates for every style"
  evidence: author backtest
  evidence_note: "Blog-level honest test, no costs, one rule set; best method varied by window (5y/1y all pooled; 5y/5y algorithm pooled; 10y unpooled). Cross-instrument Sharpe SD 0.59 vs 0.50 from luck. The blend weight is Carver's untested heuristic."
  known_failures: ["automatic clustering finds odd groups", "results inconsistent across window lengths"]
  performance_note: "Instruments with real differences earn their own numbers as history grows."
  survival_note: "Thin-history instruments do not run on their own noise."
  ledger_ids: [calibration_shrink_k, calibration_min_trades, correlated_market_merge_threshold]
  new_variables: [{name: pooled_weight_by_history, note: "weight on the pooled estimate as a function of years of own history"}]
  qmx_layer: [X1, X2]
  link_hints: ["A4-template-agents-telemetry-195: overrides earn their place", "A1-sizing-allocation-166: partial pooling per market and cell", "A5-topup-048: per-parameter pooling policy"]


# ---------------------------------------------------------------- 22. R9 definitions (kind other (definition)), so Stage B can cite them

- id: A5-topup-100
  name: "Definition: baseline risk"
  source: "research/R9-accelerators-and-brake-pairs.md:78-80"
  kind: other (definition)
  brake_or_accelerator: "neither (the reference both are measured from)"
  what_it_does: "The baseline is the risk a unit takes when nothing special is happening, for example a fixed share of its budget at the stop. It must be declared, because brakes and accelerators are defined as moves below or above it, not relative to the last value. Compounding on current budget is part of the baseline, not an accelerator [judgment, R9]."
  inputs: ["unit's neutral sizing policy"]
  outputs: ["declared baseline risk per trade"]
  assumptions: ["one baseline per unit and version"]
  levels: [unit, trade]
  instrument_classes: ["all"]
  class_notes: "Baseline is set in money at the stop, so it is class-neutral once value per point is right."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 first-principles definition."
  known_failures: ["an undeclared baseline lets a brake's release look like an accelerator"]
  performance_note: "Makes every boost measurable against a fixed reference."
  survival_note: "Makes every cut measurable too."
  ledger_ids: [risk_fraction, sizing_equity_basis]
  new_variables: [{name: baseline_risk, note: "declared neutral risk per trade for a unit"}]
  qmx_layer: [X1, X2]
  link_hints: ["A5-topup-101: brake", "A5-topup-102: accelerator", "A1-sizing-allocation-001: fixed fraction at the stop as the usual baseline"]

- id: A5-topup-101
  name: "Definition: brake"
  source: "research/R9-accelerators-and-brake-pairs.md:28,81,55-61"
  kind: other (definition)
  brake_or_accelerator: "brake (definition)"
  what_it_does: "A rule that, on evidence of danger, holds a unit's risk-taking at or below baseline: smaller size, fewer trades, no new entries, narrower scope or less exposure. A brake can never raise risk above baseline and never blocks a close, a cancel or a tighter stop. His words fix three parts: brakes come first ('Brex first, accelerator second'), money is a first-class brake signal, and a brake's fire record is also a sensor (the old circuit breaker detected alpha decay)."
  inputs: ["evidence of danger (outcome, environment, exposure, health, time)"]
  outputs: ["risk at or below baseline"]
  assumptions: ["a baseline is declared"]
  levels: [trade, unit, cluster, portfolio, account, system]
  instrument_classes: ["all"]
  class_notes: "Scope (class, region, instrument) is itself a brake actuator (his 'isolate crypto')."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 definition built on his accepted words (SEEDS A21, C19, C21, A26, C27, C10)."
  known_failures: ["holding below baseline has a cost (the sitting-duck concern), so every brake needs a release rule"]
  performance_note: "A brake with a release rule keeps growth after danger passes."
  survival_note: "The primary survival tool."
  ledger_ids: [brake_state]
  new_variables: []
  qmx_layer: [X3]
  link_hints: ["A2-brakes-drift-exits-101: exit-preservation law", "A5-topup-103: restore is part of every brake", "A5-topup-107: the nine brake kinds", "A5-topup-106: the nine attributes"]

- id: A5-topup-102
  name: "Definition: accelerator"
  source: "research/R9-accelerators-and-brake-pairs.md:28,82,53-54,72"
  kind: other (definition)
  brake_or_accelerator: "accelerator (definition)"
  what_it_does: "A rule that, on evidence of opportunity or proof, raises risk-taking above baseline: bigger size, more trades, wider scope or more capital. It always has a ceiling, and any active brake outranks it. He keeps the word ('House of Money is an accelerator'); his 'decelerator' pairs the two families; he wants the system to 'carry or amplify the load' so even a weak edge earns, which points accelerators at breadth and cushions rather than a point edge."
  inputs: ["evidence of opportunity or proof"]
  outputs: ["risk above baseline, capped"]
  assumptions: ["a ceiling exists", "brakes are checked first"]
  levels: [trade, unit, cluster, portfolio]
  instrument_classes: ["all"]
  class_notes: "No class difference in the definition."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 definition built on his words (SEEDS A21, A24, C19)."
  known_failures: ["with independent trades no accelerator beats a constant of the same average risk (R9 script)"]
  performance_note: "Pays only where results persist or where a cushion or proof exists."
  survival_note: "Bounded by its ceiling and by every brake."
  ledger_ids: [cap_multiplier, house_money_combined_cap]
  new_variables: [{name: accelerator_ceiling, note: "maximum multiple of baseline any accelerator may reach"}]
  qmx_layer: [X2]
  link_hints: ["A5-topup-108: the eight accelerator kinds", "A5-topup-138: any brake blocks every raise", "A5-topup-119: pressing equals a bigger constant without persistence"]

- id: A5-topup-103
  name: "Definition: restore (release)"
  source: "research/R9-accelerators-and-brake-pairs.md:28,83,68-71"
  kind: other (definition)
  brake_or_accelerator: "restore"
  what_it_does: "The path by which a brake lets go, back toward baseline; it belongs to the brake's own design (its clear rule). 'Growing back after a cut' is a restore, not an accelerator: one asks 'is the danger over?', the other 'is there proof to go above normal?'. Restores never reset the account floor. His A25 ('size down, but not quickly') and M33 ('the sitting duck thing') make the release rule mandatory, because holding below baseline costs growth."
  inputs: ["the brake's clear condition"]
  outputs: ["risk stepped back toward baseline, never above it"]
  assumptions: ["the brake that cut is known"]
  levels: [trade, unit, cluster, portfolio, account]
  instrument_classes: ["all"]
  class_notes: "No class difference."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 definition [judgment]."
  known_failures: ["treating a restore as an accelerator lets size overshoot baseline straight after danger"]
  performance_note: "Returns size to normal so growth resumes."
  survival_note: "Release speed is slower than the cut."
  ledger_ids: [grow_back_rule, risk_stop_resume_rule]
  new_variables: []
  qmx_layer: [X3]
  link_hints: ["A1-sizing-allocation-056: restore ladder after a cut", "A2-brakes-drift-exits-007: state-based re-enable gate", "A5-topup-134: memory ceiling near the old trip level"]

- id: A5-topup-104
  name: "Definition: clamp (envelope)"
  source: "research/R9-accelerators-and-brake-pairs.md:56,84"
  kind: other (definition)
  brake_or_accelerator: "clamp"
  what_it_does: "A fixed bound that does not read evidence: the floor, maximum lots, the per-trade cap, a regulatory leverage cap. Brakes and accelerators act inside it. His words: 'aggressive and nuclear are two things ... we needed to have clamps that make sure that, okay, in its aggressiveness, while we lose, we don't lose stupidly' (M8)."
  inputs: ["none (fixed)"]
  outputs: ["hard bound on any size or exposure"]
  assumptions: ["clamps are set by him or by rule, never by an agent"]
  levels: [trade, unit, account, system]
  instrument_classes: ["all"]
  class_notes: "Clamp values differ by class (lot limits, leverage caps)."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 definition from his M8 words."
  known_failures: ["a clamp mistaken for a brake gets 'tuned' on evidence"]
  performance_note: "Lets accelerators be aggressive inside a known envelope."
  survival_note: "The last bound when every evidence-reading rule is wrong."
  ledger_ids: [kill_line_floor, max_position_size_lots, kelly_cap, portfolio_floor]
  new_variables: []
  qmx_layer: [X2, X3]
  link_hints: ["A1-sizing-allocation-159: hard caps on lots and orders", "A5-topup-096: regulatory leverage cap", "A2-brakes-drift-exits-024: envelope protection"]

- id: A5-topup-105
  name: "Definition: banker (sweep) and re-seed"
  source: "research/R9-accelerators-and-brake-pairs.md:85,260-269"
  kind: other (definition)
  brake_or_accelerator: "sweep = slow de-accelerator; re-seed after losses = capital injection (contrarian)"
  what_it_does: "A sweep moves realised money out of the risk zone; a re-seed moves it back in. Neither acts on the next trade, but both reset what cushion-based rules feed on: under a cushion rule a sweep de-levers the next cycle, and a re-seed after losses refills the cushion, betting on the unit's own recovery. Reinsurance prices a refill (reinstatement premium pro rata to the amount used), so a re-seed or restore is earned or priced, never free."
  inputs: ["realised profit above a cap", "losses below an anchor"]
  outputs: ["capital moved out or in"]
  assumptions: ["sweeps and re-seeds never move the account floor"]
  levels: [unit, portfolio, account]
  instrument_classes: ["all"]
  class_notes: "No class difference."
  styles_timeframes: "book or BMS level (his B10)"
  evidence: idea
  evidence_note: "R9 definition; reinsurance and prop examples are practice."
  known_failures: ["a re-seed rewards a broken unit", "a payout that resets the loss limit"]
  performance_note: "Sweeps lock gains; re-seeds can restart a good unit."
  survival_note: "Sweeps shrink the cushion the next cycle risks."
  ledger_ids: [sweep_cap_equity, refund_reserve_rho, book_seed_capital]
  new_variables: []
  qmx_layer: [X2]
  link_hints: ["A1-sizing-allocation-075: cycle cap, sweep and re-seed", "A1-sizing-allocation-078: refund reserve and re-seed", "A5-topup-130: priced reinstatement", "A2-brakes-drift-exits-077: payout resets the loss limit"]

- id: A5-topup-106
  name: "Definition: the nine attributes of any brake or accelerator (one registry row)"
  source: "research/R9-accelerators-and-brake-pairs.md:87-101 (MathWorks compressor reference, Giannoulis, Massberg, Reiss 2012)"
  kind: other (definition)
  brake_or_accelerator: "both (registry schema)"
  what_it_does: "Every brake or accelerator is one registry row with nine attributes: reads (outcome, evidence, environment, exposure, health, time; over which window), scope (trade, unit, cluster or Book, class or region, BMS, account), anchor (day start, session start, running peak, seed, fixed floor, tier threshold), changes (size, frequency, permission, scope, exposure, capital), direction (down or up from baseline), shape (step, ladder, smooth taper, latch), speed (attack and release separately), hysteresis (separate trip and clear, dead band, minimum hold), memory and clear (stateless, counter with reset rules, latch cleared by time, state, evidence or a human). Audio dynamics give the same knobs fixed names: threshold, ratio, knee, attack, release; a compressor or limiter is a brake, a noise gate a permission brake, an expander an accelerator."
  inputs: ["a brake or accelerator design"]
  outputs: ["one registry row with nine attributes"]
  assumptions: ["every rule names its signal and scope (his C7: 'know what is breaking')"]
  levels: [system, methodology]
  instrument_classes: ["all"]
  class_notes: "No class difference."
  styles_timeframes: "all"
  evidence: idea
  evidence_note: "R9 schema; compressor vocabulary is an engineering standard."
  known_failures: ["rows without anchor or clear rule hide the restart hazard"]
  performance_note: "Lets Stage B compare and pair rules on the same fields."
  survival_note: "Makes missing release or hysteresis visible."
  ledger_ids: [loss_counting_rule, brake_equity_basis, brake_state]
  new_variables: [{name: brake_registry_row, note: "nine-attribute record for each brake or accelerator"}]
  qmx_layer: [X1, X3, X2]
  link_hints: ["A2-brakes-drift-exits-113: declared counting rule", "A2-brakes-drift-exits-115: declared equity series and base", "A2-brakes-drift-exits-114: declared fail mode"]


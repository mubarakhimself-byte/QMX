  source: "research/R8-gap-topup.md:307-330,709 (Cai, Haugh, Li 2026, read)"
  kind: gate/test
  what_it_does: "Each night, replay yesterday's actual factor moves as a scenario through the engine and log predicted against realised P&L, giving the stress engine its own error record. A portfolio built to look safe under the named factors showed scenario P&L within plus or minus $3 while its true expected loss was about -$20; an agent that optimises against named stress factors can pass while carrying unnamed risk, so scenario sets change over time and include factors the agents do not see."
  inputs: ["yesterday's realised factor moves", "book positions", "realised P&L"]
  outputs: ["predicted vs realised error log", "rotated hidden scenario factors"]
  assumptions: ["factor moves can be reconstructed each day"]
  levels: [portfolio, methodology]
  instrument_classes: ["simulated equity and option books"]

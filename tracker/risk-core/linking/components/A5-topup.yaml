  known_failures: ["higher growth but a slightly deeper drawdown, so not a survival gain", "PPO sensitive to design choices", "chases transient regimes; no non-stationary guarantee"]
  performance_note: "The one dynamic allocator in the chat with a full growth comparison; gains were in CAGR and Sharpe."
  survival_note: "Drawdown was worse; only usable as a bounded overlay on a capped base."
  ledger_ids: [slot_rebalance_rule]
